<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>{{ game.name }} — Melanated AZ Real Games</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #080808;
    color: #ffffff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font: inherit;
}

.page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding:
        max(12px, env(safe-area-inset-top))
        14px
        max(20px, env(safe-area-inset-bottom));
}

.topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 46px;
    height: 46px;

    border-radius: 14px;
    border: 1px solid #333;

    background: #151515;
    color: #fff;

    text-decoration: none;
    font-size: 22px;
}

.title {
    flex: 1;
}

.title h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 34px);
}

.title p {
    margin: 3px 0 0;
    color: #aaa;
    font-size: 13px;
}

.game-card {
    width: 100%;

    border: 1px solid #292929;
    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #151515,
            #0c0c0c
        );

    padding: 14px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.status {
    min-height: 26px;

    text-align: center;

    color: #ddd;

    font-weight: bold;

    margin-bottom: 10px;
}

.canvas-wrap {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    touch-action: none;

    overflow: hidden;

    border-radius: 16px;

    background: #000;

    border: 1px solid #333;
}

canvas {
    display: block;

    width: 100%;
    max-width: 700px;

    height: auto;

    touch-action: none;

    background: #000;
}

.controls {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(90px, 1fr)
        );

    gap: 8px;

    margin-top: 12px;
}

.btn {
    min-height: 48px;

    border: 0;
    border-radius: 13px;

    background: #252525;
    color: #fff;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;
}

.btn:active {
    transform: scale(.97);
}

.btn.primary {
    background: #ffffff;
    color: #000;
}

.message {
    margin-top: 12px;

    padding: 12px;

    border-radius: 12px;

    background: #151515;

    color: #aaa;

    text-align: center;

    font-size: 13px;
}

.hidden {
    display: none !important;
}


/* ======================================================
   DOM GAME STYLES
   ====================================================== */

.dom-game {
    width: 100%;
}

.big-button {
    width: 100%;
    min-height: 180px;

    border: 0;
    border-radius: 18px;

    background: #202020;
    color: white;

    font-size: 28px;
    font-weight: bold;

    touch-action: manipulation;
}

.big-button.ready {
    background: #fff;
    color: #000;
}

.grid2048 {
    width: min(94vw, 500px);

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    padding: 8px;

    border-radius: 15px;

    background: #222;
}

.tile2048 {
    aspect-ratio: 1;

    border: 0;

    border-radius: 10px;

    background: #444;

    color: #fff;

    font-size: clamp(18px, 6vw, 32px);

    font-weight: bold;
}

.memory-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    width: min(94vw, 500px);

    margin: auto;
}

.memory-card {
    aspect-ratio: 1;

    border: 0;

    border-radius: 14px;

    background: #222;

    color: white;

    font-size: clamp(22px, 7vw, 38px);

    touch-action: manipulation;
}

.memory-card.flipped,
.memory-card.matched {
    background: #eee;
    color: #111;
}

.sports-controls {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 10px;
}

.sports-controls button {
    min-height: 55px;

    border: 0;
    border-radius: 14px;

    background: #242424;
    color: #fff;

    font-size: 22px;
}

@media (min-width: 700px) {

    .page {
        padding-left: 24px;
        padding-right: 24px;
    }

    .game-card {
        padding: 20px;
    }

}

</style>

</head>


<body>

<div class="page">

    <div class="topbar">

        <a
            class="back"
            href="{{ url_for('real_games.real_games_home') }}"
            aria-label="Back to games"
        >
            ←
        </a>

        <div class="title">

            <h1>
                {{ game.icon }}
                {{ game.name }}
            </h1>

            <p>
                {{ game.description }}
            </p>

        </div>

    </div>


    <main class="game-card">

        <div
            id="status"
            class="status"
        >
            Ready
        </div>


        <div
            id="gameArea"
            class="canvas-wrap"
        >

            <canvas
                id="gameCanvas"
                width="600"
                height="600"
            ></canvas>

        </div>


        <div
            id="domArea"
            class="dom-game hidden"
        ></div>


        <div
            id="controls"
            class="controls"
        ></div>


        <div
            id="message"
            class="message"
        >
            Tap START to play.
        </div>

    </main>

</div>


<script>

/* ==========================================================
   GAME INFORMATION FROM FLASK
   ========================================================== */

const GAME_ID =
    "{{ game.game_id|default(game.name)|lower|replace(' ','_')|replace('-','_')|e }}";


/* ==========================================================
   DOM
   ========================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const gameArea =
    document.getElementById("gameArea");

const domArea =
    document.getElementById("domArea");

const controls =
    document.getElementById("controls");

const statusBox =
    document.getElementById("status");

const messageBox =
    document.getElementById("message");


/* ==========================================================
   GAME STATE
   ========================================================== */

let animationFrame = null;

let intervals = [];

let timeouts = [];

let keyHandler = null;

let running = false;


/* ==========================================================
   HELPERS
   ========================================================== */

function status(text) {

    statusBox.textContent = text;

}


function message(text) {

    messageBox.textContent = text;

}


function clearControls() {

    controls.innerHTML = "";

}


function button(text, callback, primary=false) {

    const b =
        document.createElement("button");

    b.className =
        "btn" + (primary ? " primary" : "");

    b.textContent =
        text;

    b.addEventListener(
        "click",
        callback
    );

    controls.appendChild(b);

    return b;
}


function stopGame() {

    running = false;

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }

    intervals.forEach(
        clearInterval
    );

    timeouts.forEach(
        clearTimeout
    );

    intervals = [];

    timeouts = [];

    if (keyHandler) {

        window.removeEventListener(
            "keydown",
            keyHandler
        );

        keyHandler = null;

    }

}


function every(fn, ms) {

    const id =
        setInterval(fn, ms);

    intervals.push(id);

    return id;

}


function later(fn, ms) {

    const id =
        setTimeout(fn, ms);

    timeouts.push(id);

    return id;

}


function canvasSize(width, height) {

    canvas.width = width;

    canvas.height = height;

}


/* ==========================================================
   CANVAS POINTER POSITION
   ========================================================== */

function pointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left)
            *
            canvas.width
            /
            rect.width,

        y:
            (e.clientY - rect.top)
            *
            canvas.height
            /
            rect.height

    };

}


/* ==========================================================
   SNAKE
   ========================================================== */

function snakeGame() {

    canvasSize(600,600);

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;

    const size = 30;

    function reset() {

        snake = [
            {x:10,y:10},
            {x:9,y:10},
            {x:8,y:10}
        ];

        food = makeFood();

        direction = {
            x:1,
            y:0
        };

        nextDirection = {
            x:1,
            y:0
        };

        score = 0;

    }


    function makeFood() {

        let p;

        do {

            p = {

                x:
                    Math.floor(
                        Math.random()*20
                    ),

                y:
                    Math.floor(
                        Math.random()*20
                    )

            };

        } while (
            snake &&
            snake.some(
                s =>
                    s.x === p.x &&
                    s.y === p.y
            )
        );

        return p;

    }


    function draw() {

        ctx.fillStyle =
            "#080808";

        ctx.fillRect(
            0,
            0,
            600,
            600
        );


        ctx.fillStyle =
            "#222";

        for (
            let x=0;
            x<20;
            x++
        ) {

            for (
                let y=0;
                y<20;
                y++
            ) {

                ctx.strokeStyle =
                    "#151515";

                ctx.strokeRect(
                    x*size,
                    y*size,
                    size,
                    size
                );

            }

        }


        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            food.x*size+5,
            food.y*size+5,
            size-10,
            size-10
        );


        snake.forEach(
            (s,i) => {

                ctx.fillStyle =
                    i === 0
                    ? "#fff"
                    : "#aaa";

                ctx.fillRect(
                    s.x*size+2,
                    s.y*size+2,
                    size-4,
                    size-4
                );

            }
        );


        status(
            "Snake • Score: " + score
        );

    }


    function tick() {

        direction =
            nextDirection;

        const head = {

            x:
                snake[0].x +
                direction.x,

            y:
                snake[0].y +
                direction.y

        };


        if (
            head.x < 0 ||
            head.x >= 20 ||
            head.y < 0 ||
            head.y >= 20
        ) {

            end();

            return;

        }


        if (
            snake.some(
                s =>
                    s.x === head.x &&
                    s.y === head.y
            )
        ) {

            end();

            return;

        }


        snake.unshift(head);


        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            food =
                makeFood();

        } else {

            snake.pop();

        }


        draw();

    }


    function end() {

        running = false;

        status(
            "Game Over • Score: " +
            score
        );

        message(
            "Press START to play again."
        );

    }


    function change(dx,dy) {

        if (
            direction.x === -dx &&
            direction.y === -dy
        ) return;

        nextDirection = {
            x:dx,
            y:dy
        };

    }


    keyHandler =
        e => {

            if (e.key === "ArrowUp")
                change(0,-1);

            if (e.key === "ArrowDown")
                change(0,1);

            if (e.key === "ArrowLeft")
                change(-1,0);

            if (e.key === "ArrowRight")
                change(1,0);

        };


    window.addEventListener(
        "keydown",
        keyHandler
    );


    gameArea.onpointerdown =
        e => {

            const p =
                pointerPosition(e);

            const cx =
                canvas.width/2;

            const cy =
                canvas.height/2;

            const dx =
                p.x-cx;

            const dy =
                p.y-cy;

            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                change(
                    dx > 0 ? 1 : -1,
                    0
                );

            } else {

                change(
                    0,
                    dy > 0 ? 1 : -1
                );

            }

        };


    function start() {

        reset();

        running = true;

        message(
            "Use arrows or swipe the game area."
        );

        draw();

        every(
            () => {

                if (running)
                    tick();

            },
            120
        );

    }


    reset();

    draw();

    clearControls();

    button(
        "START",
        start,
        true
    );

    button(
        "UP",
        () => change(0,-1)
    );

    button(
        "LEFT",
        () => change(-1,0)
    );

    button(
        "RIGHT",
        () => change(1,0)
    );

    button(
        "DOWN",
        () => change(0,1)
    );

}


/* ==========================================================
   PONG
   ========================================================== */

function pongGame() {

    canvasSize(700,450);

    let player;
    let cpu;
    let ball;
    let playerScore;
    let cpuScore;

    function reset() {

        player =
            175;

        cpu =
            175;

        playerScore =
            0;

        cpuScore =
            0;

        ball = {

            x:350,
            y:225,
            vx:5,
            vy:3

        };

    }


    function draw() {

        ctx.fillStyle =
            "#050505";

        ctx.fillRect(
            0,0,700,450
        );


        ctx.strokeStyle =
            "#444";

        ctx.setLineDash(
            [10,10]
        );

        ctx.beginPath();

        ctx.moveTo(
            350,0
        );

        ctx.lineTo(
            350,450
        );

        ctx.stroke();

        ctx.setLineDash([]);


        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            20,
            player,
            14,
            100
        );

        ctx.fillRect(
            666,
            cpu,
            14,
            100
        );


        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.font =
            "bold 42px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            playerScore,
            300,
            55
        );

        ctx.fillText(
            cpuScore,
            400,
            55
        );


        status(
            "Pong • " +
            playerScore +
            " - " +
            cpuScore
        );

    }


    function movePlayer(y) {

        player =
            Math.max(
                0,
                Math.min(
                    350,
                    y-50
                )
            );

    }


    function update() {

        ball.x += ball.vx;
        ball.y += ball.vy;


        if (
            ball.y < 10 ||
            ball.y > 440
        ) {

            ball.vy *= -1;

        }


        if (
            ball.x < 45 &&
            ball.x > 20 &&
            ball.y > player &&
            ball.y < player+100
        ) {

            ball.vx =
                Math.abs(ball.vx);

        }


        if (
            ball.x > 641 &&
            ball.x < 680 &&
            ball.y > cpu &&
            ball.y < cpu+100
        ) {

            ball.vx =
                -Math.abs(ball.vx);

        }


        cpu +=
            (ball.y-50-cpu)
            * .055;


        cpu =
            Math.max(
                0,
                Math.min(
                    350,
                    cpu
                )
            );


        if (ball.x < 0) {

            cpuScore++;

            resetBall(
                1
            );

        }


        if (ball.x > 700) {

            playerScore++;

            resetBall(
                -1
            );

        }


        draw();

    }


    function resetBall(dir) {

        ball = {

            x:350,
            y:225,
            vx:5*dir,
            vy:
                Math.random() > .5
                ? 3
                : -3

        };

    }


    gameArea.onpointermove =
        e => {

            movePlayer(
                pointerPosition(e).y
            );

        };


    keyHandler =
        e => {

            if (
                e.key === "ArrowUp"
            )
                movePlayer(
                    player-35
                );

            if (
                e.key === "ArrowDown"
            )
                movePlayer(
                    player+35
                );

        };


    window.addEventListener(
        "keydown",
        keyHandler
    );


    function start() {

        reset();

        running = true;

        every(
            () => {

                if (running)
                    update();

            },
            16
        );

    }


    reset();

    draw();

    clearControls();

    button(
        "START",
        start,
        true
    );

    button(
        "▲",
        () => movePlayer(player-45)
    );

    button(
        "▼",
        () => movePlayer(player+45)
    );

    message(
        "Move your paddle with your finger, mouse, or arrow keys."
    );

}


/* ==========================================================
   BREAKOUT
   ========================================================== */

function breakoutGame() {

    canvasSize(700,500);

    let paddle;
    let ball;
    let bricks;
    let score;

    function reset() {

        paddle = 300;

        ball = {

            x:350,
            y:420,
            vx:4,
            vy:-5

        };

        score = 0;

        bricks = [];

        for (
            let r=0;
            r<5;
            r++
        ) {

            for (
                let c=0;
                c<10;
                c++
            ) {

                bricks.push({

                    x:
                        15+c*68,

                    y:
                        30+r*28,

                    alive:true

                });

            }

        }

    }


    function draw() {

        ctx.fillStyle =
            "#050505";

        ctx.fillRect(
            0,0,700,500
        );


        bricks.forEach(
            b => {

                if (!b.alive)
                    return;

                ctx.fillStyle =
                    "#fff";

                ctx.fillRect(
                    b.x,
                    b.y,
                    62,
                    20
                );

            }
        );


        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            paddle,
            465,
            100,
            14
        );


        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();


        status(
            "Breakout • Score: " +
            score
        );

    }


    function update() {

        ball.x += ball.vx;
        ball.y += ball.vy;


        if (
            ball.x < 8 ||
            ball.x > 692
        )
            ball.vx *= -1;


        if (
            ball.y < 8
        )
            ball.vy *= -1;


        if (
            ball.y > 450 &&
            ball.x > paddle &&
            ball.x < paddle+100
        ) {

            ball.vy =
                -Math.abs(ball.vy);

        }


        bricks.forEach(
            b => {

                if (
                    !b.alive
                ) return;

                if (
                    ball.x > b.x &&
                    ball.x < b.x+62 &&
                    ball.y > b.y &&
                    ball.y < b.y+20
                ) {

                    b.alive =
                        false;

                    ball.vy *= -1;

                    score++;

                }

            }
        );


        if (
            ball.y > 500
        ) {

            running = false;

            message(
                "Game Over. Press START to try again."
            );

        }


        if (
            bricks.every(
                b => !b.alive
            )
        ) {

            running = false;

            message(
                "You cleared the board!"
            );

        }


        draw();

    }


    function move(x) {

        paddle =
            Math.max(
                0,
                Math.min(
                    600,
                    x-50
                )
            );

    }


    gameArea.onpointermove =
        e => {

            move(
                pointerPosition(e).x
            );

        };


    keyHandler =
        e => {

            if (
                e.key === "ArrowLeft"
            )
                move(
                    paddle-45
                );

            if (
                e.key === "ArrowRight"
            )
                move(
                    paddle+145
                );

        };


    window.addEventListener(
        "keydown",
        keyHandler
    );


    function start() {

        reset();

        running = true;

        every(
            () => {

                if (running)
                    update();

            },
            16
        );

    }


    reset();

    draw();

    clearControls();

    button(
        "START",
        start,
        true
    );

    button(
        "LEFT",
        () => move(paddle-50)
    );

    button(
        "RIGHT",
        () => move(paddle+150)
    );

}


/* ==========================================================
   DODGE
   ========================================================== */

function dodgeGame() {

    canvasSize(500,650);

    let player;
    let blocks;
    let score;

    function reset() {

        player = {
            x:230,
            y:580,
            w:40,
            h:40
        };

        blocks = [];

        score = 0;

    }


    function spawn() {

        blocks.push({

            x:
                Math.random()*460,

            y:-30,

            size:
                25+
                Math.random()*30,

            speed:
                3+
                Math.random()*4

        });

    }


    function draw() {

        ctx.fillStyle =
            "#050505";

        ctx.fillRect(
            0,0,500,650
        );


        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            player.x,
            player.y,
            player.w,
            player.h
        );


        blocks.forEach(
            b => {

                ctx.fillStyle =
                    "#888";

                ctx.fillRect(
                    b.x,
                    b.y,
                    b.size,
                    b.size
                );

            }
        );


        status(
            "Dodge • Score: " +
            Math.floor(score)
        );

    }


    function update() {

        score += .05;


        blocks.forEach(
            b => {

                b.y += b.speed;

            }
        );


        blocks =
            blocks.filter(
                b => b.y < 680
            );


        blocks.forEach(
            b => {

                if (
                    player.x <
                        b.x+b.size &&
                    player.x+player.w >
                        b.x &&
                    player.y <
                        b.y+b.size &&
                    player.y+player.h >
                        b.y
                ) {

                    running = false;

                    message(
                        "You got hit! Press START to try again."
                    );

                }

            }
        );


        draw();

    }


    function move(x) {

        player.x =
            Math.max(
                0,
                Math.min(
                    460,
                    x-20
                )
            );

    }


    gameArea.onpointermove =
        e => {

            move(
                pointerPosition(e).x
            );

        };


    keyHandler =
        e => {

            if (
                e.key === "ArrowLeft"
            )
                move(
                    player.x-40
                );

            if (
                e.key === "ArrowRight"
            )
                move(
                    player.x+60
                );

        };


    window.addEventListener(
        "keydown",
        keyHandler
    );


    function start() {

        reset();

        running = true;

        every(
            spawn,
            600
        );

        every(
            () => {

                if (running)
                    update();

            },
            16
        );

    }


    reset();

    draw();

    clearControls();

    button(
        "START",
        start,
        true
    );

    button(
        "LEFT",
        () => move(player.x-60)
    );

    button(
        "RIGHT",
        () => move(player.x+60)
    );

}


/* ==========================================================
   2048
   ========================================================== */

function game2048() {

    domArea.classList.remove(
        "hidden"
    );

    gameArea.classList.add(
        "hidden"
    );

    let board;

    function reset() {

        board =
            Array.from(
                {length:4},
                () =>
                    Array(4).fill(0)
            );

        addTile();

        addTile();

        render();

    }


    function addTile() {

        const empty = [];

        for (
            let r=0;
            r<4;
            r++
        ) {

            for (
                let c=0;
                c<4;
                c++
            ) {

                if (
                    board[r][c] === 0
                )
                    empty.push({
                        r,c
                    });

            }

        }


        if (!empty.length)
            return;


        const p =
            empty[
                Math.floor(
                    Math.random() *
                    empty.length
                )
            ];


        board[p.r][p.c] =
            Math.random() < .9
            ? 2
            : 4;

    }


    function slide(row) {

        let a =
            row.filter(
                x => x
            );

        for (
            let i=0;
            i<a.length-1;
            i++
        ) {

            if (
                a[i] === a[i+1]
            ) {

                a[i] *= 2;

                a[i+1] = 0;

            }

        }


        a =
            a.filter(
                x => x
            );


        while (
            a.length < 4
        )
            a.push(0);


        return a;

    }


    function move(dir) {

        let changed = false;

        const old =
            JSON.stringify(board);


        if (
            dir === "left"
        ) {

            for (
                let r=0;
                r<4;
                r++
            )
                board[r] =
                    slide(board[r]);

        }


        if (
            dir === "right"
        ) {

            for (
                let r=0;
                r<4;
                r++
            )
                board[r] =
                    slide(
                        board[r]
                        .reverse()
                    ).reverse();

        }


        if (
            dir === "up"
        ) {

            for (
                let c=0;
                c<4;
                c++
            ) {

                const col =
                    slide([
                        board[0][c],
                        board[1][c],
                        board[2][c],
                        board[3][c]
                    ]);


                for (
                    let r=0;
                    r<4;
                    r++
                )
                    board[r][c] =
                        col[r];

            }

        }


        if (
            dir === "down"
        ) {

            for (
                let c=0;
                c<4;
                c++
            ) {

                const col =
                    slide([
                        board[3][c],
                        board[2][c],
                        board[1][c],
                        board[0][c]
                    ]).reverse();


                for (
                    let r=0;
                    r<4;
                    r++
                )
                    board[r][c] =
                        col[r];

            }

        }


        changed =
            old !==
            JSON.stringify(board);


        if (changed) {

            addTile();

            render();

        }

    }


    function render() {

        domArea.innerHTML = "";

        const grid =
            document.createElement("div");

        grid.className =
            "grid2048";


        board.forEach(
            row => {

                row.forEach(
                    value => {

                        const b =
                            document.createElement(
                                "button"
                            );

                        b.className =
                            "tile2048";

                        b.textContent =
                            value || "";

                        grid.appendChild(b);

                    }
                );

            }
        );


        domArea.appendChild(grid);


        status(
            "2048"
        );

    }


    keyHandler =
        e => {

            if (
                e.key === "ArrowLeft"
            )
                move("left");

            if (
                e.key === "ArrowRight"
            )
                move("right");

            if (
                e.key === "ArrowUp"
            )
                move("up");

            if (
                e.key === "ArrowDown"
            )
                move("down");

        };


    window.addEventListener(
        "keydown",
        keyHandler
    );


    let sx = 0;
    let sy = 0;


    domArea.onpointerdown =
        e => {

            sx = e.clientX;
            sy = e.clientY;

        };


    domArea.onpointerup =
        e => {

            const dx =
                e.clientX-sx;

            const dy =
                e.clientY-sy;


            if (
                Math.max(
                    Math.abs(dx),
                    Math.abs(dy)
                ) < 20
            )
                return;


            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                move(
                    dx > 0
                    ? "right"
                    : "left"
                );

            } else {

                move(
                    dy > 0
                    ? "down"
                    : "up"
                );

            }

        };


    clearControls();

    button(
        "NEW GAME",
        reset,
        true
    );

    button(
        "←",
        () => move("left")
    );

    button(
        "↑",
        () => move("up")
    );

    button(
        "↓",
        () => move("down")
    );

    button(
        "→",
        () => move("right")
    );


    reset();

}


/* ==========================================================
   MEMORY MATCH
   ========================================================== */

function memoryGame() {

    domArea.classList.remove(
        "hidden"
    );

    gameArea.classList.add(
        "hidden"
    );


    const symbols = [
        "🍎","🍎",
        "🍌","🍌",
        "🍇","🍇",
        "🍉","🍉",
        "⭐","⭐",
        "🔥","🔥",
        "🎯","🎯",
        "🎮","🎮"
    ];


    let cards = [];

    let first = null;

    let second = null;

    let locked = false;

    let moves = 0;


    function reset() {

        cards =
            [...symbols]
            .sort(
                () =>
                    Math.random()-.5
            );

        first = null;

        second = null;

        locked = false;

        moves = 0;

        render();

    }


    function render() {

        domArea.innerHTML = "";

        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "memory-grid";


        cards.forEach(
            (symbol,index) => {

                const b =
                    document.createElement(
                        "button"
                    );

                b.className =
                    "memory-card";

                const matched =
                    typeof symbol === "object";


                b.textContent =
                    matched
                    ? symbol.value
                    : "❓";


                if (matched)
                    b.classList.add(
                        "matched"
                    );


                if (
                    first === index ||
                    second === index
                )
                    b.classList.add(
                        "flipped"
                    );


                if (!matched) {

                    b.addEventListener(
                        "click",
                        () =>
                            flip(index)
                    );

                }


                grid.appendChild(b);

            }
        );


        domArea.appendChild(grid);


        status(
            "Memory Match • Moves: " +
            moves
        );

    }


    function flip(index) {

        if (
            locked ||
            first === index ||
            typeof cards[index] === "object"
        )
            return;


        if (first === null) {

            first = index;

            render();

            return;

        }


        second = index;

        moves++;

        render();


        if (
            cards[first] ===
            cards[second]
        ) {

            const value =
                cards[first];

            cards[first] = {
                matched:true,
                value
            };

            cards[second] = {
                matched:true,
                value
            };


            first = null;

            second = null;

            render();


            if (
                cards.every(
                    c =>
                        typeof c ===
                        "object"
                )
            ) {

                message(
                    "You matched every pair!"
                );

            }

        } else {

            locked = true;

            later(
                () => {

                    first = null;

                    second = null;

                    locked = false;

                    render();

                },
                700
            );

        }

    }


    clearControls();

    button(
        "NEW GAME",
        reset,
        true
    );

    reset();

}


/* ==========================================================
   REACTION TEST
   ========================================================== */

function reactionGame() {

    domArea.classList.remove(
        "hidden"
    );

    gameArea.classList.add(
        "hidden"
    );


    let waiting = false;

    let ready = false;

    let startTime = 0;


    const btn =
        document.createElement(
            "button"
        );

    btn.className =
        "big-button";

    btn.textContent =
        "START";


    domArea.innerHTML = "";

    domArea.appendChild(btn);


    function start() {

        waiting = true;

        ready = false;

        btn.classList.remove(
            "ready"
        );

        btn.textContent =
            "WAIT...";

        status(
            "Get ready..."
        );


        later(
            () => {

                waiting = false;

                ready = true;

                startTime =
                    performance.now();

                btn.classList.add(
                    "ready"
                );

                btn.textContent =
                    "TAP NOW!";

                status(
                    "GO!"
                );

            },
            1200 +
            Math.random()*2500
        );

    }


    btn.addEventListener(
        "click",
        () => {

            if (
                ready
            ) {

                const time =
                    Math.round(
                        performance.now() -
                        startTime
                    );

                ready = false;

                btn.classList.remove(
                    "ready"
                );

                btn.textContent =
                    time + " ms";

                status(
                    "Reaction: " +
                    time +
                    " ms"
                );

                message(
                    "Press the button to try again."
                );

            }

            else if (
                !waiting
            ) {

                start();

            }

        }
    );


    clearControls();

    button(
        "START",
        start,
        true
    );

    message(
        "Wait for the button to change, then tap as fast as possible."
    );

}


/* ==========================================================
   WHACK-A-MOLE
   ========================================================== */

function whackGame() {

    domArea.classList.remove(
        "hidden"
    );

    gameArea.classList.add(
        "hidden"
    );


    let score = 0;

    let mole = -1;

    let runningGame = false;


    function render() {

        domArea.innerHTML = "";


        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "memory-grid";


        for (
            let i=0;
            i<16;
            i++
        ) {

            const b =
                document.createElement(
                    "button"
                );

            b.className =
                "memory-card";

            b.textContent =
                i === mole
                ? "🐹"
                : "🕳️";


            b.addEventListener(
                "click",
                () => {

                    if (
                        runningGame &&
                        i === mole
                    ) {

                        score++;

                        mole =
                            Math.floor(
                                Math.random()*16
                            );

                        render();

                    }

                }
            );


            grid.appendChild(b);

        }


        domArea.appendChild(grid);


        status(
            "Whack-a-Mole • Score: " +
            score
        );

    }


    function start() {

        score = 0;

        mole = 0;

        runningGame = true;

        render();


        every(
            () => {

                if (!runningGame)
                    return;

                mole =
                    Math.floor(
                        Math.random()*16
                    );

                render();

            },
            650
        );


        later(
            () => {

                runningGame = false;

                message(
                    "Time's up! Score: " +
                    score
                );

            },
            30000
        );

    }


    clearControls();

    button(
        "START",
        start,
        true
    );

    start();

}


/* ==========================================================
   BASKETBALL
   ========================================================== */

function basketballGame() {

    canvasSize(600,600);


    let score = 0;

    let shots = 0;

    let ball = {

        x:300,
        y:500

    };


    let hoop = {

        x:450,
        y:230

    };


    function draw() {

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            0,0,600,600
        );


        ctx.strokeStyle =
            "#777";

        ctx.lineWidth =
            5;

        ctx.beginPath();

        ctx.moveTo(
            0,520
        );

        ctx.lineTo(
            600,520
        );

        ctx.stroke();


        ctx.strokeStyle =
            "#fff";

        ctx.strokeRect(
            420,
            150,
            100,
            100
        );


        ctx.beginPath();

        ctx.arc(
            hoop.x,
            hoop.y,
            35,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.fillStyle =
            "#aaa";

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            18,
            0,
            Math.PI*2
        );

        ctx.fill();


        status(
            "Basketball • " +
            score +
            " / " +
            shots
        );

    }


    function shoot(x,y) {

        shots++;


        const distance =
            Math.hypot(
                x-hoop.x,
                y-hoop.y
            );


        if (
            distance < 55
        ) {

            score++;

            message(
                "🏀 SWISH!"
            );

        } else {

            message(
                "Miss!"
            );

        }


        ball = {
            x:300,
            y:500
        };


        draw();

    }


    gameArea.onpointerdown =
        e => {

            const p =
                pointerPosition(e);

            shoot(
                p.x,
                p.y
            );

        };


    clearControls();

    button(
        "RESET",
        () => {

            score = 0;

            shots = 0;

            draw();

        },
        true
    );


    message(
        "Tap or click near the hoop to shoot."
    );


    draw();

}


/* ==========================================================
   TARGET SHOOTER
   ========================================================== */

function targetGame() {

    canvasSize(600,600);


    let score = 0;

    let time = 30;

    let target = {

        x:300,
        y:300,
        r:35

    };


    function newTarget() {

        target = {

            x:
                60+
                Math.random()*480,

            y:
                60+
                Math.random()*480,

            r:
                20+
                Math.random()*30

        };

    }


    function draw() {

        ctx.fillStyle =
            "#050505";

        ctx.fillRect(
            0,0,600,600
        );


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth =
            4;

        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            target.r,
            0,
            Math.PI*2
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            target.r*.45,
            0,
            Math.PI*2
        );

        ctx.stroke();


        status(
            "Targets • Score: " +
            score +
            " • Time: " +
            time
        );

    }


    gameArea.onpointerdown =
        e => {

            if (!running)
                return;


            const p =
                pointerPosition(e);


            const distance =
                Math.hypot(
                    p.x-target.x,
                    p.y-target.y
                );


            if (
                distance <= target.r
            ) {

                score++;

                newTarget();

                draw();

            }

        };


    function start() {

        score = 0;

        time = 30;

        running = true;

        newTarget();

        draw();


        every(
            () => {

                if (!running)
                    return;

                time--;

                draw();


                if (
                    time <= 0
                ) {

                    running = false;

                    message(
                        "Time's up! Final score: " +
                        score
                    );

                }

            },
            1000
        );

    }


    clearControls();

    button(
        "START",
        start,
        true
    );


    message(
        "Tap the targets as quickly as possible."
    );


    draw();

}

        basketballGame,

        targetGame

};


/* ==========================================================
   START SELECTED GAME
   ========================================================== */

function startGame() {

    stopGame();

    clearControls();

    domArea.innerHTML = "";

    domArea.classList.add(
        "hidden"
    );

    gameArea.classList.remove(
        "hidden"
    );

    message(
        "Game loaded."
    );


    const loader =
        PLAYABLE_GAMES[GAME_ID];


    if (
        typeof loader !==
        "function"
    ) {

        status(
            "Game unavailable"
        );

        message(
            "This game is not enabled in the current Real Games registry."
        );

        return;

    }


    try {

        loader();

    }

    catch (error) {

        console.error(
            "Game error:",
            error
        );

        status(
            "Game Error"
        );

        message(
            "This game encountered an error. Check the browser console."
        );

    }

}
