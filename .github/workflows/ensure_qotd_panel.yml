name: Ensure QOTD Member Panel

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch QOTD startup panel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("question_of_day.py")
          text = path.read_text(encoding="utf-8")
          old = '''async def question_of_day_startup_job(context: ContextTypes.DEFAULT_TYPE):\n    if not qotd_enabled() or daily_post_already_done():\n        return\n    now = phoenix_now()\n'''
          new = '''async def question_of_day_startup_job(context: ContextTypes.DEFAULT_TYPE):\n    # Ensure the permanent member-facing QOTD panel exists in topic 11999.\n    # Existing topic content is never deleted or migrated.\n    try:\n        await ensure_qotd_submission_panel(context.application)\n    except Exception:\n        logger.exception("QOTD submission panel startup check failed.")\n\n    if not qotd_enabled() or daily_post_already_done():\n        return\n    now = phoenix_now()\n'''
          if old not in text:\n              raise SystemExit("Expected QOTD startup block was not found; no changes made.")\n          path.write_text(text.replace(old, new, 1), encoding="utf-8")\n          PY

      - name: Validate Python
        run: python -m py_compile question_of_day.py

      - name: Commit QOTD panel fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question_of_day.py
          git diff --cached --quiet || git commit -m "Ensure QOTD member submission panel on startup"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/ensure_qotd_panel.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary QOTD panel workflow"
          git push || true
