name: Apply final privacy and raffle safety fixes

on:
  push:
    paths:
      - '.github/workflows/final_security_fixes.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch current source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------------- question_of_day.py ----------------
          p = Path('question_of_day.py')
          s = p.read_text(encoding='utf-8')

          old = '''    if action == "qotd_submit_question":
          context.user_data["qotd_state"] = "question"
          context.user_data["qotd_chat_id"] = message.chat_id if message else None
          context.user_data["qotd_thread_id"] = message.message_thread_id if message else None
          await query.message.reply_text(
              "📝 <b>Send your question now.</b>\\n\\nKeep it under 3,000 characters. Your submission message will be removed after it is saved.",
              parse_mode="HTML",
              message_thread_id=message.message_thread_id if message else None,
          )
          return
          '''
          new = '''    if action == "qotd_submit_question":
          context.user_data["qotd_state"] = "question"
          context.user_data["qotd_chat_id"] = None
          context.user_data["qotd_thread_id"] = None
          try:
              await context.bot.send_message(
                  chat_id=update.effective_user.id,
                  text="📝 <b>Send your question now.</b>\\n\\n🔒 Your submission is private and will not appear in the group until it is posted as the QOTD.\\n\\nKeep it under 3,000 characters.",
                  parse_mode="HTML",
                  reply_markup=InlineKeyboardMarkup([[InlineKeyboardButton("❌ Cancel", callback_data="qotd_cancel")]]),
              )
          except TelegramError:
              await query.answer("Open the bot privately and press Start first, then try again.", show_alert=True)
          return
          '''
          if old not in s:
              raise SystemExit('QOTD question block not found')
          s = s.replace(old, new, 1)

          old = '''    if action == "qotd_submit_poll":
          context.user_data["qotd_state"] = "poll_question"
          context.user_data["qotd_chat_id"] = message.chat_id if message else None
          context.user_data["qotd_thread_id"] = message.message_thread_id if message else None
          await query.message.reply_text(
              "📊 <b>Build your poll</b>\\n\\nFirst, send the poll question. After that I'll ask for the answer choices.\\n\\nQuestion limit: 300 characters.",
              parse_mode="HTML",
              message_thread_id=message.message_thread_id if message else None,
          )
          return
          '''
          new = '''    if action == "qotd_submit_poll":
          context.user_data["qotd_state"] = "poll_question"
          context.user_data["qotd_chat_id"] = None
          context.user_data["qotd_thread_id"] = None
          try:
              await context.bot.send_message(
                  chat_id=update.effective_user.id,
                  text="📊 <b>Build your poll</b>\\n\\n🔒 Your poll submission is private and will not appear in the group until it is posted as the QOTD.\\n\\nFirst, send the poll question. Then I'll ask for the answer choices.\\n\\nQuestion limit: 300 characters.",
                  parse_mode="HTML",
                  reply_markup=InlineKeyboardMarkup([[InlineKeyboardButton("❌ Cancel", callback_data="qotd_cancel")]]),
              )
          except TelegramError:
              await query.answer("Open the bot privately and press Start first, then try again.", show_alert=True)
          return
          '''
          if old not in s:
              raise SystemExit('QOTD poll block not found')
          s = s.replace(old, new, 1)

          old = '''    expected_chat = context.user_data.get("qotd_chat_id")
          expected_thread = context.user_data.get("qotd_thread_id")
          if expected_chat and message.chat_id != expected_chat:
              return
          if expected_thread is not None and message.message_thread_id != expected_thread:
              return
          text = message.text.strip()
          '''
          new = '''    if message.chat.type != "private":
              return
          text = message.text.strip()
          '''
          if old not in s:
              raise SystemExit('QOTD input routing block not found')
          s = s.replace(old, new, 1)

          old = '''async def _finish_submission(update, context, item_id, saved_text):
          message = update.effective_message
          chat_id = message.chat_id if message else None
          thread_id = message.message_thread_id if message else None
          for key in ("qotd_state", "qotd_prompt", "qotd_chat_id", "qotd_thread_id"):
              context.user_data.pop(key, None)
          if message:
              try:
                  await message.delete()
              except TelegramError:
                  pass
          if queued_count() == 1 and not daily_post_already_done():
              posted = await publish_item(context, item_id)
              if posted:
                  return
          if chat_id:
              try:
                  count = queued_count()
                  notice = await context.bot.send_message(
                      chat_id=chat_id,
                      text=f"{saved_text}\\n\\n📚 Added to the Question of the Day bank.\\n<b>{count}</b> day{'s' if count != 1 else ''} currently queued.",
                      parse_mode="HTML",
                      message_thread_id=thread_id,
                  )
                  if context.job_queue:
                      context.job_queue.run_once(_delete_message_job, 15, data=(chat_id, notice.message_id))
              except TelegramError:
                  logger.exception("Could not send QOTD submission confirmation.")
          '''
          new = '''async def _finish_submission(update, context, item_id, saved_text):
          message = update.effective_message
          chat_id = message.chat_id if message and message.chat.type == "private" else None
          for key in ("qotd_state", "qotd_prompt", "qotd_chat_id", "qotd_thread_id"):
              context.user_data.pop(key, None)
          if message and message.chat.type == "private":
              try:
                  await message.delete()
              except TelegramError:
                  pass
          if queued_count() == 1 and not daily_post_already_done():
              posted = await publish_item(context, item_id)
              if posted:
                  return
          if chat_id:
              try:
                  count = queued_count()
                  notice = await context.bot.send_message(
                      chat_id=chat_id,
                      text=f"{saved_text}\\n\\n📚 Added to the Question of the Day bank.\\n<b>{count}</b> day{'s' if count != 1 else ''} currently queued.",
                      parse_mode="HTML",
                  )
                  if context.job_queue:
                      context.job_queue.run_once(_delete_message_job, 15, data=(chat_id, notice.message_id))
              except TelegramError:
                  logger.exception("Could not send QOTD submission confirmation.")
          '''
          if old not in s:
              raise SystemExit('QOTD finish block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- bot.py ----------------
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          # Private human verification challenge.
          old = 'message=await context.bot.send_message(chat_id=chat_id,text=f"🤖 <b>QUICK HUMAN CHECK</b>\\n\\nBefore you join the conversation, prove you\'re human. 👀\\n\\n<b>Which one is {answer.split(\' \',1)[1].lower()}?</b>\\n\\nTap the correct answer below.",reply_markup=keyboard,parse_mode=ParseMode.HTML)'
          new = 'message=await context.bot.send_message(chat_id=user_id,text=f"🤖 <b>QUICK HUMAN CHECK</b>\\n\\nBefore you join the conversation, prove you\'re human. 👀\\n\\n<b>Which one is {answer.split(\' \',1)[1].lower()}?</b>\\n\\nTap the correct answer below.",reply_markup=keyboard,parse_mode=ParseMode.HTML)'
          if old not in s:
              raise SystemExit('Human verification send line not found')
          s = s.replace(old, new, 1)

          # Private intro video: preserve the function, but send to the member's inbox.
          old = 'intro_video=await context.bot.send_video(chat_id=chat_id,video=video_file,caption=f"🎬 <b>WELCOME TO MELANATED AZ, {member_name}!</b> 💜\\n\\nTurn it up. 🔥🖤💜",parse_mode=ParseMode.HTML,supports_streaming=True)'
          new = 'intro_video=await context.bot.send_video(chat_id=chat_id,video=video_file,caption=f"🎬 <b>WELCOME TO MELANATED AZ, {member_name}!</b> 💜\\n\\nTurn it up. 🔥🖤💜",parse_mode=ParseMode.HTML,supports_streaming=True)'
          if old not in s:
              raise SystemExit('Intro video line not found')
          # No textual change here; the caller below is changed to pass user.id.

          old = 'save_joining_member(event.chat.id,user); await restrict_member(context.bot,event.chat.id,user.id); name=user.first_name or "there"; await send_community_intro_video(event.chat.id,context,name)'
          new = 'save_joining_member(event.chat.id,user); await restrict_member(context.bot,event.chat.id,user.id); name=user.first_name or "there"; await send_community_intro_video(user.id,context,name)'
          if old not in s:
              raise SystemExit('Intro video caller not found')
          s = s.replace(old, new, 1)

          # Verification callback must resolve the member against the main group,
          # because the verification button is now pressed in private chat.
          old = '''    user=update.effective_user; chat=update.effective_chat
    if not user or not chat or user.id!=target:return
    row=community_member(chat.id,user.id)
    if not row or row["status"]!="pending_verification":return
    expires=parse_iso(row["verification_expires_at"]); challenge=row["verification_challenge"] or ""
    if not expires or expires<utc_now() or "###" not in challenge: await send_human_challenge(chat.id,user.id,context); return
    answer,blob=challenge.split("###",1); options=blob.split("|||")
    if selected<0 or selected>=len(options):return
    if options[selected]!=answer:
        attempts=increment_verification_attempt(chat.id,user.id)
        if attempts>=VERIFICATION_MAX_ATTEMPTS: await remove_unverified_member(context.bot,chat.id,user.id); return
        await send_human_challenge(chat.id,user.id,context); return
    mark_verified(chat.id,user.id); await restore_member(context.bot,chat.id,user.id); private_opened=await send_private_intro_prompt(user,context)
'''
          new = '''    user=update.effective_user; chat=update.effective_chat
    if not user or not chat or user.id!=target:return
    main=configured_main_group_id()
    if not main:return
    row=community_member(main,user.id)
    if not row or row["status"]!="pending_verification":return
    expires=parse_iso(row["verification_expires_at"]); challenge=row["verification_challenge"] or ""
    if not expires or expires<utc_now() or "###" not in challenge: await send_human_challenge(main,user.id,context); return
    answer,blob=challenge.split("###",1); options=blob.split("|||")
    if selected<0 or selected>=len(options):return
    if options[selected]!=answer:
        attempts=increment_verification_attempt(main,user.id)
        if attempts>=VERIFICATION_MAX_ATTEMPTS: await remove_unverified_member(context.bot,main,user.id); return
        await send_human_challenge(main,user.id,context); return
    mark_verified(main,user.id); await restore_member(context.bot,main,user.id); await notify_admin_group_verification(context,user); private_opened=await send_private_intro_prompt(user,context)
'''
          if old not in s:
              raise SystemExit('Verification callback block not found')
          s = s.replace(old, new, 1)

          # Add the Admin Group verification notification immediately before the callback.
          marker='async def human_verification_callback(update,context):\n'
          notify='''async def notify_admin_group_verification(context,user):\n    admin_group=configured_admin_group_id()\n    if not admin_group or not user:\n        return\n    username=f"@{html.escape(user.username)}" if getattr(user,"username",None) else "No username"\n    name=html.escape(user.full_name or user.first_name or "Unknown member")\n    timestamp=utc_now().strftime("%Y-%m-%d %H:%M:%S UTC")\n    try:\n        await context.bot.send_message(\n            chat_id=admin_group,\n            text=f"🛡️ <b>MEMBER VERIFIED</b>\\n\\n👤 <b>{name}</b>\\n🔹 Username: {username}\\n🆔 User ID: <code>{user.id}</code>\\n🕒 Verified: <code>{timestamp}</code>\\n\\n👋🏾 The member is now cleared to participate, but their mandatory introduction is still required.",\n            parse_mode=ParseMode.HTML,\n        )\n    except TelegramError:\n        logger.exception("Could not notify Admin Group about verified member %s",user.id)\n\n'''
          if marker not in s:
              raise SystemExit('Verification callback marker not found')
          s=s.replace(marker,notify+marker,1)

          # Never repair/repost a raffle that already has a stored Telegram post.
          old='''    raffle_id=int(raffle["id"])\n    try:\n        # Do not write None into the raffle post fields. publish_raffle()\n        # creates the replacement post and saves its real Telegram IDs.\n        if await publish_raffle(raffle_id,context):\n'''
          new='''    raffle_id=int(raffle["id"])\n    if raffle["message_id"]:\n        logger.info("Raffle topic repair skipped: active raffle already has Telegram message_id=%s.",raffle["message_id"])\n        try:\n            os.makedirs(os.path.dirname(marker) or ".",exist_ok=True)\n            with open(marker,"w",encoding="utf-8") as fh: fh.write(f"raffle={raffle_id}\\nexisting_message_id={raffle[\"message_id\"]}\\n")\n        except Exception:\n            pass\n        return\n    try:\n        # Only publish when the active raffle has no Telegram post recorded.\n        if await publish_raffle(raffle_id,context):\n'''
          if old not in s:
              raise SystemExit('Raffle repair block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('Applied final privacy + raffle safety patches.')
          PY

          python -m py_compile bot.py question_of_day.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py question_of_day.py
          git diff --cached --check
          git commit -m "Fix private onboarding, QOTD submissions, and raffle repost safety"
          git rm .github/workflows/final_security_fixes.yml
          git commit -m "Remove one-time patch workflow"
          git push
