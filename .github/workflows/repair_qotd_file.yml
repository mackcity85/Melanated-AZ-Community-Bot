name: Repair QOTD File
on:
  push:
    paths:
      - '.github/workflows/repair_qotd_file.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore QOTD implementation
        run: |
          git restore --source=599dd7e17a7e644a31c94f030ff501a6cfa4493c -- question_of_day.py
          python - <<'PY'
          from pathlib import Path
          p=Path('question_of_day.py')
          s=p.read_text()
          s=s.replace('_int_env("QUESTION_OF_DAY_HOUR", 7)', '_int_env("QUESTION_OF_DAY_HOUR", 11)')
          s=s.replace('7:00 AM Arizona time', '11:00 AM Arizona time')
          p.write_text(s)
          PY
          python -m py_compile question_of_day.py admin.py bot.py topic_routing.py run_bot.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question_of_day.py
          git commit -m 'Restore full QOTD implementation' || exit 0
          git push origin HEAD:main

# trigger repair run
