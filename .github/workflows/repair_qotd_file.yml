name: Repair QOTD File

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair_qotd_file.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore QOTD implementation and set 11 AM
        shell: bash
        run: |
          git fetch origin main
          git restore --source=599dd7e17a7e644a31c94f030ff501a6cfa4493c -- question_of_day.py
          python - <<'PY'
          from pathlib import Path
          p = Path('question_of_day.py')
          s = p.read_text()
          s = s.replace('QUESTION_OF_DAY_HOUR = max(0, min(23, _int_env("QUESTION_OF_DAY_HOUR", 7)))', 'QUESTION_OF_DAY_HOUR = max(0, min(23, _int_env("QUESTION_OF_DAY_HOUR", 11)))')
          s = s.replace('7:00 AM Arizona time', '11:00 AM Arizona time')
          p.write_text(s)
          PY
          python -m py_compile question_of_day.py admin.py bot.py topic_routing.py run_bot.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question_of_day.py
          git commit -m "Restore QOTD implementation and set 11 AM" || exit 0
          git push origin HEAD:main

      - name: Remove repair workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/repair_qotd_file.yml || true
          git commit -m "Remove temporary QOTD repair workflow" || true
          git push origin HEAD:main || true
