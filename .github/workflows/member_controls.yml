name: Apply final source fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final patch helper
        run: python apply_final_fixes.py
      - name: Validate
        run: python -m py_compile bot.py question_of_day.py member_bank.py admin.py games_reminder.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py question_of_day.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Fix private onboarding, QOTD submissions, and raffle repost safety [skip ci]"
            git push
          fi
