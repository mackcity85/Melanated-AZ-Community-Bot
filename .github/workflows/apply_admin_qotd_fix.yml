name: Apply Admin QOTD Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin, bot, QOTD, and launcher
        run: |
          python - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # admin.py: put QOTD / After Dark directly into the real panel
          # ------------------------------------------------------------
          p = Path('admin.py')
          s = p.read_text()

          marker = '''# ==========================================================\n# ADMIN BUTTON ROUTER\n# ==========================================================\n'''
          funcs = r'''# ==========================================================
# QUESTION OF THE DAY / AFTER DARK ADMIN CONTROLS
# ==========================================================

async def admin_questions(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer()
    except Exception:
        pass

    try:
        from question_of_day import queued_count, daily_post_already_done, qotd_enabled
        count = queued_count()
        posted = daily_post_already_done()
        enabled = qotd_enabled()
    except Exception:
        count, posted, enabled = 0, False, False

    keyboard = InlineKeyboardMarkup([
        [InlineKeyboardButton("📚 QOTD Bank Status", callback_data="admin_qotd_status")],
        [InlineKeyboardButton("▶️ Post Next QOTD Now", callback_data="admin_qotd_post_next")],
        [InlineKeyboardButton("📌 Recreate QOTD Panel", callback_data="admin_qotd_panel")],
        [InlineKeyboardButton("⬅️ Back", callback_data="admin_back")],
    ])

    await query.edit_message_text(
        "💭 **QUESTION OF THE DAY**\n\n"
        "🕚 **Daily:** 11:00 AM Arizona time\n"
        f"📚 Queued: **{count} day{'s' if count != 1 else ''}**\n"
        f"📅 Today's post: **{'Posted' if posted else 'Not posted'}**\n"
        f"⚙️ System: **{'Enabled' if enabled else 'Not configured'}**\n\n"
        "📍 Destination: topic `11999`",
        reply_markup=keyboard,
        parse_mode="Markdown",
    )


async def admin_qotd_status(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer()
    except Exception:
        pass
    try:
        from question_of_day import queued_count, daily_post_already_done
        count = queued_count()
        posted = daily_post_already_done()
    except Exception:
        count, posted = 0, False
    await query.edit_message_text(
        "📚 **QOTD BANK STATUS**\n\n"
        f"Queued items: **{count}**\n"
        f"Today's QOTD: **{'Posted' if posted else 'Not posted'}**\n\n"
        "Questions and polls share the QOTD bank.\n"
        "Empty bank = no scheduled QOTD post.",
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("⬅️ Back", callback_data="admin_questions")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


async def admin_qotd_post_next(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer("Posting next QOTD...")
    except Exception:
        pass
    try:
        from question_of_day import publish_item, get_next_item
        item = get_next_item()
        if not item:
            text = "📚 **QOTD BANK EMPTY**\n\nThere is nothing queued to post."
        else:
            posted = await publish_item(context, int(item["id"]))
            text = (
                "✅ **QOTD POSTED**\n\nThe next queued Question/Poll was posted to topic `11999`."
                if posted else
                "❌ **QOTD POST FAILED**\n\nCheck the Render logs."
            )
    except Exception:
        text = "❌ **QOTD POST FAILED**\n\nCheck the Render logs."
    await query.edit_message_text(
        text,
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("💭 QOTD Controls", callback_data="admin_questions")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


async def admin_qotd_panel(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer("Recreating QOTD panel...")
    except Exception:
        pass
    try:
        from question_of_day import ensure_qotd_submission_panel
        await ensure_qotd_submission_panel(context.application)
        text = "📌 **QOTD PANEL READY**\n\nThe submission panel was created/re-pinned in topic `11999`."
    except Exception:
        text = "❌ **QOTD PANEL FAILED**\n\nCheck the Render logs."
    await query.edit_message_text(
        text,
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("💭 QOTD Controls", callback_data="admin_questions")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


async def admin_after_dark(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer()
    except Exception:
        pass
    await query.edit_message_text(
        "🌙 **AFTER DARK**\n\n"
        "After Dark uses its separate content bank and posts into the shared topic.\n\n"
        "🌙 **Daily:** 10:00 PM Arizona time\n"
        "📍 **Destination:** topic `11999`",
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("🌙 Confirm 10:00 PM Schedule", callback_data="admin_after_dark_schedule")],
            [InlineKeyboardButton("🌙 Post After Dark Now", callback_data="admin_after_dark_now")],
            [InlineKeyboardButton("⬅️ Back", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


async def admin_after_dark_schedule(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer("Schedule confirmed")
    except Exception:
        pass
    await query.edit_message_text(
        "🌙 **AFTER DARK SCHEDULE**\n\n"
        "Daily at **10:00 PM Arizona time**.\n\n"
        "Posts to the shared topic `11999`.",
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("🌙 After Dark Controls", callback_data="admin_after_dark")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


async def admin_after_dark_now(update, context):
    if not await require_admin(update, context):
        return
    query = update.callback_query
    if not query:
        return
    try:
        await query.answer("Posting After Dark...")
    except Exception:
        pass
    try:
        from daily_messages import send_daily_community_message
        await send_daily_community_message(context)
        text = "🌙 **AFTER DARK POSTED**\n\nThe current After Dark prompt was posted to topic `11999`."
    except Exception:
        text = "❌ **AFTER DARK POST FAILED**\n\nCheck the Render logs."
    await query.edit_message_text(
        text,
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("🌙 After Dark Controls", callback_data="admin_after_dark")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )


'''
          if 'async def admin_questions(' not in s:
              if marker not in s:
                  raise SystemExit('admin.py router marker not found')
              s = s.replace(marker, funcs + marker, 1)

          keyboard_old = '''            [\n                InlineKeyboardButton(\n                    "🎁 Holiday Exchange",\n                    callback_data="admin_holiday_exchange",\n                ),\n            ],\n            [\n                InlineKeyboardButton(\n                    "🔄 Refresh",\n                    callback_data="admin_refresh",\n                ),\n            ],'''
          keyboard_new = '''            [\n                InlineKeyboardButton(\n                    "🎁 Holiday Exchange",\n                    callback_data="admin_holiday_exchange",\n                ),\n            ],\n            [\n                InlineKeyboardButton(\n                    "💭 Questions / QOTD",\n                    callback_data="admin_questions",\n                ),\n                InlineKeyboardButton(\n                    "🌙 After Dark",\n                    callback_data="admin_after_dark",\n                ),\n            ],\n            [\n                InlineKeyboardButton(\n                    "🔄 Refresh",\n                    callback_data="admin_refresh",\n                ),\n            ],'''
          if 'callback_data="admin_questions"' not in s:
              if keyboard_old not in s:
                  raise SystemExit('admin.py keyboard marker not found')
              s = s.replace(keyboard_old, keyboard_new, 1)

          menu_old = '''        "🎁 **HOLIDAY EXCHANGE**\\n"\n        "Manage the Holiday Exchange."'''
          menu_new = '''        "🎁 **HOLIDAY EXCHANGE**\\n"\n        "Manage the Holiday Exchange.\\n\\n"\n\n        "💭 **QUESTIONS / QOTD**\\n"\n        "Manage the Question/Poll bank. Daily release: **11:00 AM Arizona time**.\\n\\n"\n\n        "🌙 **AFTER DARK**\\n"\n        "Separate content bank. Daily release: **10:00 PM Arizona time**."'''
          if 'Daily release: **11:00 AM Arizona time**' not in s:
              if menu_old not in s:
                  raise SystemExit('admin.py menu marker not found')
              s = s.replace(menu_old, menu_new, 1)

          router_marker = '''    # ------------------------------------------------------\n    # HOLIDAY EXCHANGE\n    # ------------------------------------------------------\n'''
          router_insert = '''    # ------------------------------------------------------\n    # QUESTION OF THE DAY / AFTER DARK\n    # ------------------------------------------------------\n\n    if data == "admin_questions":\n        await admin_questions(update, context)\n        return\n\n    if data == "admin_qotd_status":\n        await admin_qotd_status(update, context)\n        return\n\n    if data == "admin_qotd_post_next":\n        await admin_qotd_post_next(update, context)\n        return\n\n    if data == "admin_qotd_panel":\n        await admin_qotd_panel(update, context)\n        return\n\n    if data == "admin_after_dark":\n        await admin_after_dark(update, context)\n        return\n\n    if data == "admin_after_dark_schedule":\n        await admin_after_dark_schedule(update, context)\n        return\n\n    if data == "admin_after_dark_now":\n        await admin_after_dark_now(update, context)\n        return\n\n'''
          if 'if data == "admin_qotd_status":' not in s:
              if router_marker not in s:
                  raise SystemExit('admin.py router insertion marker not found')
              s = s.replace(router_marker, router_insert + router_marker, 1)

          p.write_text(s)

          # ------------------------------------------------------------
          # question_of_day.py: default schedule is 11:00 AM Phoenix
          # ------------------------------------------------------------
          p = Path('question_of_day.py')
          s = p.read_text()
          s = s.replace('Local Phoenix hour, default 7', 'Local Phoenix hour, default 11')
          s = s.replace('os.environ.get("QUESTION_OF_DAY_HOUR", 7)', 'os.environ.get("QUESTION_OF_DAY_HOUR", 11)')
          p.write_text(s)

          # ------------------------------------------------------------
          # bot.py: make QOTD part of the real application builder
          # ------------------------------------------------------------
          p = Path('bot.py')
          s = p.read_text()
          import_marker = 'from telegram.ext import'
          if 'from question_of_day import register_question_of_day_handlers' not in s:
              # Import lazily in build_application instead of changing the large import block.
              pass

          build_marker = '''    application=Application.builder().token(BOT_TOKEN).post_init(post_init).build()'''
          if 'start_question_of_day_scheduler(application)' not in s:
              if build_marker not in s:
                  raise SystemExit('bot.py build marker not found')
              replacement = build_marker + '''\n\n    # Shared QOTD / After Dark routing and QOTD scheduler.\n    try:\n        from topic_routing import install_all_topic_routing\n        install_all_topic_routing()\n    except Exception:\n        logger.exception("Unable to install shared topic routing.")\n\n    try:\n        from question_of_day import (\n            register_question_of_day_handlers,\n            start_question_of_day_scheduler,\n        )\n        register_question_of_day_handlers(application)\n        start_question_of_day_scheduler(application)\n    except Exception:\n        logger.exception("Unable to initialize Question of the Day scheduler.")'''
              s = s.replace(build_marker, replacement, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # run_bot.py: remove the old monkey-patch wrapper so the real
          # admin.py/bot.py implementations are the only owners.
          # ------------------------------------------------------------
          p = Path('run_bot.py')
          p.write_text('''# ==========================================================\n# Melanated AZ Bot launcher\n# run_bot.py\n#\n# The real admin panel and QOTD scheduler now live directly in\n# admin.py and bot.py. This launcher intentionally contains no\n# monkey-patching or duplicate scheduler registration.\n# ==========================================================\n\nimport bot\n\n\nif __name__ == "__main__":\n    bot.main()\n''')
          PY

      - name: Validate Python files
        run: python -m py_compile admin.py bot.py question_of_day.py run_bot.py

      - name: Commit direct fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.py bot.py question_of_day.py run_bot.py
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix direct admin QOTD controls and schedules"
          git push
