name: Monthly private intro reminders
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monthly_intro_reminders.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text()
          s=s.replace('(\"inactivity_notice_message_id\",\"INTEGER\")]', '(\"inactivity_notice_message_id\",\"INTEGER\"),(\"monthly_intro_reminder_at\",\"TEXT\")]')
          old='''async def send_monthly_intro_reminders(context):\n    return\n\ndef start_monthly_intro_reminders(application):\n    # Disabled: the Introductions topic has ONE permanent launcher/reminder.\n    logger.info(\"Monthly public introduction reposts disabled.\")'''
          new='''async def send_monthly_intro_reminders(context):\n    main=configured_main_group_id()\n    if not main:return\n    now=utc_now(); cutoff=now-timedelta(days=30)\n    with community_db_connect() as conn:\n        rows=conn.execute(\"SELECT * FROM community_members WHERE chat_id=? AND status NOT IN ('left','removed') AND (intro_text IS NULL OR TRIM(intro_text)='') AND (monthly_intro_reminder_at IS NULL OR monthly_intro_reminder_at<=?)\",(main,cutoff.isoformat())).fetchall()\n    bot_username=context.application.bot_data.get(\"bot_username\")\n    for row in rows:\n        uid=int(row[\"user_id\"])\n        try:\n            live=await context.bot.get_chat_member(main,uid)\n            if getattr(live,\"status\",\"\") not in {\"member\",\"administrator\",\"creator\"}:continue\n            if await is_admin(uid,context):continue\n            first_name=getattr(getattr(live,\"user\",None),\"first_name\",None) or row[\"first_name\"] or \"there\"\n            url=f\"https://t.me/{bot_username}?start=intro\" if bot_username else None\n            keyboard=InlineKeyboardMarkup([[InlineKeyboardButton(\"👋🏾 Complete My Intro\",url=url)]]) if url else None\n            text=f\"👋🏾 <b>Hey {html.escape(first_name)}!</b> 💜\\n\\nWe’d love to get to know you a little better. Your introduction is still missing, and it’s required for everyone in the Melanated AZ community.\\n\\nIt only takes a few minutes and helps everyone know who’s part of the community.\\n\\n🎂 <b>Birthday is optional</b>, but if you add yours, we’ll make sure you get a birthday shoutout! 🎉\\n\\nWhenever you’re ready, tap below to complete your intro. 👇🏾\"\n            await context.bot.send_message(chat_id=uid,text=text,reply_markup=keyboard,parse_mode=ParseMode.HTML)\n            with community_db_connect() as conn:\n                conn.execute(\"UPDATE community_members SET monthly_intro_reminder_at=? WHERE chat_id=? AND user_id=?\",(now.isoformat(),main,uid)); conn.commit()\n        except TelegramError:pass\n        except Exception:logger.exception(\"Monthly intro reminder failed for %s\",uid)\n\ndef start_monthly_intro_reminders(application):\n    if not application.job_queue:return\n    application.job_queue.run_once(send_monthly_intro_reminders,when=10,name=\"monthly-intro-reminders-initial\")\n    application.job_queue.run_repeating(send_monthly_intro_reminders,interval=86400,first=86400,name=\"monthly-intro-reminders\")\n    logger.info(\"Monthly private intro reminders enabled | first run now | cadence 30 days per member\")'''
          if old not in s: raise SystemExit('target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'Send monthly private reminders to members without intros' || exit 0
          git push