name: Fix raffle repair None crash

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-raffle-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove invalid None raffle post reset
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          bad = '        set_raffle_post(raffle_id,None,None)\n'
          if bad in text:
              text = text.replace(
                  '        # Clear the stale Telegram post reference left by the disabled auto-sync manager.\n'
                  + bad,
                  '        # Do not write None into the raffle post fields. publish_raffle()\n'
                  '        # creates the replacement post and saves its real Telegram IDs.\n'
              )
              path.write_text(text, encoding="utf-8")
              print("Fixed bot.py raffle repair")
          else:
              print("bot.py already fixed")

          path = Path("games_reminder.py")
          text = path.read_text(encoding="utf-8")
          bad = '        set_raffle_post(raffle_id, None, None)\n'
          if bad in text:
              text = text.replace(
                  bad,
                  '        # Do not write None into raffle post fields.\n'
              )
              path.write_text(text, encoding="utf-8")
              print("Fixed legacy games_reminder raffle repair")
          else:
              print("games_reminder.py already fixed or does not contain legacy call")
          PY

      - name: Wire member bank into admin panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("admin.py")
          text = path.read_text(encoding="utf-8")

          import_line = "from member_bank import admin_members, admin_member_view\n"
          if import_line not in text:
              marker = "from config import ADMIN_IDS\n"
              if marker not in text:
                  raise SystemExit("admin.py import marker not found")
              text = text.replace(marker, marker + "\n" + import_line, 1)

          button_marker = '''            [\n                InlineKeyboardButton(\n                    "🔄 Refresh",\n                    callback_data="admin_refresh",\n                ),\n            ],\n'''
          member_button = '''            [\n                InlineKeyboardButton(\n                    "👥 Members",\n                    callback_data="admin_members",\n                ),\n            ],\n'''
          if 'callback_data="admin_members"' not in text:
              if button_marker not in text:
                  raise SystemExit("admin keyboard refresh marker not found")
              text = text.replace(button_marker, member_button + button_marker, 1)

          router_marker = '''    # ------------------------------------------------------\n    # UNKNOWN\n    # ------------------------------------------------------\n'''
          router_block = '''    # ------------------------------------------------------\n    # MEMBER BANK / INTRO TRACKING\n    # ------------------------------------------------------\n\n    if data == "admin_members":\n        await admin_members(update, context, page=0)\n        return\n\n    if data.startswith("admin_members_page_"):\n        page_text = data[len("admin_members_page_"):]\n        try:\n            page = int(page_text)\n        except (TypeError, ValueError):\n            await query.answer("Invalid page.", show_alert=True)\n            return\n        await admin_members(update, context, page=page)\n        return\n\n    if data.startswith("admin_member_view_"):\n        member_user_id = data[len("admin_member_view_"):]\n        await admin_member_view(update, context, member_user_id)\n        return\n\n'''
          if 'if data == "admin_members":' not in text:
              if router_marker not in text:
                  raise SystemExit("admin router marker not found")
              text = text.replace(router_marker, router_block + router_marker, 1)

          path.write_text(text, encoding="utf-8")
          print("Member bank wiring complete")
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py games_reminder.py admin.py .github/workflows/fix_raffle_repair.yml
          git commit -m "Restore Members admin panel"
          git push
