name: Maintain bot fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Preserve the existing raffle-repair fixes.
          for filename, old, new in [
              ("bot.py",
               '        set_raffle_post(raffle_id,None,None)\n',
               '        # Do not write None into raffle post fields. publish_raffle() saves real Telegram IDs.\n'),
              ("games_reminder.py",
               '        set_raffle_post(raffle_id, None, None)\n',
               '        # Do not write None into raffle post fields.\n'),
          ]:
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Add Remove Member controls to the existing member bank.
          p = Path("member_bank.py")
          text = p.read_text(encoding="utf-8")

          remove_block = r'''


async def admin_member_remove_prompt(update, context, user_id):
    """Ask for confirmation before removing a member from the main group."""
    query = update.callback_query
    if not query:
        return
    try:
        from admin import is_admin
        if not await is_admin(update.effective_user.id, context):
            await query.answer("⛔ You are not authorized.", show_alert=True)
            return
    except Exception:
        logger.exception("Unable to verify admin for member removal.")
        await query.answer("Unable to verify admin access.", show_alert=True)
        return
    try:
        user_id = int(user_id)
    except (TypeError, ValueError):
        await query.answer("Invalid member.", show_alert=True)
        return
    await query.answer()
    await query.edit_message_text(
        "🚫 **REMOVE MEMBER**\n\n"
        f"Are you sure you want to remove user `{user_id}` from the Melanated AZ main group?\n\n"
        "This removes them from the group but **does not delete their Member Bank record**.",
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("🚫 Yes, Remove", callback_data=f"admin_member_remove_confirm_{user_id}")],
            [InlineKeyboardButton("❌ Cancel", callback_data=f"admin_member_remove_cancel_{user_id}")],
        ]),
        parse_mode="Markdown",
    )


async def admin_member_remove_cancel(update, context, user_id):
    query = update.callback_query
    if not query:
        return
    await query.answer("Removal cancelled.")
    await admin_member_view(update, context, user_id)


async def admin_member_remove_confirm(update, context, user_id):
    query = update.callback_query
    if not query:
        return
    try:
        from admin import is_admin
        if not await is_admin(update.effective_user.id, context):
            await query.answer("⛔ You are not authorized.", show_alert=True)
            return
    except Exception:
        logger.exception("Unable to verify admin for member removal confirmation.")
        await query.answer("Unable to verify admin access.", show_alert=True)
        return
    try:
        user_id = int(user_id)
    except (TypeError, ValueError):
        await query.answer("Invalid member.", show_alert=True)
        return
    if user_id == getattr(context.bot, "id", None):
        await query.answer("The bot cannot remove itself.", show_alert=True)
        return
    try:
        member = await context.bot.get_chat_member(int(MAIN_GROUP_ID), user_id)
        if getattr(member, "status", None) in ("creator", "administrator"):
            await query.answer("Administrators and the group owner cannot be removed here.", show_alert=True)
            return
        await context.bot.ban_chat_member(chat_id=int(MAIN_GROUP_ID), user_id=user_id)
        await context.bot.unban_chat_member(chat_id=int(MAIN_GROUP_ID), user_id=user_id, only_if_banned=True)
    except Exception as exc:
        logger.exception("Unable to remove member | user_id=%s", user_id)
        await query.answer("Removal failed.", show_alert=True)
        await query.edit_message_text(
            "❌ **REMOVE FAILED**\n\n"
            f"I could not remove user `{user_id}` from the main group.\n\n"
            f"Telegram error: `{type(exc).__name__}`",
            reply_markup=InlineKeyboardMarkup([
                [InlineKeyboardButton("⬅️ Member Profile", callback_data=f"admin_member_view_{user_id}")],
                [InlineKeyboardButton("⬅️ Members", callback_data="admin_members")],
            ]),
            parse_mode="Markdown",
        )
        return

    try:
        conn = _db(COMMUNITY_DB)
        columns = {r["name"] for r in conn.execute("PRAGMA table_info(community_members)").fetchall()}
        updates, values = [], []
        if "status" in columns:
            updates.append("status=?")
            values.append("removed_by_admin")
        if "last_post_at" in columns:
            updates.append("last_post_at=NULL")
        if updates:
            values.extend([int(MAIN_GROUP_ID), user_id])
            conn.execute(f"UPDATE community_members SET {', '.join(updates)} WHERE chat_id=? AND user_id=?", values)
            conn.commit()
        conn.close()
    except Exception:
        logger.exception("Telegram removal succeeded but Member Bank status update failed | user_id=%s", user_id)

    await query.answer("Member removed from the main group.")
    await query.edit_message_text(
        "🚫 **MEMBER REMOVED**\n\n"
        f"User `{user_id}` was removed from the Melanated AZ main group.\n\n"
        "Their Member Bank record was preserved for historical tracking.",
        reply_markup=InlineKeyboardMarkup([
            [InlineKeyboardButton("⬅️ Members", callback_data="admin_members")],
            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],
        ]),
        parse_mode="Markdown",
    )
'''
          if "async def admin_member_remove_prompt(" not in text:
              text += remove_block

          # Message Member opens a direct Telegram chat. This avoids requiring
          # the member to have started the bot and does not change stored data.
          old_buttons = '''        reply_markup=InlineKeyboardMarkup([\n            [InlineKeyboardButton("⬅️ Members", callback_data="admin_members")],\n            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],\n        ]),'''
          new_buttons = '''        reply_markup=InlineKeyboardMarkup([\n            [InlineKeyboardButton("📩 Message Member", url=f"tg://user?id={user_id}")],\n            [InlineKeyboardButton("🚫 Remove Member", callback_data=f"admin_member_remove_{user_id}")],\n            [InlineKeyboardButton("⬅️ Members", callback_data="admin_members")],\n            [InlineKeyboardButton("🏠 Admin Panel", callback_data="admin_back")],\n        ]),'''
          if 'url=f"tg://user?id={user_id}"' not in text:
              if old_buttons not in text:
                  raise SystemExit("member profile button marker not found")
              text = text.replace(old_buttons, new_buttons, 1)
          p.write_text(text, encoding="utf-8")

          # Wire removal callbacks into the existing admin callback router.
          p = Path("admin.py")
          text = p.read_text(encoding="utf-8")
          old_import = "from member_bank import admin_members, admin_member_view\n"
          new_import = '''from member_bank import (\n    admin_members,\n    admin_member_view,\n    admin_member_remove_prompt,\n    admin_member_remove_cancel,\n    admin_member_remove_confirm,\n)\n'''
          if "admin_member_remove_prompt" not in text:
              if old_import not in text:
                  raise SystemExit("admin member_bank import marker not found")
              text = text.replace(old_import, new_import, 1)

          route_marker = '    if data == "admin_refresh":\n'
          route_block = '''    if data.startswith("admin_member_remove_confirm_"):\n        await admin_member_remove_confirm(update, context, data[len("admin_member_remove_confirm_"):])\n        return\n\n    if data.startswith("admin_member_remove_cancel_"):\n        await admin_member_remove_cancel(update, context, data[len("admin_member_remove_cancel_"):])\n        return\n\n    if data.startswith("admin_member_remove_"):\n        await admin_member_remove_prompt(update, context, data[len("admin_member_remove_"):])\n        return\n\n'''
          if 'data.startswith("admin_member_remove_confirm_")' not in text:
              if route_marker not in text:
                  raise SystemExit("admin refresh route marker not found")
              text = text.replace(route_marker, route_block + route_marker, 1)
          p.write_text(text, encoding="utf-8")
          print("Safe member controls patch applied")
          PY

      - name: Validate Python
        run: python -m py_compile member_bank.py admin.py bot.py games_reminder.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member_bank.py admin.py bot.py games_reminder.py
          git commit -m "Add safe Member Bank message and remove controls"
          git push
