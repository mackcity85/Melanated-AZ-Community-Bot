name: Raffle Queue Syntax Check

on:
  pull_request:
    paths:
      - "bot.py"
      - "raffle.py"
      - "raffle_database.py"
      - "admin.py"
      - "birthday_scheduler.py"
      - ".github/workflows/raffle-queue-check.yml"
  push:
    branches:
      - "feature/raffle-queue-preserve-existing"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python modules
        run: python -m py_compile admin.py bot.py raffle.py raffle_database.py birthday_scheduler.py
