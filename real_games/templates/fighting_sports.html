<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>{{ game.name }} — Melanated AZ</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#08090d;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#222b3d,#07080b 70%);display:flex;justify-content:center;padding:18px}.wrap{width:min(760px,100%)}.card{background:#11151d;border:1px solid #374257;border-radius:18px;padding:18px;box-shadow:0 18px 55px #0009}h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px)}.sub{color:#adb8c9;margin-bottom:12px}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:800}canvas{display:block;width:100%;max-width:720px;aspect-ratio:16/9;background:#050608;border:2px solid #4a566c;border-radius:12px;touch-action:none;margin:auto}.start{display:flex;justify-content:center;margin:12px 0}.start button,.pad button,.actions button{border:1px solid #53627b;border-radius:14px;background:#1c2533;color:#fff;font-weight:800;touch-action:none}.start button{padding:12px 26px;font-size:16px}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:15px}.pad button{height:58px;font-size:22px}.actions{display:flex;justify-content:center;gap:12px;margin-top:10px}.actions button{width:100px;height:58px;font-size:22px}.blank{visibility:hidden}.help{text-align:center;color:#909bad;font-size:13px;margin-top:12px}</style></head>
<body><main class="wrap"><section class="card"><h1>{{ game.icon }} {{ game.name }}</h1><div class="sub">{{ game.system_name }} • {{ game.genre|capitalize }} • Original playable game</div><div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div><canvas id="game" width="960" height="540"></canvas><div class="start"><button id="start">START / RESTART</button></div><div class="pad"><button class="blank"></button><button data-key="up">▲</button><button class="blank"></button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="actions"><button data-key="a">A</button><button data-key="b">B</button></div><div class="help">Fighting: arrows move • A punch • B kick/block • Sports: arrows move • A action • B sprint/charge</div></section></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');const W=960,H=540,genre={{ game.genre|tojson }},gameId={{ game.game_id|tojson }},keys={left:false,right:false,up:false,down:false,a:false,b:false};let running=false,score=0,t=0,last=0,p1,p2,ball,shots,particles,round=1,clock=60,stamina=100;
function reset(){score=0;t=0;round=1;clock=60;stamina=100;shots=[];particles=[];p1={x:260,y:365,w:44,h:78,hp:100,guard:false,cd:0};p2={x:700,y:365,w:44,h:78,hp:100,guard:false,cd:0,ai:0};ball={x:480,y:320,vx:0,vy:0,owner:1};scoreEl.textContent='Score: 0';statusEl.textContent='Ready'}
function start(){reset();running=true;last=performance.now();statusEl.textContent='Playing';requestAnimationFrame(loop)}document.getElementById('start').onclick=start;
function hit(a,b,r=55){return Math.hypot(a.x-b.x,a.y-b.y)<r}function burst(x,y){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:.45})}
function fighterBG(){ctx.fillStyle='#241416';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4a252b';ctx.fillRect(0,330,W,210);ctx.fillStyle='#12151d';ctx.fillRect(70,95,820,240);ctx.strokeStyle='#d7b15b';ctx.lineWidth=5;ctx.strokeRect(80,105,800,220);ctx.strokeStyle='#7b5960';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(480,105);ctx.lineTo(480,325);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('ARCADE BOUT',22,30);}
function sportsBG(){ctx.fillStyle='#10251a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2c7a48';ctx.fillRect(55,70,850,420);ctx.strokeStyle='#d8f1dc';ctx.lineWidth=4;ctx.strokeRect(55,70,850,420);ctx.beginPath();ctx.moveTo(480,70);ctx.lineTo(480,490);ctx.stroke();ctx.beginPath();ctx.arc(480,280,72,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('ARCADE SPORTS',22,30)}
function drawFighter(p,enemy){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=enemy?'#e85b68':'#63c7ff';ctx.fillRect(-20,-58,40,58);ctx.beginPath();ctx.arc(0,-75,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(enemy?-11:5,-80,6,5);ctx.fillRect(enemy?5:-11,-80,6,5);ctx.fillStyle=enemy?'#ff9c55':'#ffe27a';ctx.fillRect(enemy?-34:14,-48,20,12);ctx.fillRect(enemy?-34:14,-18,20,12);ctx.restore()}
function drawHealth(){ctx.fillStyle='#222';ctx.fillRect(70,48,300,18);ctx.fillRect(590,48,300,18);ctx.fillStyle='#63c7ff';ctx.fillRect(70,48,3*p1.hp,18);ctx.fillStyle='#e85b68';ctx.fillRect(590,48,3*p2.hp,18)}
function drawSports(){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#777';ctx.stroke();ctx.fillStyle='#111';ctx.fillRect(p1.x-22,p1.y-34,44,68);ctx.fillStyle='#63c7ff';ctx.fillRect(p1.x-18,p1.y-38,36,12);ctx.fillStyle='#e85b68';ctx.fillRect(p2.x-22,p2.y-34,44,68);ctx.fillStyle='#ffe27a';ctx.fillRect(p2.x-18,p2.y-38,36,12)}
function draw(){if(genre==='fighting'){fighterBG();drawHealth();drawFighter(p1,false);drawFighter(p2,true)}else{sportsBG();drawSports()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#ffe27a';ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1}}
function updateFighting(dt){p1.vx=(keys.right-keys.left)*4.8;p1.vy=(keys.down-keys.up)*2.5;p1.x=Math.max(130,Math.min(830,p1.x+p1.vx*dt*60));p1.y=Math.max(345,Math.min(410,p1.y+p1.vy*dt*60));p1.guard=keys.b;p1.cd=Math.max(0,p1.cd-dt);p2.x+=Math.sign(p1.x-p2.x)*(1.7+Math.random())*dt*60;p2.x=Math.max(130,Math.min(830,p2.x));p2.cd=Math.max(0,p2.cd-dt);if(keys.a&&p1.cd===0&&hit(p1,p2,105)){p2.hp=Math.max(0,p2.hp-(p1.guard?2:10));p1.cd=.38;burst(p2.x,p2.y)}if(!p2.guard&&p2.cd===0&&hit(p1,p2,100)&&Math.random()<dt*.9){p1.hp=Math.max(0,p1.hp-7);p2.cd=.7;burst(p1.x,p1.y)}if(p2.hp<=0||p1.hp<=0){running=false;statusEl.textContent=p2.hp<=0?'KNOCKOUT!':'DEFEATED'}score=100-p2.hp;if(score>=100){running=false;statusEl.textContent='BOUT WON!'}}
function updateBasketball(dt){clock-=dt;let sp=keys.b?7:4.5;p1.x=Math.max(90,Math.min(870,p1.x+(keys.right-keys.left)*sp*dt*60));p1.y=Math.max(105,Math.min(465,p1.y+(keys.down-keys.up)*sp*dt*60));if(ball.owner===1){ball.x=p1.x+25;ball.y=p1.y-5;if(keys.a&&!p1._a){ball.owner=0;ball.vx=(keys.right-keys.left)*9+(480-p1.x)*.018;ball.vy=-8;p1._a=true}if(!keys.a)p1._a=false}else{ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vy+=.42*dt*60;if(ball.x<70||ball.x>890)ball.vx*=-.8;if(ball.y<80||ball.y>490)ball.vy*=-.75;if(ball.y<125&&Math.abs(ball.x-850)<70){score+=2;ball={x:p1.x+25,y:p1.y-5,vx:0,vy:0,owner:1};burst(850,120)}else if(ball.y<125&&Math.abs(ball.x-110)<70){score=Math.max(0,score-1);ball={x:p1.x+25,y:p1.y-5,vx:0,vy:0,owner:1}}}if(Math.random()<dt*.7){p2.x+=Math.sign(p1.x-p2.x)*2.5;p2.y+=Math.sign(p1.y-p2.y)*2.5}if(clock<=0){running=false;statusEl.textContent=score>=10?'GAME WON!':'TIME!'}}
function updateFootball(dt){clock-=dt;let sp=keys.b?7:4.8;p1.x=Math.max(90,Math.min(870,p1.x+(keys.right-keys.left)*sp*dt*60));p1.y=Math.max(90,Math.min(470,p1.y+(keys.down-keys.up)*sp*dt*60));if(ball.owner===1){ball.x=p1.x+24;ball.y=p1.y;if(keys.a&&!p1._a){ball.owner=0;ball.vx=(keys.right-keys.left)*11+(870-p1.x)*.02;ball.vy=(keys.down-keys.up)*7;p1._a=true}if(!keys.a)p1._a=false}else{ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vx*=.985;ball.vy*=.985;if(ball.x>880){score+=7;ball={x:p1.x+24,y:p1.y,vx:0,vy:0,owner:1};burst(885,280)}}if(clock<=0){running=false;statusEl.textContent=score>=7?'TOUCHDOWN!':'DRIVE OVER'}}
function update(dt){t+=dt;if(genre==='fighting')updateFighting(dt);else if({{ (game.sport or '')|tojson }}==='football')updateFootball(dt);else updateBasketball(dt);for(const p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt}particles=particles.filter(p=>p.life>0);scoreEl.textContent=genre==='fighting'?'Enemy HP: '+Math.floor(p2.hp):'Score: '+Math.floor(score)}
function loop(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'a',z:'a',' ':'a',x:'b',w:'up',s:'down',d:'right'};window.addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{const k=map[e.key];if(k){e.preventDefault();keys[k]=false}});document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;if(btn.setPointerCapture&&e.pointerId!==undefined)try{btn.setPointerCapture(e.pointerId)}catch(_){} };const up=e=>{e.preventDefault();keys[k]=false};if(window.PointerEvent){btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)}else{btn.addEventListener('touchstart',down,{passive:false});btn.addEventListener('touchend',up,{passive:false});btn.addEventListener('touchcancel',up,{passive:false});btn.addEventListener('mousedown',down);btn.addEventListener('mouseup',up);btn.addEventListener('mouseleave',up)}});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=false)});reset();draw();
</script></body></html>
