<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🎭 Dirty Minds</title>
<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#09090d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:10px}main{max-width:980px;margin:auto}.card{background:#15151d;border:1px solid #30303d;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 8px 28px #0005}h1{margin:0 0 6px;font-size:clamp(25px,7vw,40px)}h2{margin:8px 0}.muted{color:#aaa}.small{font-size:13px}.clue{font-size:clamp(22px,6vw,34px);font-weight:800;line-height:1.2;padding:22px 4px}.answer{font-size:18px;padding:13px;width:100%;border-radius:12px;border:1px solid #444;background:#0d0d13;color:#fff}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:#29293a;color:#fff}.primary{background:#7c3aed}.danger{background:#8b1e3f}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.notice{padding:10px;border-radius:10px;background:#222233;margin-top:8px}.players,.results{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#20202a;border-radius:12px}.tag{padding:3px 7px;border-radius:8px;background:#333}.hostbox{border-color:#6d28d9}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.video-tile{position:relative;min-height:150px;background:#000;border-radius:14px;overflow:hidden;border:1px solid #30303d}.video-tile video{width:100%;height:100%;min-height:150px;object-fit:cover;display:block}.video-name{position:absolute;left:8px;bottom:8px;background:#000b;padding:5px 8px;border-radius:8px;font-size:13px;font-weight:800}.correct{font-size:22px;font-weight:900;text-align:center;background:#17291e}.waiting{font-size:14px;color:#bbb}@media(max-width:600px){body{padding:7px}.btn{flex:1;min-width:120px}.row{align-items:flex-start;flex-direction:column}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.video-tile,.video-tile video{min-height:120px}}
</style>
</head>
<body>
<main>
<div class="card"><h1>🎭 Dirty Minds</h1><div class="muted">Clues sound dirty. Answers are clean.</div><div id="roomLine" class="small"></div></div>
<div class="card"><h2>🎥 Camera & Mic</h2><div class="btns"><button class="btn" id="micBtn">🎤 Turn Mic On</button><button class="btn" id="camBtn">📷 Turn Camera On</button><button class="btn" id="leaveMediaBtn">🔌 Disconnect Media</button></div><div id="videoGrid" class="video-grid"></div><div id="mediaMsg" class="small muted" style="margin-top:8px">Connecting to LiveKit…</div></div>
<div class="card" id="hostCard"><h2>👑 Host Controls</h2><div class="btns"><button class="btn primary" id="startBtn">▶️ Start Game</button><button class="btn primary hidden" id="revealBtn">👀 Reveal Answer</button><button class="btn primary hidden" id="nextBtn">➡️ Next Round</button><button class="btn danger hidden" id="finishBtn">🏁 End Game</button></div><div id="hostMsg" class="notice hidden"></div></div>
<div class="card"><div id="status" class="muted">Waiting for the host…</div><div id="round" class="small"></div><div id="clue" class="clue">Waiting for game to start.</div><div id="waiting" class="waiting"></div><div id="answerReveal" class="notice correct hidden">✅ Correct Answer: <span id="correctAnswer"></span></div><form id="answerForm" class="hidden"><input id="answer" class="answer" maxlength="100" autocomplete="off" placeholder="Your clean answer…"><div class="btns" style="margin-top:8px"><button class="btn primary" type="submit">Submit Answer</button></div></form></div>
<div class="card"><h2>👥 Players</h2><div id="players" class="players"></div></div>
<div class="card hidden" id="resultsCard"><h2>📋 Round Results</h2><div id="results" class="results"></div></div>
</main>
<script>
const ROOM_ID={{ room_id|tojson }},PLAYER_KEY={{ player_key|tojson }},PLAYER_NAME={{ player_name|default('Player')|tojson }};
const API='/real-games/api/dirty-minds';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let room=null,localVideo=null;
async function post(path,body={}){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({room_id:ROOM_ID,player_key:PLAYER_KEY,...body})});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'Request failed');return j}
async function refresh(){try{const r=await fetch(`${API}/state?room=${encodeURIComponent(ROOM_ID)}&player_key=${encodeURIComponent(PLAYER_KEY)}`,{cache:'no-store'});const j=await r.json();if(j.success)render(j.state)}catch(e){console.error(e)}}
function hostMsg(t){$('hostMsg').textContent=t;$('hostMsg').classList.remove('hidden')}
function render(s){$('roomLine').textContent=`Room ${s.room_id} · You: ${PLAYER_NAME} · ${s.player_count}/${s.max_players} players`;$('status').textContent=s.status==='waiting'?'Waiting for the host…':s.status==='playing'?'Submit one clean answer.':s.status==='revealed'?'Answers revealed — discuss the results!':'Game finished.';$('round').textContent=s.round?`Round ${s.round} of ${s.total_rounds}`:'';$('clue').textContent=s.clue||'Waiting for game to start.';$('startBtn').classList.toggle('hidden',!s.can_start);$('revealBtn').classList.toggle('hidden',!s.can_reveal);$('nextBtn').classList.toggle('hidden',!s.can_next);$('finishBtn').classList.toggle('hidden',!s.is_host||s.finished);$('hostCard').classList.toggle('hostbox',s.is_host);$('answerForm').classList.toggle('hidden',s.status!=='playing'||s.my_submitted);$('answer').disabled=s.my_submitted;$('waiting').textContent=s.status==='playing'?`${s.submitted_count} of ${s.player_count} players have answered.`:'';$('answerReveal').classList.toggle('hidden',!s.revealed);$('correctAnswer').textContent=s.revealed?(s.answer||'Answer unavailable'):'';$('players').innerHTML=(s.players||[]).map(p=>`<div class="row"><span>${esc(p.name)} ${p.host?'👑':''} ${p.name===PLAYER_NAME?'<span class="tag">You</span>':''}</span><span>${p.submitted?'✅ Answered':'⏳ Waiting'}</span></div>`).join('');if(s.revealed){$('resultsCard').classList.remove('hidden');$('results').innerHTML=(s.round_results||[]).map(r=>`<div class="row"><b>${esc(r.name)}</b><span>${esc(r.answer||'Did not answer')}</span></div>`).join('')||'<div class="muted">No answers.</div>'}else $('resultsCard').classList.add('hidden')}
$('startBtn').onclick=async()=>{try{await post('/start');await refresh()}catch(e){hostMsg('⚠️ '+e.message)}};$('revealBtn').onclick=async()=>{try{await post('/reveal');await refresh()}catch(e){hostMsg('⚠️ '+e.message)}};$('nextBtn').onclick=async()=>{try{await post('/next');await refresh()}catch(e){hostMsg('⚠️ '+e.message)}};$('finishBtn').onclick=async()=>{if(!confirm('End this Dirty Minds game?'))return;try{await post('/finish');await refresh()}catch(e){hostMsg('⚠️ '+e.message)}};$('answerForm').onsubmit=async e=>{e.preventDefault();const a=$('answer').value.trim();if(!a)return;try{await post('/answer',{answer:a});$('answer').value='';await refresh()}catch(e){alert(e.message)}};
function addTile(id,name,el){document.getElementById(id)?.remove();const tile=document.createElement('div');tile.className='video-tile';tile.id=id;tile.appendChild(el);const label=document.createElement('div');label.className='video-name';label.textContent=name;tile.appendChild(label);$('videoGrid').appendChild(tile)}
function removeTile(id){document.getElementById(id)?.remove()}
function pname(p){return p.name||p.identity||'Player'}
async function connectLiveKit(){try{if(!window.LivekitClient)throw new Error('LiveKit browser SDK did not load.');const r=await fetch(`${API}/livekit-token?room=${encodeURIComponent(ROOM_ID)}&player_key=${encodeURIComponent(PLAYER_KEY)}`,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'Unable to get LiveKit token.');const {Room,RoomEvent,Track,TrackPublication}=window.LivekitClient;room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.TrackSubscribed,(track,publication,participant)=>{const el=track.attach();el.autoplay=true;el.playsInline=true;if(track.kind===Track.Kind.Video){addTile('tile-'+participant.identity,pname(participant),el)}else{el.style.display='none';document.body.appendChild(el);el.play().catch(()=>{})}});room.on(RoomEvent.TrackUnsubscribed,(track,publication,participant)=>{track.detach().forEach(el=>el.remove());if(track.kind===Track.Kind.Video)removeTile('tile-'+participant.identity)});room.on(RoomEvent.ParticipantDisconnected,p=>removeTile('tile-'+p.identity));room.on(RoomEvent.Disconnected,()=>{$('mediaMsg').textContent='LiveKit disconnected.'});await room.connect(j.url,j.token);$('mediaMsg').textContent='🟢 LiveKit connected. Turn on your mic or camera to share with everyone.';room.remoteParticipants.forEach(p=>p.trackPublications.forEach(pub=>{if(pub.isSubscribed&&pub.track){const el=pub.track.attach();el.autoplay=true;el.playsInline=true;if(pub.kind===Track.Kind.Video){addTile('tile-'+p.identity,pname(p),el)}else{el.style.display='none';document.body.appendChild(el);el.play().catch(()=>{})}}}))}catch(e){console.error(e);$('mediaMsg').textContent='⚠️ '+e.message}}
$('micBtn').onclick=async()=>{try{if(!room)throw new Error('LiveKit is not connected yet.');const enabled=!room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(enabled);$('micBtn').textContent=enabled?'🎤 Mic On':'🔇 Mic Off';$('mediaMsg').textContent=enabled?'🎤 Your microphone is live for the room.':'🔇 Your microphone is off.'}catch(e){$('mediaMsg').textContent='⚠️ '+e.message}};
$('camBtn').onclick=async()=>{try{if(!room)throw new Error('LiveKit is not connected yet.');const enabled=!room.localParticipant.isCameraEnabled;await room.localParticipant.setCameraEnabled(enabled);$('camBtn').textContent=enabled?'📷 Camera On':'📷 Camera Off';const pub=room.localParticipant.getTrackPublication(window.LivekitClient.Track.Source.Camera);if(enabled&&pub?.track){localVideo=pub.track.attach();localVideo.autoplay=true;localVideo.playsInline=true;localVideo.muted=true;addTile('tile-local',PLAYER_NAME+' (You)',localVideo)}else if(!enabled){removeTile('tile-local');localVideo=null}}catch(e){$('mediaMsg').textContent='⚠️ '+e.message}};
$('leaveMediaBtn').onclick=async()=>{try{await room?.disconnect();room=null;$('videoGrid').innerHTML='';$('mediaMsg').textContent='Media disconnected. Refresh to reconnect.';$('micBtn').textContent='🎤 Turn Mic On';$('camBtn').textContent='📷 Turn Camera On'}catch(e){console.error(e)}};window.addEventListener('beforeunload',()=>room?.disconnect());refresh();setInterval(refresh,1000);connectLiveKit();
</script>
</body>
</html>
