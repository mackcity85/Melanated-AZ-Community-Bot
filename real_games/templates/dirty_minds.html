<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>🎭 Dirty Minds</title>

<!-- ==========================================================
     LIVEKIT
     Primary CDN
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"
    onerror="
        var s=document.createElement('script');
        s.src='https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js';
        document.head.appendChild(s);
    ">
</script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    background:#09090d;
    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    padding:12px;
}

main{
    width:100%;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#15151d;
    border:1px solid #30303d;
    border-radius:18px;
    padding:16px;
    margin:10px 0;
    box-shadow:0 8px 28px rgba(0,0,0,.25);
}

h1{
    margin:0 0 5px;
    font-size:clamp(26px,7vw,40px);
}

h2{
    margin:5px 0 12px;
}

.muted{
    color:#aaa;
}

.small{
    font-size:13px;
    color:#aaa;
}

.btns{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.btn{
    border:0;
    border-radius:12px;
    padding:13px 16px;
    font-weight:800;
    color:#fff;
    background:#29293a;
    cursor:pointer;
    min-height:46px;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.primary{
    background:#7c3aed;
}

.good{
    background:#16803c;
}

.warning{
    background:#b7791f;
}

.danger{
    background:#8b1e3f;
}

.hidden{
    display:none !important;
}

.clue{
    font-size:clamp(23px,6vw,36px);
    font-weight:900;
    line-height:1.25;
    padding:20px 5px;
    text-align:center;
}

.answer{
    width:100%;
    font-size:18px;
    padding:14px;
    border-radius:12px;
    border:1px solid #444;
    background:#0d0d13;
    color:#fff;
    outline:none;
}

.answer:focus{
    border-color:#7c3aed;
}

.notice{
    padding:13px;
    border-radius:12px;
    background:#222233;
    margin-top:10px;
}

.correct-answer{
    background:#12351f;
    border:1px solid #24753b;
    padding:16px;
    border-radius:14px;
    margin-top:14px;
    text-align:center;
}

.correct-label{
    color:#86efac;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.correct-value{
    font-size:26px;
    font-weight:900;
    margin-top:5px;
}

.players{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.player{
    background:#0d0d13;
    border:1px solid #30303d;
    border-radius:14px;
    overflow:hidden;
}

.video{
    width:100%;
    aspect-ratio:16/10;
    background:#000;
    position:relative;
    overflow:hidden;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.player-name{
    padding:9px;
    text-align:center;
    font-weight:800;
}

.answers{
    display:grid;
    gap:8px;
    margin-top:12px;
}

.answer-card{
    background:#20202a;
    border-radius:12px;
    padding:13px;
}

.answer-player{
    font-weight:900;
    margin-bottom:5px;
}

.answer-text{
    color:#eee;
    font-size:17px;
}

.waiting{
    text-align:center;
    padding:15px;
}

.status-pill{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#29293a;
    font-size:12px;
}

</style>
</head>

<body>

<main>

<!-- ==========================================================
     HEADER
========================================================== -->

<div class="card">

    <h1>🎭 Dirty Minds</h1>

    <div class="muted">
        Clues sound dirty. Answers are clean.
    </div>

    <div
        id="roomLine"
        class="small"
        style="margin-top:8px;">
    </div>

    <div
        id="connectionStatus"
        class="status-pill"
        style="margin-top:8px;">
        Connecting...
    </div>

</div>


<!-- ==========================================================
     CAMERA / MICROPHONE
========================================================== -->

<div class="card">

    <h2>🎤 Camera & Mic</h2>

    <div class="btns">

        <button
            class="btn"
            id="micBtn">
            🎤 Mic Off
        </button>

        <button
            class="btn"
            id="camBtn">
            📷 Camera Off
        </button>

    </div>

    <div
        id="mediaMsg"
        class="small"
        style="margin-top:10px;">
    </div>

</div>


<!-- ==========================================================
     PLAYERS / LIVE VIDEO
========================================================== -->

<div class="card">

    <h2>👥 Players</h2>

    <div
        id="players"
        class="players">
    </div>

</div>


<!-- ==========================================================
     HOST CONTROLS
========================================================== -->

<div
    class="card"
    id="hostCard">

    <h2>👑 Host Controls</h2>

    <div class="btns">

        <button
            class="btn primary hidden"
            id="startBtn">
            ▶️ Start Game
        </button>

        <button
            class="btn warning hidden"
            id="revealBtn">
            👀 Reveal Answers
        </button>

        <button
            class="btn good hidden"
            id="nextBtn">
            ➡️ Next Round
        </button>

        <button
            class="btn danger hidden"
            id="finishBtn">
            🏁 End Game
        </button>

    </div>

    <div
        id="hostMsg"
        class="notice hidden">
    </div>

</div>


<!-- ==========================================================
     GAME
========================================================== -->

<div class="card">

    <div
        id="status"
        class="muted">
        Waiting for the host…
    </div>

    <div
        id="round"
        class="small"
        style="margin-top:5px;">
    </div>

    <div
        id="clue"
        class="clue">
        Waiting for game to start.
    </div>


    <!-- ANSWER FORM -->

    <form
        id="answerForm"
        class="hidden">

        <input
            id="answer"
            class="answer"
            maxlength="100"
            autocomplete="off"
            placeholder="Your clean answer…">

        <div
            class="btns"
            style="margin-top:8px;">

            <button
                class="btn primary"
                type="submit"
                id="submitBtn">

                Submit Answer

            </button>

        </div>

    </form>


    <div
        id="submittedMsg"
        class="notice hidden">

        ✅ Your answer has been submitted.
        Waiting for everyone else…

    </div>


    <!-- ======================================================
         REVEAL RESULTS
    ====================================================== -->

    <div
        id="resultsSection"
        class="hidden">

        <h2 style="margin-top:20px;">
            📋 Round Results
        </h2>

        <div
            id="answers"
            class="answers">
        </div>


        <!-- THIS IS THE ACTUAL CLEAN ANSWER -->

        <div class="correct-answer">

            <div class="correct-label">
                Actual Clean Answer
            </div>

            <div
                id="correctAnswer"
                class="correct-value">
            </div>

        </div>

    </div>


    <!-- ======================================================
         GAME FINISHED
    ====================================================== -->

    <div
        id="finished"
        class="notice hidden"
        style="text-align:center;font-size:20px;font-weight:900;">

        🎉 Game Finished!

    </div>

</div>

</main>


<script>

/* ==========================================================
   VARIABLES
========================================================== */

const ROOM_ID =
    {{ room_id|tojson }};

const PLAYER_KEY =
    {{ player_key|tojson }};

const PLAYER_NAME =
    {{ player_name|default('Player')|tojson }};

const API =
    "/real-games/api/dirty-minds";

const TOKEN_API =
    API + "/livekit-token";


let livekitRoom = null;

let micOn = false;

let camOn = false;

let currentState = null;

let pollTimer = null;


/* ==========================================================
   HELPERS
========================================================== */

function $(id){
    return document.getElementById(id);
}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}


function show(id){
    $(id).classList.remove("hidden");
}


function hide(id){
    $(id).classList.add("hidden");
}


function setStatus(text){
    $("connectionStatus").textContent = text;
}


function hostMessage(text){

    $("hostMsg").textContent = text;

    show("hostMsg");
}


/* ==========================================================
   LIVEKIT LOADER
========================================================== */

function getLiveKit(){

    /*
     * Different UMD builds can expose the global
     * under LivekitClient.
     */

    if(window.LivekitClient){
        return window.LivekitClient;
    }

    if(window.LiveKit){
        return window.LiveKit;
    }

    return null;
}


/* ==========================================================
   LIVEKIT CONNECTION
========================================================== */

async function connectLiveKit(){

    let LK = getLiveKit();

    /*
     * Give the fallback CDN a few seconds to finish loading.
     */

    if(!LK){

        await new Promise(resolve => {

            let attempts = 0;

            const timer =
                setInterval(() => {

                    attempts++;

                    LK = getLiveKit();

                    if(LK || attempts >= 30){

                        clearInterval(timer);

                        resolve();

                    }

                },100);

        });

    }


    LK = getLiveKit();


    if(!LK){

        setStatus("LiveKit unavailable");

        $("mediaMsg").textContent =
            "LiveKit JavaScript could not be loaded. " +
            "The game itself can still be tested.";

        return;

    }


    try{

        setStatus("Connecting video...");

        const response =
            await fetch(
                TOKEN_API +
                "?room=" +
                encodeURIComponent(ROOM_ID) +
                "&player_key=" +
                encodeURIComponent(PLAYER_KEY),
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.error ||
                "LiveKit token could not be created."
            );

        }


        livekitRoom =
            new LK.Room({
                adaptiveStream:true,
                dynacast:true
            });


        /* ==================================================
           REMOTE VIDEO/AUDIO
        ================================================== */

        livekitRoom.on(
            LK.RoomEvent.TrackSubscribed,
            (track,publication,participant) => {

                createPlayer(participant);

                attachTrack(
                    track,
                    participant
                );

            }
        );


        livekitRoom.on(
            LK.RoomEvent.TrackUnsubscribed,
            track => {

                try{
                    track.detach();
                }catch(e){}

            }
        );


        livekitRoom.on(
            LK.RoomEvent.ParticipantConnected,
            participant => {

                createPlayer(participant);

            }
        );


        livekitRoom.on(
            LK.RoomEvent.ParticipantDisconnected,
            participant => {

                removePlayer(
                    participant.identity
                );

            }
        );


        livekitRoom.on(
            LK.RoomEvent.Disconnected,
            () => {

                setStatus("LiveKit disconnected");

            }
        );


        /* ==================================================
           CONNECT
        ================================================== */

        await livekitRoom.connect(
            data.url,
            data.token
        );


        setStatus("LiveKit connected");

        $("mediaMsg").textContent =
            "Camera and microphone are ready.";


        createLocalPlayer();


        /*
         * Add existing remote participants.
         */

        livekitRoom.remoteParticipants.forEach(
            participant => {

                createPlayer(participant);

                participant.trackPublications.forEach(
                    publication => {

                        if(
                            publication.isSubscribed &&
                            publication.track
                        ){

                            attachTrack(
                                publication.track,
                                participant
                            );

                        }

                    }
                );

            }
        );


    }catch(error){

        console.error(
            "LiveKit connection error:",
            error
        );

        setStatus("LiveKit connection error");

        $("mediaMsg").textContent =
            error.message ||
            "LiveKit connection failed.";

    }

}


/* ==========================================================
   LOCAL PLAYER TILE
========================================================== */

function createLocalPlayer(){

    if(!livekitRoom){
        return;
    }

    const identity =
        livekitRoom.localParticipant.identity;


    if(
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        )
    ){
        return;
    }


    const player =
        document.createElement("div");

    player.className =
        "player";

    player.dataset.player =
        identity;


    player.innerHTML = `

        <div class="video">

            <div class="local-video"></div>

        </div>

        <div class="player-name">
            ${esc(PLAYER_NAME)} (You)
        </div>

    `;


    $("players")
        .appendChild(player);

}


/* ==========================================================
   REMOTE PLAYER TILE
========================================================== */

function createPlayer(participant){

    const identity =
        participant.identity;


    if(
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        )
    ){
        return;
    }


    const player =
        document.createElement("div");

    player.className =
        "player";

    player.dataset.player =
        identity;


    player.innerHTML = `

        <div class="video"></div>

        <div class="player-name">
            ${esc(
                participant.name ||
                identity ||
                "Player"
            )}
        </div>

    `;


    $("players")
        .appendChild(player);

}


/* ==========================================================
   ATTACH VIDEO / AUDIO
========================================================== */

function attachTrack(
    track,
    participant
){

    createPlayer(participant);


    const tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(participant.identity) +
            '"]'
        );


    if(!tile){
        return;
    }


    const videoArea =
        tile.querySelector(".video");


    if(!videoArea){
        return;
    }


    try{

        const element =
            track.attach();


        element.autoplay = true;

        element.playsInline = true;


        /*
         * Remote audio must NOT be muted.
         */

        if(track.kind === "audio"){

            element.autoplay = true;

        }


        videoArea.appendChild(
            element
        );


    }catch(error){

        console.error(
            "Track attach error:",
            error
        );

    }

}


/* ==========================================================
   REMOVE PLAYER
========================================================== */

function removePlayer(identity){

    const tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        );


    if(tile){
        tile.remove();
    }

}


/* ==========================================================
   MICROPHONE
========================================================== */

async function toggleMic(){

    if(!livekitRoom){

        $("mediaMsg").textContent =
            "LiveKit is not connected.";

        return;

    }


    try{

        micOn =
            !micOn;


        await livekitRoom
            .localParticipant
            .setMicrophoneEnabled(
                micOn
            );


        $("micBtn").textContent =
            micOn
                ? "🔇 Mute Mic"
                : "🎤 Mic Off";


    }catch(error){

        console.error(error);

        micOn = false;

        $("micBtn").textContent =
            "🎤 Mic Off";


        $("mediaMsg").textContent =
            "Microphone permission was denied or unavailable.";

    }

}


/* ==========================================================
   CAMERA
========================================================== */

async function toggleCamera(){

    if(!livekitRoom){

        $("mediaMsg").textContent =
            "LiveKit is not connected.";

        return;

    }


    try{

        camOn =
            !camOn;


        await livekitRoom
            .localParticipant
            .setCameraEnabled(
                camOn
            );


        $("camBtn").textContent =
            camOn
                ? "📷 Camera On"
                : "📷 Camera Off";


        /*
         * Attach local camera.
         */

        if(camOn){

            const LK =
                getLiveKit();


            const publication =
                livekitRoom
                    .localParticipant
                    .getTrackPublication(
                        LK.Track.Source.Camera
                    );


            if(
                publication &&
                publication.track
            ){

                const tile =
                    document.querySelector(
                        '[data-player="' +
                        CSS.escape(
                            livekitRoom.localParticipant.identity
                        ) +
                        '"]'
                    );


                if(tile){

                    const area =
                        tile.querySelector(
                            ".local-video"
                        );


                    if(area){

                        const existing =
                            area.querySelector(
                                "video"
                            );


                        if(!existing){

                            const video =
                                publication.track.attach();


                            video.autoplay =
                                true;

                            video.playsInline =
                                true;

                            video.muted =
                                true;


                            area.appendChild(
                                video
                            );

                        }

                    }

                }

            }

        }


    }catch(error){

        console.error(error);

        camOn = false;

        $("camBtn").textContent =
            "📷 Camera Off";


        $("mediaMsg").textContent =
            "Camera permission was denied or unavailable.";

    }

}


/* ==========================================================
   API CALL
========================================================== */

async function call(
    path,
    body={}
){

    const response =
        await fetch(
            API + path,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Cache-Control":
                        "no-cache"
                },

                cache:"no-store",

                body:JSON.stringify({

                    room_id:
                        ROOM_ID,

                    player_key:
                        PLAYER_KEY,

                    ...body

                })
            }
        );


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }catch(error){

        throw new Error(
            "Server returned an invalid response."
        );

    }


    if(
        !response.ok ||
        data.success === false
    ){

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}


/* ==========================================================
   GET STATE
========================================================== */

async function getState(){

    const response =
        await fetch(
            API +
            "/state?room=" +
            encodeURIComponent(ROOM_ID) +
            "&player_key=" +
            encodeURIComponent(PLAYER_KEY),
            {
                cache:"no-store"
            }
        );


    const data =
        await response.json();


    if(
        !response.ok ||
        data.success === false
    ){

        throw new Error(
            data.error ||
            "Unable to get game state."
        );

    }


    return data.state;

}


/* ==========================================================
   RENDER GAME
========================================================== */

function render(state){

    if(!state){
        return;
    }


    currentState =
        state;


    $("roomLine").textContent =
        "Room " +
        state.room_id +
        " · " +
        PLAYER_NAME +
        " · " +
        state.player_count +
        "/" +
        state.max_players +
        " players";


    /* ======================================================
       WAITING
    ====================================================== */

    if(state.status === "waiting"){

        $("status").textContent =
            "Waiting for the host…";

        $("clue").textContent =
            "Waiting for game to start.";

        hide("answerForm");

        hide("submittedMsg");

        hide("resultsSection");

        hide("revealBtn");

        hide("nextBtn");

        hide("finishBtn");


        if(state.is_host){

            show("startBtn");

            $("startBtn").disabled =
                !state.can_start;

        }else{

            hide("startBtn");

        }


        return;

    }


    /* ======================================================
       PLAYING
    ====================================================== */

    if(state.status === "playing"){

        $("status").textContent =
            "Submit one clean answer.";

        $("round").textContent =
            "Round " +
            state.round +
            " of " +
            state.total_rounds;


        $("clue").textContent =
            state.clue ||
            "Loading clue…";


        hide("resultsSection");

        hide("nextBtn");

        hide("finishBtn");


        if(state.is_host){

            hide("startBtn");

        }


        /*
         * Number of submitted answers.
         */

        const submitted =
            Number(
                state.submitted_count || 0
            );


        const total =
            Number(
                state.player_count || 0
            );


        /*
         * Determine whether THIS player
         * already submitted.
         */

        const me =
            (state.players || [])
                .find(
                    player =>
                        player.player_key ===
                        PLAYER_KEY
                );


        /*
         * Some backend versions don't expose
         * player_key publicly, so also use
         * my_submitted when available.
         */

        const alreadySubmitted =
            state.my_submitted === true ||
            (
                me &&
                me.submitted === true
            );


        if(alreadySubmitted){

            hide("answerForm");

            show("submittedMsg");

        }else{

            show("answerForm");

            hide("submittedMsg");

            $("answer").disabled =
                false;

            $("submitBtn").disabled =
                false;

        }


        /*
         * Host can reveal only when EVERYONE
         * has submitted.
         */

        if(
            state.is_host &&
            total > 0 &&
            submitted >= total
        ){

            show("revealBtn");

            $("revealBtn").disabled =
                false;

        }else{

            hide("revealBtn");

        }


        return;

    }


    /* ======================================================
       REVEALED
    ====================================================== */

    if(state.status === "revealed"){

        $("status").textContent =
            "Round revealed.";

        $("round").textContent =
            "Round " +
            state.round +
            " of " +
            state.total_rounds;


        $("clue").textContent =
            state.clue ||
            "";


        hide("answerForm");

        hide("submittedMsg");

        hide("revealBtn");


        /*
         * IMPORTANT:
         *
         * The backend calls the actual clean answer
         * "answer", NOT "correct_answer".
         */

        $("correctAnswer").textContent =
            state.answer ||
            "Answer unavailable";


        /*
         * Show every player's submitted answer.
         */

        renderAnswers(
            state.round_results || []
        );


        show("resultsSection");


        if(state.is_host){

            show("nextBtn");

            show("finishBtn");

        }else{

            hide("nextBtn");

            hide("finishBtn");

        }


        return;

    }


    /* ======================================================
       FINISHED
    ====================================================== */

    if(state.status === "finished"){

        $("status").textContent =
            "Game finished.";

        $("clue").textContent =
            "🎉 Thanks for playing Dirty Minds!";


        hide("answerForm");

        hide("submittedMsg");

        hide("revealBtn");

        hide("nextBtn");

        hide("finishBtn");

        hide("resultsSection");

        show("finished");


        return;

    }

}


/* ==========================================================
   RENDER SUBMITTED ANSWERS
========================================================== */

function renderAnswers(results){

    const container =
        $("answers");


    container.innerHTML =
        "";


    if(!results.length){

        container.innerHTML =
            `
            <div class="notice">
                No submitted answers found.
            </div>
            `;

        return;

    }


    results.forEach(result => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "answer-card";


        const name =
            result.name ||
            "Player";


        const answer =
            result.answer ||
            "(No answer submitted)";


        card.innerHTML = `

            <div class="answer-player">
                👤 ${esc(name)}
            </div>

            <div class="answer-text">
                ${esc(answer)}
            </div>

        `;


        container.appendChild(
            card
        );

    });

}


/* ==========================================================
   START GAME
========================================================== */

async function startGame(){

    try{

        $("startBtn").disabled =
            true;


        await call(
            "/start"
        );


        await refresh();


    }catch(error){

        console.error(error);


        hostMessage(
            error.message ||
            "Unable to start game."
        );


        $("startBtn").disabled =
            false;

    }

}


/* ==========================================================
   SUBMIT ANSWER
========================================================== */

async function submitAnswer(event){

    event.preventDefault();


    const input =
        $("answer");


    const answer =
        input.value.trim();


    if(!answer){

        $("mediaMsg").textContent =
            "Enter your clean answer first.";

        return;

    }


    try{

        $("submitBtn").disabled =
            true;

        input.disabled =
            true;


        await call(
            "/answer",
            {
                answer:answer
            }
        );


        hide("answerForm");

        show("submittedMsg");


        await refresh();


    }catch(error){

        console.error(error);


        $("mediaMsg").textContent =
            error.message ||
            "Unable to submit answer.";


        $("submitBtn").disabled =
            false;

        input.disabled =
            false;

    }

}


/* ==========================================================
   REVEAL
========================================================== */

async function reveal(){

    try{

        $("revealBtn").disabled =
            true;


        await call(
            "/reveal"
        );


        await refresh();


    }catch(error){

        console.error(error);


        hostMessage(
            error.message ||
            "Unable to reveal answers."
        );


        $("revealBtn").disabled =
            false;

    }

}


/* ==========================================================
   NEXT ROUND
========================================================== */

async function nextRound(){

    try{

        $("nextBtn").disabled =
            true;


        await call(
            "/next"
        );


        $("answer").value =
            "";


        await refresh();


    }catch(error){

        console.error(error);


        hostMessage(
            error.message ||
            "Unable to start next round."
        );


        $("nextBtn").disabled =
            false;

    }

}


/* ==========================================================
   FINISH GAME
========================================================== */

async function finishGame(){

    if(
        !confirm(
            "End the Dirty Minds game?"
        )
    ){

        return;

    }


    try{

        await call(
            "/finish"
        );


        await refresh();


    }catch(error){

        console.error(error);


        hostMessage(
            error.message ||
            "Unable to end game."
        );

    }

}


/* ==========================================================
   REFRESH
========================================================== */

async function refresh(){

    try{

        const state =
            await getState();


        render(state);


    }catch(error){

        console.error(
            "State refresh error:",
            error
        );

    }

}


/* ==========================================================
   BUTTONS
========================================================== */

$("micBtn")
    .addEventListener(
        "click",
        toggleMic
    );


$("camBtn")
    .addEventListener(
        "click",
        toggleCamera
    );


$("startBtn")
    .addEventListener(
        "click",
        startGame
    );


$("revealBtn")
    .addEventListener(
        "click",
        reveal
    );


$("nextBtn")
    .addEventListener(
        "click",
        nextRound
    );


$("finishBtn")
    .addEventListener(
        "click",
        finishGame
    );


$("answerForm")
    .addEventListener(
        "submit",
        submitAnswer
    );


/* ==========================================================
   POLLING
========================================================== */

pollTimer =
    setInterval(
        refresh,
        1000
    );


/* ==========================================================
   INITIALIZE
========================================================== */

(async function(){

    await connectLiveKit();

    await refresh();

})();


/* ==========================================================
   CLEANUP
========================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if(pollTimer){

            clearInterval(
                pollTimer
            );

        }


        if(livekitRoom){

            try{

                livekitRoom.disconnect();

            }catch(e){}

        }

    }
);

</script>
