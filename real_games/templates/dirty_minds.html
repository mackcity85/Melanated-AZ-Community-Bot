<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>{{ game.name|default('Dirty Minds') }} — Melanated AZ Real Games</title>

<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#09090d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:12px;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.title{
    font-size:24px;
    font-weight:900;
}

.status{
    padding:7px 10px;
    border-radius:20px;
    background:#191923;
    color:#aaa;
    font-size:12px;
}

.panel{
    background:#15151d;
    border:1px solid #292936;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
}

.clue{
    font-size:26px;
    line-height:1.25;
    font-weight:900;
    text-align:center;
    padding:20px 10px;
}

.answer-row{
    display:flex;
    gap:8px;
}

.answer-row input{
    flex:1;
    min-width:0;
    background:#0b0b10;
    border:1px solid #353543;
    color:#fff;
    border-radius:12px;
    padding:14px;
    outline:none;
}

.primary{
    background:#8b5cf6;
    color:#fff;
}

.success{
    background:#16a34a;
    color:#fff;
}

.warning{
    background:#d97706;
    color:#fff;
}

.danger{
    background:#dc2626;
    color:#fff;
}

.secondary{
    background:#292936;
    color:#fff;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}

.message{
    text-align:center;
    color:#aaa;
    margin-top:10px;
    min-height:20px;
}

.players{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.player{
    background:#0d0d13;
    border:1px solid #292936;
    border-radius:14px;
    overflow:hidden;
}

.video{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:#050507;
    overflow:hidden;
}

.video video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.player-name{
    padding:9px;
    font-weight:700;
    text-align:center;
}

.answers{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.answer-card{
    background:#0d0d13;
    border:1px solid #292936;
    border-radius:12px;
    padding:12px;
}

.answer-name{
    font-weight:800;
    margin-bottom:5px;
}

.correct{
    margin-top:12px;
    padding:15px;
    border-radius:12px;
    background:#16351f;
    border:1px solid #24743b;
    text-align:center;
}

.correct-label{
    font-size:12px;
    text-transform:uppercase;
    color:#86efac;
    font-weight:800;
}

.correct-answer{
    font-size:22px;
    font-weight:900;
    margin-top:4px;
}

.hidden{
    display:none !important;
}

.small{
    font-size:13px;
    color:#999;
}

@media(max-width:650px){
    body{
        padding:8px;
    }

    .title{
        font-size:20px;
    }

    .clue{
        font-size:22px;
    }

    .answer-row{
        flex-direction:column;
    }

    .answer-row button{
        width:100%;
    }

    .controls button{
        flex:1 1 45%;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">🎭 Dirty Minds</div>
        <div id="connectionStatus" class="status">Connecting...</div>
    </div>

    <!-- VIDEO / AUDIO -->
    <div class="panel">
        <div class="small" style="margin-bottom:10px;">
            Players
        </div>

        <div id="players" class="players"></div>

        <div class="controls" style="margin-top:12px;">
            <button id="micBtn" class="secondary">
                🎤 Mic
            </button>

            <button id="cameraBtn" class="secondary">
                📷 Camera
            </button>
        </div>

        <div id="mediaMessage" class="message"></div>
    </div>

    <!-- GAME -->
    <div id="gamePanel" class="panel">

        <div id="waitingScreen">
            <div class="clue">
                Waiting for the host to start...
            </div>

            <div id="waitingPlayers" class="message"></div>

            <div class="controls">
                <button id="startBtn" class="primary hidden">
                    ▶ Start Game
                </button>
            </div>
        </div>

        <div id="playingScreen" class="hidden">

            <div class="small" style="text-align:center;">
                Round <span id="roundNumber">1</span>
            </div>

            <div id="clue" class="clue">
                Loading clue...
            </div>

            <div id="answerArea">

                <div class="answer-row">
                    <input
                        id="answerInput"
                        type="text"
                        maxlength="200"
                        autocomplete="off"
                        placeholder="Enter your clean answer..."
                    >

                    <button id="submitBtn" class="primary">
                        Submit
                    </button>
                </div>

                <div id="answerMessage" class="message"></div>

            </div>

            <div id="submittedMessage"
                 class="message hidden">
                ✅ Your answer has been submitted. Waiting for everyone else...
            </div>

        </div>

        <!-- REVEAL -->
        <div id="revealScreen" class="hidden">

            <div class="clue">
                Round Results
            </div>

            <div id="answers" class="answers"></div>

            <div class="correct">
                <div class="correct-label">
                    Correct Clean Answer
                </div>

                <div id="correctAnswer"
                     class="correct-answer">
                </div>
            </div>

            <div class="controls" style="margin-top:15px;">

                <button id="nextBtn"
                        class="success hidden">
                    ➡️ Next Round
                </button>

                <button id="finishBtn"
                        class="danger hidden">
                    🛑 End Game
                </button>

            </div>

        </div>

        <!-- FINISHED -->
        <div id="finishedScreen" class="hidden">

            <div class="clue">
                🎉 Game Finished
            </div>

            <div class="message">
                Thanks for playing Dirty Minds!
            </div>

        </div>

    </div>

</div>

<script>
(function(){

"use strict";

const ROOM_ID =
    {{ room_id|tojson }};

const PLAYER_KEY =
    {{ player_key|tojson }};

const PLAYER_NAME =
    {{ player_name|default("Player")|tojson }};

const TOKEN_ENDPOINT =
    "/real-games/api/dirty-minds/livekit-token";

const STATE_ENDPOINT =
    "/real-games/api/dirty-minds/state";

const START_ENDPOINT =
    "/real-games/api/dirty-minds/start";

const ANSWER_ENDPOINT =
    "/real-games/api/dirty-minds/answer";

const REVEAL_ENDPOINT =
    "/real-games/api/dirty-minds/reveal";

const NEXT_ENDPOINT =
    "/real-games/api/dirty-minds/next";

const FINISH_ENDPOINT =
    "/real-games/api/dirty-minds/finish";


const $ = id => document.getElementById(id);

let room = null;
let stateTimer = null;
let lastState = null;
let cameraEnabled = false;
let microphoneEnabled = false;


/* ==========================================================
   BASIC HELPERS
========================================================== */

function show(id){
    $(id).classList.remove("hidden");
}

function hide(id){
    $(id).classList.add("hidden");
}

function setStatus(text){
    $("connectionStatus").textContent = text;
}

function message(text){
    $("mediaMessage").textContent = text || "";
}

async function postJSON(url,data){

    const response = await fetch(url,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    let result;

    try{
        result = await response.json();
    }catch(e){
        throw new Error("Server returned an invalid response.");
    }

    if(!response.ok || result.success === false || result.ok === false){
        throw new Error(result.error || "Request failed.");
    }

    return result;
}

async function getState(){

    const url =
        STATE_ENDPOINT +
        "?room=" +
        encodeURIComponent(ROOM_ID) +
        "&player_key=" +
        encodeURIComponent(PLAYER_KEY);

    const response = await fetch(url);

    const result = await response.json();

    if(!response.ok || result.success === false){
        throw new Error(result.error || "Unable to load game state.");
    }

    return result.state;
}


/* ==========================================================
   LIVEKIT
========================================================== */

async function connectLiveKit(){

    if(!window.LivekitClient){
        setStatus("LiveKit SDK failed");
        message("LiveKit could not be loaded.");
        return;
    }

    try{

        setStatus("Connecting...");

        const response = await fetch(
            TOKEN_ENDPOINT +
            "?room=" +
            encodeURIComponent(ROOM_ID) +
            "&player_key=" +
            encodeURIComponent(PLAYER_KEY)
        );

        const data = await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.error ||
                "Unable to get LiveKit token."
            );
        }

        room = new LivekitClient.Room({
            adaptiveStream:true,
            dynacast:true
        });

        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            function(track,publication,participant){
                attachRemoteTrack(
                    track,
                    participant
                );
            }
        );

        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            function(track){
                track.detach();
            }
        );

        room.on(
            LivekitClient.RoomEvent.ParticipantConnected,
            function(participant){
                createPlayerTile(participant);
            }
        );

        room.on(
            LivekitClient.RoomEvent.ParticipantDisconnected,
            function(participant){
                removePlayerTile(
                    participant.identity
                );
            }
        );

        room.on(
            LivekitClient.RoomEvent.Disconnected,
            function(){
                setStatus("Disconnected");
            }
        );

        await room.connect(
            data.url,
            data.token
        );

        setStatus("Live");

        createLocalTile();

        room.remoteParticipants.forEach(
            participant => {
                createPlayerTile(participant);

                participant.trackPublications.forEach(
                    publication => {
                        if(publication.isSubscribed &&
                           publication.track){
                            attachRemoteTrack(
                                publication.track,
                                participant
                            );
                        }
                    }
                );
            }
        );

        message("");

    }catch(error){

        console.error("LiveKit error:",error);

        setStatus("LiveKit error");

        message(
            error.message ||
            "Unable to connect to LiveKit."
        );
    }
}


function createLocalTile(){

    if(!room) return;

    const identity =
        room.localParticipant.identity;

    let tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        );

    if(!tile){

        tile =
            document.createElement("div");

        tile.className = "player";

        tile.dataset.player = identity;

        tile.innerHTML = `
            <div class="video">
                <div class="localVideo"></div>
            </div>
            <div class="player-name">
                ${escapeHTML(PLAYER_NAME)} (You)
            </div>
        `;

        $("players").appendChild(tile);
    }
}


function createPlayerTile(participant){

    const identity =
        participant.identity;

    let tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        );

    if(tile) return;

    tile =
        document.createElement("div");

    tile.className = "player";

    tile.dataset.player = identity;

    tile.innerHTML = `
        <div class="video"></div>
        <div class="player-name">
            ${escapeHTML(participant.name || identity)}
        </div>
    `;

    $("players").appendChild(tile);
}


function removePlayerTile(identity){

    const tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(identity) +
            '"]'
        );

    if(tile){
        tile.remove();
    }
}


function attachRemoteTrack(track,participant){

    createPlayerTile(participant);

    const tile =
        document.querySelector(
            '[data-player="' +
            CSS.escape(participant.identity) +
            '"]'
        );

    if(!tile) return;

    const container =
        tile.querySelector(".video");

    if(!container) return;

    const element =
        track.attach();

    element.autoplay = true;
    element.playsInline = true;

    if(track.kind === "video"){
        element.muted = true;
    }

    container.appendChild(element);
}


async function enableMicrophone(){

    if(!room) return;

    try{

        microphoneEnabled =
            !microphoneEnabled;

        await room.localParticipant
            .setMicrophoneEnabled(
                microphoneEnabled
            );

        $("micBtn").textContent =
            microphoneEnabled
                ? "🔇 Mute Mic"
                : "🎤 Mic";

    }catch(error){

        microphoneEnabled = false;

        console.error(error);

        message(
            "Microphone permission was denied or unavailable."
        );
    }
}


async function enableCamera(){

    if(!room) return;

    try{

        cameraEnabled =
            !cameraEnabled;

        await room.localParticipant
            .setCameraEnabled(
                cameraEnabled
            );

        $("cameraBtn").textContent =
            cameraEnabled
                ? "📷 Camera On"
                : "📷 Camera Off";

        if(cameraEnabled){

            const publication =
                room.localParticipant
                    .getTrackPublication(
                        LivekitClient.Track.Source.Camera
                    );

            if(publication && publication.track){

                const tile =
                    document.querySelector(
                        '[data-player="' +
                        CSS.escape(
                            room.localParticipant.identity
                        ) +
                        '"]'
                    );

                if(tile){

                    const container =
                        tile.querySelector(".localVideo");

                    if(container){

                        const existing =
                            container.querySelector("video");

                        if(!existing){

                            const element =
                                publication.track.attach();

                            element.autoplay = true;
                            element.playsInline = true;
                            element.muted = true;

                            container.appendChild(
                                element
                            );
                        }
                    }
                }
            }
        }

    }catch(error){

        cameraEnabled = false;

        console.error(error);

        message(
            "Camera permission was denied or unavailable."
        );
    }
}


/* ==========================================================
   GAME UI
========================================================== */

function renderState(state){

    if(!state) return;

    lastState = state;

    const status =
        state.status || "waiting";

    if(status === "waiting"){

        show("waitingScreen");
        hide("playingScreen");
        hide("revealScreen");
        hide("finishedScreen");

        $("waitingPlayers").textContent =
            `${state.player_count || 0} player(s) in room`;

        if(state.is_host){
            show("startBtn");
        }else{
            hide("startBtn");
        }

        return;
    }

    if(status === "playing"){

        hide("waitingScreen");
        show("playingScreen");
        hide("revealScreen");
        hide("finishedScreen");

        $("roundNumber").textContent =
            state.round_number || 1;

        $("clue").textContent =
            state.clue || "";

        const me =
            (state.players || []).find(
                p => p.player_key === PLAYER_KEY
            );

        if(me && me.submitted){

            hide("answerArea");
            show("submittedMessage");

        }else{

            show("answerArea");
            hide("submittedMessage");

            $("answerInput").disabled = false;
            $("submitBtn").disabled = false;
        }

        $("answerMessage").textContent =
            `${state.submitted_count || 0} of ${state.player_count || 0} players submitted`;

        return;
    }

    if(status === "revealed"){

        hide("waitingScreen");
        hide("playingScreen");
        show("revealScreen");
        hide("finishedScreen");

        renderResults(state);

        if(state.is_host){
            show("nextBtn");
            show("finishBtn");
        }else{
            hide("nextBtn");
            hide("finishBtn");
        }

        return;
    }

    if(status === "finished"){

        hide("waitingScreen");
        hide("playingScreen");
        hide("revealScreen");
        show("finishedScreen");

        return;
    }
}


function renderResults(state){

    const answers =
        $("answers");

    answers.innerHTML = "";

    const results =
        state.round_results || [];

    results.forEach(result => {

        const card =
            document.createElement("div");

        card.className =
            "answer-card";

        card.innerHTML = `
            <div class="answer-name">
                ${escapeHTML(result.name || "Player")}
            </div>
            <div>
                ${escapeHTML(result.answer || "")}
            </div>
        `;

        answers.appendChild(card);
    });

    $("correctAnswer").textContent =
        state.correct_answer || "";
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==========================================================
   GAME ACTIONS
========================================================== */

async function startGame(){

    try{

        $("startBtn").disabled = true;

        await postJSON(
            START_ENDPOINT,
            {
                room_id:ROOM_ID,
                player_key:PLAYER_KEY
            }
        );

        await refreshState();

    }catch(error){

        console.error(error);

        alert(
            error.message ||
            "Unable to start game."
        );

        $("startBtn").disabled = false;
    }
}


async function submitAnswer(){

    const input =
        $("answerInput");

    const answer =
        input.value.trim();

    if(!answer){

        $("answerMessage").textContent =
            "Enter an answer first.";

        return;
    }

    try{

        $("submitBtn").disabled = true;
        input.disabled = true;

        const result =
            await postJSON(
                ANSWER_ENDPOINT,
                {
                    room_id:ROOM_ID,
                    player_key:PLAYER_KEY,
                    answer:answer
                }
            );

        if(result.success){

            hide("answerArea");
            show("submittedMessage");

            await refreshState();
        }

    }catch(error){

        console.error(error);

        $("answerMessage").textContent =
            error.message ||
            "Unable to submit answer.";

        $("submitBtn").disabled = false;
        input.disabled = false;
    }
}


async function revealRound(){

    try{

        await postJSON(
            REVEAL_ENDPOINT,
            {
                room_id:ROOM_ID,
                player_key:PLAYER_KEY
            }
        );

        await refreshState();

    }catch(error){

        alert(
            error.message ||
            "Unable to reveal round."
        );
    }
}


async function nextRound(){

    try{

        $("nextBtn").disabled = true;

        await postJSON(
            NEXT_ENDPOINT,
            {
                room_id:ROOM_ID,
                player_key:PLAYER_KEY
            }
        );

        $("answerInput").value = "";

        await refreshState();

    }catch(error){

        alert(
            error.message ||
            "Unable to start next round."
        );

    }finally{

        $("nextBtn").disabled = false;
    }
}


async function finishGame(){

    if(!confirm("End the Dirty Minds game?")){
        return;
    }

    try{

        await postJSON(
            FINISH_ENDPOINT,
            {
                room_id:ROOM_ID,
                player_key:PLAYER_KEY
            }
        );

        await refreshState();

    }catch(error){

        alert(
            error.message ||
            "Unable to end game."
        );
    }
}


async function refreshState(){

    try{

        const state =
            await getState();

        renderState(state);

    }catch(error){

        console.error(
            "State error:",
            error
        );
    }
}


/* ==========================================================
   HOST REVEAL
========================================================== */

function addRevealButton(){

    if($("revealBtn")) return;

    const button =
        document.createElement("button");

    button.id =
        "revealBtn";

    button.className =
        "warning hidden";

    button.textContent =
        "👀 Reveal Answers";

    button.onclick =
        revealRound;

    $("gamePanel")
        .querySelector(".controls")
        ?.appendChild(button);
}


/* ==========================================================
   EVENT HANDLERS
========================================================== */

$("micBtn").addEventListener(
    "click",
    enableMicrophone
);

$("cameraBtn").addEventListener(
    "click",
    enableCamera
);

$("startBtn").addEventListener(
    "click",
    startGame
);

$("submitBtn").addEventListener(
    "click",
    submitAnswer
);

$("nextBtn").addEventListener(
    "click",
    nextRound
);

$("finishBtn").addEventListener(
    "click",
    finishGame
);

$("answerInput").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            event.preventDefault();
            submitAnswer();
        }

    }
);


/* ==========================================================
   AUTOMATIC HOST REVEAL
========================================================== */

function updateRevealAvailability(){

    if(!lastState) return;

    if(lastState.status !== "playing"){
        return;
    }

    if(!lastState.is_host){
        return;
    }

    const count =
        Number(lastState.submitted_count || 0);

    const total =
        Number(lastState.player_count || 0);

    let button =
        $("revealBtn");

    if(!button){

        button =
            document.createElement("button");

        button.id =
            "revealBtn";

        button.className =
            "warning";

        button.textContent =
            "👀 Reveal Answers";

        button.onclick =
            revealRound;

        document
            .querySelector(".controls")
            ?.appendChild(button);
    }

    if(count >= total && total > 0){
        show("revealBtn");
    }else{
        hide("revealBtn");
    }
}


/* ==========================================================
   POLLING
========================================================== */

async function poll(){

    try{

        const state =
            await getState();

        renderState(state);

        updateRevealAvailability();

    }catch(error){

        console.error(
            "Polling error:",
            error
        );
    }
}


/* ==========================================================
   START
========================================================== */

async function init(){

    await connectLiveKit();

    await refreshState();

    stateTimer =
        setInterval(
            poll,
            1000
        );
}

window.addEventListener(
    "beforeunload",
    function(){

        if(stateTimer){
            clearInterval(stateTimer);
        }

        if(room){
            room.disconnect();
        }
    }
);

init();

})();
</script>

</body>
</html>
