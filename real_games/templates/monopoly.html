<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Melanated AZ Monopoly</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 15px;
    background: #1d1d1d;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

.setup {
    background: #1d1d1d;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

input {
    padding: 12px;
    margin: 5px;
    border: 0;
    border-radius: 7px;
}

button {
    padding: 12px 16px;
    margin: 5px;
    border: 0;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.board {
    display: grid;
    grid-template-columns:
        repeat(10, minmax(45px, 1fr));

    background: #e9e1b8;
    color: #111;

    border: 8px solid #222;

    aspect-ratio: 1 / 1;

    width: 100%;
    max-width: 900px;

    margin: auto;
}

.space {
    border: 1px solid #555;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 4px;

    overflow: hidden;
}

.space-name {
    font-size: clamp(7px, 1.2vw, 14px);
    font-weight: bold;
}

.price {
    font-size: clamp(7px, 1vw, 12px);
}

.pieces {
    font-size: 18px;
    margin-top: 3px;
}

.panel {
    background: #1d1d1d;
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
}

.message {
    font-size: 19px;
    margin-bottom: 10px;
}

.player {
    background: #292929;
    padding: 9px;
    border-radius: 7px;
    margin: 5px 0;
}

.current {
    outline: 2px solid white;
}

</style>

</head>

<body>

<header>

<h1>🎲 Melanated AZ Monopoly</h1>

</header>

<div class="container">

<div class="setup">

<input
    id="name"
    placeholder="Your name"
>

<button onclick="createGame()">
    CREATE GAME
</button>

<input
    id="room"
    placeholder="Room code"
>

<button onclick="joinGame()">
    JOIN GAME
</button>

</div>

<div
    id="board"
    class="board"
></div>

<div class="panel">

<div
    id="message"
    class="message"
>
Create or join a game.
</div>

<button
    id="start"
    onclick="startGame()"
>
🚀 START GAME
</button>

<button
    id="roll"
    onclick="rollDice()"
    disabled
>
🎲 ROLL
</button>

<button
    id="buy"
    onclick="buyProperty()"
    disabled
>
💰 BUY
</button>

<div id="players"></div>

</div>

</div>

<script>

let gameId =
    "{{ game_id or '' }}";

let playerId =
    localStorage.getItem(
        "melanated_az_real_player"
    );

if (!playerId) {

    playerId =
        crypto.randomUUID();

    localStorage.setItem(
        "melanated_az_real_player",
        playerId
    );
}


function playerName() {

    return (
        document
        .getElementById("name")
        .value
        .trim()
        || "Player"
    );
}


async function request(
    url,
    method = "GET",
    body = null
) {

    const options = {
        method: method,
        headers: {
            "Content-Type":
                "application/json"
        }
    };

    if (body) {

        options.body =
            JSON.stringify(body);
    }

    const response =
        await fetch(
            url,
            options
        );

    const result =
        await response.json();

    if (!response.ok) {

        throw new Error(
            result.error ||
            "Request failed."
        );
    }

    return result;
}


async function createGame() {

    try {

        const state =
            await request(
                "/real-games/monopoly/create",
                "POST",
                {
                    player_id:
                        playerId,

                    player_name:
                        playerName()
                }
            );

        gameId =
            state.game_id;

        document
            .getElementById("room")
            .value = gameId;

        window.history.replaceState(
            {},
            "",
            `/real-games/monopoly/${gameId}`
        );

        render(state);

    } catch (error) {

        alert(error.message);
    }
}


async function joinGame() {

    const id =
        document
        .getElementById("room")
        .value
        .trim()
        .toUpperCase();

    if (!id) {

        alert(
            "Enter a room code."
        );

        return;
    }

    try {

        const state =
            await request(
                `/real-games/monopoly/${id}/join`,
                "POST",
                {
                    player_id:
                        playerId,

                    player_name:
                        playerName()
                }
            );

        gameId = id;

        window.history.replaceState(
            {},
            "",
            `/real-games/monopoly/${gameId}`
        );

        render(state);

    } catch (error) {

        alert(error.message);
    }
}


async function startGame() {

    if (!gameId)
        return;

    try {

        const state =
            await request(
                `/real-games/monopoly/${gameId}/start`,
                "POST"
            );

        render(state);

    } catch (error) {

        alert(error.message);
    }
}


async function rollDice() {

    if (!gameId)
        return;

    try {

        const state =
            await request(
                `/real-games/monopoly/${gameId}/roll`,
                "POST",
                {
                    player_id:
                        playerId
                }
            );

        render(state);

    } catch (error) {

        alert(error.message);
    }
}


async function buyProperty() {

    if (!gameId)
        return;

    try {

        const state =
            await request(
                `/real-games/monopoly/${gameId}/buy`,
                "POST",
                {
                    player_id:
                        playerId
                }
            );

        render(state);

    } catch (error) {

        alert(error.message);
    }
}


function render(state) {

    document
        .getElementById("message")
        .innerText =
            state.message || "";

    const board =
        document
        .getElementById("board");

    board.innerHTML = "";

    state.board.forEach(
        (space, index) => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "space";

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "space-name";

            title.innerText =
                space.name;

            cell.appendChild(
                title
            );

            if (space.price) {

                const price =
                    document.createElement(
                        "div"
                    );

                price.className =
                    "price";

                price.innerText =
                    "$" + space.price;

                cell.appendChild(
                    price
                );
            }

            const pieces =
                document.createElement(
                    "div"
                );

            pieces.className =
                "pieces";

            state.players.forEach(
                player => {

                    if (
                        player.position === index &&
                        !player.bankrupt
                    ) {

                        pieces.innerText +=
                            player.token;
                    }
                }
            );

            cell.appendChild(
                pieces
            );

            board.appendChild(
                cell
            );
        }
    );


    const players =
        document
        .getElementById("players");

    players.innerHTML =
        "<h3>Players</h3>";


    state.players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "player";

            if (
                player.id ===
                state.current_player
            ) {

                div.classList.add(
                    "current"
                );
            }

            div.innerHTML =
                `${player.token}
                 <b>${escapeHtml(player.name)}</b>
                 — $${player.money}
                 — ${player.properties.length} properties`;

            if (
                player.id ===
                state.current_player
            ) {

                div.innerHTML +=
                    " 🎯";
            }

            if (player.bankrupt) {

                div.innerHTML +=
                    " 💀";
            }

            players.appendChild(
                div
            );
        }
    );


    const myTurn =
        state.current_player ===
        playerId;

    document
        .getElementById("start")
        .disabled =
            state.started;

    document
        .getElementById("roll")
        .disabled =
            !state.started ||
            state.finished ||
            !myTurn;

    document
        .getElementById("buy")
        .disabled =
            !state.started ||
            state.finished ||
            !myTurn;
}


function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.innerText =
        value;

    return div.innerHTML;
}


async function refresh() {

    if (!gameId)
        return;

    try {

        const state =
            await request(
                `/real-games/monopoly/${gameId}/state`
            );

        render(state);

    } catch (_) {}
}


setInterval(
    refresh,
    1500
);


if (gameId) {

    document
        .getElementById("room")
        .value = gameId;

    refresh();
}

</script>

</body>

</html>
