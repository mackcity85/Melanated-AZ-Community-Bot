<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>{{ game.name }} | Melanated AZ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#wrap{width:min(100vw,1000px);height:100vh;margin:auto;display:flex;flex-direction:column}header{padding:10px 14px;background:#11131b;border-bottom:1px solid #303442;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:18px;margin:0}#hud{font-weight:800;white-space:nowrap}#stage{position:relative;flex:1;min-height:0;background:#151820;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;touch-action:none}#controls{padding:10px;background:#0d0f15;display:flex;justify-content:space-between;align-items:center;gap:14px}button{border:1px solid #414654;background:#1b1e28;color:#fff;border-radius:12px;min-width:58px;min-height:48px;font-size:18px;font-weight:800;touch-action:manipulation}.cluster{display:flex;gap:8px}.hint{font-size:12px;color:#aeb4c2;text-align:center;flex:1}
</style></head>
<body><div id="wrap"><header><h1>{{ game.icon }} {{ game.name }}</h1><div id="hud">READY</div></header><div id="stage"><canvas id="game"></canvas></div><div id="controls"><div class="cluster"><button id="left">◀</button><button id="right">▶</button></div><div class="hint" id="hint">Tap START. Keyboard: arrows + Z/X.</div><div class="cluster"><button id="a">A</button><button id="b">B</button></div></div></div>
<script>
const GAME={{ game|tojson }};const c=document.getElementById('game'),x=c.getContext('2d'),hud=document.getElementById('hud'),hint=document.getElementById('hint');
let W=960,H=540,dpr=1,state='menu',keys={},last=0,score=0,round=1,player,enemies,ball,goal,particles=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=c.getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(260,r.height);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){score=0;round=1;particles=[];state='play'; if(GAME.genre==='Fighting') resetFight(); else resetSport();}
function resetFight(){player={x:W*.25,y:H*.62,w:58,h:110,hp:100,stam:100,vy:0,attack:0,guard:false,flash:0};enemies=[{x:W*.7,y:H*.62,w:58,h:110,hp:100,stam:100,attack:0,guard:false,flash:0,dir:-1}]}
function resetSport(){const s=GAME.sport;if(s==='basketball'){player={x:W*.18,y:H*.72,w:38,h:58};ball={x:player.x+35,y:player.y-10,vx:0,vy:0,held:true};goal={x:W*.78,y:H*.3,w:100,h:70}}else if(s==='football'){player={x:W*.15,y:H*.65,w:38,h:55,vy:0};ball={x:player.x+30,y:player.y,vx:0,vy:0,held:true};enemies=[{x:W*.55,y:H*.65,w:42,h:60},{x:W*.75,y:H*.5,w:42,h:60}];goal={x:W*.88,y:H*.2,w:18,h:H*.6}}else if(s==='soccer'){player={x:W*.22,y:H*.5,w:32,h:32};ball={x:W*.3,y:H*.5,vx:0,vy:0};enemies=[{x:W*.65,y:H*.35,w:30,h:30},{x:W*.72,y:H*.68,w:30,h:30}];goal={x:W*.91,y:H*.35,w:35,h:H*.3}}else{player={x:W*.2,y:H*.72,w:35,h:65};ball={x:W*.7,y:H*.35,vx:-260,vy:0};goal={x:W*.08,y:H*.5,w:10,h:H*.3}}}
function key(e,v){keys[e.key.toLowerCase()]=v;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase()))e.preventDefault()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
function bind(id,k){const b=document.getElementById(id);['pointerdown','touchstart'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();keys[k]=true},{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();keys[k]=false},{passive:false}))}bind('left','arrowleft');bind('right','arrowright');bind('a','z');bind('b','x');
function start(){reset()}c.addEventListener('pointerdown',()=>{if(state==='menu'||state==='over')start()});
function rect(o,fill){x.fillStyle=fill;x.fillRect(o.x,o.y,o.w,o.h)}function text(t,y,size=24){x.fillStyle='#fff';x.font=`800 ${size}px system-ui`;x.textAlign='center';x.fillText(t,W/2,y)}
function bg(){x.fillStyle='#0b0d13';x.fillRect(0,0,W,H);if(GAME.genre==='Fighting'){x.fillStyle='#202531';x.fillRect(0,H*.18,W,H*.65);x.fillStyle='#343b49';x.fillRect(0,H*.72,W*.1);for(let i=0;i<10;i++){x.fillStyle=i%2?'#1a1e28':'#252a35';x.fillRect(i*W/10,H*.72,W/10,18)}x.strokeStyle='#d5d9df';x.lineWidth=3;x.strokeRect(W*.1,H*.25,W*.8,H*.47)}else{const s=GAME.sport;if(s==='basketball'){x.fillStyle='#a85d2c';x.fillRect(0,0,W,H);x.strokeStyle='#f4d6b7';x.lineWidth=3;x.strokeRect(W*.05,H*.08,W*.9,H*.84);x.beginPath();x.arc(W*.5,H*.5,75,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.fillRect(W*.83,H*.18,6,100);x.strokeStyle='#ffdb9b';x.strokeRect(W*.76,H*.25,70,6)}else if(s==='football'){x.fillStyle='#176b35';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.lineWidth=2;for(let i=1;i<10;i++){x.beginPath();x.moveTo(i*W/10,0);x.lineTo(i*W/10,H);x.stroke()}x.fillStyle='#fff';x.fillRect(W*.9,H*.15,8,H*.7)}else if(s==='soccer'){x.fillStyle='#16823b';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(W*.06,H*.08,W*.88,H*.84);x.beginPath();x.arc(W*.5,H*.5,60,0,Math.PI*2);x.stroke();x.strokeRect(W*.06,H*.3,100,H*.4);x.strokeRect(W*.84,H*.3,100,H*.4)}else{x.fillStyle='#4777aa';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(W*.05,H*.08,W*.9,H*.84);x.fillStyle='#d7dce2';x.fillRect(W*.08,H*.18,W*.84,5)}}}
function fighter(o,enemy=false){x.save();x.translate(o.x,o.y);x.fillStyle=enemy?'#d34b54':'#3d8cff';x.fillRect(-o.w/2,-o.h,o.w,o.h);x.fillStyle='#f0b38c';x.beginPath();x.arc(0,-o.h-20,24,0,Math.PI*2);x.fill();x.fillStyle='#111';x.fillRect(-24,-o.h-45,48,12);x.fillStyle='#fff';x.fillRect(-o.w/2,-o.h*.58,o.w,10);x.restore()}
function fight(dt){const p=player,e=enemies[0];let move=(keys.arrowleft?-1:0)+(keys.arrowright?1:0);p.x+=move*240*dt;p.x=Math.max(70,Math.min(W-70,p.x));p.guard=!!keys.x;p.stam=Math.min(100,p.stam+25*dt);if(keys.z&&p.attack<=0&&p.stam>=12){p.attack=.25;p.stam-=12}p.attack=Math.max(0,p.attack-dt);e.dir=p.x<e.x?-1:1;e.x+=e.dir*100*dt;if(Math.abs(e.x-p.x)<120&&e.attack<=0){e.attack=.3}e.attack=Math.max(0,e.attack-dt);if(p.attack>0&&p.attack<.12&&Math.abs(e.x-p.x)<125&&!e.guard){e.hp-=28;e.flash=.12;score+=10}if(e.attack>0&&e.attack<.12&&Math.abs(e.x-p.x)<115&&!p.guard){p.hp-=18}if(p.hp<=0||e.hp<=0){state='over';return}hud.textContent=`HP ${Math.ceil(p.hp)}  |  OPP ${Math.ceil(e.hp)}  |  RND ${round}`;fighter(p);fighter(e,true);x.fillStyle='#1a1d25';x.fillRect(25,25,220,18);x.fillStyle='#32d583';x.fillRect(25,25,220*p.hp/100,18);x.fillStyle='#1a1d25';x.fillRect(W-245,25,220,18);x.fillStyle='#e05a65';x.fillRect(W-245,25,220*e.hp/100,18);x.fillStyle='#fff';x.font='700 14px system-ui';x.fillText('YOU',25,20);x.fillText('OPPONENT',W-245,20)}
function sport(dt){const s=GAME.sport;if(s==='basketball')basket(dt);else if(s==='football')football(dt);else if(s==='soccer')soccer(dt);else baseball(dt)}
function basket(dt){player.x+=((keys.arrowleft?-1:0)+(keys.arrowright?1:0))*260*dt;player.x=Math.max(30,Math.min(W-30,player.x));if(ball.held){ball.x=player.x+28;ball.y=player.y-10;if(keys.z){ball.held=false;ball.vx=360;ball.vy=-470}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=900*dt;if(ball.y>H*.8){ball.y=H*.72;ball.vy=0;ball.vx=0;ball.held=true}}if(ball.x>goal.x-5&&ball.x<goal.x+goal.w&&ball.y>goal.y&&ball.y<goal.y+goal.h){score+=2;ball.held=true;ball.x=player.x+28;ball.y=player.y-10}hud.textContent=`SCORE ${score}`;rect(player,'#4c8cff');x.fillStyle='#f08a32';x.beginPath();x.arc(ball.x,ball.y,13,0,Math.PI*2);x.fill()}
function football(dt){player.x+=((keys.arrowleft?-1:0)+(keys.arrowright?1:0))*230*dt;player.x=Math.max(25,Math.min(W-45,player.x));if(ball.held){ball.x=player.x+25;ball.y=player.y-10;if(keys.z){ball.held=false;ball.vx=500;ball.vy=-80}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(const e of enemies)if(Math.abs(e.x-ball.x)<35&&Math.abs(e.y-ball.y)<50){ball.x=player.x+25;ball.y=player.y;ball.held=true}if(ball.x>goal.x){score+=7;ball.held=true;player.x=W*.15}}rect(player,'#4c8cff');for(const e of enemies)rect(e,'#e14d56');x.fillStyle='#7b4b2a';x.beginPath();x.ellipse(ball.x,ball.y,16,10,0,0,Math.PI*2);x.fill();hud.textContent=`TOUCHDOWNS ${score/7}`}
function soccer(dt){player.x+=((keys.arrowleft?-1:0)+(keys.arrowright?1:0))*240*dt;player.y+=((keys.arrowup?-1:0)+(keys.arrowdown?1:0))*240*dt;player.x=Math.max(25,Math.min(W-60,player.x));player.y=Math.max(40,Math.min(H-40,player.y));const d=Math.hypot(ball.x-player.x,ball.y-player.y);if(d<50&&keys.z){ball.vx=500;ball.vy=(ball.y-player.y)*5;score+=1}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.985;ball.vy*=.985;if(ball.x>goal.x){score+=3;ball.x=W*.3;ball.y=H*.5;ball.vx=0}rect(player,'#fff');for(const e of enemies)rect(e,'#e44');x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,13,0,Math.PI*2);x.fill();hud.textContent=`GOALS ${score/3|0}`}
function baseball(dt){if(ball.x>W*.16&&keys.z){ball.vx=-760;ball.x=W*.16}ball.x+=ball.vx*dt;if(ball.x<W*.08){score+=4;ball.x=W*.7;ball.vx=-260}rect(player,'#fff');x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,8,0,Math.PI*2);x.fill();hud.textContent=`HOME RUNS ${score/4|0}`}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;bg();if(state==='menu'){text(GAME.name,120,40);text(GAME.genre==='Fighting'?'1V1 ARCADE FIGHT':'PLAY THE SPORT',180,25);text('TAP / PRESS A TO START',260,22);text('Z = ACTION   X = BLOCK / MOVE',305,18)}else if(state==='over'){text(player.hp<=0?'KNOCKOUT':'GAME OVER',170,42);text(`SCORE ${score}`,220,28);text('TAP TO PLAY AGAIN',285,20)}else{if(GAME.genre==='Fighting')fight(dt);else sport(dt)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
