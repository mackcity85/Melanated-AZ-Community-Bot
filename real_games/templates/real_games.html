<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Melanated AZ Real Games</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.games {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.game {
    display: block;
    padding: 25px;
    background: #222;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    text-align: center;
    font-size: 20px;
}

.game:hover {
    background: #333;
}

.icon {
    display: block;
    font-size: 42px;
    margin-bottom: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎮 Melanated AZ Real Games</h1>

<div class="games">

<a
    class="game"
    href="/real-games/monopoly/"
>

<span class="icon">🎲</span>

Monopoly

</a>

<div class="game">
<span class="icon">🏎️</span>
Racing
<br>
<small>Coming Soon</small>
</div>

<div class="game">
<span class="icon">🥊</span>
Fighting
<br>
<small>Coming Soon</small>
</div>

<div class="game">
<span class="icon">🔫</span>
Shooting
<br>
<small>Coming Soon</small>
</div>

<div class="game">
<span class="icon">🕹️</span>
Arcade
<br>
<small>Coming Soon</small>
</div>

</div>

</div>

</body>

</html>
