<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>{{game.name}}</title><style>body{margin:0;background:#08090d;color:#fff;font-family:system-ui;text-align:center}main{width:min(960px,100%);margin:auto}header{padding:12px;background:#11151d;display:flex;justify-content:space-between}canvas{width:100%;height:auto;display:block;touch-action:none}.controls{padding:12px;background:#0d1016;display:flex;justify-content:center;gap:10px}.controls button{width:68px;height:54px;border-radius:12px;border:1px solid #566;background:#202531;color:#fff;font-size:20px;font-weight:800;touch-action:none}.help{padding:8px;color:#aab2c0;font-size:13px}</style></head><body><main><header><b>{{game.icon}} {{game.name}}</b><b id="hud">READY</b></header><canvas id="c" width="960" height="540"></canvas><div class="controls"><button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="a">A</button><button data-k="b">B</button></div><div class="help">Arrows/WASD move • A = action/shoot • B = sprint/charge • Tap the field to start</div></main><script>
const G={{game|tojson}},c=document.getElementById('c'),x=c.getContext('2d'),K={left:0,right:0,up:0,down:0,a:0,b:0};let W=960,H=540,run=false,t=0,score=0,p,ball,enemies=[];const sport=G.sport;
function start(){run=true;score=0;t=0;p={x:150,y:380};enemies=[];if(sport==='basketball')ball={x:p.x+30,y:p.y-20,vx:0,vy:0,held:1};if(sport==='football'){ball={x:p.x+25,y:p.y,vx:0,vy:0,held:1};enemies=[{x:470,y:260},{x:610,y:370},{x:760,y:220}]}if(sport==='soccer'){ball={x:300,y:270,vx:0,vy:0};enemies=[{x:600,y:190},{x:690,y:350},{x:790,y:260}]}if(sport==='baseball')ball={x:850,y:270,vx:-320,vy:0};requestAnimationFrame(loop)}
function field(){x.fillStyle='#111';x.fillRect(0,0,W,H);if(sport==='basketball'){x.fillStyle='#b76632';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(55,45,850,450);x.beginPath();x.arc(480,270,70,0,7);x.stroke();x.fillStyle='#fff';x.fillRect(830,110,8,80);x.strokeRect(755,130,80,8);x.fillStyle='#e88732';x.beginPath();x.arc(480,270,13,0,7);x.fill()}else if(sport==='football'){x.fillStyle='#18713c';x.fillRect(0,0,W,H);x.strokeStyle='#fff';for(let i=0;i<=10;i++){x.beginPath();x.moveTo(i*96,0);x.lineTo(i*96,H);x.stroke()}x.fillStyle='#fff';x.fillRect(900,40,10,460)}else if(sport==='soccer'){x.fillStyle='#18833f';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.strokeRect(45,45,870,450);x.beginPath();x.arc(480,270,65,0,7);x.stroke();x.strokeRect(45,165,120,210);x.strokeRect(795,165,120,210)}else{x.fillStyle='#4d79aa';x.fillRect(0,0,W,H);x.strokeStyle='#fff';x.strokeRect(45,45,870,450);x.beginPath();x.arc(480,270,85,0,7);x.stroke();x.fillStyle='#fff';x.fillRect(55,120,850,5)} }
function draw(){field();if(sport==='basketball'){x.fillStyle='#fff';x.fillRect(p.x-18,p.y-45,36,58);x.fillStyle='#f28a32';x.beginPath();x.arc(ball.x,ball.y,14,0,7);x.fill()}else if(sport==='football'){x.fillStyle='#4e91ff';x.fillRect(p.x-20,p.y-28,40,56);for(const e of enemies){x.fillStyle='#e34e59';x.fillRect(e.x-20,e.y-28,40,56)}x.fillStyle='#8b542e';x.beginPath();x.ellipse(ball.x,ball.y,17,10,0,0,7);x.fill()}else if(sport==='soccer'){x.fillStyle='#fff';x.fillRect(p.x-16,p.y-16,32,32);for(const e of enemies){x.fillStyle='#e34e59';x.fillRect(e.x-15,e.y-15,30,30)}x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,12,0,7);x.fill()}else{x.fillStyle='#fff';x.fillRect(p.x-18,p.y-40,36,55);x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,8,0,7);x.fill()} }
function update(dt){const sp=K.b?360:240;p.x+= (K.right-K.left)*sp*dt;p.y+=(K.down-K.up)*sp*dt;p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(40,Math.min(H-40,p.y));if(sport==='basketball'){if(ball.held){ball.x=p.x+30;ball.y=p.y-20;if(K.a){ball.held=0;ball.vx=(K.right-K.left)*360+(480-p.x)*.7;ball.vy=-520}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=900*dt;if(ball.y>H-40){ball.y=H-40;ball.vy*=-.55}if(ball.x>750&&ball.y<190){score+=2;ball.held=1}}}else if(sport==='football'){if(ball.held){ball.x=p.x+25;ball.y=p.y;if(K.a){ball.held=0;ball.vx=650;ball.vy=(K.down-K.up)*300}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.995;for(const e of enemies)if(Math.hypot(e.x-ball.x,e.y-ball.y)<48){ball.held=1;ball.x=p.x+25;ball.y=p.y}if(ball.x>890){score+=7;ball.held=1;p.x=150}}}else if(sport==='soccer'){if(Math.hypot(ball.x-p.x,ball.y-p.y)<50&&K.a){ball.vx=600;ball.vy=(ball.y-p.y)*5;score+=1}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.985;ball.vy*=.985;if(ball.x>790&&ball.y>165&&ball.y<375){score+=3;ball.x=300;ball.y=270;ball.vx=0;ball.vy=0}}else{if(ball.x<170&&Math.abs(ball.y-p.y)<80){score+=4;ball.x=850;ball.y=150+Math.random()*240;ball.vx=-320}}hud.textContent=sport.toUpperCase()+' • SCORE '+score}
function loop(now){if(!run)return;const dt=Math.min(.035,(now-t)/1000||.016);t=now;update(dt);draw();requestAnimationFrame(loop)}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'a',z:'a',x:'b',w:'up',s:'down',d:'right',' ':'a'};addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();K[k]=1;if(!run)start()}});addEventListener('keyup',e=>{const k=map[e.key];if(k)K[k]=0});document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();K[k]=1;if(!run)start()};const off=e=>{e.preventDefault();K[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});c.addEventListener('pointerdown',()=>{if(!run)start()});field();
</script></body></html>
