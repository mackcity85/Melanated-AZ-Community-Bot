<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>SNES Arcade</title><style>*{box-sizing:border-box}html,body{margin:0;background:#171225;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:12px;overscroll-behavior:none}main{max-width:760px;margin:auto}canvas{display:block;width:min(96vw,700px);height:auto;margin:auto;background:#090711;border:4px solid #4b3c68;image-rendering:pixelated;touch-action:none;user-select:none}.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.btn{background:#302548;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97);background:#51406f}.info{color:#c4bdd2;line-height:1.5}.controls{display:flex;justify-content:center;gap:18px;align-items:center;margin:8px auto}.dpad{display:grid;grid-template-columns:62px 62px 62px;gap:5px}.dpad button,.action button{height:55px;padding:0;font-size:22px}.action{display:flex;gap:8px}.empty{visibility:hidden}</style></head><body><main><h1>🕹️ SNES-STYLE ARCADE</h1><div id="title"></div><div id="score">Score: 0</div><canvas id="game" width="640" height="400"></canvas><div class="bar"><button class="btn" id="start" type="button">▶ Start / Restart</button></div><div class="controls"><div class="dpad"><button class="btn empty">.</button><button class="btn control" data-key="up">⬆️</button><button class="btn empty">.</button><button class="btn control" data-key="left">⬅️</button><button class="btn control" data-key="down">⬇️</button><button class="btn control" data-key="right">➡️</button></div><div class="action"><button class="btn control" data-key="a">🅰️</button><button class="btn control" data-key="b">🅱️</button></div></div><p class="info">PC: arrows/WASD + Space/Z/X. Phone/tablet: use the D-pad and A/B buttons.</p><div class="bar"><button class="btn" id="race">🏎️ Drift Racer</button><button class="btn" id="blast">⚡ Power Blaster</button><button class="btn" id="crystal">💎 Crystal Catch</button></div></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),titleEl=document.getElementById('title');let mode='race',running=false,score=0,last=0,raf=0;const keys={up:false,down:false,left:false,right:false,a:false,b:false};function release(){Object.keys(keys).forEach(k=>keys[k]=false)}
document.querySelectorAll('.control').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true};const up=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',down,{passive:false});btn.addEventListener('pointerup',up,{passive:false});btn.addEventListener('pointercancel',up,{passive:false});btn.addEventListener('lostpointercapture',()=>keys[k]=false);btn.addEventListener('touchstart',down,{passive:false});btn.addEventListener('touchend',up,{passive:false});btn.addEventListener('touchcancel',up,{passive:false});btn.addEventListener('contextmenu',e=>e.preventDefault())});window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' ','z','x'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')keys.up=true;if(k==='arrowdown'||k==='s')keys.down=true;if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '||k==='z')keys.a=true;if(k==='x')keys.b=true});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.down=false;if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' '||k==='z')keys.a=false;if(k==='x')keys.b=false});
document.getElementById('start').onclick=()=>start();document.getElementById('race').onclick=()=>setMode('race');document.getElementById('blast').onclick=()=>setMode('blast');document.getElementById('crystal').onclick=()=>setMode('crystal');let g={};function setMode(m){mode=m;start()}function start(){cancelAnimationFrame(raf);release();running=true;score=0;scoreEl.textContent='Score: 0';g={};if(mode==='race')initRace();if(mode==='blast')initBlast();if(mode==='crystal')initCrystal();last=performance.now();raf=requestAnimationFrame(loop)}function title(t){titleEl.textContent=t}function bg(){x.fillStyle='#0a0811';x.fillRect(0,0,640,400)}function over(t){running=false;release();x.fillStyle='#fff';x.font='bold 32px monospace';x.textAlign='center';x.fillText(t,320,205)}
function initRace(){title('🏎️ Drift Racer');g.car={x:320,y:320,w:25,h:42};g.speed=180;g.boost=100;g.t=0;g.laps=0;g.hazards=[];for(let i=0;i<12;i++)g.hazards.push({x:190+(i%3)*130,y:-i*110,w:30,h:30})}function race(dt){g.t+=dt;let car=g.car;car.x+=((keys.right?1:0)-(keys.left?1:0))*220*dt;car.x=Math.max(145,Math.min(470,car.x));let boost=(keys.a&&g.boost>0);g.speed=boost?310:180;if(boost)g.boost=Math.max(0,g.boost-55*dt);else g.boost=Math.min(100,g.boost+18*dt);for(const h of g.hazards){h.y+=g.speed*dt;if(h.y>410){h.y=-80;h.x=170+Math.floor(Math.random()*3)*135;score+=25;scoreEl.textContent='Score: '+score}}for(const h of g.hazards)if(car.x< h.x+h.w&&car.x+car.w>h.x&&car.y<h.y+h.h&&car.y+car.h>h.y){over('CRASH!');return}if(g.t>20){score+=500;scoreEl.textContent='Score: '+score;over('RACE CLEAR!')}}function drawRace(){bg();x.fillStyle='#42364e';x.fillRect(130,0,380,400);x.fillStyle='#1b1722';x.fillRect(155,0,330,400);x.strokeStyle='#eee';x.setLineDash([20,20]);x.lineDashOffset=-performance.now()/8;x.beginPath();x.moveTo(320,0);x.lineTo(320,400);x.stroke();x.setLineDash([]);x.fillStyle='#e34';x.fillRect(g.car.x,g.car.y,g.car.w,g.car.h);x.fillStyle='#ffd34d';for(const h of g.hazards)x.fillRect(h.x,h.y,h.w,h.h);x.fillStyle='#fff';x.font='18px monospace';x.fillText('BOOST '+Math.round(g.boost),20,30)}
function initBlast(){title('⚡ Power Blaster');g.p={x:70,y:315,w:28,h:35,vy:0,on:true};g.shots=[];g.foes=[];g.cool=0;g.spawn=0;g.scroll=0}function blast(dt){let p=g.p;p.x+=((keys.right?1:0)-(keys.left?1:0))*190*dt;if((keys.up||keys.a)&&p.on){p.vy=-410;p.on=false}p.vy+=900*dt;p.y+=p.vy*dt;if(p.y>=315){p.y=315;p.vy=0;p.on=true}p.x=Math.max(10,Math.min(602,p.x));g.cool-=dt;if(keys.b&&g.cool<=0){g.shots.push({x:p.x+28,y:p.y+12,vx:470});g.cool=.22}for(const s of g.shots)s.x+=s.vx*dt;g.shots=g.shots.filter(s=>s.x<650);g.spawn-=dt;if(g.spawn<=0){g.foes.push({x:620,y:275-Math.random()*150,w:28,h:28});g.spawn=.8}for(const f of g.foes)f.x-=90*dt;for(const s of g.shots)for(const f of g.foes)if(f.x<s.x+8&&f.x+f.w>s.x&&Math.abs(f.y-s.y)<25){f.x=-100;score+=20;scoreEl.textContent='Score: '+score}g.foes=g.foes.filter(f=>f.x>-80);for(const f of g.foes)if(p.x<f.x+f.w&&p.x+p.w>f.x&&p.y<f.y+f.h&&p.y+p.h>f.y){over('PLAYER DOWN');return}if(score>=300)over('STAGE CLEAR!')}function drawBlast(){bg();x.fillStyle='#392b52';x.fillRect(0,350,640,50);x.fillStyle='#5ee7ff';x.fillRect(g.p.x,g.p.y,g.p.w,g.p.h);x.fillStyle='#ffe66d';for(const s of g.shots)x.fillRect(s.x,s.y,12,5);x.fillStyle='#e66';for(const f of g.foes)x.fillRect(f.x,f.y,f.w,f.h)}
function initCrystal(){title('💎 Crystal Catch');g.p={x:300,y:300,w:34,h:34};g.items=[];g.time=30;g.spawn=0}function crystal(dt){let p=g.p;p.x+=((keys.right?1:0)-(keys.left?1:0))*240*dt;p.y+=((keys.down?1:0)-(keys.up?1:0))*240*dt;p.x=Math.max(0,Math.min(606,p.x));p.y=Math.max(0,Math.min(366,p.y));g.time-=dt;g.spawn-=dt;if(g.spawn<=0){g.items.push({x:20+Math.random()*600,y:20+Math.random()*360,r:9,good:Math.random()>.3,life:4});g.spawn=.45}for(const i of g.items)i.life-=dt;g.items=g.items.filter(i=>i.life>0);for(const i of g.items)if(Math.hypot(p.x+17-i.x,p.y+17-i.y)<25){if(i.good)score+=10;else score=Math.max(0,score-15);scoreEl.textContent='Score: '+score;i.life=0}if(g.time<=0)over('TIME UP!')}function drawCrystal(){bg();x.fillStyle='#6b52a5';x.fillRect(0,0,640,400);x.fillStyle='#14101e';x.fillRect(8,8,624,384);x.fillStyle='#65e6ff';x.fillRect(g.p.x,g.p.y,g.p.w,g.p.h);for(const i of g.items){x.fillStyle=i.good?'#72f0b0':'#e66';x.beginPath();x.moveTo(i.x,i.y-10);x.lineTo(i.x+10,i.y);x.lineTo(i.x,i.y+10);x.lineTo(i.x-10,i.y);x.closePath();x.fill()}x.fillStyle='#fff';x.font='18px monospace';x.fillText('TIME '+Math.max(0,Math.ceil(g.time)),20,30)}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;if(mode==='race')race(dt),drawRace();if(mode==='blast')blast(dt),drawBlast();if(mode==='crystal')crystal(dt),drawCrystal();if(running)raf=requestAnimationFrame(loop)}start();</script></body></html>
