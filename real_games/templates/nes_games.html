<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>NES Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:12px;overscroll-behavior:none}main{max-width:760px;margin:auto}canvas{display:block;width:min(96vw,700px);height:auto;margin:auto;background:#050505;border:4px solid #333;image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.btn{background:#252525;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97);background:#444}.info{color:#bbb;line-height:1.5}.dpad{display:grid;grid-template-columns:70px 70px 70px;gap:6px;justify-content:center;margin:8px auto}.dpad button{height:58px;padding:0;font-size:24px}.empty{visibility:hidden}
</style></head>
<body><main><h1>🕹️ NES-STYLE ARCADE</h1><div id="title"></div><div id="score">Score: 0</div><canvas id="game" width="640" height="400"></canvas><div class="bar"><button class="btn" id="startBtn" type="button">▶ Start / Restart</button></div><div class="dpad"><button class="btn empty" type="button" aria-hidden="true">.</button><button class="btn control" data-key="up" type="button" aria-label="Up">⬆️</button><button class="btn empty" type="button" aria-hidden="true">.</button><button class="btn control" data-key="left" type="button" aria-label="Left">⬅️</button><button class="btn control" data-key="down" type="button" aria-label="Down">⬇️</button><button class="btn control" data-key="right" type="button" aria-label="Right">➡️</button></div><p class="info">PC: arrows / WASD. Phone or tablet: use the on-screen controls. Hold a direction to move.</p><div class="bar"><button class="btn" id="blockBtn" type="button">🧱 Block Buster</button><button class="btn" id="starBtn" type="button">🚀 Star Defender</button><button class="btn" id="runnerBtn" type="button">🪙 Coin Runner</button></div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),titleEl=document.getElementById('title');let mode='block',running=false,score=0,last=0,raf=0;const keys={up:false,down:false,left:false,right:false};

function setKey(name,value){keys[name]=value}
function releaseAll(){for(const k of Object.keys(keys))keys[k]=false}

// Mobile-safe controls: Pointer Events plus touch fallback. Pointer capture keeps
// a held button active even if the finger slides slightly outside the button.
document.querySelectorAll('.control').forEach(btn=>{
  const key=btn.dataset.key;
  btn.addEventListener('pointerdown',e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(_){}setKey(key,true)},{passive:false});
  const release=e=>{e.preventDefault();setKey(key,false)};

  btn.addEventListener('pointerup',release,{passive:false});
  btn.addEventListener('pointercancel',release,{passive:false});
  btn.addEventListener('lostpointercapture',()=>setKey(key,false));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('touchstart',e=>{e.preventDefault();setKey(key,true)},{passive:false});
  btn.addEventListener('touchend',release,{passive:false});
  btn.addEventListener('touchcancel',release,{passive:false});
});
window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});

addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')keys.up=true;if(k==='arrowdown'||k==='s')keys.down=true;if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '&&!running)start()});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.down=false;if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});

document.getElementById('startBtn').addEventListener('click',start);document.getElementById('blockBtn').addEventListener('click',()=>setGame('block'));document.getElementById('starBtn').addEventListener('click',()=>setGame('star'));document.getElementById('runnerBtn').addEventListener('click',()=>setGame('runner'));

let game={};function setGame(m){mode=m;start()}function start(){cancelAnimationFrame(raf);releaseAll();running=true;score=0;scoreEl.textContent='Score: 0';game={};if(mode==='block')initBlock();if(mode==='star')initStar();if(mode==='runner')initRunner();last=performance.now();raf=requestAnimationFrame(loop)}
function text(t){titleEl.textContent=t}function draw(){x.fillStyle='#061018';x.fillRect(0,0,640,400)}function over(t){running=false;releaseAll();x.fillStyle='#fff';x.font='bold 34px monospace';x.textAlign='center';x.fillText(t,320,205)}
function initBlock(){text('🧱 Block Buster');game.p={x:270,y:365,w:100,h:14};game.ball={x:320,y:330,vx:4,vy:-4,r:7};game.blocks=[];for(let r=0;r<5;r++)for(let q=0;q<10;q++)game.blocks.push({x:25+q*61,y:45+r*23,w:55,h:17,on:true})}
function block(dt){game.p.x+=((keys.right?1:0)-(keys.left?1:0))*420*dt;game.p.x=Math.max(0,Math.min(540,game.p.x));let b=game.ball;b.x+=b.vx;b.y+=b.vy;if(b.x<7||b.x>633)b.vx*=-1;if(b.y<7)b.vy*=-1;if(b.y>405){over('GAME OVER');return}if(b.y+b.r>=game.p.y&&b.y-b.r<=game.p.y+14&&b.x>=game.p.x&&b.x<=game.p.x+100){b.vy=-Math.abs(b.vy);b.vx+=((b.x-(game.p.x+50))/25)}for(const z of game.blocks)if(z.on&&b.x>z.x&&b.x<z.x+z.w&&b.y>z.y&&b.y<z.y+z.h){z.on=false;b.vy*=-1;score+=10;scoreEl.textContent='Score: '+score;break}if(game.blocks.every(z=>!z.on)){score+=100;scoreEl.textContent='Score: '+score;over('STAGE CLEAR!')}}
function drawBlock(){draw();x.fillStyle='#e33';for(const z of game.blocks)if(z.on)x.fillRect(z.x,z.y,z.w,z.h);x.fillStyle='#fff';x.fillRect(game.p.x,game.p.y,game.p.w,game.p.h);x.fillRect(game.ball.x-7,game.ball.y-7,14,14)}
function initStar(){text('🚀 Star Defender');game.p={x:300,y:350,w:34,h:22};game.enemies=[];game.bullets=[];game.enemyBullets=[];for(let r=0;r<3;r++)for(let q=0;q<8;q++)game.enemies.push({x:80+q*65,y:50+r*35,on:true});game.cool=0;game.ecool=0}
function star(dt){let p=game.p;p.x+=((keys.right?1:0)-(keys.left?1:0))*300*dt;p.x=Math.max(0,Math.min(606,p.x));game.cool-=dt;if(keys.up&&game.cool<=0){game.bullets.push({x:p.x+17,y:p.y,vy:-500});game.cool=.25}for(const b of game.bullets)b.y+=b.vy*dt;game.bullets=game.bullets.filter(b=>b.y>-10);for(const e of game.enemies)if(e.on){e.x+=Math.sin(performance.now()/500+e.y)*.25;for(const b of game.bullets)if(Math.abs(b.x-(e.x+12))<18&&Math.abs(b.y-e.y)<15){e.on=false;b.y=-50;score+=10;scoreEl.textContent='Score: '+score}}if(game.enemies.every(e=>!e.on)){over('WAVE CLEAR!');return}game.ecool-=dt;if(game.ecool<=0){let alive=game.enemies.filter(e=>e.on);if(alive.length)game.enemyBullets.push({x:alive[Math.floor(Math.random()*alive.length)].x+12,y:alive[0].y+15,vy:210});game.ecool=.6}for(const b of game.enemyBullets)b.y+=b.vy*dt;for(const b of game.enemyBullets)if(b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){over('SHIP DOWN');return}}
function drawStar(){draw();x.fillStyle='#5ee7ff';x.fillRect(game.p.x,game.p.y,34,22);x.fillStyle='#fff';for(const b of game.bullets)x.fillRect(b.x-2,b.y,4,10);x.fillStyle='#e66';for(const e of game.enemies)if(e.on){x.fillRect(e.x,e.y,25,16);x.fillRect(e.x+6,e.y-6,13,6)}x.fillStyle='#ff0';for(const b of game.enemyBullets)x.fillRect(b.x-2,b.y,4,8)}
function initRunner(){text('🪙 Coin Runner');game.p={x:70,y:320,w:24,h:30,vy:0,on:false};game.coins=[];game.hazards=[];game.flag=false;for(let i=0;i<12;i++)game.coins.push({x:100+i*42,y:250-(i%3)*45,taken:false});for(let i=0;i<8;i++)game.hazards.push({x:180+i*60,y:350,w:22,h:20});game.flagX=620}
function runner(dt){let p=game.p;p.x+=((keys.right?1:0)-(keys.left?1:0))*180*dt;if((keys.up||keys.down)&&p.on){p.vy=-430;p.on=false}p.vy+=900*dt;p.y+=p.vy*dt;if(p.y>=320){p.y=320;p.vy=0;p.on=true}p.x=Math.max(0,Math.min(616,p.x));for(const q of game.coins)if(!q.taken&&Math.abs(p.x-q.x)<24&&Math.abs(p.y-q.y)<35){q.taken=true;score+=25;scoreEl.textContent='Score: '+score}for(const h of game.hazards)if(p.x+p.w>h.x&&p.x<h.x+h.w&&p.y+p.h>h.y&&p.y<h.y+h.h){over('GAME OVER');return}if(p.x>=game.flagX){score+=100;scoreEl.textContent='Score: '+score;over('LEVEL CLEAR!')}}
function drawRunner(){draw();x.fillStyle='#173b80';x.fillRect(0,350,640,50);x.fillStyle='#ffd83d';for(const q of game.coins)if(!q.taken){x.beginPath();x.arc(q.x,q.y,9,0,Math.PI*2);x.fill()}x.fillStyle='#e33';for(const h of game.hazards)x.fillRect(h.x,h.y,h.w,h.h);x.fillStyle='#39d98a';x.fillRect(game.p.x,game.p.y,game.p.w,game.p.h);x.fillStyle='#fff';x.fillRect(game.flagX,270,5,80);x.fillRect(game.flagX,270,35,18)}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;if(mode==='block')block(dt),drawBlock();if(mode==='star')star(dt),drawStar();if(mode==='runner')runner(dt),drawRunner();if(running)raf=requestAnimationFrame(loop)}
setGame('block');
</script></body></html>
