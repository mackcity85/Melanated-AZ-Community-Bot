<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>{{ game.name }} — Melanated AZ</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#f7f7f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172033,#07080b 65%);display:flex;justify-content:center;padding:18px}.wrap{width:min(760px,100%)}.card{background:#11151d;border:1px solid #2b3444;border-radius:18px;padding:18px;box-shadow:0 18px 55px #0008}h1{margin:0 0 5px;font-size:clamp(22px,5vw,34px)}.sub{color:#aeb8c8;margin-bottom:14px}canvas{display:block;width:100%;max-width:720px;aspect-ratio:16/9;background:#05070b;border:2px solid #394458;border-radius:12px;touch-action:none;margin:auto}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:15px}.pad button,.actions button{height:58px;border:1px solid #46536a;border-radius:14px;background:#1b2330;color:#fff;font-size:22px;font-weight:800;touch-action:none}.pad button:active,.actions button:active{transform:scale(.96);background:#29364b}.blank{visibility:hidden}.actions{display:flex;justify-content:center;gap:12px;margin-top:10px}.actions button{width:100px}.start{display:flex;justify-content:center;margin:12px 0}.start button{padding:12px 26px;border:0;border-radius:12px;font-size:16px;font-weight:800;background:#fff;color:#111}.help{text-align:center;color:#8f9bad;font-size:13px;margin-top:12px}
</style></head>
<body><main class="wrap"><section class="card">
<h1>{{ game.icon }} {{ game.name }}</h1><div class="sub">{{ game.system_name }} • Original playable console-style game</div>
<div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
<canvas id="game" width="960" height="540"></canvas>
<div class="start"><button id="start">START / RESTART</button></div>
<div class="pad"><button class="blank"></button><button data-key="up">▲</button><button class="blank"></button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
<div class="actions"><button data-key="a">A</button><button data-key="b">B</button></div>
<div class="help">Keyboard: arrows/WASD • A = Space/Z • B = X • Mobile: use the controls</div>
</section></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
const W=960,H=540,mode={{ game.mode|tojson }},keys={left:false,right:false,up:false,down:false,a:false,b:false};let running=false,score=0,t=0,last=0,player,enemies,shots,items;
function resize(){/* CSS handles display scaling; keep a fixed logical canvas for stable gameplay. */}window.addEventListener('resize',resize);resize();
function reset(){score=0;t=0;player={x:W/2,y:H-80,w:38,h:38,vx:0,vy:0};enemies=[];shots=[];items=[];for(let i=0;i<8;i++)items.push({x:40+Math.random()*880,y:70+Math.random()*360,r:9,got:false});scoreEl.textContent='Score: 0';statusEl.textContent='Playing'}
function rect(a){return {x:a.x-a.w/2,y:a.y-a.h/2,w:a.w,h:a.h}}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2}
function spawn(){let side=Math.random()<.5?0:1;enemies.push({x:side?W+30:-30,y:60+Math.random()*390,w:32,h:32,vx:(side?-1:1)*(2.2+Math.random()*2),vy:(Math.random()-.5)*1.5})}
function start(){reset();running=true;last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').onclick=start;
function drawBG(){ctx.fillStyle='#070a10';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1b2637';ctx.lineWidth=2;for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawPlayer(){ctx.fillStyle='#fff';ctx.fillRect(player.x-player.w/2,player.y-player.h/2,player.w,player.h);ctx.fillStyle='#111';ctx.fillRect(player.x-7,player.y-6,5,5);ctx.fillRect(player.x+2,player.y-6,5,5)}
function draw(){drawBG();ctx.fillStyle='#7d8da8';ctx.font='bold 18px system-ui';ctx.fillText(mode==='runner'?'RUN TO 1000 POINTS':mode==='shooter'?'SURVIVE THE WAVE':'CLEAR THE LAP',22,30);if(mode==='racer'){ctx.strokeStyle='#ddd';ctx.lineWidth=8;ctx.strokeRect(180,45,600,450);ctx.strokeStyle='#777';ctx.lineWidth=3;for(let y=70;y<480;y+=70){ctx.beginPath();ctx.moveTo(465,y);ctx.lineTo(495,y+35);ctx.stroke()}}for(const i of items){if(!i.got){ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(i.x,i.y,i.r,0,Math.PI*2);ctx.fill()}}for(const e of enemies){ctx.fillStyle='#e85d5d';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h)}for(const s of shots){ctx.fillStyle='#8ff';ctx.fillRect(s.x-4,s.y-12,8,24)}drawPlayer()}
function update(dt){t+=dt;let sp=4.8;player.vx=(keys.right-keys.left)*sp;player.vy=(keys.down-keys.up)*sp;player.x=Math.max(22,Math.min(W-22,player.x+player.vx*dt*60));player.y=Math.max(55,Math.min(H-22,player.y+player.vy*dt*60));
if(mode==='runner'){if(Math.random()<dt*.8)spawn();for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;if(hit(player,e)){running=false;statusEl.textContent='Game Over';}}for(const i of items){if(!i.got&&Math.hypot(player.x-i.x,player.y-i.y)<30){i.got=true;score+=25}}if(score>=1000){running=false;statusEl.textContent='CLEAR!'}}
if(mode==='shooter'){if(keys.a&&!player._a){shots.push({x:player.x,y:player.y-25});player._a=true}if(!keys.a)player._a=false;if(Math.random()<dt*1.2)spawn();for(const s of shots)s.y-=9*dt*60;shots=shots.filter(s=>s.y>-20);for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;if(hit(player,e)){running=false;statusEl.textContent='Game Over'}}for(const s of shots){for(const e of enemies){if(Math.hypot(s.x-e.x,s.y-e.y)<28){e.dead=true;score+=20}}}enemies=enemies.filter(e=>!e.dead);if(t>45){running=false;statusEl.textContent='WAVE CLEAR!';}}
if(mode==='racer'){let speed=4+(keys.a?3:0);player.y-=speed*dt*60;player.x+=player.vx*dt*60;if(player.y<65){score+=250;player.y=H-80}if(Math.random()<dt*.7)spawn();for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;if(hit(player,e)){running=false;statusEl.textContent='CRASH!'}}if(score>=1000){running=false;statusEl.textContent='RACE COMPLETE!'}}scoreEl.textContent='Score: '+Math.floor(score)}
function loop(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function setKey(k,v){keys[k]=v}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'a',z:'a',' ':'a',x:'b',w:'up',s:'down',d:'right'};window.addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();setKey(k,true)}});window.addEventListener('keyup',e=>{const k=map[e.key];if(k){e.preventDefault();setKey(k,false)}});
document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();setKey(k,true);if(btn.setPointerCapture&&e.pointerId!==undefined)try{btn.setPointerCapture(e.pointerId)}catch(_){} };const up=e=>{e.preventDefault();setKey(k,false)};if(window.PointerEvent){btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)}else{btn.addEventListener('touchstart',down,{passive:false});btn.addEventListener('touchend',up,{passive:false});btn.addEventListener('touchcancel',up,{passive:false});btn.addEventListener('mousedown',down);btn.addEventListener('mouseup',up);btn.addEventListener('mouseleave',up)}});
window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=false)});reset();draw();
</script></body></html>
