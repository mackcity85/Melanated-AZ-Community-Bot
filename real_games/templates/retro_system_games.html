<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>{{ game.name }} — Melanated AZ</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#080a0f;color:#f7f7f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#182238,#06070a 68%);display:flex;justify-content:center;padding:18px}.wrap{width:min(760px,100%)}.card{background:#11151d;border:1px solid #303b50;border-radius:18px;padding:18px;box-shadow:0 18px 55px #0009}h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px)}.sub{color:#aeb8c8;margin-bottom:12px}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-weight:800}canvas{display:block;width:100%;max-width:720px;aspect-ratio:16/9;background:#05070b;border:2px solid #46536a;border-radius:12px;touch-action:none;margin:auto}.start{display:flex;justify-content:center;margin:12px 0}.start button,.pad button,.actions button{border:1px solid #46536a;border-radius:14px;background:#1b2330;color:#fff;font-weight:800;touch-action:none}.start button{padding:12px 26px;font-size:16px}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:15px}.pad button{height:58px;font-size:22px}.actions{display:flex;justify-content:center;gap:12px;margin-top:10px}.actions button{width:100px;height:58px;font-size:22px}.pad button:active,.actions button:active,.start button:active{transform:scale(.96);background:#2a374d}.blank{visibility:hidden}.help{text-align:center;color:#8f9bad;font-size:13px;margin-top:12px}
</style></head>
<body><main class="wrap"><section class="card">
<h1>{{ game.icon }} {{ game.name }}</h1><div class="sub">{{ game.system_name }} • Original playable console-style game</div>
<div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
<canvas id="game" width="960" height="540"></canvas>
<div class="start"><button id="start">START / RESTART</button></div>
<div class="pad"><button class="blank"></button><button data-key="up">▲</button><button class="blank"></button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
<div class="actions"><button data-key="a">A</button><button data-key="b">B</button></div>
<div class="help">Keyboard: arrows/WASD • A = Space/Z • B = X • Mobile: use the controls</div>
</section></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
const W=960,H=540,system={{ game.system_id|tojson }},gameId={{ game.game_id|tojson }},gameName={{ game.name|tojson }},index=parseInt(gameId.slice(-1),10)||1;
const keys={left:false,right:false,up:false,down:false,a:false,b:false};
let running=false,score=0,t=0,last=0,player,enemies,shots,items,coins,obstacles,particles;
const THEMES={
 gameboy:['#9bbc0f','#306230','#0f380f','#8bac0f'],gbc:['#5b8cff','#2b1b57','#ffcf33','#ff5c8a'],n64:['#6d4aff','#17112d','#32d8ff','#ff7b39'],gba:['#43b8ff','#101b4d','#ffdb4d','#ff5f7a'],gamecube:['#7b68ee','#171229','#63e6be','#ff8f3d'],mastersystem:['#e8e8e8','#18233d','#e53935','#ffd54f'],genesis:['#d94cff','#120d22','#4ce6ff','#ffbd45'],gamegear:['#ff6b8a','#24101d','#65f6c7','#ffd166'],saturn:['#b8b8c8','#17171d','#efefef','#7a8cff'],dreamcast:['#4de0ff','#061722','#ff4d8d','#ffe066'],ps1:['#c7ccd6','#141820','#00d9ff','#ff477e'],ps2:['#8f7aff','#100d24','#42e8ff','#ff5c5c'],psp:['#e6e6f0','#151522','#67f5ff','#ff7be5'],ps3:['#3ce7ff','#07131b','#d9f8ff','#ff5370'],xbox:['#79d94c','#08170b','#b6ff75','#36a852'],xbox360:['#d8d8d8','#151515','#8cff66','#ff7b66'],xboxone:['#8cff66','#071208','#d5ffd0','#54b7ff']};
const theme=THEMES[system]||['#fff','#111','#6cf','#f66'];
function resize(){}window.addEventListener('resize',resize);
function reset(){score=0;t=0;running=false;player={x:W/2,y:H-75,w:38,h:38,vx:0,vy:0,energy:100};enemies=[];shots=[];items=[];coins=[];obstacles=[];particles=[];for(let i=0;i<12;i++)coins.push({x:50+Math.random()*860,y:70+Math.random()*390,r:9,got:false});scoreEl.textContent='Score: 0';statusEl.textContent='Ready'}
function start(){reset();running=true;last=performance.now();statusEl.textContent='Playing';requestAnimationFrame(loop)}document.getElementById('start').onclick=start;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function hit(a,b,r=30){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function spawnEnemy(){const side=Math.random()<.5?0:1;enemies.push({x:side?-35:W+35,y:65+Math.random()*410,w:28+Math.random()*14,h:28+Math.random()*14,vx:(side?1:-1)*(1.6+Math.random()*2.4),vy:(Math.random()-.5)*1.8,phase:Math.random()*6,dead:false})}
function burst(x,y){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:.5})}
function drawGrid(){ctx.fillStyle=theme[1];ctx.fillRect(0,0,W,H);ctx.strokeStyle=theme[2]+'35';ctx.lineWidth=2;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawRunnerBG(){drawGrid();ctx.fillStyle=theme[2]+'30';for(let x=0;x<W;x+=120){ctx.fillRect(x,45,55,H-70)}ctx.fillStyle=theme[3];ctx.font='bold 18px system-ui';ctx.fillText('ENDLESS RUN',22,30)}
function drawShooterBG(){ctx.fillStyle=theme[1];ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){const x=(i*137)%W,y=(i*71)%H;ctx.fillStyle=i%3?theme[2]+'88':theme[3]+'aa';ctx.fillRect(x,y,2,2)}ctx.strokeStyle=theme[2]+'40';for(let r=80;r<500;r+=80){ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=theme[2];ctx.font='bold 18px system-ui';ctx.fillText('WAVE ATTACK',22,30)}
function drawRacerBG(){ctx.fillStyle=theme[1];ctx.fillRect(0,0,W,H);ctx.fillStyle=theme[0]+'22';ctx.fillRect(175,0,610,H);ctx.strokeStyle=theme[0];ctx.lineWidth=7;ctx.strokeRect(175,20,610,500);ctx.strokeStyle=theme[2]+'66';ctx.lineWidth=3;for(let y=40;y<520;y+=70){ctx.beginPath();ctx.moveTo(475,y);ctx.lineTo(485,y+30);ctx.stroke()}ctx.fillStyle=theme[3];ctx.font='bold 18px system-ui';ctx.fillText('TURBO CIRCUIT',22,30)}
function drawPlayer(){ctx.fillStyle=theme[0];if(index===1){ctx.fillRect(player.x-18,player.y-18,36,36);ctx.fillStyle=theme[2];ctx.fillRect(player.x-8,player.y-9,16,7)}else if(index===2){ctx.beginPath();ctx.moveTo(player.x,player.y-22);ctx.lineTo(player.x+21,player.y+18);ctx.lineTo(player.x,player.y+8);ctx.lineTo(player.x-21,player.y+18);ctx.closePath();ctx.fill();ctx.fillStyle=theme[2];ctx.beginPath();ctx.arc(player.x,player.y-2,7,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc(player.x,player.y,21,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme[2];ctx.fillRect(player.x-6,player.y-13,12,26)}}
function drawEnemy(e){ctx.fillStyle=theme[3];if(index===1){ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);ctx.fillStyle=theme[1];ctx.fillRect(e.x-5,e.y-5,4,4);ctx.fillRect(e.x+2,e.y-5,4,4)}else if(index===2){ctx.beginPath();ctx.moveTo(e.x,e.y-e.h/2);ctx.lineTo(e.x+e.w/2,e.y+e.h/2);ctx.lineTo(e.x-e.w/2,e.y+e.h/2);ctx.closePath();ctx.fill()}else{ctx.beginPath();ctx.arc(e.x,e.y,e.w/2,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme[1];ctx.fillRect(e.x-5,e.y-3,10,6)}}
function draw(){if(index===1)drawRunnerBG();else if(index===2)drawShooterBG();else drawRacerBG();
for(const c of coins)if(!c.got){ctx.fillStyle=theme[3];ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme[1];ctx.font='bold 11px system-ui';ctx.fillText(index===3?'★':'+' ,c.x-4,c.y+4)}
for(const e of enemies)if(!e.dead)drawEnemy(e);for(const s of shots){ctx.fillStyle=theme[2];ctx.fillRect(s.x-4,s.y-14,8,28)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=theme[3];ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1}drawPlayer()}
function update(dt){t+=dt;const sp=index===3?5.4:4.7;player.vx=(keys.right-keys.left)*sp;player.vy=(keys.down-keys.up)*sp;player.x=Math.max(25,Math.min(W-25,player.x+player.vx*dt*60));player.y=Math.max(55,Math.min(H-25,player.y+player.vy*dt*60));
if(index===1){if(Math.random()<dt*.9)spawnEnemy();for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;e.phase+=dt;if(hit(player,e,34)){running=false;statusEl.textContent='GAME OVER'}}for(const c of coins)if(!c.got&&hit(player,c,28)){c.got=true;score+=25;burst(c.x,c.y)}if(score>=1000){running=false;statusEl.textContent='LEVEL CLEAR!'}}
if(index===2){if(keys.a&&!player._a){shots.push({x:player.x,y:player.y-24,v:10});player._a=true}if(!keys.a)player._a=false;if(Math.random()<dt*1.35)spawnEnemy();for(const s of shots)s.y-=s.v*dt*60;shots=shots.filter(s=>s.y>-30);for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;e.phase+=dt;e.y+=Math.sin(e.phase*2)*.7;if(hit(player,e,32)){running=false;statusEl.textContent='SHIP DOWN'}}for(const s of shots)for(const e of enemies)if(!e.dead&&hit(s,e,25)){e.dead=true;score+=20;burst(e.x,e.y)}enemies=enemies.filter(e=>!e.dead&&e.x>-70&&e.x<W+70);if(t>=45||score>=300){running=false;statusEl.textContent='WAVE CLEAR!'}}
if(index===3){if(keys.a&&!player._a){player.boost=1;player._a=true}if(!keys.a)player._a=false;player.boost=Math.max(0,player.boost||0);let speed=4+(player.boost?3.5:0);player.y-=speed*dt*60;if(player.y<65){score+=250;player.y=H-75;burst(player.x,player.y)}if(Math.random()<dt*.75)spawnEnemy();for(const e of enemies){e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;if(hit(player,e,34)){running=false;statusEl.textContent='CRASH!'}}if(score>=1000){running=false;statusEl.textContent='RACE COMPLETE!'}}
for(const p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life-=dt}particles=particles.filter(p=>p.life>0);scoreEl.textContent='Score: '+Math.floor(score)}
function loop(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function setKey(k,v){keys[k]=v}const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'a',z:'a',' ':'a',x:'b',w:'up',s:'down',d:'right'};
window.addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();setKey(k,true)}});window.addEventListener('keyup',e=>{const k=map[e.key];if(k){e.preventDefault();setKey(k,false)}});
document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();setKey(k,true);if(btn.setPointerCapture&&e.pointerId!==undefined)try{btn.setPointerCapture(e.pointerId)}catch(_){} };const up=e=>{e.preventDefault();setKey(k,false)};if(window.PointerEvent){btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)}else{btn.addEventListener('touchstart',down,{passive:false});btn.addEventListener('touchend',up,{passive:false});btn.addEventListener('touchcancel',up,{passive:false});btn.addEventListener('mousedown',down);btn.addEventListener('mouseup',up);btn.addEventListener('mouseleave',up)}});
window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=false)});reset();draw();
</script></body></html>
