    trivia.className="trivia";

    gameArea.appendChild(trivia);

    /*
       Clean/funny Dirty Minds-style riddles.
       The joke is that the question sounds suggestive
       but has an innocent answer.
    */

    const questions=[
        {
            q:"What gets wetter the more it dries?",
            answers:[
                "A towel",
                "A sponge",
                "A raincoat",
                "A shoe"
            ],
            correct:0
        },
        {
            q:"What has a head and a tail but no body?",
            answers:[
                "A coin",
                "A snake",
                "A shirt",
                "A spoon"
            ],
            correct:0
        },
        {
            q:"What goes in hard and dry and comes out soft and wet?",
            answers:[
                "Pasta",
                "A towel",
                "A candle",
                "A pencil"
            ],
            correct:0
        },
        {
            q:"What can you catch but never throw?",
            answers:[
                "A cold",
                "A ball",
                "A shoe",
                "A fish"
            ],
            correct:0
        },
        {
            q:"What has a hole in the middle but can still hold water?",
            answers:[
                "A sponge",
                "A cup",
                "A bottle",
                "A bucket"
            ],
            correct:0
        },
        {
            q:"What gets longer when you pull it?",
            answers:[
                "A rubber band",
                "A table",
                "A book",
                "A plate"
            ],
            correct:0
        },
        {
            q:"What has many rings but no fingers?",
            answers:[
                "A telephone",
                "A hand",
                "A glove",
                "A necklace"
            ],
            correct:0
        },
        {
            q:"What can be cracked, made, told, and played?",
            answers:[
                "A joke",
                "A window",
                "An egg",
                "A guitar"
            ],
            correct:0
        },
        {
            q:"What has a bottom at the top?",
            answers:[
                "Your legs",
                "A mountain",
                "A bottle",
                "A chair"
            ],
            correct:0
        },
        {
            q:"What is easy to get into but hard to get out of?",
            answers:[
                "Trouble",
                "A car",
                "A bathtub",
                "A house"
            ],
            correct:0
        },
        {
            q:"What can you hold without ever touching it?",
            answers:[
                "A conversation",
                "A cup",
                "A ball",
                "A book"
            ],
            correct:0
        },
        {
            q:"What has a tongue but cannot taste?",
            answers:[
                "A shoe",
                "A dog",
                "A spoon",
                "A person"
            ],
            correct:0
        }
    ];

    shuffle(questions);

    let index=0;
    let score=0;

    function renderQuestion(){

        if(index>=questions.length){

            trivia.innerHTML=`
                <div class="question-box">
                    <div class="question-text">
                        😈 Game Over!
                    </div>
                    <p>
                        You scored
                        <strong>${score}</strong>
                        out of
                        <strong>${questions.length}</strong>.
                    </p>
                    <button
                        class="btn primary"
                        id="dirtyAgain"
                    >
                        🔄 Play Again
                    </button>
                </div>
            `;

            document
                .getElementById("dirtyAgain")
                .addEventListener(
                    "click",
                    ()=>{
                        loadGame("dirty_minds");
                    }
                );

            return;
        }

        const item=questions[index];

        numberEl.textContent=
            `${index+1}/${questions.length}`;

        trivia.innerHTML="";

        const box=
            document.createElement("div");

        box.className="question-box";

        box.innerHTML=`
            <div class="question-number">
                😈 Dirty Minds
            </div>
            <div class="question-text">
                ${item.q}
            </div>
        `;

        trivia.appendChild(box);

        const answers=
            document.createElement("div");

        answers.className="answers";

        item.answers.forEach(
            (answer,i)=>{

                const button=
                    document.createElement("button");

                button.className="answer-btn";

                button.textContent=answer;

                button.addEventListener(
                    "click",
                    ()=>{

                        const buttons=
                            answers.querySelectorAll(
                                ".answer-btn"
                            );

                        buttons.forEach(
                            b=>b.disabled=true
                        );

                        if(i===item.correct){

                            button.classList.add(
                                "correct"
                            );

                            score++;

                            scoreEl.textContent=
                                score;

                        }else{

                            button.classList.add(
                                "wrong"
                            );

                            buttons[
                                item.correct
                            ].classList.add(
                                "correct"
                            );
                        }

                        const result=
                            document.createElement("div");

                        result.className=
                            "trivia-result";

                        result.textContent=
                            i===item.correct
                            ? "🔥 Correct!"
                            : `😏 Nope! The innocent answer is "${item.answers[item.correct]}".`;

                        trivia.appendChild(result);

                        setTimeout(()=>{

                            index++;

                            renderQuestion();

                        },1100);
                    }
                );

                answers.appendChild(button);
            }
        );

        trivia.appendChild(answers);
    }

    renderQuestion();

    window.currentStart=()=>{};

    cleanupCurrentGame=()=>{
        window.currentStart=null;
    };
}


/* =========================================================
   RACE CAR RACING
   ========================================================= */

function raceCarGame(){

    clearGameArea();
    clearScore();

    const canvas=createCanvas(420,650);
    const ctx=canvas.getContext("2d");

    const scoreEl=addStat(
        "Distance",
        "0",
        "raceDistance"
    );

    const speedEl=addStat(
        "Speed",
        "1",
        "raceSpeed"
    );

    let playerLane=1;
    let distance=0;
    let speed=4;
    let cars=[];
    let running=false;
    let frame=0;
    let spawnCounter=0;

    const lanes=[
        90,
        180,
        270
    ];

    function spawnCar(){

        const lane=
            randomInt(0,2);

        cars.push({
            lane,
            x:lanes[lane],
            y:-120,
            w:48,
            h:90,
            speed:speed*
                (0.85+
                Math.random()*.35)
        });
    }

    function drawRoad(){

        ctx.fillStyle="#111";
        ctx.fillRect(
            0,
            0,
            420,
            650
        );

        /* road */

        ctx.fillStyle="#444";

        ctx.fillRect(
            55,
            0,
            310,
            650
        );

        /* lane lines */

        ctx.strokeStyle="#aaa";
        ctx.lineWidth=5;
        ctx.setLineDash([35,30]);

        [145,235].forEach(x=>{

            ctx.beginPath();

            ctx.moveTo(x,0);
            ctx.lineTo(x,650);

            ctx.stroke();
        });

        ctx.setLineDash([]);

        /* player */

        ctx.fillStyle="#fff";

        ctx.fillRect(
            lanes[playerLane]-24,
            530,
            48,
            90
        );

        /* opponents */

        ctx.fillStyle="#888";

        cars.forEach(car=>{

            ctx.fillRect(
                car.x-24,
                car.y,
                car.w,
                car.h
            );
        });
    }

    function collision(car){

        const px=
            lanes[playerLane]-24;

        const py=530;

        return (
            px<car.x+car.w/2 &&
            px+48>car.x-car.w/2 &&
            py<car.y+car.h &&
            py+90>car.y
        );
    }

    function loop(){

        if(!running)return;

        spawnCounter++;

        if(
            spawnCounter>
            Math.max(
                25,
                65-distance/100
            )
        ){

            spawnCounter=0;

            spawnCar();
        }

        cars.forEach(car=>{
            car.y+=car.speed;
        });

        cars=cars.filter(
            car=>car.y<700
        );

        for(const car of cars){

            if(collision(car)){

                running=false;

                setStartText("▶ Start");

                return;
            }
        }

        distance+=speed*.05;

        speed=
            Math.min(
                12,
                4+distance/150
            );

        scoreEl.textContent=
            Math.floor(distance);

        speedEl.textContent=
            speed.toFixed(1);

        drawRoad();

        frame=
            requestAnimationFrame(loop);
    }

    function start(){

        if(running)return;

        running=true;

        setStartText("🏎️ Racing");

        frame=
            requestAnimationFrame(loop);
    }

    function moveLeft(){

        playerLane=
            Math.max(
                0,
                playerLane-1
            );
    }

    function moveRight(){

        playerLane=
            Math.min(
                2,
                playerLane+1
            );
    }

    function key(e){

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A"
        ){

            e.preventDefault();
            moveLeft();
        }

        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D"
        ){

            e.preventDefault();
            moveRight();
        }

        if(
            e.key==="ArrowUp" ||
            e.key==="w" ||
            e.key==="W"
        ){

            e.preventDefault();
            start();
        }
    }

    let touchStartX=0;

    function touchStart(e){

        const p=e.touches[0];

        touchStartX=p.clientX;
    }

    function touchEnd(e){

        const p=e.changedTouches[0];

        const dx=
            p.clientX-touchStartX;

        if(
            Math.abs(dx)<25
        ){
            start();
            return;
        }

        if(dx<0){
            moveLeft();
        }else{
            moveRight();
        }

        start();
    }

    canvas.addEventListener(
        "touchstart",
        touchStart,
        {passive:true}
    );

    canvas.addEventListener(
        "touchend",
        touchEnd,
        {passive:true}
    );

    document.addEventListener(
        "keydown",
        key
    );

    window.currentStart=start;

    drawRoad();

    cleanupCurrentGame=()=>{

        running=false;

        cancelAnimationFrame(frame);

        canvas.removeEventListener(
            "touchstart",
            touchStart
        );

        canvas.removeEventListener(
            "touchend",
            touchEnd
        );

        document.removeEventListener(
            "keydown",
            key
        );

        window.currentStart=null;
    };
}

};


/* =========================================================
   LOAD GAME
   ========================================================= */

function loadGame(id){

    stopCurrentGame();

    startBtn.disabled=false;

    setStartText("▶ Start");

    const normalized=
        String(id||"")
        .toLowerCase()
        .trim()
        .replace(/-/g,"_")
        .replace(/\s+/g,"_");

    const engine=
        PLAYABLE_GAMES[normalized];

    if(!engine){

        unknownGame();

        return;
    }

    try{

        engine();

    }catch(error){

        console.error(
            "Game failed to load:",
            normalized,
            error
        );

        stopCurrentGame();

        clearGameArea();

        clearScore();

        setMessage(
            "❌ This game encountered an error while loading."
        );

        startBtn.disabled=true;
    }
}
