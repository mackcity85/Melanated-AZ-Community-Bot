<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>{{ game.name }} — Melanated AZ Real Games</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:10px;
    padding-bottom:30px;
}

button,
a{
    touch-action:manipulation;
}

.wrapper{
    width:100%;
    max-width:720px;
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.back{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    padding:0 16px;
    background:#191919;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-weight:800;
}

.title{
    flex:1;
    text-align:right;
    font-size:17px;
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:14px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.hero{
    text-align:center;
    margin-bottom:10px;
}

.icon{
    font-size:45px;
    line-height:1;
    margin-bottom:6px;
}

h1{
    margin:0;
    font-size:24px;
}

.description{
    color:#999;
    margin-top:6px;
    font-size:13px;
}

.status{
    min-height:22px;
    text-align:center;
    font-weight:800;
    margin:8px 0;
}

.scores{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:8px 0 12px;
}

.score{
    min-width:90px;
    background:#191919;
    border:1px solid #333;
    border-radius:11px;
    padding:7px 11px;
    text-align:center;
    font-size:12px;
}

.score strong{
    display:block;
    font-size:19px;
    margin-top:2px;
}

.game{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    max-width:620px;
    height:auto;
    background:#050505;
    border:2px solid #303030;
    border-radius:14px;
    touch-action:none;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

button{
    appearance:none;
    min-height:48px;
    min-width:70px;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid #3b3b3b;
    background:#1d1d1d;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

.primary{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.danger{
    background:#351515;
    border-color:#713535;
}

.dpad{
    display:grid;
    grid-template-columns:repeat(3,60px);
    grid-template-rows:repeat(3,52px);
    gap:5px;
    justify-content:center;
    margin:12px auto;
}

.dpad button:nth-child(1){
    grid-column:2;
}

.dpad button:nth-child(2){
    grid-column:1;
    grid-row:2;
}

.dpad button:nth-child(3){
    grid-column:3;
    grid-row:2;
}

.dpad button:nth-child(4){
    grid-column:2;
    grid-row:3;
}

.result{
    margin-top:12px;
    padding:15px;
    border-radius:13px;
    background:#191919;
    border:1px solid #333;
    text-align:center;
    font-size:18px;
    font-weight:900;
}

.hidden{
    display:none!important;
}

.message{
    text-align:center;
    padding:25px 10px;
}

.grid{
    display:grid;
    gap:7px;
}

.memory-grid{
    grid-template-columns:repeat(4,1fr);
    max-width:440px;
    margin:auto;
}

.memory-card{
    aspect-ratio:1;
    min-width:0;
    font-size:clamp(24px,8vw,42px);
}

.ttt-grid{
    grid-template-columns:repeat(3,1fr);
    max-width:390px;
    margin:auto;
}

.ttt-cell{
    aspect-ratio:1;
    font-size:clamp(35px,12vw,65px);
}

.c4-grid{
    grid-template-columns:repeat(7,1fr);
    max-width:560px;
    margin:auto;
    gap:4px;
}

.c4-cell{
    min-width:0;
    min-height:46px;
    padding:0;
    font-size:22px;
}

.choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    max-width:500px;
    margin:auto;
}

.choice-grid button{
    min-height:60px;
}

input{
    width:100%;
    padding:14px;
    background:#080808;
    color:#fff;
    border:1px solid #444;
    border-radius:12px;
    font-size:18px;
    text-align:center;
}

@media(max-width:430px){
    body{
        padding:7px;
    }

    .card{
        padding:10px;
    }

    h1{
        font-size:21px;
    }

    .title{
        font-size:14px;
    }

    button{
        font-size:14px;
        min-height:46px;
    }

    .choice-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="topbar">

        <a class="back"
           href="{{ url_for('real_games.real_games_home') }}">
            ← Games
        </a>

        <div class="title">
            {{ game.name }}
        </div>

    </div>

    <div class="card">

        <div class="hero">

            <div class="icon">
                {{ game.icon }}
            </div>

            <h1>
                {{ game.name }}
            </h1>

            <div class="description">
                {{ game.description }}
            </div>

        </div>

        <div id="scores" class="scores"></div>

        <div id="status" class="status"></div>

        <div id="game" class="game"></div>

        <div id="controls" class="controls"></div>

        <div id="result" class="result hidden"></div>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CORE
========================================================= */

const GAME_ID =
    "{{ game.game_id|default(game.name)|lower|replace(' ','_')|replace('-','_')|e }}";

const gameBox =
    document.getElementById("game");

const controls =
    document.getElementById("controls");

const scores =
    document.getElementById("scores");

const statusBox =
    document.getElementById("status");

const resultBox =
    document.getElementById("result");

let timers = [];
let intervals = [];
let keys = [];
let restartFunction = null;

function cleanup(){

    timers.forEach(clearTimeout);
    intervals.forEach(clearInterval);

    timers = [];
    intervals = [];

    keys.forEach(item=>{
        window.removeEventListener(item.event,item.fn);
    });

    keys = [];

    gameBox.innerHTML = "";
    controls.innerHTML = "";
    scores.innerHTML = "";

    statusBox.textContent = "";

    resultBox.classList.add("hidden");
    resultBox.innerHTML = "";

    restartFunction = null;
}

function timer(fn,time){

    const id = setTimeout(fn,time);
    timers.push(id);

    return id;
}

function interval(fn,time){

    const id = setInterval(fn,time);
    intervals.push(id);

    return id;
}

function setKeys(map){

    const fn = event => {

        const key =
            event.key.toLowerCase();

        if(map[key]){

            event.preventDefault();

            map[key]();
        }
    };

    window.addEventListener("keydown",fn);

    keys.push({
        event:"keydown",
        fn
    });
}

function button(text,fn,cls=""){

    const b =
        document.createElement("button");

    b.textContent = text;

    if(cls){
        b.className = cls;
    }

    b.addEventListener("click",fn);

    controls.appendChild(b);

    return b;
}

function canvas(width,height){

    const c =
        document.createElement("canvas");

    c.width = width;
    c.height = height;

    gameBox.appendChild(c);

    return c;
}

function score(data){

    scores.innerHTML = "";

    Object.entries(data).forEach(([name,value])=>{

        const box =
            document.createElement("div");

        box.className = "score";

        box.innerHTML =
            `${name}<strong>${value}</strong>`;

        scores.appendChild(box);
    });
}

function status(text){

    statusBox.textContent =
        text || "";
}

function result(text){

    resultBox.innerHTML = text;

    resultBox.classList.remove("hidden");
}

function restart(){

    button("🔄 Restart",()=>{
        if(restartFunction){
            restartFunction();
        }
    });
}

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;
}

function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];
}

/* =========================================================
   1. SNAKE
========================================================= */

function snakeGame(){

    const c = canvas(420,420);
    const ctx = c.getContext("2d");

    const size = 21;
    const cell = 20;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let points;
    let alive;

    function reset(){

        snake = [
            {x:10,y:10},
            {x:9,y:10},
            {x:8,y:10}
        ];

        direction = {
            x:1,
            y:0
        };

        nextDirection = {
            x:1,
            y:0
        };

        points = 0;
        alive = true;

        placeFood();

        result("");

        resultBox.classList.add("hidden");
    }

    function placeFood(){

        do{

            food = {
                x:random(0,size-1),
                y:random(0,size-1)
            };

        }while(
            snake.some(
                part =>
                    part.x===food.x &&
                    part.y===food.y
            )
        );
    }

    function change(x,y){

        if(
            x === -direction.x &&
            y === -direction.y
        ){
            return;
        }

        nextDirection = {x,y};
    }

    function draw(){

        ctx.fillStyle="#050505";
        ctx.fillRect(
            0,0,c.width,c.height
        );

        ctx.strokeStyle="#171717";

        for(let i=0;i<size;i++){

            ctx.beginPath();

            ctx.moveTo(i*cell,0);
            ctx.lineTo(i*cell,c.height);

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(0,i*cell);
            ctx.lineTo(c.width,i*cell);

            ctx.stroke();
        }

        ctx.fillStyle="#63d471";

        snake.forEach(part=>{

            ctx.fillRect(
                part.x*cell+2,
                part.y*cell+2,
                cell-4,
                cell-4
            );
        });

        ctx.fillStyle="#ef5555";

        ctx.beginPath();

        ctx.arc(
            food.x*cell+10,
            food.y*cell+10,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

        score({
            Score:points
        });
    }

    function step(){

        if(!alive){
            return;
        }

        direction = nextDirection;

        const head = {
            x:snake[0].x + direction.x,
            y:snake[0].y + direction.y
        };

        if(
            head.x<0 ||
            head.x>=size ||
            head.y<0 ||
            head.y>=size ||
            snake.some(
                p =>
                    p.x===head.x &&
                    p.y===head.y
            )
        ){

            alive=false;

            status("Game Over");

            result(
                `🐍 GAME OVER<br>Score: ${points}`
            );

            return;
        }

        snake.unshift(head);

        if(
            head.x===food.x &&
            head.y===food.y
        ){

            points++;

            placeFood();

        }else{

            snake.pop();
        }

        draw();
    }

    setKeys({

        arrowup:()=>change(0,-1),
        w:()=>change(0,-1),

        arrowdown:()=>change(0,1),
        s:()=>change(0,1),

        arrowleft:()=>change(-1,0),
        a:()=>change(-1,0),

        arrowright:()=>change(1,0),
        d:()=>change(1,0)
    });

    const pad =
        document.createElement("div");

    pad.className="dpad";

    [
        ["▲",()=>change(0,-1)],
        ["◀",()=>change(-1,0)],
        ["▶",()=>change(1,0)],
        ["▼",()=>change(0,1)]
    ].forEach(item=>{

        const b =
            document.createElement("button");

        b.textContent=item[0];

        b.onclick=item[1];

        pad.appendChild(b);
    });

    controls.appendChild(pad);

    restartFunction=()=>{
        cleanup();
        snakeGame();
    };

    reset();
    draw();

    interval(step,110);
}

/* =========================================================
   2. PONG
========================================================= */

function pongGame(){

    const c=canvas(600,400);
    const ctx=c.getContext("2d");

    let player=170;
    let cpu=170;

    let ball={
        x:300,
        y:200,
        vx:5,
        vy:3
    };

    let you=0;
    let opponent=0;
    let running=true;

    function resetBall(direction){

        ball={
            x:300,
            y:200,
            vx:direction*5,
            vy:Math.random()>.5?3:-3
        };
    }

    function movePlayer(amount){

        player =
            clamp(
                player+amount,
                0,
                340
            );
    }

    function draw(){

        ctx.fillStyle="#050505";

        ctx.fillRect(
            0,0,600,400
        );

        ctx.strokeStyle="#333";

        ctx.setLineDash([8,8]);

        ctx.beginPath();

        ctx.moveTo(300,0);
        ctx.lineTo(300,400);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle="#fff";

        ctx.fillRect(
            15,
            player,
            12,
            60
        );

        ctx.fillRect(
            573,
            cpu,
            12,
            60
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        score({
            You:you,
            CPU:opponent
        });
    }

    function step(){

        if(!running){
            return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if(
            ball.y<8 ||
            ball.y>392
        ){
            ball.vy *= -1;
        }

        const target =
            ball.y-30;

        if(cpu<target){
            cpu += 3.5;
        }

        if(cpu>target){
            cpu -= 3.5;
        }

        cpu=clamp(cpu,0,340);

        if(
            ball.x<32 &&
            ball.x>15 &&
            ball.y>player-5 &&
            ball.y<player+65
        ){

            ball.vx =
                Math.abs(ball.vx)*1.03;
        }

        if(
            ball.x>560 &&
            ball.x<585 &&
            ball.y>cpu-5 &&
            ball.y<cpu+65
        ){

            ball.vx =
                -Math.abs(ball.vx)*1.03;
        }

        if(ball.x<0){

            opponent++;

            resetBall(1);
        }

        if(ball.x>600){

            you++;

            resetBall(-1);
        }

        if(you>=5 || opponent>=5){

            running=false;

            result(
                you>opponent
                ? "🏆 YOU WIN!"
                : "🤖 CPU WINS!"
            );
        }

        draw();
    }

    c.addEventListener(
        "pointermove",
        event=>{

            const r =
                c.getBoundingClientRect();

            const y =
                (event.clientY-r.top)
                *400/r.height;

            player =
                clamp(
                    y-30,
                    0,
                    340
                );
        }
    );

    setKeys({

        arrowup:()=>movePlayer(-25),
        w:()=>movePlayer(-25),

        arrowdown:()=>movePlayer(25),
        s:()=>movePlayer(25)
    });

    button(
        "▲",
        ()=>movePlayer(-30)
    );

    button(
        "▼",
        ()=>movePlayer(30)
    );

    restartFunction=()=>{
        cleanup();
        pongGame();
    };

    draw();

    interval(step,16);
}

/* =========================================================
   3. BREAKOUT
========================================================= */

function breakoutGame(){

    const c=canvas(600,500);
    const ctx=c.getContext("2d");

    let paddle=250;

    let ball={
        x:300,
        y:420,
        vx:4,
        vy:-4
    };

    let bricks=[];
    let points=0;
    let lives=3;
    let running=true;

    function build(){

        bricks=[];

        for(let row=0;row<5;row++){

            for(let col=0;col<8;col++){

                bricks.push({
                    x:15+col*72,
                    y:30+row*28,
                    w:62,
                    h:20,
                    alive:true
                });
            }
        }
    }

    function resetBall(){

        ball={
            x:300,
            y:420,
            vx:Math.random()>.5?4:-4,
            vy:-4
        };
    }

    function draw(){

        ctx.fillStyle="#050505";

        ctx.fillRect(
            0,0,600,500
        );

        ctx.fillStyle="#fff";

        bricks.forEach(b=>{

            if(!b.alive){
                return;
            }

            ctx.fillRect(
                b.x,
                b.y,
                b.w,
                b.h
            );
        });

        ctx.fillRect(
            paddle,
            465,
            100,
            14
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        score({
            Score:points,
            Lives:lives
        });
    }

    function step(){

        if(!running){
            return;
        }

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        if(
            ball.x<8 ||
            ball.x>592
        ){
            ball.vx*=-1;
        }

        if(ball.y<8){
            ball.vy*=-1;
        }

        if(
            ball.y>450 &&
            ball.y<485 &&
            ball.x>paddle &&
            ball.x<paddle+100
        ){

            ball.vy =
                -Math.abs(ball.vy);

            ball.vx =
                (ball.x-(paddle+50))*.12;
        }

        for(const b of bricks){

            if(
                b.alive &&
                ball.x>b.x &&
                ball.x<b.x+b.w &&
                ball.y>b.y &&
                ball.y<b.y+b.h
            ){

                b.alive=false;

                ball.vy*=-1;

                points+=10;

                break;
            }
        }

        if(ball.y>510){

            lives--;

            if(lives<=0){

                running=false;

                result(
                    `🧱 GAME OVER<br>Score: ${points}`
                );

                return;
            }

            resetBall();
        }

        if(
            bricks.every(
                b=>!b.alive
            )
        ){

            running=false;

            result(
                `🏆 BOARD CLEARED!<br>Score: ${points}`
            );
        }

        draw();
    }

    function move(amount){

        paddle =
            clamp(
                paddle+amount,
                0,
                500
            );
    }

    c.addEventListener(
        "pointermove",
        event=>{

            const r =
                c.getBoundingClientRect();

            paddle =
                clamp(
                    (event.clientX-r.left)
                    *600/r.width-50,
                    0,
                    500
                );
        }
    );

    setKeys({

        arrowleft:()=>move(-30),
        a:()=>move(-30),

        arrowright:()=>move(30),
        d:()=>move(30)
    });

    button("◀",()=>move(-35));
    button("▶",()=>move(35));

    restartFunction=()=>{
        cleanup();
        breakoutGame();
    };

    build();
    draw();

    interval(step,16);
}

/* =========================================================
   4. DODGE
========================================================= */

function dodgeGame(){

    const c=canvas(420,600);
    const ctx=c.getContext("2d");

    let player=190;
    let obstacles=[];
    let points=0;
    let running=true;

    function draw(){

        ctx.fillStyle="#050505";

        ctx.fillRect(
            0,0,420,600
        );

        ctx.fillStyle="#fff";

        ctx.fillRect(
            player,
            540,
            40,
            40
        );

        ctx.fillStyle="#e84f4f";

        obstacles.forEach(o=>{

            ctx.fillRect(
                o.x,
                o.y,
                o.w,
                25
            );
        });

        score({
            Score:points
        });
    }

    function step(){

        if(!running){
            return;
        }

        if(Math.random()<.045){

            obstacles.push({
                x:random(0,360),
                y:-30,
                w:random(35,90)
            });
        }

        obstacles.forEach(o=>{
            o.y+=5;
        });

        for(const o of obstacles){

            if(
                o.y+25>540 &&
                o.y<580 &&
                player<o.x+o.w &&
                player+40>o.x
            ){

                running=false;

                result(
                    `💥 GAME OVER<br>Score: ${points}`
                );

                return;
            }
        }

        obstacles =
            obstacles.filter(
                o=>o.y<620
            );

        points++;

        draw();
    }

    function move(amount){

        player =
            clamp(
                player+amount,
                0,
                380
            );
    }

    setKeys({

        arrowleft:()=>move(-25),
        a:()=>move(-25),

        arrowright:()=>move(25),
        d:()=>move(25)
    });

    button("◀",()=>move(-30));
    button("▶",()=>move(30));

    restartFunction=()=>{
        cleanup();
        dodgeGame();
    };

    draw();

    interval(step,40);
}

/* =========================================================
   5. TARGET SHOOTER
========================================================= */

function targetGame(){

    const c=canvas(500,500);
    const ctx=c.getContext("2d");

    let targets=[];
    let points=0;
    let missed=0;
    let running=true;

    function spawn(){

        targets.push({

            x:random(40,460),
            y:random(50,450),

            radius:random(18,32)
        });
    }

    function draw(){

        ctx.fillStyle="#050505";

        ctx.fillRect(
            0,0,500,500
        );

        targets.forEach(t=>{

            ctx.strokeStyle="#fff";
            ctx.lineWidth=3;

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                t.radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                t.radius*.45,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.fillStyle="#fff";

            ctx.beginPath();

            ctx.arc(
                t.x,
                t.y,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        });

        score({
            Score:points,
            Missed:missed
        });
    }

    function shoot(event){

        if(!running){
            return;
        }

        const r =
            c.getBoundingClientRect();

        const x =
            (event.clientX-r.left)
            *500/r.width;

        const y =
            (event.clientY-r.top)
            *500/r.height;

        let hit=-1;

        for(let i=0;i<targets.length;i++){

            if(
                Math.hypot(
                    targets[i].x-x,
                    targets[i].y-y
                ) <= targets[i].radius
            ){

                hit=i;
                break;
            }
        }

        if(hit>=0){

            targets.splice(hit,1);

            points+=10;

            status("🎯 HIT!");

        }else{

            missed++;

            status("MISS!");
        }

        if(points>=100){

            running=false;

            result(
                `🏆 YOU WIN!<br>Score: ${points}`
            );
        }

        if(missed>=10){

            running=false;

            result(
                `🎯 GAME OVER<br>Score: ${points}`
            );
        }

        draw();
    }

    c.addEventListener(
        "pointerdown",
        shoot
    );

    button(
        "🎯 SHOOT",
        ()=>{
            status(
                "Tap a target!"
            );
        },
        "primary"
    );

    restartFunction=()=>{
        cleanup();
        targetGame();
    };

    for(let i=0;i<4;i++){
        spawn();
    }

    draw();

    interval(()=>{

        if(!running){
            return;
        }

        if(targets.length<6){
            spawn();
        }

        draw();

    },900);
}

/* =========================================================
   6. BASKETBALL
========================================================= */

function basketballGame(){

    const c=canvas(500,650);
    const ctx=c.getContext("2d");

    let ball={
        x:250,
        y:570,
        vx:0,
        vy:0
    };

    let hoopX=350;
    let shooting=false;

    let made=0;
    let shots=0;

    function resetBall(){

        ball={
            x:250,
            y:570,
            vx:0,
            vy:0
        };

        shooting=false;
    }

    function shoot(){

        if(shooting){
            return;
        }

        shots++;

        hoopX =
            random(100,390);

        ball.vx =
            (hoopX+32-ball.x)*.035;

        ball.vy=-11;

        shooting=true;
    }

    function draw(){

        ctx.fillStyle="#185a25";

        ctx.fillRect(
            0,0,500,650
        );

        ctx.fillStyle="#4b8b4b";

        ctx.fillRect(
            0,600,500,50
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=4;

        ctx.strokeRect(
            hoopX,
            120,
            65,
            6
        );

        ctx.beginPath();

        ctx.arc(
            hoopX+32,
            138,
            22,
            0,
            Math.PI
        );

        ctx.stroke();

        ctx.fillStyle="#f28b35";

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            14,
            0,
            Math.PI*2
        );

        ctx.fill();

        score({
            Made:made,
            Shots:shots
        });
    }

    function step(){

        if(!shooting){
            return;
        }

        ball.vy+=.35;

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        if(
            ball.y>120 &&
            ball.y<180 &&
            Math.abs(
                ball.x-(hoopX+32)
            )<20
        ){

            made++;

            status("🏀 BUCKET!");

            resetBall();

        }else if(ball.y>620){

            status("Miss!");

            resetBall();
        }

        draw();
    }

    button(
        "🏀 SHOOT",
        shoot,
        "primary"
    );

    restartFunction=()=>{
        cleanup();
        basketballGame();
    };

    draw();

    interval(step,25);
}

/* =========================================================
   7. TIC TAC TOE
========================================================= */

function ticTacToeGame(){

    const boardBox =
        document.createElement("div");

    boardBox.className =
        "grid ttt-grid";

    gameBox.appendChild(boardBox);

    let board =
        Array(9).fill("");

    let turn="X";
    let over=false;

    function winner(){

        const lines=[

            [0,1,2],
            [3,4,5],
            [6,7,8],

            [0,3,6],
            [1,4,7],
            [2,5,8],

            [0,4,8],
            [2,4,6]
        ];

        return lines.find(
            ([a,b,c]) =>
                board[a] &&
                board[a]===board[b] &&
                board[a]===board[c]
        );
    }

    function render(){

        boardBox.innerHTML="";

        board.forEach(
            (value,index)=>{

                const b =
                    document.createElement("button");

                b.className =
                    "ttt-cell";

                b.textContent=value;

                b.onclick=()=>{

                    if(
                        over ||
                        board[index]
                    ){
                        return;
                    }

                    board[index]=turn;

                    const win =
                        winner();

                    if(win){

                        over=true;

                        result(
                            `🏆 ${turn} WINS!`
                        );

                    }else if(
                        board.every(Boolean)
                    ){

                        over=true;

                        result(
                            "🤝 DRAW!"
                        );

                    }else{

                        turn =
                            turn==="X"
                            ? "O"
                            : "X";
                    }

                    status(
                        over
                        ? ""
                        : `Turn: ${turn}`
                    );

                    render();
                };

                boardBox.appendChild(b);
            }
        );
    }

    restartFunction=()=>{
        cleanup();
        ticTacToeGame();
    };

    status("Turn: X");

    render();
}

/* =========================================================
   8. CONNECT FOUR
========================================================= */

function connectFourGame(){

    const boardBox =
        document.createElement("div");

    boardBox.className =
        "grid c4-grid";

    gameBox.appendChild(boardBox);

    let board =
        Array.from(
            {length:6},
            ()=>Array(7).fill("")
        );

    let turn="🔴";
    let over=false;

    function check(r,c){

        const dirs=[
            [1,0],
            [0,1],
            [1,1],
            [1,-1]
        ];

        for(
            const [dr,dc]
            of dirs
        ){

            let count=1;

            for(
                const direction
                of [-1,1]
            ){

                let rr =
                    r+dr*direction;

                let cc =
                    c+dc*direction;

                while(
                    rr>=0 &&
                    rr<6 &&
                    cc>=0 &&
                    cc<7 &&
                    board[rr][cc]===turn
                ){

                    count++;

                    rr+=dr*direction;
                    cc+=dc*direction;
                }
            }

            if(count>=4){
                return true;
            }
        }

        return false;
    }

    function render(){

        boardBox.innerHTML="";

        for(let r=0;r<6;r++){

            for(let c=0;c<7;c++){

                const b =
                    document.createElement("button");

                b.className =
                    "c4-cell";

                b.textContent =
                    board[r][c] || "⚪";

                b.onclick=()=>{

                    if(over){
                        return;
                    }

                    for(
                        let rr=5;
                        rr>=0;
                        rr--
                    ){

                        if(
                            !board[rr][c]
                        ){

                            board[rr][c]=turn;

                            if(
                                check(rr,c)
                            ){

                                over=true;

                                result(
                                    `${turn} WINS!`
                                );

                            }else{

                                turn =
                                    turn==="🔴"
                                    ? "🟡"
                                    : "🔴";
                            }

                            render();

                            break;
                        }
                    }
                };

                boardBox.appendChild(b);
            }
        }

        status(
            over
            ? ""
            : `Turn: ${turn}`
        );
    }

    restartFunction=()=>{
        cleanup();
        connectFourGame();
    };

    render();
}

/* =========================================================
   9. MEMORY MATCH
========================================================= */

function memoryGame(){

    const grid =
        document.createElement("div");

    grid.className =
        "grid memory-grid";

    gameBox.appendChild(grid);

    const symbols=[
        "🍎","🍌","🍇","🍉",
        "🍒","🥝","🍋","🥭"
    ];

    const cards =
        [...symbols,...symbols]
        .sort(
            ()=>Math.random()-.5
        );

    let first=null;
    let locked=false;
    let matches=0;
    let moves=0;

    function render(){

        grid.innerHTML="";

        cards.forEach(
            (symbol,index)=>{

                const b =
                    document.createElement("button");

                b.className =
                    "memory-card";

                b.textContent =
                    cards[index].matched
                    ? symbol
                    : "❓";

                if(cards[index].matched){
                    b.disabled=true;
                }

                b.onclick=()=>{

                    if(
                        locked ||
                        cards[index].matched
                    ){
                        return;
                    }

                    b.textContent=symbol;

                    if(first===null){

                        first={
                            index,
                            button:b
                        };

                        return;
                    }

                    moves++;

                    if(
                        cards[first.index] ===
                        cards[index]
                    ){

                        cards[first.index]={
                            matched:true
                        };

                        cards[index]={
                            matched:true
                        };

                        matches++;

                        first=null;

                        if(
                            matches===symbols.length
                        ){

                            result(
                                `🧠 ALL MATCHED!<br>
                                 Moves: ${moves}`
                            );
                        }

                    }else{

                        locked=true;

                        const old=
                            first.button;

                        const current=b;

                        first=null;

                        timer(()=>{

                            old.textContent="❓";
                            current.textContent="❓";

                            locked=false;

                        },650);
                    }

                    score({
                        Matches:
                            `${matches}/${symbols.length}`,
                        Moves:moves
                    });

                    render();
                };

                grid.appendChild(b);
            }
        );
    }

    score({
        Matches:"0/8",
        Moves:0
    });

    restartFunction=()=>{
        cleanup();
        memoryGame();
    };

    render();
}

/* =========================================================
   10. 2048
========================================================= */

function game2048(){

    const boardBox =
        document.createElement("div");

    boardBox.style.width="100%";
    boardBox.style.maxWidth="430px";
    boardBox.style.margin="auto";

    gameBox.appendChild(boardBox);

    let board =
        Array.from(
            {length:4},
            ()=>Array(4).fill(0)
        );

    let points=0;

    function empty(){

        const result=[];

        for(let y=0;y<4;y++){

            for(let x=0;x<4;x++){

                if(!board[y][x]){
                    result.push({x,y});
                }
            }
        }

        return result;
    }

    function addTile(){

        const spots=empty();

        if(!spots.length){
            return;
        }

        const p=
            randomItem(spots);

        board[p.y][p.x] =
            Math.random()<.9
            ? 2
            : 4;
    }

    function render(){

        boardBox.innerHTML="";

        const grid =
            document.createElement("div");

        grid.style.display="grid";
        grid.style.gridTemplateColumns=
            "repeat(4,1fr)";
        grid.style.gap="7px";
        grid.style.background="#333";
        grid.style.padding="7px";
        grid.style.borderRadius="14px";

        for(let y=0;y<4;y++){

            for(let x=0;x<4;x++){

                const cell =
                    document.createElement("div");

                cell.style.aspectRatio="1";
                cell.style.display="flex";
                cell.style.alignItems="center";
                cell.style.justifyContent="center";
                cell.style.background=
                    board[y][x]
                    ? "#555"
                    : "#191919";
                cell.style.borderRadius="8px";
                cell.style.fontSize=
                    "clamp(22px,8vw,36px)";
                cell.style.fontWeight="900";

                cell.textContent=
                    board[y][x] || "";

                grid.appendChild(cell);
            }
        }

        boardBox.appendChild(grid);

        score({
            Score:points
        });
    }

    function move(direction){

        let changed=false;

        for(let i=0;i<4;i++){

            let line=[];

            for(let j=0;j<4;j++){

                const y =
                    direction==="up" ||
                    direction==="down"
                    ? j
                    : i;

                const x =
                    direction==="left" ||
                    direction==="right"
                    ? j
                    : i;

                line.push(
                    board[y][x]
                );
            }

            if(
                direction==="right" ||
                direction==="down"
            ){
                line.reverse();
            }

            line=line.filter(Boolean);

            for(
                let j=0;
                j<line.length-1;
                j++
            ){

                if(
                    line[j]===line[j+1]
                ){

                    line[j]*=2;

                    points+=line[j];

                    line[j+1]=0;
                }
            }

            line=line.filter(Boolean);

            while(line.length<4){
                line.push(0);
            }

            if(
                direction==="right" ||
                direction==="down"
            ){
                line.reverse();
            }

            for(let j=0;j<4;j++){

                const y =
                    direction==="up" ||
                    direction==="down"
                    ? j
                    : i;

                const x =
                    direction==="left" ||
                    direction==="right"
                    ? j
                    : i;

                if(
                    board[y][x]!==line[j]
                ){
                    changed=true;
                }

                board[y][x]=line[j];
            }
        }

        if(changed){
            addTile();
        }

        render();

        if(
            empty().length===0 &&
            !canMove()
        ){

            result(
                `🔢 GAME OVER<br>Score: ${points}`
            );
        }
    }

    function canMove(){

        for(let y=0;y<4;y++){

            for(let x=0;x<4;x++){

                if(!board[y][x]){
                    return true;
                }

                if(
                    x<3 &&
                    board[y][x]===
                    board[y][x+1]
                ){
                    return true;
                }

                if(
                    y<3 &&
                    board[y][x]===
                    board[y+1][x]
                ){
                    return true;
                }
            }
        }

        return false;
    }

    setKeys({

        arrowup:()=>move("up"),
        w:()=>move("up"),

        arrowdown:()=>move("down"),
        s:()=>move("down"),

        arrowleft:()=>move("left"),
        a:()=>move("left"),

        arrowright:()=>move("right"),
        d:()=>move("right")
    });

    button("▲",()=>move("up"));
    button("◀",()=>move("left"));
    button("▶",()=>move("right"));
    button("▼",()=>move("down"));

    restartFunction=()=>{
        cleanup();
        game2048();
    };

    addTile();
    addTile();

    render();
}

/* =========================================================
   11. REACTION TEST
========================================================= */

function reactionGame(){

    const box =
        document.createElement("div");

    box.style.width="100%";
    box.style.maxWidth="500px";
    box.style.margin="auto";
    box.style.textAlign="center";

    gameBox.appendChild(box);

    let startTime=0;
    let waiting=false;
    let ready=false;
    let best=null;

    function draw(){

        box.innerHTML="";

        const big =
            document.createElement("button");

        big.style.width="100%";
        big.style.minHeight="260px";
        big.style.fontSize="32px";

        if(waiting){

            big.textContent=
                "WAIT...";

        }else if(ready){

            big.textContent=
                "🟢 TAP NOW!";

            big.className="primary";

        }else{

            big.textContent=
                "⚡ START";

            big.className="primary";
        }

        big.onclick=()=>{

            if(ready){

                const reaction =
                    Date.now()-startTime;

                if(
                    best===null ||
                    reaction<best
                ){
                    best=reaction;
                }

                status(
                    `Reaction: ${reaction} ms`
                );

                score({
                    Best:
                        best
                        ? `${best} ms`
                        : "-"
                });

                ready=false;

                draw();

            }else if(!waiting){

                waiting=true;

                draw();

                timer(()=>{

                    ready=true;
                    waiting=false;
                    startTime=Date.now();

                    draw();

                },random(1500,4000));
            }
        };

        box.appendChild(big);
    }

    restartFunction=()=>{
        cleanup();
        reactionGame();
    };

    score({
        Best:"-"
    });

    draw();
}

/* =========================================================
   12. WHACK-A-MOLE
========================================================= */

function whackGame(){

    const grid =
        document.createElement("div");

    grid.className="choice-grid";

    gameBox.appendChild(grid);

    let mole=-1;
    let points=0;
    let misses=0;
    let running=true;

    function render(){

        grid.innerHTML="";

        for(let i=0;i<9;i++){

            const b =
                document.createElement("button");

            b.style.height="85px";

            b.textContent =
                i===mole
                ? "🐹"
                : "🕳️";

            b.onclick=()=>{

                if(!running){
                    return;
                }

                if(i===mole){

                    points+=10;

                    status("💥 WHACK!");

                    mole=-1;

                }else{

                    misses++;

                    status("MISS!");
                }

                if(points>=100){

                    running=false;

                    result(
                        "🏆 YOU WIN!"
                    );
                }

                if(misses>=10){

                    running=false;

                    result(
                        `GAME OVER<br>Score: ${points}`
                    );
                }

                score({
                    Score:points,
                    Misses:misses
                });

                render();
            };

            grid.appendChild(b);
        }
    }

    restartFunction=()=>{
        cleanup();
        whackGame();
    };

    score({
        Score:0,
        Misses:0
    });

    render();

    interval(()=>{

        if(!running){
            return;
        }

        mole=random(0,8);

        render();

    },750);
}

function startGame(){

    cleanup();

    const loader =
        PLAYABLE_GAMES[GAME_ID];

    if(!loader){

        status(
            "This game is not available."
        );

        result(`
            <div class="message">

                📱 This game isn't included
                in the PC/mobile game collection.

                <br><br>

                <a
                    href="{{ url_for('real_games.real_games_home') }}"
                    style="
                        display:inline-block;
                        padding:13px 18px;
                        background:#fff;
                        color:#000;
                        border-radius:12px;
                        text-decoration:none;
                        font-weight:900;
                    "
                >
                    ← Back to Games
                </a>

            </div>
        `);

        return;
    }

    try{

        loader();

    }catch(error){

        console.error(
            "GAME ERROR:",
            error
        );

        cleanup();

        status(
            "Game failed to start."
        );

        result(`
            ⚠️ Game could not start.

            <br><br>

            <small>
                ${error.message || "Unknown error"}
            </small>

            <br><br>

            <button
                class="primary"
                onclick="startGame()"
            >
                🔄 Try Again
            </button>
        `);
    }
}
