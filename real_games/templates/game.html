function snake(){canvasGame('🐍 Snake','Use arrows/WASD or the touch buttons below.',(c,x)=>{let s=[{x:10,y:10},{x:9,y:10}],d={x:1,y:0},food={x:15,y:10},score=0,dead=false;ui(`<div class="panel"><div class="title">🐍 Snake</div><div class="score">Score: <b id="sc">0</b></div><canvas class="canvas" id="c" width="400" height="400"></canvas><div class="controls"><button id="u">⬆️</button><button id="l">⬅️</button><button id="dn">⬇️</button><button id="r">➡️</button></div><div class="controls"><button id="restart">Restart</button></div></div>`);c=$('#c');x=c.getContext('2d');function turn(a,b){if(a!==-d.x||b!==-d.y)d={x:a,y:b}}function key(e){let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0)}document.addEventListener('keydown',key);['u','l','dn','r'].forEach((id,i)=>$('#'+id).onclick=()=>turn([[0,-1],[-1,0],[0,1],[1,0]][i][0],[[0,-1],[-1,0],[0,1],[1,0]][i][1]));function loop(){if(dead)return;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||s.some(q=>q.x===h.x&&q.y===h.y)){dead=true;$('#sc').textContent=score+' — Game Over';return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;$('#sc').textContent=score;do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(s.some(q=>q.x===food.x&&q.y===food.y))}else s.pop();x.fillStyle='#050505';x.fillRect(0,0,400,400);x.fillStyle='#e33';x.fillRect(food.x*20,food.y*20,18,18);x.fillStyle='#39d98a';s.forEach(q=>x.fillRect(q.x*20,q.y*20,18,18))}I(loop,110);cleanup=()=>document.removeEventListener('keydown',key);$('#restart').onclick=()=>{clearGame();snake()}})}
function pong(){canvasGame('🏓 Pong','Move with your finger/mouse or arrow keys.',(c,x)=>{let py=185,cy=185,b={x:350,y:225,vx:5,vy:3},ps=0,cs=0;function move(y){let r=c.getBoundingClientRect();py=Math.max(0,Math.min(370,(y-r.top)/r.height*450-40))}c.onpointermove=e=>move(e.clientY);c.onpointerdown=e=>move(e.clientY);function key(e){if(e.key==='ArrowUp')py-=25;if(e.key==='ArrowDown')py+=25;py=Math.max(0,Math.min(370,py))}document.addEventListener('keydown',key);function loop(){x.fillStyle='#050505';x.fillRect(0,0,700,450);cy+=(b.y-40-cy)*.04;b.x+=b.vx;b.y+=b.vy;if(b.y<8||b.y>442)b.vy*=-1;if(b.x<42&&b.y>py&&b.y<py+80)b.vx=Math.abs(b.vx);if(b.x>658&&b.y>cy&&b.y<cy+80)b.vx=-Math.abs(b.vx);if(b.x<0){cs++;b={x:350,y:225,vx:5,vy:3}}if(b.x>700){ps++;b={x:350,y:225,vx:-5,vy:3}}x.fillStyle='#fff';x.fillRect(20,py,12,80);x.fillRect(668,cy,12,80);x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function breakout(){canvasGame('🧱 Breakout','Move the paddle with your finger/mouse.',(c,x)=>{let px=290,b={x:350,y:390,vx:4,vy:-4},br=[];for(let r=0;r<5;r++)for(let q=0;q<10;q++)br.push({x:10+q*68,y:35+r*24,on:1});c.onpointermove=e=>{let z=c.getBoundingClientRect();px=(e.clientX-z.left)/z.width*700-60;px=Math.max(0,Math.min(580,px))};function key(e){if(e.key==='ArrowLeft')px-=30;if(e.key==='ArrowRight')px+=30}document.addEventListener('keydown',key);function loop(){x.fillStyle='#050505';x.fillRect(0,0,700,450);b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>692)b.vx*=-1;if(b.y<8)b.vy*=-1;if(b.y>420){if(b.x>px&&b.x<px+120)b.vy=-Math.abs(b.vy);else{b={x:350,y:390,vx:4,vy:-4};br.forEach(q=>q.on=1)}}br.forEach(q=>{if(q.on&&b.x>q.x&&b.x<q.x+62&&b.y>q.y&&b.y<q.y+18){q.on=0;b.vy*=-1}});x.fillStyle='#fff';x.fillRect(px,420,120,12);br.forEach(q=>{if(q.on)x.fillRect(q.x,q.y,62,18)});x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function tetris(){canvasGame('🧩 Tetris','Arrow keys move/rotate. Down drops. Space rotates.',(c,x)=>{let W=10,H=20,g=Array.from({length:H},()=>Array(W).fill(0)),p={x:4,y:0,s:[[1,1],[1,1]]},score=0;function draw(){x.fillStyle='#050505';x.fillRect(0,0,400,400);let a=g.map(r=>r.slice());p.s.forEach((r,i)=>r.forEach((v,j)=>{if(v&&p.y+i>=0)a[p.y+i][p.x+j]=1}));a.forEach((r,i)=>r.forEach((v,j)=>{if(v){x.fillStyle='#7c3aed';x.fillRect(j*20,i*20,19,19)}}));}function spawn(){p={x:4,y:0,s:[[1,1,1],[0,1,0]]};if(p.y<0){} }function hit(nx,ny,shape=p.s){return shape.some((r,i)=>r.some((v,j)=>v&&(nx+j<0||nx+j>=W||ny+i>=H||(ny+i>=0&&g[ny+i][nx+j]))))}function rot(){let s=p.s.map((r,i)=>r.map((_,j)=>p.s[p.s.length-1-j][i]));if(!hit(p.x,p.y,s))p.s=s}function step(){if(!hit(p.x,p.y+1)){p.y++;return}p.s.forEach((r,i)=>r.forEach((v,j)=>{if(v&&p.y+i>=0)g[p.y+i][p.x+j]=1}));g=g.filter(r=>r.some(v=>!v));while(g.length<H)g.unshift(Array(W).fill(0));spawn();score++;draw()}function key(e){if(e.key==='ArrowLeft'&&!hit(p.x-1,p.y))p.x--;if(e.key==='ArrowRight'&&!hit(p.x+1,p.y))p.x++;if(e.key==='ArrowDown')step();if(e.key==='ArrowUp'||e.code==='Space')rot();draw()}document.addEventListener('keydown',key);spawn();draw();I(step,550);cleanup=()=>document.removeEventListener('keydown',key)})}
function flappy(){canvasGame('🐦 Flappy','Tap/click to flap. Avoid the pipes.',(c,x)=>{let y=220,v=0,px=680,gap=170,top=100,score=0;function flap(){v=-7}c.onpointerdown=flap;function loop(){v+=.35;y+=v;px-=3;if(px<-80){px=680;top=50+Math.random()*220;score++}x.fillStyle='#091b25';x.fillRect(0,0,700,450);x.fillStyle='#fff';x.beginPath();x.arc(120,y,15,0,7);x.fill();x.fillStyle='#39d98a';x.fillRect(px,0,70,top);x.fillRect(px,top+gap,70,450);if(y<0||y>450||(120+15>px&&120-15<px+70&&(y-15<top||y+15>top+gap))){y=220;v=0;score=0}x.fillStyle='#fff';x.font='24px Arial';x.fillText('Score '+score,20,35);F(loop)}loop()})}
function spaceInvaders(){canvasGame('👾 Space Invaders','Move and tap/click to shoot.',(c,x)=>{let px=330,shots=[],en=[];for(let r=0;r<3;r++)for(let q=0;q<8;q++)en.push({x:80+q*70,y:60+r*45,on:1});c.onpointermove=e=>{let z=c.getBoundingClientRect();px=(e.clientX-z.left)/z.width*700};c.onpointerdown=()=>shots.push({x:px,y:420});function key(e){if(e.key==='ArrowLeft')px-=25;if(e.key==='ArrowRight')px+=25;if(e.code==='Space')shots.push({x:px,y:420})}document.addEventListener('keydown',key);function loop(){x.fillStyle='#050505';x.fillRect(0,0,700,450);shots.forEach(s=>s.y-=7);en.forEach(e=>{if(e.on)e.x+=Math.sin(Date.now()/700)*.5});shots.forEach(s=>en.forEach(e=>{if(e.on&&Math.abs(s.x-e.x)<28&&Math.abs(s.y-e.y)<20)e.on=0}));x.fillStyle='#39d98a';x.fillRect(px-25,420,50,15);x.fillStyle='#e33';shots.forEach(s=>x.fillRect(s.x-2,s.y,4,12));x.fillStyle='#7c3aed';en.forEach(e=>{if(e.on){x.fillRect(e.x-20,e.y-12,40,24)}});F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function asteroids(){canvasGame('☄️ Asteroids','Move with arrows, shoot with Space/tap.',(c,x)=>{let ship={x:350,y:225,a:0,vx:0,vy:0},shots=[],rocks=[];for(let i=0;i<8;i++)rocks.push({x:Math.random()*700,y:Math.random()*450,vx:Math.random()*2-1,vy:Math.random()*2-1,r:22});function fire(){shots.push({x:ship.x,y:ship.y,vx:Math.cos(ship.a)*7,vy:Math.sin(ship.a)*7})}function key(e){if(e.key==='ArrowLeft')ship.a-=.15;if(e.key==='ArrowRight')ship.a+=.15;if(e.key==='ArrowUp'){ship.vx+=Math.cos(ship.a)*.2;ship.vy+=Math.sin(ship.a)*.2}if(e.code==='Space')fire()}document.addEventListener('keydown',key);c.onpointerdown=fire;function loop(){ship.x=(ship.x+ship.vx+700)%700;ship.y=(ship.y+ship.vy+450)%450;shots.forEach(s=>{s.x=(s.x+s.vx+700)%700;s.y=(s.y+s.vy+450)%450});rocks.forEach(r=>{r.x=(r.x+r.vx+700)%700;r.y=(r.y+r.vy+450)%450});shots.forEach(s=>rocks.forEach(r=>{if(Math.hypot(s.x-r.x,s.y-r.y)<r.r)r.x=-999}));x.fillStyle='#050505';x.fillRect(0,0,700,450);x.fillStyle='#fff';x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.beginPath();x.moveTo(18,0);x.lineTo(-14,-11);x.lineTo(-9,0);x.lineTo(-14,11);x.closePath();x.fill();x.restore();rocks.forEach(r=>{if(r.x>-500){x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()}});shots.forEach(s=>{x.fillRect(s.x,s.y,4,4)});F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function pacman(){canvasGame('🟡 Pac-Man','Use arrow keys. Eat dots and avoid ghosts.',(c,x)=>{let p={x:60,y:60},d={x:0,y:0},dots=[];for(let i=0;i<14;i++)for(let j=0;j<9;j++)dots.push({x:30+i*45,y:30+j*45,on:1});function key(e){if(e.key==='ArrowUp')d={x:0,y:-3};if(e.key==='ArrowDown')d={x:0,y:3};if(e.key==='ArrowLeft')d={x:-3,y:0};if(e.key==='ArrowRight')d={x:3,y:0}}document.addEventListener('keydown',key);function loop(){p.x=(p.x+d.x+700)%700;p.y=(p.y+d.y+450)%450;dots.forEach(q=>{if(q.on&&Math.hypot(p.x-q.x,p.y-q.y)<15)q.on=0});x.fillStyle='#050505';x.fillRect(0,0,700,450);x.fillStyle='#222';for(let i=0;i<13;i++)x.fillRect(15+i*52,15,30,420);x.fillStyle='#ffd21f';x.beginPath();x.arc(p.x,p.y,14,0,7);x.fill();x.fillStyle='#fff';dots.forEach(q=>{if(q.on){x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}});F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function game2048(){ui(`<div class="panel"><div class="title">🔢 2048</div><div class="score">Score: <b id="score">0</b></div><div id="g" class="grid grid4"></div><div class="controls"><button id="restart">Restart</button></div><div class="help">Swipe or use arrow keys.</div></div>`);let a=Array(16).fill(0),score=0;function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}function draw(){g.innerHTML=a.map(v=>`<div class="cell">${v||''}</div>`).join('');$('#score').textContent=score}function move(dir){let rows=[];for(let r=0;r<4;r++){let row=a.slice(r*4,r*4+4);if(dir==='R'||dir==='D')row.reverse();row=row.filter(Boolean);for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;score+=row[i];row.splice(i+1,1)}while(row.length<4)row.push(0);if(dir==='R'||dir==='D')row.reverse();rows.push(row)}if(dir==='L'||dir==='R'){a=rows.flat()}else{a=Array(16).fill(0);for(let r=0;r<4;r++)for(let q=0;q<4;q++)a[q*4+r]=rows[r][q]}}function key(e){let k=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k))return;e.preventDefault();move({ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k]);add();draw()}document.addEventListener('keydown',key);add();add();draw();$('#restart').onclick=()=>{clearGame();game2048()};cleanup=()=>document.removeEventListener('keydown',key)}
function memory(){ui(`<div class="panel"><div class="title">🧠 Memory Match</div><div id="mg" class="grid grid4"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let vals=['🍎','🍎','🍋','🍋','🍒','🍒','⭐','⭐','🐶','🐶','🐱','🐱','🚗','🚗','⚽','⚽'].sort(()=>Math.random()-.5),open=[],done=[];function draw(){mg.innerHTML=vals.map((v,i)=>`<button class="cell ${open.includes(i)||done.includes(i)?'on':''}" data-i="${i}">${open.includes(i)||done.includes(i)?v:'?'}</button>`).join('');mg.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(+b.dataset.i))}function pick(i){if(open.includes(i)||done.includes(i)||open.length===2)return;open.push(i);draw();if(open.length===2){if(vals[open[0]]===vals[open[1]])done.push(...open);T(()=>{open=[];draw()},500)}}draw();$('#restart').onclick=()=>{clearGame();memory()}}

function ttt(){ui(`<div class="panel"><div class="title">⭕ Tic-Tac-Toe</div><div class="message" id="m">X goes first</div><div class="ttt" id="b"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let b=Array(9).fill(''),turn='X';function draw(){b.forEach((v,i)=>b[i]=v);$('#b').innerHTML=b.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('');$('#b').querySelectorAll('button').forEach(q=>q.onclick=()=>play(+q.dataset.i));}function win(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].find(z=>b[z[0]]&&b[z[0]]===b[z[1]]&&b[z[1]]===b[z[2]])}function play(i){if(b[i]||win())return;b[i]=turn;let w=win();if(w)$('#m').textContent=turn+' wins!';else if(b.every(Boolean))$('#m').textContent='Draw!';else{turn=turn==='X'?'O':'X';$('#m').textContent=turn+' turn'}draw()}draw();$('#restart').onclick=()=>{clearGame();ttt()}}
function connect(){ui(`<div class="panel"><div class="title">🔴 Connect Four</div><div class="message" id="m">Red starts</div><div class="connect" id="b"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let a=Array.from({length:6},()=>Array(7).fill('')),t='R';function draw(){b.innerHTML=a.flat().map((v,i)=>`<button class="disc" data-i="${i}" style="background:${v==='R'?'#e33':v==='Y'?'#ffd21f':'#080808'}"></button>`).join('');b.querySelectorAll('button').forEach(q=>q.onclick=()=>drop(+q.dataset.i%7))}function drop(c){for(let r=5;r>=0;r--)if(!a[r][c]){a[r][c]=t;let w=check(r,c);if(w)$('#m').textContent=(t==='R'?'Red':'Yellow')+' wins!';else{t=t==='R'?'Y':'R';$('#m').textContent=(t==='R'?'Red':'Yellow')+' turn'}draw();return}}function check(r,c){let z=a[r][c],dirs=[[1,0],[0,1],[1,1],[1,-1]];return dirs.some(([dr,dc])=>{let n=1;for(let q=1;q<4;q++)if(a[r+dr*q]?.[c+dc*q]===z)n++;else break;for(let q=1;q<4;q++)if(a[r-dr*q]?.[c-dc*q]===z)n++;else break;return n>=4})}draw();$('#restart').onclick=()=>{clearGame();connect()}}
function checkers(){ui(`<div class="panel"><div class="title">🔴 Checkers</div><div class="message" id="m">Red: select a piece, then a square</div><div class="board" id="b"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let a=Array.from({length:8},()=>Array(8).fill('')),sel=null,t='r';for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r][c]='b';for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r][c]='r';function draw(){b.innerHTML=a.flat().map((v,i)=>`<div class="sq ${(Math.floor(i/8)+i)%2?'dark':'light'} ${sel===i?'selected':''}" data-i="${i}">${v==='r'?'🔴':v==='b'?'⚫':''}</div>`).join('');b.querySelectorAll('.sq').forEach(q=>q.onclick=()=>click(+q.dataset.i))}function click(i){let r=Math.floor(i/8),c=i%8;if(sel===null){if(a[r][c]===t)sel=i}else{let sr=Math.floor(sel/8),sc=sel%8;if(!a[r][c]&&Math.abs(r-sr)===1&&Math.abs(c-sc)===1){a[r][c]=a[sr][sc];a[sr][sc]='';t=t==='r'?'b':'r';$('#m').textContent=(t==='r'?'Red':'Black')+': select a piece, then a square'}sel=null}draw()}draw();$('#restart').onclick=()=>{clearGame();checkers()}}
function chess(){ui(`<div class="panel"><div class="title">♟️ Chess</div><div class="message">Local two-player board. Tap a piece, then a square.</div><div class="board" id="b"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let pieces=['♜♞♝♛♚♝♞♜','♟♟♟♟♟♟♟♟','','','','','♙♙♙♙♙♙♙♙','♖♘♗♕♔♗♘♖'.split('')],a=Array.from({length:8},()=>Array(8).fill('')),sel=null;pieces.forEach((row,r)=>{if(typeof row==='string')row=row.split('');row.forEach((v,c)=>a[r][c]=v||'')});function draw(){b.innerHTML=a.flat().map((v,i)=>`<div class="sq ${(Math.floor(i/8)+i)%2?'dark':'light'} ${sel===i?'selected':''}" data-i="${i}">${v}</div>`).join('');b.querySelectorAll('.sq').forEach(q=>q.onclick=()=>click(+q.dataset.i))}function click(i){if(sel===null&&a[Math.floor(i/8)][i%8])sel=i;else if(sel!==null){let sr=Math.floor(sel/8),sc=sel%8,r=Math.floor(i/8),c=i%8;a[r][c]=a[sr][sc];a[sr][sc]='';sel=null}draw()}draw();$('#restart').onclick=()=>{clearGame();chess()}}
function monopoly(){ui(`<div class="panel"><div class="title">🎩 Monopoly</div><div class="score">Position: <b id="p">GO</b> · Cash: $<b id="cash">1500</b></div><div class="card"><div class="dice" id="d">🎲</div><p id="m">Roll the dice.</p><button id="roll" class="bigbtn">ROLL</button></div><div class="controls"><button id="restart">Restart</button></div></div>`);let pos=0,cash=1500,names=['GO','Mediterranean','Baltic','Reading Railroad','Oriental','Vermont','Jail','St. James','Tennessee','New York','Free Parking','Kentucky','Indiana','Illinois','B&O Railroad','Atlantic','Ventnor','Water Works','Marvin Gardens','Go To Jail'];$('#roll').onclick=()=>{let d=Math.ceil(Math.random()*6)+Math.ceil(Math.random()*6);pos=(pos+d)%names.length;if(pos===0)cash+=200;if([2,5,8,11,15,18].includes(pos))cash-=100;$('#p').textContent=names[pos];$('#cash').textContent=cash;$('#d').textContent='🎲 '+d;$('#m').textContent='You moved '+d+' spaces.'};$('#restart').onclick=()=>{clearGame();monopoly()}}
function battleship(){ui(`<div class="panel"><div class="title">🚢 Battleship</div><div class="message" id="m">Find 5 hidden ships in 20 shots.</div><div id="g" class="grid grid4"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let ships=new Set();while(ships.size<5)ships.add(Math.floor(Math.random()*16));let shots=0,hits=0;g.innerHTML=Array.from({length:16},(_,i)=>`<button class="cell" data-i="${i}">🌊</button>`).join('');g.querySelectorAll('button').forEach(q=>q.onclick=()=>{let i=+q.dataset.i;if(q.disabled)return;q.disabled=true;shots++;if(ships.has(i)){hits++;q.textContent='💥';q.classList.add('on')}else q.textContent='❌';m.textContent=hits===5?'You sank the fleet!':`${hits}/5 ships found · ${20-shots} shots left`;if(shots>=20&&hits<5)m.textContent='Game over — restart to play again.'});$('#restart').onclick=()=>{clearGame();battleship()}}
function yahtzee(){ui(`<div class="panel"><div class="title">🎲 Yahtzee</div><div class="dice" id="d">⚀ ⚀ ⚀ ⚀ ⚀</div><div class="score">Score: <b id="s">0</b></div><div class="controls"><button id="roll" class="bigbtn">ROLL</button><button id="restart">Restart</button></div></div>`);let score=0,rolls=0;$('#roll').onclick=()=>{let d=Array.from({length:5},()=>1+Math.floor(Math.random()*6));$('#d').textContent=d.map(v=>['','⚀','⚁','⚂','⚃','⚄','⚅'][v]).join(' ');rolls++;let cnt={};d.forEach(v=>cnt[v]=(cnt[v]||0)+1);if(Object.values(cnt).includes(5))score+=50;else score+=d.reduce((a,b)=>a+b,0);$('#s').textContent=score;if(rolls>=10)$('#roll').disabled=true};$('#restart').onclick=()=>{clearGame();yahtzee()}}
function ludo(){ui(`<div class="panel"><div class="title">🟢 Ludo</div><div class="message" id="m">Race 4 tokens to the finish.</div><div class="card"><div>Token positions: <b id="p">0, 0, 0, 0</b></div><div class="dice" id="d">🎲</div><button id="roll" class="bigbtn">ROLL</button></div><div class="controls"><button id="restart">Restart</button></div></div>`);let p=[0,0,0,0];$('#roll').onclick=()=>{let d=1+Math.floor(Math.random()*6),i=Math.floor(Math.random()*4);p[i]=Math.min(50,p[i]+d);$('#d').textContent='🎲 '+d;$('#p').textContent=p.join(', ');if(p.every(x=>x>=50))$('#m').textContent='🏆 You won!'};$('#restart').onclick=()=>{clearGame();ludo()}}

/* ---------- SPORTS ---------- */
function basketball(){ui(`<div class="panel"><div class="title">🏀 Basketball</div><div class="message" id="m">Tap the ball when it reaches the hoop.</div><div class="playfield" id="f"><div id="ball" style="position:absolute;left:30px;bottom:30px;font-size:55px">🏀</div><div style="position:absolute;right:70px;top:80px;font-size:90px">🏀</div></div><div class="score">Score: <b id="s">0</b></div><div class="controls"><button id="shoot" class="bigbtn">SHOOT</button><button id="restart">Restart</button></div></div>`);let score=0,x=30,dir=1;I(()=>{x+=dir*4;if(x>560||x<20)dir*=-1;$('#ball').style.left=x+'px'},30);$('#shoot').onclick=()=>{if(x>470){score++;$('#s').textContent=score;$('#m').textContent='🏀 Swish!'}else $('#m').textContent='Miss! Wait for the ball.'};$('#restart').onclick=()=>{clearGame();basketball()}}
function football(){ui(`<div class="panel"><div class="title">🏈 Football</div><div class="message" id="m">Tap PASS when the receiver is open.</div><div class="playfield" id="f"><div id="q" style="position:absolute;left:20px;top:200px;font-size:50px">🏈</div><div id="r" style="position:absolute;left:520px;top:80px;font-size:45px">🏃</div></div><div class="score">TDs: <b id="s">0</b></div><div class="controls"><button id="pass" class="bigbtn">PASS</button><button id="restart">Restart</button></div></div>`);let score=0,y=80,dir=1;I(()=>{y+=dir*3;if(y>330||y<30)dir*=-1;$('#r').style.top=y+'px'},30);$('#pass').onclick=()=>{if(y>160&&y<260){score++;s.textContent=score;m.textContent='🏈 TOUCHDOWN!'}else m.textContent='Incomplete pass.'};$('#restart').onclick=()=>{clearGame();football()}}
function soccer(){ui(`<div class="panel"><div class="title">⚽ Soccer</div><div class="message" id="m">Tap SHOOT when the moving target crosses the goal.</div><div class="playfield"><div id="goal" style="position:absolute;right:20px;top:100px;width:110px;height:250px;border:8px solid #fff"></div><div id="ball" style="position:absolute;left:40px;top:200px;font-size:45px">⚽</div><div id="keeper" style="position:absolute;right:75px;top:160px;font-size:45px">🧍</div></div><div class="score">Goals: <b id="s">0</b></div><div class="controls"><button id="shoot" class="bigbtn">SHOOT</button><button id="restart">Restart</button></div></div>`);let score=0,y=160,dir=1;I(()=>{y+=dir*4;if(y>330||y<60)dir*=-1;keeper.style.top=y+'px'},30);$('#shoot').onclick=()=>{if(y<140||y>290){score++;s.textContent=score;m.textContent='⚽ GOAL!'}else m.textContent='Saved!'};$('#restart').onclick=()=>{clearGame();soccer()}}
function bowling(){ui(`<div class="panel"><div class="title">🎳 Bowling</div><div class="message" id="m">Tap ROLL and try to knock down 10 pins.</div><div class="playfield"><div style="text-align:center;font-size:90px;padding-top:40px">🎳</div><div id="pins" style="text-align:center;font-size:50px">🎳 🎳 🎳 🎳 🎳</div></div><div class="score">Score: <b id="s">0</b></div><div class="controls"><button id="roll" class="bigbtn">ROLL</button><button id="restart">Restart</button></div></div>`);let score=0;$('#roll').onclick=()=>{let n=Math.floor(Math.random()*11);score+=n;s.textContent=score;m.textContent=n===10?'🎳 STRIKE!':`${n} pins down.`};$('#restart').onclick=()=>{clearGame();bowling()}}
function cricket(){ui(`<div class="panel"><div class="title">🏏 Cricket</div><div class="message" id="m">Tap HIT as the ball approaches.</div><div class="playfield"><div id="ball" style="position:absolute;left:30px;top:200px;font-size:35px">🔴</div><div style="position:absolute;right:50px;top:180px;font-size:70px">🏏</div></div><div class="score">Runs: <b id="s">0</b></div><div class="controls"><button id="hit" class="bigbtn">HIT</button><button id="restart">Restart</button></div></div>`);let x=30,dir=1,runs=0;I(()=>{x+=dir*6;if(x>570||x<20)dir*=-1;ball.style.left=x+'px'},30);$('#hit').onclick=()=>{if(x>500){let n=1+Math.floor(Math.random()*6);runs+=n;s.textContent=runs;m.textContent=`🏏 ${n} runs!`}else m.textContent='Miss!'};$('#restart').onclick=()=>{clearGame();cricket()}}

/* ---------- SHOOTING ---------- */
function targetShooter(){ui(`<div class="panel"><div class="title">🎯 Target Shooter</div><div class="score">Hits: <b id="s">0</b></div><div class="playfield" id="f"></div><div class="controls"><button id="restart">Restart</button></div></div>`);let score=0;function spawn(){let z=document.createElement('button');z.className='target';z.style.left=Math.random()*85+'%';z.style.top=Math.random()*80+'%';z.onclick=()=>{score++;s.textContent=score;z.remove();spawn()};f.appendChild(z)}spawn();$('#restart').onclick=()=>{clearGame();targetShooter()}}
function alienBlaster(){canvasGame('👽 Alien Blaster','Move and shoot aliens.',(c,x)=>{let px=350,shots=[],en=[];for(let i=0;i<10;i++)en.push({x:50+i*65,y:60,on:1});c.onpointermove=e=>{let z=c.getBoundingClientRect();px=(e.clientX-z.left)/z.width*700};c.onpointerdown=()=>shots.push({x:px,y:420});function loop(){shots.forEach(q=>q.y-=8);en.forEach(q=>{if(q.on&&shots.some(s=>Math.abs(s.x-q.x)<25&&Math.abs(s.y-q.y)<20))q.on=0});x.fillStyle='#050505';x.fillRect(0,0,700,450);x.fillStyle='#39d98a';x.fillRect(px-25,420,50,14);x.fillStyle='#e33';en.forEach(q=>{if(q.on)x.fillRect(q.x-18,q.y-12,36,24)});x.fillStyle='#fff';shots.forEach(q=>x.fillRect(q.x,q.y,4,12));F(loop)}loop()})}
function spaceFighter(){canvasGame('🚀 Space Fighter','Move with arrows and shoot incoming enemies.',(c,x)=>{let px=350,shots=[],en=[];function fire(){shots.push({x:px,y:420})}function key(e){if(e.key==='ArrowLeft')px-=25;if(e.key==='ArrowRight')px+=25;if(e.code==='Space')fire()}document.addEventListener('keydown',key);c.onpointerdown=fire;I(()=>en.push({x:Math.random()*680,y:0}),700);function loop(){shots.forEach(q=>q.y-=8);en.forEach(q=>q.y+=2);en.forEach(q=>{if(shots.some(s=>Math.abs(s.x-q.x)<22&&Math.abs(s.y-q.y)<22))q.y=999});x.fillStyle='#050505';x.fillRect(0,0,700,450);x.fillStyle='#fff';x.fillRect(px-20,420,40,16);x.fillStyle='#e33';en.forEach(q=>{if(q.y<500){x.beginPath();x.arc(q.x,q.y,16,0,7);x.fill()}});shots.forEach(q=>x.fillRect(q.x,q.y,4,12));F(loop)}loop();cleanup=()=>document.removeEventListener('keydown',key)})}
function zombieBlaster(){canvasGame('🧟 Zombie Blaster','Tap/click zombies before they reach you.',(c,x)=>{let z=[],score=0;function spawn(){z.push({x:Math.random()*680,y:Math.random()*400,r:18})}I(spawn,700);c.onpointerdown=e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*700,my=(e.clientY-r.top)/r.height*450;z.forEach(q=>{if(Math.hypot(q.x-mx,q.y-my)<35){q.r=-1;score++}})}function loop(){z.forEach(q=>{q.x+=(350-q.x)*.003;q.y+=(225-q.y)*.003});z=z.filter(q=>q.r>0);x.fillStyle='#050505';x.fillRect(0,0,700,450);x.fillStyle='#7c3aed';z.forEach(q=>{x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()});x.fillStyle='#fff';x.font='22px Arial';x.fillText('Score '+score,20,30);F(loop)}loop()})}

function generic(name,icon){ui(`<div class="panel"><div class="title">${icon} ${name}</div><div class="message" id="m">Tap PLAY to start.</div><div class="controls"><button id="play" class="bigbtn">PLAY</button><button id="restart">Restart</button></div></div>`);let n=0;$('#play').onclick=()=>{$('#m').textContent='Playing! Score: '+(++n)};$('#restart').onclick=()=>{clearGame();generic(name,icon)}}

const games={snake,pong,breakout,tetris,flappy,space_invaders:spaceInvaders,asteroids,pac_man:pacman,'2048':game2048,memory_match:memory,monopoly,chess,checkers,connect_four:connect,tic_tac_toe:ttt,battleship,yahtzee,ludo,basketball,football,soccer,bowling,cricket,alien_blaster:alienBlaster,space_fighter:spaceFighter,target_shooter:targetShooter,zombie_blaster:zombieBlaster};
function launch(){
  clearGame();
  const name={{ game.name|default('Real Game')|tojson }};
  const icon={{ game.icon|default('🎮')|tojson }};
  const desc={{ game.description|default('Tap Start Game to begin.')|tojson }};
  ui(`<div class="panel" style="text-align:center;padding:28px 16px"><div style="font-size:64px">${icon}</div><div class="title" style="font-size:28px;margin:10px 0">${esc(name)}</div><div class="help" style="margin:12px auto 22px;max-width:600px">${esc(desc)}</div><div class="controls"><button id="startGame" class="bigbtn">▶️ START GAME</button></div><div class="help">Mobile friendly • Tap the button above to begin</div></div>`);
  $('#startGame').onclick=()=>{clearGame();let fn=games[GAME_ID];if(fn)fn();else generic(name,icon)};
}
launch();
</script>
