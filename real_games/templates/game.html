<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ game.name }} — Melanated AZ Real Games</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 20px;
}

.wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.brand {
    font-size: 18px;
    font-weight: bold;
}

.back {
    display: inline-block;
    background: #252525;
    color: #fff;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 10px;
}

.back:hover {
    background: #3a3a3a;
}

.game-header {
    text-align: center;
    margin-bottom: 20px;
}

.game-icon {
    font-size: 58px;
}

.game-title {
    margin: 5px 0;
    font-size: 36px;
}

.game-description {
    color: #aaa;
}

.game-shell {
    background: #141414;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    min-height: 500px;
}

.status {
    text-align: center;
    padding: 12px;
    margin-bottom: 15px;
    background: #202020;
    border-radius: 10px;
    color: #ddd;
}

.scoreboard {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.score {
    background: #202020;
    padding: 10px 20px;
    border-radius: 10px;
    min-width: 110px;
    text-align: center;
}

.score strong {
    display: block;
    font-size: 22px;
    margin-top: 4px;
}

canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    background: #000;
    border: 2px solid #444;
    border-radius: 10px;
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 17px;
    background: #fff;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

button.secondary {
    background: #333;
    color: #fff;
}

.instructions {
    margin-top: 20px;
    background: #1b1b1b;
    border-radius: 12px;
    padding: 15px;
    color: #bbb;
    text-align: center;
}

.board {
    margin: 20px auto;
    display: grid;
    gap: 5px;
    justify-content: center;
}

.cell {
    width: 60px;
    height: 60px;
    background: #252525;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    user-select: none;
}

.cell:hover {
    background: #333;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
}

.card {
    height: 110px;
    background: #252525;
    border: 2px solid #444;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    user-select: none;
}

.card.flipped {
    background: #eee;
    color: #111;
}

.card.matched {
    background: #333;
    opacity: .6;
}

.question {
    max-width: 800px;
    margin: 25px auto;
    text-align: center;
}

.question h2 {
    font-size: 25px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.answers button {
    min-height: 60px;
}

.big-message {
    text-align: center;
    font-size: 25px;
    padding: 30px;
}

.mobile-controls {
    width: 190px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.mobile-controls button {
    height: 50px;
    padding: 0;
}

.mobile-controls .up {
    grid-column: 2;
}

.mobile-controls .left {
    grid-column: 1;
}

.mobile-controls .down {
    grid-column: 2;
}

.mobile-controls .right {
    grid-column: 3;
}

.error-box {
    max-width: 650px;
    margin: 50px auto;
    padding: 30px;
    text-align: center;
    background: #211111;
    border: 1px solid #662222;
    border-radius: 15px;
}

.error-box h2 {
    color: #ff7777;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .game-shell {
        padding: 12px;
    }

    .game-title {
        font-size: 28px;
    }

    .cell {
        width: 48px;
        height: 48px;
    }

    .card-grid {
        grid-template-columns: repeat(4, 65px);
        gap: 7px;
    }

    .card {
        height: 85px;
        font-size: 25px;
    }

    .answers {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="topbar">

        <div class="brand">
            👑 Melanated AZ Real Games
        </div>

        <a
            class="back"
            href="{{ url_for('real_games.real_games_home') }}"
        >
            ← Games
        </a>

    </div>

    <div class="game-header">

        <div class="game-icon">
            {{ game.icon }}
        </div>

        <h1 class="game-title">
            {{ game.name }}
        </h1>

        <div class="game-description">
            {{ game.description }}
        </div>

    </div>

    <div class="game-shell">

        <div id="status" class="status">
            Loading game...
        </div>

        <div id="scoreboard" class="scoreboard"></div>

        <div id="game-container"></div>

        <div class="controls">

            <button onclick="restartGame()">
                🔄 Restart
            </button>

        </div>

    </div>

    <div class="instructions">

        <strong>How to Play</strong>

        <div id="instructions-text">
            Loading instructions...
        </div>

    </div>

</div>

<script>

/* ==========================================================
   GAME INFORMATION
   ========================================================== */

const GAME_ID =
    {{ game.game_id | tojson }};

const GAME_NAME =
    {{ game.name | tojson }};

const GAME_CONTAINER =
    document.getElementById("game-container");

const STATUS =
    document.getElementById("status");

const SCOREBOARD =
    document.getElementById("scoreboard");

let CURRENT_GAME = null;


/* ==========================================================
   HELPERS
   ========================================================== */

function setStatus(text) {
    STATUS.textContent = text;
}

function setInstructions(text) {
    document.getElementById(
        "instructions-text"
    ).textContent = text;
}

function setScore(label, value) {

    SCOREBOARD.innerHTML = `
        <div class="score">
            ${label}
            <strong>${value}</strong>
        </div>
    `;
}

function clearGame() {

    GAME_CONTAINER.innerHTML = "";

    SCOREBOARD.innerHTML = "";

}

function restartGame() {

    if (
        CURRENT_GAME &&
        typeof CURRENT_GAME.restart === "function"
    ) {

        CURRENT_GAME.restart();

    } else {

        location.reload();

    }

}

function createButton(text, callback) {

    const b =
        document.createElement("button");

    b.textContent = text;

    b.onclick = callback;

    return b;

}


/* ==========================================================
   SNAKE
   ========================================================== */

function loadSnake() {

    CURRENT_GAME = {
        restart: startSnake
    };

    startSnake();

}

function startSnake() {

    clearGame();

    const canvas =
        document.createElement("canvas");

    canvas.width = 500;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    const GRID = 25;
    const SIZE = 20;

    let snake;
    let food;
    let dx;
    let dy;
    let score;
    let running;
    let timer;

    function randomFood() {

        let position;

        do {

            position = {
                x:
                    Math.floor(
                        Math.random() * GRID
                    ),

                y:
                    Math.floor(
                        Math.random() * GRID
                    )
            };

        } while (
            snake.some(
                part =>
                    part.x === position.x &&
                    part.y === position.y
            )
        );

        return position;

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.strokeStyle = "#151515";

        for (
            let i = 0;
            i <= GRID;
            i++
        ) {

            ctx.beginPath();

            ctx.moveTo(
                i * SIZE,
                0
            );

            ctx.lineTo(
                i * SIZE,
                canvas.height
            );

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(
                0,
                i * SIZE
            );

            ctx.lineTo(
                canvas.width,
                i * SIZE
            );

            ctx.stroke();

        }

        ctx.fillStyle = "#fff";

        snake.forEach(
            (part, index) => {

                ctx.fillRect(
                    part.x * SIZE + 1,
                    part.y * SIZE + 1,
                    SIZE - 2,
                    SIZE - 2
                );

            }
        );

        ctx.fillStyle = "#e33";

        ctx.fillRect(
            food.x * SIZE + 2,
            food.y * SIZE + 2,
            SIZE - 4,
            SIZE - 4
        );

        setScore(
            "Score",
            score
        );

    }

    function endGame() {

        running = false;

        clearInterval(timer);

        setStatus(
            "💀 Game Over — Score: " + score
        );

    }

    function tick() {

        if (!running) {
            return;
        }

        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };

        if (
            head.x < 0 ||
            head.x >= GRID ||
            head.y < 0 ||
            head.y >= GRID
        ) {

            endGame();
            return;

        }

        if (
            snake.some(
                part =>
                    part.x === head.x &&
                    part.y === head.y
            )
        ) {

            endGame();
            return;

        }

        snake.unshift(head);

        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            food = randomFood();

        } else {

            snake.pop();

        }

        draw();

    }

    snake = [
        {x: 12, y: 12},
        {x: 11, y: 12},
        {x: 10, y: 12}
    ];

    dx = 1;
    dy = 0;
    score = 0;
    running = true;

    food = randomFood();

    document.onkeydown =
        function(event) {

            if (
                event.key === "ArrowUp" &&
                dy !== 1
            ) {

                dx = 0;
                dy = -1;

            }

            if (
                event.key === "ArrowDown" &&
                dy !== -1
            ) {

                dx = 0;
                dy = 1;

            }

            if (
                event.key === "ArrowLeft" &&
                dx !== 1
            ) {

                dx = -1;
                dy = 0;

            }

            if (
                event.key === "ArrowRight" &&
                dx !== -1
            ) {

                dx = 1;
                dy = 0;

            }

        };

    setStatus(
        "🐍 Snake — Go!"
    );

    setInstructions(
        "Use the arrow keys. Eat the red food and avoid the walls and yourself."
    );

    draw();

    timer =
        setInterval(
            tick,
            100
        );

}


/* ==========================================================
   PONG
   ========================================================== */

function loadPong() {

    CURRENT_GAME = {
        restart: startPong
    };

    startPong();

}

function startPong() {

    clearGame();

    const canvas =
        document.createElement("canvas");

    canvas.width = 700;
    canvas.height = 400;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    let playerY = 160;
    let cpuY = 160;

    let ball;
    let playerScore = 0;
    let cpuScore = 0;

    let running = true;

    function resetBall(direction) {

        ball = {
            x: 350,
            y: 200,
            vx: 5 * direction,
            vy:
                Math.random() > .5
                ? 3
                : -3
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            400
        );

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            20,
            playerY,
            15,
            80
        );

        ctx.fillRect(
            665,
            cpuY,
            15,
            80
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            9,
            0,
            Math.PI * 2
        );

        ctx.fill();

        setScore(
            "You " +
            playerScore +
            " — CPU " +
            cpuScore,
            ""
        );

    }

    function finish(message) {

        running = false;

        setStatus(message);

    }

    function update() {

        if (!running) {
            return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (
            ball.y <= 10 ||
            ball.y >= 390
        ) {

            ball.vy *= -1;

        }

        cpuY +=
            (ball.y - (cpuY + 40)) *
            .075;

        cpuY =
            Math.max(
                0,
                Math.min(
                    320,
                    cpuY
                )
            );

        if (
            ball.x <= 35 &&
            ball.y >= playerY &&
            ball.y <= playerY + 80
        ) {

            ball.vx =
                Math.abs(ball.vx);

        }

        if (
            ball.x >= 650 &&
            ball.y >= cpuY &&
            ball.y <= cpuY + 80
        ) {

            ball.vx =
                -Math.abs(ball.vx);

        }

        if (ball.x < 0) {

            cpuScore++;

            resetBall(1);

        }

        if (ball.x > 700) {

            playerScore++;

            resetBall(-1);

        }

        if (playerScore >= 10) {

            finish(
                "🏆 You Win!"
            );

            return;

        }

        if (cpuScore >= 10) {

            finish(
                "💀 CPU Wins!"
            );

            return;

        }

        draw();

        requestAnimationFrame(
            update
        );

    }

    document.onkeydown =
        function(event) {

            if (
                event.key === "ArrowUp" ||
                event.key.toLowerCase() === "w"
            ) {

                playerY -= 25;

            }

            if (
                event.key === "ArrowDown" ||
                event.key.toLowerCase() === "s"
            ) {

                playerY += 25;

            }

            playerY =
                Math.max(
                    0,
                    Math.min(
                        320,
                        playerY
                    )
                );

        };

    setStatus(
        "🏓 Pong"
    );

    setInstructions(
        "Move your paddle with W/S or Arrow Up/Down. First to 10 wins."
    );

    resetBall(
        Math.random() > .5
        ? 1
        : -1
    );

    draw();

    update();

}


/* ==========================================================
   BREAKOUT
   ========================================================== */

function loadBreakout() {

    CURRENT_GAME = {
        restart: startBreakout
    };

    startBreakout();

}

function startBreakout() {

    clearGame();

    const canvas =
        document.createElement("canvas");

    canvas.width = 700;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    let paddleX = 300;

    let ball = {
        x: 350,
        y: 430,
        vx: 4,
        vy: -4
    };

    let score = 0;
    let lives = 3;
    let running = true;

    const bricks = [];

    for (
        let row = 0;
        row < 5;
        row++
    ) {

        for (
            let col = 0;
            col < 10;
            col++
        ) {

            bricks.push({
                x: col * 68 + 8,
                y: row * 30 + 30,
                width: 60,
                height: 20,
                alive: true
            });

        }

    }

    function resetBall() {

        ball = {
            x: 350,
            y: 430,
            vx:
                Math.random() > .5
                ? 4
                : -4,
            vy: -4
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            500
        );

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            paddleX,
            470,
            100,
            15
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();

        bricks.forEach(
            brick => {

                if (!brick.alive) {
                    return;
                }

                ctx.fillRect(
                    brick.x,
                    brick.y,
                    brick.width,
                    brick.height
                );

            }
        );

        setScore(
            "Score",
            score
        );

    }

    function update() {

        if (!running) {
            return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (
            ball.x <= 8 ||
            ball.x >= 692
        ) {

            ball.vx *= -1;

        }

        if (ball.y <= 8) {

            ball.vy *= -1;

        }

        if (
            ball.y + 8 >= 470 &&
            ball.x >= paddleX &&
            ball.x <= paddleX + 100
        ) {

            ball.vy =
                -Math.abs(ball.vy);

        }

        for (
            const brick of bricks
        ) {

            if (!brick.alive) {
                continue;
            }

            if (
                ball.x >= brick.x &&
                ball.x <=
                    brick.x +
                    brick.width &&
                ball.y >= brick.y &&
                ball.y <=
                    brick.y +
                    brick.height
            ) {

                brick.alive = false;

                ball.vy *= -1;

                score++;

                break;

            }

        }

        if (
            bricks.every(
                brick =>
                    !brick.alive
            )
        ) {

            running = false;

            setStatus(
                "🏆 You cleared every brick!"
            );

            return;

        }

        if (ball.y > 510) {

            lives--;

            if (lives <= 0) {

                running = false;

                setStatus(
                    "💀 Game Over — Score: " +
                    score
                );

                return;

            }

            resetBall();

        }

        setStatus(
            "🧱 Breakout — Lives: " +
            lives
        );

        draw();

        requestAnimationFrame(
            update
        );

    }

    document.onkeydown =
        function(event) {

            if (
                event.key === "ArrowLeft"
            ) {

                paddleX -= 35;

            }

            if (
                event.key === "ArrowRight"
            ) {

                paddleX += 35;

            }

            paddleX =
                Math.max(
                    0,
                    Math.min(
                        600,
                        paddleX
                    )
                );

        };

    setInstructions(
        "Move the paddle with the left/right arrow keys and destroy all bricks."
    );

    draw();

    update();

}


/* ==========================================================
   2048
   ========================================================== */

function load2048() {

    CURRENT_GAME = {
        restart: start2048
    };

    start2048();

}

function start2048() {

    clearGame();

    const board =
        document.createElement("div");

    board.className = "board";

    board.style.gridTemplateColumns =
        "repeat(4, 60px)";

    GAME_CONTAINER.appendChild(board);

    let grid =
        Array.from(
            {length: 4},
            () => Array(4).fill(0)
        );

    let score = 0;
    let running = true;

    function addTile() {

        const empty = [];

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            for (
                let c = 0;
                c < 4;
                c++
            ) {

                if (
                    grid[r][c] === 0
                ) {

                    empty.push(
                        [r, c]
                    );

                }

            }

        }

        if (!empty.length) {
            return;
        }

        const location =
            empty[
                Math.floor(
                    Math.random() *
                    empty.length
                )
            ];

        grid[
            location[0]
        ][
            location[1]
        ] =
            Math.random() < .9
            ? 2
            : 4;

    }

    function compress(row) {

        const values =
            row.filter(
                value =>
                    value !== 0
            );

        const result = [];

        for (
            let i = 0;
            i < values.length;
            i++
        ) {

            if (
                values[i] ===
                values[i + 1]
            ) {

                const merged =
                    values[i] * 2;

                result.push(
                    merged
                );

                score += merged;

                i++;

            } else {

                result.push(
                    values[i]
                );

            }

        }

        while (
            result.length < 4
        ) {

            result.push(0);

        }

        return result;

    }

    function rotateRight() {

        const result =
            Array.from(
                {length: 4},
                () => Array(4).fill(0)
            );

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            for (
                let c = 0;
                c < 4;
                c++
            ) {

                result[c][3-r] =
                    grid[r][c];

            }

        }

        grid = result;

    }

    function move(direction) {

        if (!running) {
            return;
        }

        const rotations = {
            left: 0,
            up: 3,
            right: 2,
            down: 1
        };

        const count =
            rotations[direction];

        for (
            let i = 0;
            i < count;
            i++
        ) {

            rotateRight();

        }

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            grid[r] =
                compress(
                    grid[r]
                );

        }

        for (
            let i = 0;
            i < (4 - count) % 4;
            i++
        ) {

            rotateRight();

        }

        addTile();

        render();

        if (
            grid.some(
                row =>
                    row.includes(2048)
            )
        ) {

            running = false;

            setStatus(
                "🏆 You reached 2048!"
            );

        }

    }

    function render() {

        board.innerHTML = "";

        grid.forEach(
            row => {

                row.forEach(
                    value => {

                        const cell =
                            document.createElement(
                                "div"
                            );

                        cell.className =
                            "cell";

                        cell.textContent =
                            value || "";

                        board.appendChild(
                            cell
                        );

                    }
                );

            }
        );

        setScore(
            "Score",
            score
        );

    }

    document.onkeydown =
        function(event) {

            const keys = {
                ArrowLeft: "left",
                ArrowRight: "right",
                ArrowUp: "up",
                ArrowDown: "down"
            };

            if (
                keys[event.key]
            ) {

                move(
                    keys[event.key]
                );

            }

        };

    setStatus(
        "🔢 2048"
    );

    setInstructions(
        "Use the arrow keys to combine matching numbers and reach 2048."
    );

    addTile();
    addTile();

    render();

}


/* ==========================================================
   MEMORY
   ========================================================== */

function loadMemory() {

    CURRENT_GAME = {
        restart: startMemory
    };

    startMemory();

}

function startMemory() {

    clearGame();

    const grid =
        document.createElement("div");

    grid.className =
        "card-grid";

    GAME_CONTAINER.appendChild(
        grid
    );

    const symbols = [
        "🍎",
        "🍌",
        "🍇",
        "🍉",
        "🍒",
        "🥝",
        "🍋",
        "🍊"
    ];

    const cards =
        [...symbols, ...symbols]
        .sort(
            () =>
                Math.random() - .5
        );

    let first = null;
    let locked = false;
    let matches = 0;
    let moves = 0;

    cards.forEach(
        symbol => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            card.textContent =
                "❓";

            card.onclick =
                function() {

                    if (
                        locked ||
                        card === first ||
                        card.classList.contains(
                            "matched"
                        )
                    ) {

                        return;

                    }

                    card.textContent =
                        symbol;

                    card.classList.add(
                        "flipped"
                    );

                    if (!first) {

                        first = card;

                        return;

                    }

                    moves++;

                    if (
                        first.textContent ===
                        card.textContent
                    ) {

                        first.classList.add(
                            "matched"
                        );

                        card.classList.add(
                            "matched"
                        );

                        first = null;

                        matches++;

                        if (
                            matches ===
                            symbols.length
                        ) {

                            setStatus(
                                "🏆 You won in " +
                                moves +
                                " moves!"
                            );

                        }

                    } else {

                        locked = true;

                        const previous =
                            first;

                        setTimeout(
                            function() {

                                previous.textContent =
                                    "❓";

                                card.textContent =
                                    "❓";

                                previous.classList.remove(
                                    "flipped"
                                );

                                card.classList.remove(
                                    "flipped"
                                );

                                first = null;

                                locked = false;

                            },
                            700
                        );

                    }

                };

            grid.appendChild(
                card
            );

        }
    );

    setStatus(
        "🧠 Memory Match"
    );

    setInstructions(
        "Flip two cards and find all eight matching pairs."
    );

}


/* ==========================================================
   TIC TAC TOE
   ========================================================== */

function loadTicTacToe() {

    CURRENT_GAME = {
        restart: startTicTacToe
    };

    startTicTacToe();

}

function startTicTacToe() {

    clearGame();

    const board =
        document.createElement("div");

    board.className = "board";

    board.style.gridTemplateColumns =
        "repeat(3, 70px)";

    GAME_CONTAINER.appendChild(
        board
    );

    const cells =
        Array(9).fill("");

    let turn = "X";
    let running = true;

    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    function winner() {

        for (
            const combo of wins
        ) {

            const [a,b,c] =
                combo;

            if (
                cells[a] &&
                cells[a] === cells[b] &&
                cells[a] === cells[c]
            ) {

                return cells[a];

            }

        }

        if (
            cells.every(
                value => value
            )
        ) {

            return "draw";

        }

        return null;

    }

    cells.forEach(
        (_, index) => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            cell.onclick =
                function() {

                    if (
                        !running ||
                        cells[index]
                    ) {

                        return;

                    }

                    cells[index] =
                        turn;

                    cell.textContent =
                        turn;

                    const result =
                        winner();

                    if (result) {

                        running = false;

                        setStatus(
                            result === "draw"
                            ? "🤝 Draw!"
                            : "🏆 " +
                              result +
                              " wins!"
                        );

                        return;

                    }

                    turn =
                        turn === "X"
                        ? "O"
                        : "X";

                    setStatus(
                        "Player " +
                        turn +
                        "'s turn"
                    );

                };

            board.appendChild(
                cell
            );

        }
    );

    setStatus(
        "⭕ Tic-Tac-Toe"
    );

    setInstructions(
        "Click an empty square. Get three in a row."
    );

}


/* ==========================================================
   CONNECT FOUR
   ========================================================== */

function loadConnectFour() {

    CURRENT_GAME = {
        restart: startConnectFour
    };

    startConnectFour();

}

function startConnectFour() {

    clearGame();

    const board =
        document.createElement("div");

    board.className = "board";

    board.style.gridTemplateColumns =
        "repeat(7, 50px)";

    GAME_CONTAINER.appendChild(
        board
    );

    const grid =
        Array.from(
            {length: 6},
            () => Array(7).fill("")
        );

    let turn = "🔴";
    let running = true;

    function checkWin(
        row,
        col
    ) {

        const player =
            grid[row][col];

        const directions = [
            [0,1],
            [1,0],
            [1,1],
            [1,-1]
        ];

        for (
            const [
                dr,
                dc
            ] of directions
        ) {

            let count = 1;

            for (
                let step = 1;
                step < 4;
                step++
            ) {

                const r =
                    row + dr * step;

                const c =
                    col + dc * step;

                if (
                    r < 0 ||
                    r >= 6 ||
                    c < 0 ||
                    c >= 7 ||
                    grid[r][c] !== player
                ) {

                    break;

                }

                count++;

            }

            for (
                let step = 1;
                step < 4;
                step++
            ) {

                const r =
                    row - dr * step;

                const c =
                    col - dc * step;

                if (
                    r < 0 ||
                    r >= 6 ||
                    c < 0 ||
                    c >= 7 ||
                    grid[r][c] !== player
                ) {

                    break;

                }

                count++;

            }

            if (count >= 4) {

                return true;

            }

        }

        return false;

    }

    function render() {

        const cells =
            board.children;

        let index = 0;

        for (
            let r = 0;
            r < 6;
            r++
        ) {

            for (
                let c = 0;
                c < 7;
                c++
            ) {

                cells[index].textContent =
                    grid[r][c];

                index++;

            }

        }

    }

    for (
        let r = 0;
        r < 6;
        r++
    ) {

        for (
            let c = 0;
            c < 7;
            c++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            cell.onclick =
                function() {

                    if (!running) {
                        return;
                    }

                    for (
                        let row = 5;
                        row >= 0;
                        row--
                    ) {

                        if (
                            !grid[row][c]
                        ) {

                            grid[row][c] =
                                turn;

                            render();

                            if (
                                checkWin(
                                    row,
                                    c
                                )
                            ) {

                                running = false;

                                setStatus(
                                    "🏆 " +
                                    turn +
                                    " wins!"
                                );

                            } else {

                                turn =
                                    turn ===
                                    "🔴"
                                    ? "🟡"
                                    : "🔴";

                                setStatus(
                                    turn +
                                    " turn"
                                );

                            }

                            break;

                        }

                    }

                };

            board.appendChild(
                cell
            );

        }

    }

    setStatus(
        "🔴 Connect Four"
    );

    setInstructions(
        "Click a column to drop your piece. Connect four before your opponent."
    );

}


/* ==========================================================

   ========================================================== */

function loadRPS() {

    CURRENT_GAME = {
        restart: startRPS
    };

    startRPS();

}

function startRPS() {

    clearGame();

    let playerScore = 0;
    let cpuScore = 0;

    const area =
        document.createElement(
            "div"
        );

    area.className =
        "big-message";

    area.innerHTML =
        "<div style='font-size:80px'>✊ ✋ ✌️</div>";

    GAME_CONTAINER.appendChild(
        area
    );

    const controls =
        document.createElement(
            "div"
        );

    controls.className =
        "controls";

    const choices = [
        "Rock",
        "Paper",
        "Scissors"
    ];

    choices.forEach(
        choice => {

            controls.appendChild(
                createButton(
                    choice,
                    () =>
                        play(choice)
                )
            );

        }
    );

    GAME_CONTAINER.appendChild(
        controls
    );

    function play(player) {

        const cpu =
            choices[
                Math.floor(
                    Math.random() *
                    choices.length
                )
            ];

        let result;

        if (
            player === cpu
        ) {

            result =
                "🤝 Draw!";

        } else if (
            (
                player === "Rock" &&
                cpu === "Scissors"
            ) ||
            (
                player === "Paper" &&
                cpu === "Rock"
            ) ||
            (
                player === "Scissors" &&
                cpu === "Paper"
            )
        ) {

            playerScore++;

            result =
                "🏆 You win!";

        } else {

            cpuScore++;

            result =
                "💀 CPU wins!";

        }

        setStatus(
            result +
            " You chose " +
            player +
            " — CPU chose " +
            cpu
        );

        setScore(
            "Score",
            playerScore +
            " - " +
            cpuScore
        );

    }

    setStatus(
        "✊ Rock Paper Scissors"
    );

    setInstructions(
        "Choose Rock, Paper, or Scissors."
    );

}


/* ==========================================================
   TARGET SHOOTER
   ========================================================== */

function loadTargetShooter() {

    CURRENT_GAME = {
        restart: startTargetShooter
    };

    startTargetShooter();

}

function startTargetShooter() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 700;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(
        canvas
    );

    const ctx =
        canvas.getContext("2d");

    let target;
    let score = 0;
    let shots = 0;
    let time = 20;
    let running = true;
    let timer;

    function newTarget() {

        target = {
            x:
                50 +
                Math.random() *
                600,

            y:
                50 +
                Math.random() *
                400,

            radius: 25
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            500
        );

        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            target.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#fff";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            9,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#000";

        ctx.fill();

        setScore(
            "Hits",
            score
        );

    }

    canvas.onclick =
        function(event) {

            if (!running) {
                return;
            }

            const rect =
                canvas.getBoundingClientRect();

            const scaleX =
                canvas.width /
                rect.width;

            const scaleY =
                canvas.height /
                rect.height;

            const x =
                (
                    event.clientX -
                    rect.left
                ) * scaleX;

            const y =
                (
                    event.clientY -
                    rect.top
                ) * scaleY;

            shots++;

            const distance =
                Math.hypot(
                    x - target.x,
                    y - target.y
                );

            if (
                distance <=
                target.radius
            ) {

                score++;

                newTarget();

            }

            draw();

        };

    timer =
        setInterval(
            function() {

                time--;

                setStatus(
                    "🎯 Time remaining: " +
                    time +
                    " seconds"
                );

                if (time <= 0) {

                    running = false;

                    clearInterval(timer);

                    setStatus(
                        "🏆 Finished — " +
                        score +
                        " hits from " +
                        shots +
                        " shots!"
                    );

                }

            },
            1000
        );

    newTarget();

    setInstructions(
        "Click the target as quickly and accurately as possible."
    );

    draw();

}


/* ==========================================================
   DODGE
   ========================================================== */

function loadDodge() {

    CURRENT_GAME = {
        restart: startDodge
    };

    startDodge();

}

function startDodge() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 600;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(
        canvas
    );

    const ctx =
        canvas.getContext("2d");

    const player = {
        x: 285,
        y: 440,
        width: 30,
        height: 30,
        speed: 7
    };

    let enemies = [];
    let score = 0;
    let running = true;
    let spawnTimer;

    function spawnEnemy() {

        enemies.push({
            x:
                Math.random() *
                570,

            y: -30,

            width: 30,
            height: 30,

            speed:
                2 +
                Math.random() * 3
        });

    }

    function collision(a,b) {

        return (
            a.x <
                b.x + b.width &&
            a.x + a.width >
                b.x &&
            a.y <
                b.y + b.height &&
            a.y + a.height >
                b.y
        );

    }

    function update() {

        if (!running) {
            return;
        }

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            600,
            500
        );

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            player.x,
            player.y,
            player.width,
            player.height
        );

        enemies.forEach(
            enemy => {

                enemy.y +=
                    enemy.speed;

                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.width,
                    enemy.height
                );

                if (
                    collision(
                        player,
                        enemy
                    )
                ) {

                    running = false;

                    clearInterval(
                        spawnTimer
                    );

                    setStatus(
                        "💀 Game Over — Score: " +
                        Math.floor(
                            score / 10
                        )
                    );

                }

            }
        );

        enemies =
            enemies.filter(
                enemy =>
                    enemy.y < 550
            );

        score++;

        setScore(
            "Survival",
            Math.floor(
                score / 10
            )
        );

        if (running) {

            requestAnimationFrame(
                update
            );

        }

    }

    document.onkeydown =
        function(event) {

            if (
                event.key === "ArrowLeft"
            ) {

                player.x -=
                    player.speed;

            }

            if (
                event.key === "ArrowRight"
            ) {

                player.x +=
                    player.speed;

            }

            player.x =
                Math.max(
                    0,
                    Math.min(
                        570,
                        player.x
                    )
                );

        };

    spawnTimer =
        setInterval(
            spawnEnemy,
            650
        );

    setStatus(
        "🥊 Dodge"
    );

    setInstructions(
        "Use the left and right arrow keys to dodge the falling blocks."
    );

    update();

}
