<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ game.name }} — Melanated AZ Real Games</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 20px;
}

.wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.brand {
    font-size: 18px;
    font-weight: bold;
}

.back {
    display: inline-block;
    background: #252525;
    color: #fff;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 10px;
}

.back:hover {
    background: #3a3a3a;
}

.game-header {
    text-align: center;
    margin-bottom: 20px;
}

.game-icon {
    font-size: 58px;
}

.game-title {
    margin: 5px 0;
    font-size: 36px;
}

.game-description {
    color: #aaa;
}

.game-shell {
    background: #141414;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 20px;
    min-height: 500px;
}

.status {
    text-align: center;
    padding: 12px;
    margin-bottom: 15px;
    background: #202020;
    border-radius: 10px;
    color: #ddd;
}

.scoreboard {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.score {
    background: #202020;
    padding: 10px 20px;
    border-radius: 10px;
    min-width: 110px;
    text-align: center;
}

.score strong {
    display: block;
    font-size: 22px;
    margin-top: 4px;
}

canvas {
    display: block;
    margin: 20px auto;
    max-width: 100%;
    height: auto;
    background: #000;
    border: 2px solid #444;
    border-radius: 10px;
    touch-action: none;
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 17px;
    background: #fff;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

button.secondary {
    background: #333;
    color: #fff;
}

.instructions {
    margin-top: 20px;
    background: #1b1b1b;
    border-radius: 12px;
    padding: 15px;
    color: #bbb;
    text-align: center;
}

.big-message {
    text-align: center;
    font-size: 25px;
    padding: 30px;
}

.question {
    max-width: 850px;
    margin: 25px auto;
    text-align: center;
}

.question h2 {
    font-size: 25px;
    line-height: 1.4;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.answers button {
    min-height: 55px;
}

.board {
    margin: 20px auto;
    display: grid;
    gap: 5px;
    justify-content: center;
}

.cell {
    width: 55px;
    height: 55px;
    background: #252525;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    cursor: pointer;
    user-select: none;
}

.cell:hover {
    background: #333;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
}

.card {
    height: 100px;
    background: #252525;
    border: 2px solid #444;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    cursor: pointer;
    user-select: none;
}

.card.flipped {
    background: #eee;
    color: #111;
}

.card.matched {
    background: #333;
    opacity: .6;
}

.mobile-controls {
    width: 190px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.mobile-controls button {
    height: 50px;
    padding: 0;
}

.mobile-controls .up {
    grid-column: 2;
}

.mobile-controls .left {
    grid-column: 1;
}

.mobile-controls .down {
    grid-column: 2;
}

.mobile-controls .right {
    grid-column: 3;
}

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .game-shell {
        padding: 10px;
    }

    .game-title {
        font-size: 28px;
    }

    canvas {
        width: 100%;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .card-grid {
        grid-template-columns: repeat(4, 70px);
        gap: 7px;
    }

    .card {
        height: 70px;
        font-size: 25px;
    }

    .cell {
        width: 45px;
        height: 45px;
        font-size: 22px;
    }
}
</style>

</div>

<script>

/* ==========================================================
   GAME INFORMATION
   ========================================================== */

const GAME_ID =
    {{ game.game_id | tojson }};

const GAME_NAME =
    {{ game.name | tojson }};

const GAME_CONTAINER =
    document.getElementById(
        "game-container"
    );

const STATUS =
    document.getElementById(
        "status"
    );

const SCOREBOARD =
    document.getElementById(
        "scoreboard"
    );

let CURRENT_GAME = null;


/* ==========================================================
   GAME LOOP MANAGEMENT
   ========================================================== */

let ACTIVE_INTERVALS = [];
let ACTIVE_TIMEOUTS = [];
let ACTIVE_ANIMATIONS = [];

function trackedInterval(fn, ms) {

    const id =
        setInterval(fn, ms);

    ACTIVE_INTERVALS.push(id);

    return id;
}

function trackedTimeout(fn, ms) {

    const id =
        setTimeout(fn, ms);

    ACTIVE_TIMEOUTS.push(id);

    return id;
}

function trackedAnimation(fn) {

    const id =
        requestAnimationFrame(fn);

    ACTIVE_ANIMATIONS.push(id);

    return id;
}

function stopGameLoops() {

    ACTIVE_INTERVALS.forEach(
        id => clearInterval(id)
    );

    ACTIVE_TIMEOUTS.forEach(
        id => clearTimeout(id)
    );

    ACTIVE_ANIMATIONS.forEach(
        id => cancelAnimationFrame(id)
    );

    ACTIVE_INTERVALS = [];
    ACTIVE_TIMEOUTS = [];
    ACTIVE_ANIMATIONS = [];

    document.onkeydown = null;
}


/* ==========================================================
   COMMON HELPERS
   ========================================================== */

function setStatus(text) {

    STATUS.textContent = text;

}

function setInstructions(text) {

    document.getElementById(
        "instructions-text"
    ).textContent = text;

}

function setScore(label, value) {

    SCOREBOARD.innerHTML = `
        <div class="score">
            ${label}
            <strong>${value}</strong>
        </div>
    `;

}

function clearGame() {

    stopGameLoops();

    GAME_CONTAINER.innerHTML = "";

    SCOREBOARD.innerHTML = "";

}

function createButton(
    text,
    callback,
    className = ""
) {

    const b =
        document.createElement(
            "button"
        );

    b.textContent = text;

    if (className) {
        b.className = className;
    }

    b.addEventListener(
        "click",
        callback
    );

    return b;

}

function restartGame() {

    if (
        CURRENT_GAME &&
        typeof CURRENT_GAME.restart ===
        "function"
    ) {

        CURRENT_GAME.restart();

    } else {

        location.reload();

    }

}


/* ==========================================================
   SNAKE
   ========================================================== */

function loadSnake() {

    CURRENT_GAME = {
        restart: startSnake
    };

    startSnake();

}

function startSnake() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    const SIZE = 20;
    const GRID = 25;
    const WIDTH = SIZE * GRID;

    canvas.width = WIDTH;
    canvas.height = WIDTH;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    let snake;
    let food;
    let dx;
    let dy;
    let score;
    let running;

    function reset() {

        snake = [
            {x: 12, y: 12},
            {x: 11, y: 12},
            {x: 10, y: 12}
        ];

        dx = 1;
        dy = 0;

        score = 0;

        running = true;

        placeFood();

        setStatus(
            "🐍 Snake — Go!"
        );

        draw();

    }

    function placeFood() {

        let valid = false;

        while (!valid) {

            food = {
                x:
                    Math.floor(
                        Math.random() *
                        GRID
                    ),

                y:
                    Math.floor(
                        Math.random() *
                        GRID
                    )
            };

            valid =
                !snake.some(
                    part =>
                        part.x === food.x &&
                        part.y === food.y
                );

        }

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            WIDTH
        );

        ctx.fillStyle = "#fff";

        snake.forEach(
            (part, index) => {

                ctx.fillRect(
                    part.x * SIZE,
                    part.y * SIZE,
                    SIZE - 2,
                    SIZE - 2
                );

            }
        );

        ctx.fillStyle = "#f00";

        ctx.fillRect(
            food.x * SIZE,
            food.y * SIZE,
            SIZE - 2,
            SIZE - 2
        );

        setScore(
            "Score",
            score
        );

    }

    function tick() {

        if (!running) {
            return;
        }

        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };

        if (
            head.x < 0 ||
            head.x >= GRID ||
            head.y < 0 ||
            head.y >= GRID
        ) {

            endGame();

            return;

        }

        const ate =
            head.x === food.x &&
            head.y === food.y;

        const bodyToCheck =
            ate
            ? snake
            : snake.slice(0, -1);

        if (
            bodyToCheck.some(
                part =>
                    part.x === head.x &&
                    part.y === head.y
            )
        ) {

            endGame();

            return;

        }

        snake.unshift(head);

        if (ate) {

            score++;

            placeFood();

        } else {

            snake.pop();

        }

        draw();

    }

    function endGame() {

        running = false;

        setStatus(
            "💀 Game Over — Score: " +
            score
        );

    }

    document.onkeydown =
        function(e) {

            if (
                e.key === "ArrowUp" &&
                dy !== 1
            ) {

                dx = 0;
                dy = -1;

            }

            if (
                e.key === "ArrowDown" &&
                dy !== -1
            ) {

                dx = 0;
                dy = 1;

            }

            if (
                e.key === "ArrowLeft" &&
                dx !== 1
            ) {

                dx = -1;
                dy = 0;

            }

            if (
                e.key === "ArrowRight" &&
                dx !== -1
            ) {

                dx = 1;
                dy = 0;

            }

        };

    reset();

    trackedInterval(
        tick,
        110
    );

}


/* ==========================================================
   PONG
   ========================================================== */

function loadPong() {

    CURRENT_GAME = {
        restart: startPong
    };

    startPong();

}

function startPong() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 700;
    canvas.height = 400;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    const paddleHeight = 80;
    const paddleWidth = 14;

    let playerY = 160;
    let aiY = 160;

    let ball = {
        x: 350,
        y: 200,
        vx: 5,
        vy: 3
    };

    let playerScore = 0;
    let aiScore = 0;

    let running = true;

    setInstructions(
        "Use W/S or Arrow Up/Down. First to 10 wins."
    );

    function resetBall(direction) {

        ball = {
            x: 350,
            y: 200,
            vx: 5 * direction,
            vy:
                Math.random() < .5
                ? -3
                : 3
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            400
        );

        ctx.strokeStyle = "#333";
        ctx.setLineDash([8, 8]);

        ctx.beginPath();

        ctx.moveTo(350, 0);
        ctx.lineTo(350, 400);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            20,
            playerY,
            paddleWidth,
            paddleHeight
        );

        ctx.fillRect(
            666,
            aiY,
            paddleWidth,
            paddleHeight
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            9,
            0,
            Math.PI * 2
        );

        ctx.fill();

        setScore(
            "You " +
            playerScore +
            " — CPU " +
            aiScore,
            ""
        );

    }

    function finish() {

        running = false;

        setStatus(
            playerScore >= 10
            ? "🏆 You Win!"
            : "💀 CPU Wins!"
        );

    }

    function update() {

        if (!running) {
            return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (
            ball.y <= 9 ||
            ball.y >= 391
        ) {

            ball.vy *= -1;

        }

        aiY +=
            (ball.y -
            (aiY + paddleHeight / 2))
            * .075;

        aiY =
            Math.max(
                0,
                Math.min(
                    320,
                    aiY
                )
            );

        if (
            ball.x <= 34 &&
            ball.x >= 20 &&
            ball.y >= playerY &&
            ball.y <=
                playerY +
                paddleHeight
        ) {

            ball.x = 35;

            ball.vx =
                Math.abs(ball.vx) + .15;

        }

        if (
            ball.x >= 650 &&
            ball.x <= 680 &&
            ball.y >= aiY &&
            ball.y <=
                aiY +
                paddleHeight
        ) {

            ball.x = 649;

            ball.vx =
                -Math.abs(ball.vx) - .15;

        }

        if (ball.x < 0) {

            aiScore++;

            if (aiScore >= 10) {

                finish();

                return;

            }

            resetBall(1);

        }

        if (ball.x > 700) {

            playerScore++;

            if (playerScore >= 10) {

                finish();

                return;

            }

            resetBall(-1);

        }

        draw();

        requestAnimationFrame(
            update
        );

    }

    document.onkeydown =
        function(e) {

            const key =
                e.key.toLowerCase();

            if (
                key === "arrowup" ||
                key === "w"
            ) {

                playerY -= 30;

            }

            if (
                key === "arrowdown" ||
                key === "s"
            ) {

                playerY += 30;

            }

            playerY =
                Math.max(
                    0,
                    Math.min(
                        320,
                        playerY
                    )
                );

        };

    setStatus(
        "🏓 Pong"
    );

    update();

}


/* ==========================================================
   BREAKOUT
   ========================================================== */

function loadBreakout() {

    CURRENT_GAME = {
        restart: startBreakout
    };

    startBreakout();

}

function startBreakout() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 700;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    const paddle = {
        x: 300,
        y: 465,
        width: 100,
        height: 15
    };

    let ball = {
        x: 350,
        y: 440,
        vx: 4,
        vy: -4
    };

    let bricks = [];
    let score = 0;
    let lives = 3;
    let running = true;

    for (
        let row = 0;
        row < 6;
        row++
    ) {

        for (
            let col = 0;
            col < 10;
            col++
        ) {

            bricks.push({
                x:
                    col * 68 + 10,

                y:
                    row * 30 + 30,

                width: 58,
                height: 20,

                alive: true
            });

        }

    }

    setStatus(
        "🧱 Breakout"
    );

    setInstructions(
        "Use Arrow Left/Right. Destroy all blocks. You have 3 lives."
    );

    function resetBall() {

        ball = {
            x: 350,
            y: 440,
            vx:
                Math.random() < .5
                ? -4
                : 4,
            vy: -4
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            500
        );

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            paddle.x,
            paddle.y,
            paddle.width,
            paddle.height
        );

        bricks.forEach(
            brick => {

                if (!brick.alive) {
                    return;
                }

                ctx.fillRect(
                    brick.x,
                    brick.y,
                    brick.width,
                    brick.height
                );

            }
        );

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();

        setScore(
            "Score",
            score
        );

    }

    function loseLife() {

        lives--;

        if (lives <= 0) {

            running = false;

            setStatus(
                "💀 Game Over — Score: " +
                score
            );

            return;

        }

        resetBall();

        setStatus(
            "❤️ Lives: " +
            lives
        );

    }

    function update() {

        if (!running) {
            return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (
            ball.x <= 8 ||
            ball.x >= 692
        ) {

            ball.vx *= -1;

        }

        if (ball.y <= 8) {

            ball.vy *= -1;

        }

        if (
            ball.y + 8 >= paddle.y &&
            ball.y - 8 <=
                paddle.y +
                paddle.height &&
            ball.x >= paddle.x &&
            ball.x <=
                paddle.x +
                paddle.width &&
            ball.vy > 0
        ) {

            const hit =
                (
                    ball.x -
                    (
                        paddle.x +
                        paddle.width / 2
                    )
                ) /
                (paddle.width / 2);

            ball.vx =
                hit * 5;

            ball.vy =
                -Math.abs(ball.vy);

        }

        bricks.forEach(
            brick => {

                if (!brick.alive) {
                    return;
                }

                if (
                    ball.x >= brick.x &&
                    ball.x <=
                        brick.x +
                        brick.width &&
                    ball.y >= brick.y &&
                    ball.y <=
                        brick.y +
                        brick.height
                ) {

                    brick.alive = false;

                    score++;

                    ball.vy *= -1;

                }

            }
        );

        if (
            bricks.every(
                brick =>
                    !brick.alive
            )
        ) {

            running = false;

            setStatus(
                "🏆 You cleared every block!"
            );

            return;

        }

        if (ball.y > 510) {

            loseLife();

        }

        draw();

        requestAnimationFrame(
            update
        );

    }

    document.onkeydown =
        function(e) {

            if (
                e.key === "ArrowLeft"
            ) {

                paddle.x -= 35;

            }

            if (
                e.key === "ArrowRight"
            ) {

                paddle.x += 35;

            }

            paddle.x =
                Math.max(
                    0,
                    Math.min(
                        600,
                        paddle.x
                    )
                );

        };

    draw();

    update();

}


/* ==========================================================
   2048
   ========================================================== */

function load2048() {

    CURRENT_GAME = {
        restart: start2048
    };

    start2048();

}

function start2048() {

    clearGame();

    const board =
        document.createElement(
            "div"
        );

    board.className =
        "board";

    board.style.gridTemplateColumns =
        "repeat(4, 60px)";

    GAME_CONTAINER.appendChild(
        board
    );

    let grid =
        Array.from(
            {length: 4},
            () => Array(4).fill(0)
        );

    let score = 0;
    let gameOver = false;

    function addTile() {

        const empty = [];

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            for (
                let c = 0;
                c < 4;
                c++
            ) {

                if (
                    grid[r][c] === 0
                ) {

                    empty.push(
                        [r, c]
                    );

                }

            }

        }

        if (!empty.length) {
            return false;
        }

        const spot =
            empty[
                Math.floor(
                    Math.random() *
                    empty.length
                )
            ];

        grid[spot[0]][spot[1]] =
            Math.random() < .9
            ? 2
            : 4;

        return true;

    }

    function compress(row) {

        return row.filter(
            value => value !== 0
        );

    }

    function merge(row) {

        row = compress(row);

        for (
            let i = 0;
            i < row.length - 1;
            i++
        ) {

            if (
                row[i] ===
                row[i + 1]
            ) {

                row[i] *= 2;

                score += row[i];

                row.splice(
                    i + 1,
                    1
                );

            }

        }

        while (
            row.length < 4
        ) {

            row.push(0);

        }

        return row;

    }

    function moveLeft() {

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            grid[r] =
                merge(
                    grid[r]
                );

        }

    }

    function reverseRows() {

        grid =
            grid.map(
                row =>
                    row.reverse()
            );

    }

    function transpose() {

        const next =
            Array.from(
                {length: 4},
                () => Array(4).fill(0)
            );

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            for (
                let c = 0;
                c < 4;
                c++
            ) {

                next[c][r] =
                    grid[r][c];

            }

        }

        grid = next;

    }

    function move(direction) {

        if (gameOver) {
            return;
        }

        if (
            direction === "left"
        ) {

            moveLeft();

        }

        if (
            direction === "right"
        ) {

            reverseRows();

            moveLeft();

            reverseRows();

        }

        if (
            direction === "up"
        ) {

            transpose();

            moveLeft();

            transpose();

        }

        if (
            direction === "down"
        ) {

            transpose();

            reverseRows();

            moveLeft();

            reverseRows();

            transpose();

        }

        addTile();

        render();

        if (
            hasWon()
        ) {

            setStatus(
                "🏆 You reached 2048!"
            );

        } else if (
            !canMove()
        ) {

            gameOver = true;

            setStatus(
                "💀 Game Over — Score: " +
                score
            );

        }

    }

    function hasWon() {

        return grid.some(
            row =>
                row.includes(2048)
        );

    }

    function canMove() {

        for (
            let r = 0;
            r < 4;
            r++
        ) {

            for (
                let c = 0;
                c < 4;
                c++
            ) {

                if (
                    grid[r][c] === 0
                ) {

                    return true;

                }

                if (
                    c < 3 &&
                    grid[r][c] ===
                    grid[r][c + 1]
                ) {

                    return true;

                }

                if (
                    r < 3 &&
                    grid[r][c] ===
                    grid[r + 1][c]
                ) {

                    return true;

                }

            }

        }

        return false;

    }

    function render() {

        board.innerHTML = "";

        grid.forEach(
            row => {

                row.forEach(
                    value => {

                        const cell =
                            document.createElement(
                                "div"
                            );

                        cell.className =
                            "cell";

                        cell.textContent =
                            value || "";

                        board.appendChild(
                            cell
                        );

                    }
                );

            }
        );

        setScore(
            "Score",
            score
        );

    }

    document.onkeydown =
        function(e) {

            if (
                e.key ===
                "ArrowLeft"
            ) {

                move("left");

            }

            if (
                e.key ===
                "ArrowRight"
            ) {

                move("right");

            }

            if (
                e.key ===
                "ArrowUp"
            ) {

                move("up");

            }

            if (
                e.key ===
                "ArrowDown"
            ) {

                move("down");

            }

        };

    setStatus(
        "🔢 2048"
    );

    setInstructions(
        "Use the arrow keys to combine matching tiles. Reach 2048."
    );

    addTile();
    addTile();

    render();

}

function loadMemory() {

    CURRENT_GAME = {
        restart: startMemory
    };

function startMemory() {

    clearGame();

    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "card-grid";

    GAME_CONTAINER.appendChild(
        grid
    );

    const symbols = [
        "🍎",
        "🍌",
        "🍇",
        "🍉",
        "🍒",
        "🥝",
        "🍋",
        "🍊"
    ];

    const cards =
        [...symbols, ...symbols]
        .sort(
            () =>
                Math.random() - .5
        );

    let first = null;
    let lock = false;
    let matches = 0;
    let moves = 0;

    cards.forEach(
        symbol => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            card.textContent =
                "❓";

            card.addEventListener(
                "click",
                function() {

                    if (
                        lock ||
                        card === first ||
                        card.classList.contains(
                            "matched"
                        )
                    ) {

                        return;

                    }

                    card.textContent =
                        symbol;

                    card.classList.add(
                        "flipped"
                    );

                    if (!first) {

                        first = card;

                        return;

                    }

                    moves++;

                    if (
                        first.textContent ===
                        card.textContent
                    ) {

                        first.classList.add(
                            "matched"
                        );

                        card.classList.add(
                            "matched"
                        );

                        first = null;

                        matches++;

                        if (
                            matches ===
                            symbols.length
                        ) {

                            setStatus(
                                "🏆 You won in " +
                                moves +
                                " moves!"
                            );

                        }

                    } else {

                        lock = true;

                        trackedTimeout(
                            () => {

                                first.textContent =
                                    "❓";

                                card.textContent =
                                    "❓";

                                first.classList.remove(
                                    "flipped"
                                );

                                card.classList.remove(
                                    "flipped"
                                );

                                first = null;

                                lock = false;

                            },
                            700
                        );

                    }

                }
            );

            grid.appendChild(card);

        }
    );

    setStatus(
        "🧠 Memory Match"
    );

    setInstructions(
        "Flip two cards at a time and match every pair."
    );

}

function loadTicTacToe() {

    CURRENT_GAME = {
        restart: startTicTacToe
    };

    startTicTacToe();

}

function startTicTacToe() {

    clearGame();

    const board =
        document.createElement(
            "div"
        );

    board.className =
        "board";

    board.style.gridTemplateColumns =
        "repeat(3, 70px)";

    GAME_CONTAINER.appendChild(
        board
    );

    let cells =
        Array(9).fill("");

    let turn = "X";
    let finished = false;

    const wins = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    function winner() {

        for (
            const [a,b,c]
            of wins
        ) {

            if (
                cells[a] &&
                cells[a] === cells[b] &&
                cells[a] === cells[c]
            ) {

                return cells[a];

            }

        }

        if (
            cells.every(
                value => value !== ""
            )
        ) {

            return "draw";

        }

        return null;

    }

    cells.forEach(
        (_, index) => {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";

            cell.addEventListener(
                "click",
                () => {

                    if (
                        finished ||
                        cells[index]
                    ) {

                        return;

                    }

                    cells[index] =
                        turn;

                    cell.textContent =
                        turn;

                    const result =
                        winner();

                    if (result) {

                        finished = true;

                        setStatus(
                            result === "draw"
                            ? "🤝 Draw!"
                            : "🏆 " +
                              result +
                              " wins!"
                        );

                        return;

                    }

                    turn =
                        turn === "X"
                        ? "O"
                        : "X";

                    setStatus(
                        "Player " +
                        turn +
                        "'s turn"
                    );

                }
            );

            board.appendChild(cell);

        }
    );

    setStatus(
        "⭕ Tic-Tac-Toe — X's turn"
    );

    setInstructions(
        "Click an empty square. Get three in a row."
    );

}


/* ==========================================================
   CONNECT FOUR
   ========================================================== */

function loadConnectFour() {

    CURRENT_GAME = {
        restart: startConnectFour
    };

    startConnectFour();

}

function startConnectFour() {

    clearGame();

    const board =
        document.createElement(
            "div"
        );

    board.className =
        "board";

    board.style.gridTemplateColumns =
        "repeat(7, 55px)";

    GAME_CONTAINER.appendChild(
        board
    );

    const rows = 6;
    const cols = 7;

    let grid =
        Array.from(
            {length: rows},
            () => Array(cols).fill("")
        );

    let turn = "🔴";
    let finished = false;

    function checkWin(
        row,
        col
    ) {

        const player =
            grid[row][col];

        const directions = [
            [0,1],
            [1,0],
            [1,1],
            [1,-1]
        ];

        for (
            const [dr, dc]
            of directions
        ) {

            let count = 1;

            for (
                let d = 1;
                d < 4;
                d++
            ) {

                const r =
                    row + dr * d;

                const c =
                    col + dc * d;

                if (
                    r < 0 ||
                    r >= rows ||
                    c < 0 ||
                    c >= cols ||
                    grid[r][c] !== player
                ) {

                    break;

                }

                count++;

            }

            for (
                let d = 1;
                d < 4;
                d++
            ) {

                const r =
                    row - dr * d;

                const c =
                    col - dc * d;

                if (
                    r < 0 ||
                    r >= rows ||
                    c < 0 ||
                    c >= cols ||
                    grid[r][c] !== player
                ) {

                    break;

                }

                count++;

            }

            if (count >= 4) {
                return true;
            }

        }

        return false;

    }

    function render() {

        board.innerHTML = "";

        for (
            let r = 0;
            r < rows;
            r++
        ) {

            for (
                let c = 0;
                c < cols;
                c++
            ) {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "cell";

                cell.textContent =
                    grid[r][c];

                cell.addEventListener(
                    "click",
                    () => drop(c)
                );

                board.appendChild(cell);

            }

        }

    }

    function drop(col) {

        if (finished) {
            return;
        }

        for (
            let r = rows - 1;
            r >= 0;
            r--
        ) {

            if (!grid[r][col]) {

                grid[r][col] =
                    turn;

                render();

                if (
                    checkWin(r, col)
                ) {

                    finished = true;

                    setStatus(
                        "🏆 " +
                        turn +
                        " wins!"
                    );

                    return;

                }

                if (
                    grid.every(
                        row =>
                            row.every(
                                cell =>
                                    cell
                            )
                    )
                ) {

                    finished = true;

                    setStatus(
                        "🤝 Draw!"
                    );

                    return;

                }

                turn =
                    turn === "🔴"
                    ? "🟡"
                    : "🔴";

                setStatus(
                    turn +
                    " turn"
                );

                return;

            }

        }

    }

    setStatus(
        "🔴 Connect Four"
    );

    setInstructions(
        "Click a column to drop your piece. Connect four."
    );

    render();

}

/* ==========================================================
   TARGET SHOOTER
   ========================================================== */

function loadTargetShooter() {

    CURRENT_GAME = {
        restart: startTargetShooter
    };

    startTargetShooter();

}

function startTargetShooter() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 700;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(
        canvas
    );

    const ctx =
        canvas.getContext("2d");

    let score = 0;
    let shots = 0;
    let time = 20;
    let running = true;

    let target = null;

    function newTarget() {

        target = {
            x:
                45 +
                Math.random() * 610,

            y:
                45 +
                Math.random() * 410,

            radius: 27
        };

    }

    function draw() {

        ctx.fillStyle = "#000";

        ctx.fillRect(
            0,
            0,
            700,
            500
        );

        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            target.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#fff";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            target.x,
            target.y,
            9,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#000";

        ctx.fill();

        setScore(
            "Hits",
            score
        );

    }

    canvas.addEventListener(
        "pointerdown",
        e => {

            if (!running) {
                return;
            }

            const rect =
                canvas.getBoundingClientRect();

            const scaleX =
                canvas.width /
                rect.width;

            const scaleY =
                canvas.height /
                rect.height;

            const x =
                (
                    e.clientX -
                    rect.left
                ) *
                scaleX;

            const y =
                (
                    e.clientY -
                    rect.top
                ) *
                scaleY;

            shots++;

            const distance =
                Math.hypot(
                    x - target.x,
                    y - target.y
                );

            if (
                distance <=
                target.radius
            ) {

                score++;

                newTarget();

            }

            draw();

        }
    );

    newTarget();

    setInstructions(
        "Click the target as many times as possible in 20 seconds."
    );

    const timer =
        trackedInterval(
            () => {

                time--;

                setStatus(
                    "🎯 Time: " +
                    time
                );

                if (time <= 0) {

                    running = false;

                    setStatus(
                        "🏆 Finished! " +
                        score +
                        " hits out of " +
                        shots +
                        " shots."
                    );

                }

            },
            1000
        );

    setStatus(
        "🎯 Target Shooter"
    );

    draw();

}


/* ==========================================================
   DODGE BATTLE
   ========================================================== */

function loadDodge() {

    CURRENT_GAME = {
        restart: startDodge
    };

    startDodge();

}

function startDodge() {

    clearGame();

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 600;
    canvas.height = 500;

    GAME_CONTAINER.appendChild(
        canvas
    );

    const ctx =
        canvas.getContext("2d");

    let player = {
        x: 285,
        y: 450,
        size: 30
    };

    let enemies = [];

    let running = true;
    let score = 0;
    let lastSpawn = 0;

    const keys = {};

    document.onkeydown =
        e => {

            keys[e.key] = true;

        };

    document.onkeyup =
        e => {

            keys[e.key] = false;

        };

    setStatus(
        "🥊 Dodge Battle"
    );

    setInstructions(
        "Use Arrow Left and Arrow Right to dodge the falling blocks."
    );

    function spawn() {

        enemies.push({
            x:
                Math.random() *
                570,

            y: -30,

            size: 30,

            speed:
                2 +
                Math.random() * 3
        });

    }

    function collision(a, b) {

        return (
            a.x <
                b.x + b.size &&
            a.x + a.size >
                b.x &&
            a.y <
                b.y + b.size &&
            a.y + a.size >
                b.y
        );

    }

    function update(timestamp) {

        if (!running) {
            return;
        }

        if (
            keys.ArrowLeft
        ) {

            player.x -= 6;

        }

        if (
            keys.ArrowRight
        ) {

            player.x += 6;

        }

        player.x =
            Math.max(
                0,
                Math.min(
                    570,
                    player.x
                )
            );

        if (
            timestamp -
            lastSpawn >
            600
        ) {

            spawn();

            lastSpawn =
                timestamp;

        }

        enemies.forEach(
            enemy => {

                enemy.y +=
                    enemy.speed;

                if (
                    collision(
                        player,
                        enemy
                    )
                ) {

                    running = false;

                    setStatus(
                        "💀 Game Over — " +
                        Math.floor(
                            score / 10
                        ) +
                        " seconds"
                    );

                }

            }
        );

        enemies =
            enemies.filter(
                enemy =>
                    enemy.y < 550
            );

        score++;

        ctx.fillStyle =
            "#000";

        ctx.fillRect(
            0,
            0,
            600,
            500
        );

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            player.x,
            player.y,
            player.size,
            player.size
        );

        enemies.forEach(
            enemy => {

                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.size,
                    enemy.size
                );

            }
        );

        setScore(
            "Survival",
            Math.floor(
                score / 60
            )
        );

        if (running) {

            requestAnimationFrame(
                update
            );

        }

    }

    requestAnimationFrame(
        update
    );

}

        loadTrivia,

    word_challenge:
        loadTrivia

};


/* ==========================================================
   STRICT LAUNCHER
   ========================================================== */

function launchGame() {

    const engine =
        PLAYABLE_GAMES[GAME_ID];

    if (
        typeof engine !==
        "function"
    ) {

        clearGame();

        setStatus(
            "⚠️ Game not available yet"
        );

        setInstructions(
            "This game is registered, but a real playable engine has not been installed yet."
        );

        GAME_CONTAINER.innerHTML = `
            <div class="big-message">

                <div style="font-size:80px">
                    🎮
                </div>

                <h2>
                    ${GAME_NAME}
                </h2>

                <p>
                    This game is temporarily disabled
                    until its real game engine is ready.
                </p>

                <p>
                    No placeholder game is being shown.
                </p>

            </div>
        `;

        return;

    }

    try {

        engine();

    } catch (error) {

        console.error(
            "Game engine error:",
            error
        );

        clearGame();

        setStatus(
            "❌ Game failed to load"
        );

        setInstructions(
            "The game engine encountered an error. Check the browser console for details."
        );

        GAME_CONTAINER.innerHTML = `
            <div class="big-message">

                <div style="font-size:70px">
                    ⚠️
                </div>

                <h2>
                    ${GAME_NAME}
                </h2>

                <p>
                    The game could not be started.
                </p>

            </div>
        `;

    }

}


/* ==========================================================
   START
   ========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        launchGame();

    }
);

</script>
