            return;
        }

        if(type==="free"){

            log(
                p.name+
                " landed on Free Parking."
            );

            nextTurn();

            return;
        }

        if(type==="tax"){

            p.money-=space[2];

            log(
                p.name+
                " paid $"+
                space[2]+
                " in taxes."
            );

            checkBankruptcy(p);

            nextTurn();

            return;
        }

        if(type==="chance"){

            const amount=
                [-150,-100,50,100,150]
                [
                    Math.floor(
                        Math.random()*5
                    )
                ];

            p.money+=amount;

            log(
                p.name+
                (
                    amount>=0
                    ? " received $"
                    : " paid $"
                )+
                Math.abs(amount)+
                " from Chance."
            );

            checkBankruptcy(p);

            nextTurn();

            return;
        }

        if(type==="community"){

            const amount=
                [50,100,150,-50]
                [
                    Math.floor(
                        Math.random()*4
                    )
                ];

            p.money+=amount;

            log(
                p.name+
                " drew community card: "+
                (amount>=0?"+":"")+
                "$"+
                amount
            );

            checkBankruptcy(p);

            nextTurn();

            return;
        }

        if(type==="property"){

            const owner=space.owner;

            if(owner===undefined){

                if(p.human){

                    pendingProperty=p.pos;

                    $("#monoBuy").style.display=
                        "inline-block";

                    $("#monoSkip").style.display=
                        "inline-block";

                    log(
                        `${space[0]} costs $${space[2]}. Buy it?`
                    );

                    return;

                }else{

                    if(p.money>=space[2]){

                        space.owner=
                            players.indexOf(p);

                        p.money-=space[2];

                        log(
                            p.name+
                            " bought "+
                            space[0]
                        );
                    }

                    nextTurn();

                    return;
                }
            }

            if(owner!==players.indexOf(p)){

                const rent=space[3];

                const landlord=
                    players[owner];

                p.money-=rent;

                landlord.money+=rent;

                log(
                    p.name+
                    " paid $"+
                    rent+
                    " rent to "+
                    landlord.name
                );

                checkBankruptcy(p);
            }

            nextTurn();
        }
    }

    function buyProperty(){

        if(pendingProperty===null)return;

        const p=players[current];

        const space=
            spaces[pendingProperty];

        if(p.money>=space[2]){

            space.owner=current;

            p.money-=space[2];

            log(
                "You bought "+
                space[0]+
                " for $"+
                space[2]
            );
        }

        pendingProperty=null;

        $("#monoBuy").style.display="none";
        $("#monoSkip").style.display="none";

        render();

        timer(
            nextTurn,
            500
        );
    }

    function checkBankruptcy(p){

        if(p.money>=0){
            return;
        }

        p.alive=false;

        log(
            p.name+
            " is bankrupt!"
        );

        spaces.forEach(s=>{

            if(
                s.owner===
                players.indexOf(p)
            ){
                delete s.owner;
            }
        });

        const alive=
            players.filter(
                x=>x.alive
            );

        if(alive.length<=1){

            gameEnded=true;

            if(alive.length===1){

                log(
                    "🏆 "+
                    alive[0].name+
                    " wins!"
                );
            }

            render();

            return true;
        }

        return true;
    }

    function nextTurn(){

        if(gameEnded)return;

        $("#monoBuy").style.display="none";
        $("#monoSkip").style.display="none";

        let attempts=0;

        do{

            current=
                (current+1)%
                players.length;

            attempts++;

        }while(
            !players[current].alive &&
            attempts<players.length
        );

        render();
        updateTurn();
    }

    function aiTurn(){

        if(gameEnded)return;

        const p=players[current];

        if(p.human)return;

        const d1=
            1+Math.floor(Math.random()*6);

        const d2=
            1+Math.floor(Math.random()*6);

        log(
            p.name+
            " rolled "+
            d1+
            " + "+
            d2
        );

        movePlayer(
            p,
            d1+d2
        );
    }

    $("#monoRoll").onclick=rollDice;
    $("#monoBuy").onclick=buyProperty;

    $("#monoSkip").onclick=()=>{

        pendingProperty=null;

        $("#monoBuy").style.display="none";
        $("#monoSkip").style.display="none";

        nextTurn();
    };

    $("#monoRestart").onclick=reset;

    reset();
}


/* ==========================================================
   RACE CAR RACING
   ========================================================== */

function raceCarGame(){

    html(`
        <div class="panel">

            <div class="game-title">
                🏎️ Race Car Racing
            </div>

            <div class="score">
                Distance:
                <b id="raceScore">0</b> m
            </div>

            <canvas id="raceCanvas"
                    width="360"
                    height="640">
            </canvas>

            <div class="controls">

                <button id="raceLeft">
                    ⬅️ LEFT
                </button>

                <button id="raceStart"
                        class="primary">
                    START
                </button>

                <button id="raceRight">
                    RIGHT ➡️
                </button>

            </div>

            <div class="help">
                Use buttons, A/D, or ← →
                keys to dodge traffic.
            </div>

        </div>
    `);

    const canvas=$("#raceCanvas");
    const ctx=canvas.getContext("2d");

    const lanes=[
        80,
        180,
        280
    ];

    let playerLane=1;
    let enemies=[];
    let running=false;
    let distance=0;
    let speed=260;
    let last=0;
    let raf;

    function reset(){

        playerLane=1;
        enemies=[];
        running=false;
        distance=0;
        speed=260;
        last=0;

        $("#raceScore").textContent=0;

        draw();
    }

    function left(){
        playerLane=
            Math.max(
                0,
                playerLane-1
            );
    }

    function right(){
        playerLane=
            Math.min(
                2,
                playerLane+1
            );
    }

    $("#raceLeft").onclick=left;
    $("#raceRight").onclick=right;

    function key(e){

        if(
            e.key==="ArrowLeft" ||
            e.key.toLowerCase()==="a"
        ){

            e.preventDefault();

            left();
        }

        if(
            e.key==="ArrowRight" ||
            e.key.toLowerCase()==="d"
        ){

            e.preventDefault();

            right();
        }

        if(
            e.key===" " &&
            !running
        ){
            start();
        }
    }

    document.addEventListener(
        "keydown",
        key
    );

    function start(){

        enemies=[];
        distance=0;
        speed=260;
        playerLane=1;
        running=true;
        last=performance.now();

        $("#raceScore").textContent=0;

        loop(last);
    }

    function spawn(){

        const lane=
            Math.floor(
                Math.random()*3
            );

        if(
            enemies.some(
                e=>
                    e.lane===lane &&
                    e.y<160
            )
        ){
            return;
        }

        enemies.push({
            lane,
            y:-100,
            w:48,
            h:82
        });
    }

    function loop(t){

        if(!running)return;

        const dt=
            Math.min(
                .035,
                (t-last)/1000
            );

        last=t;

        speed+=dt*5;

        distance+=
            dt*
            speed*
            .1;

        if(Math.random()<.025){
            spawn();
        }

        enemies.forEach(
            e=>{
                e.y+=speed*dt;
            }
        );

        enemies=
            enemies.filter(
                e=>e.y<700
            );

        const py=520;
        const px=lanes[playerLane];

        for(const e of enemies){

            const ex=
                lanes[e.lane];

            if(
                Math.abs(ex-px)<48 &&
                e.y<py+70 &&
                e.y+e.h>py
            ){

                running=false;

                timer(()=>{
                    alert(
                        "💥 Crash!\n\nDistance: "+
                        Math.floor(distance)+
                        " m"
                    );
                },20);

                draw();

                return;
            }
        }

        $("#raceScore").textContent=
            Math.floor(distance);

        draw();

        raf=
            requestAnimationFrame(loop);

        activeFrames.push(raf);
    }

    function draw(){

        ctx.fillStyle="#151515";
        ctx.fillRect(
            0,
            0,
            360,
            640
        );

        ctx.fillStyle="#333";
        ctx.fillRect(
            25,
            0,
            310,
            640
        );

        ctx.fillStyle="#d8d8d8";

        ctx.fillRect(
            20,
            0,
            5,
            640
        );

        ctx.fillRect(
            335,
            0,
            5,
            640
        );

        ctx.strokeStyle="#aaa";
        ctx.lineWidth=4;
        ctx.setLineDash([
            30,
            30
        ]);

        ctx.beginPath();
        ctx.moveTo(130,0);
        ctx.lineTo(130,640);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(230,0);
        ctx.lineTo(230,640);
        ctx.stroke();

        ctx.setLineDash([]);

        const px=lanes[playerLane];

        ctx.fillStyle="#3498db";

        ctx.fillRect(
            px-24,
            520,
            48,
            82
        );

        ctx.fillStyle="#111";

        ctx.fillRect(
            px-18,
            530,
            36,
            18
        );

        ctx.fillRect(
            px-18,
            575,
            36,
            18
        );

        enemies.forEach(e=>{

            const x=
                lanes[e.lane];

            ctx.fillStyle="#e74c3c";

            ctx.fillRect(
                x-24,
                e.y,
                e.w,
                e.h
            );

            ctx.fillStyle="#111";

            ctx.fillRect(
                x-18,
                e.y+10,
                36,
                16
            );

            ctx.fillRect(
                x-18,
                e.y+55,
                36,
                16
            );
        });

        if(!running){

            ctx.fillStyle="#fff";

            ctx.textAlign="center";

            ctx.font=
                "bold 26px Arial";

            ctx.fillText(
                "TAP START",
                180,
                320
            );
        }
    }

    $("#raceStart").onclick=()=>{
        if(!running){
            start();
        }
    };

    reset();

    activeCleanup=()=>{

        document.removeEventListener(
            "keydown",
            key
        );

        cancelAnimationFrame(raf);
    };
}


/* ==========================================================
   DIRTY MINDS — MULTIPLAYER WITH HOST CONTROLS
   ========================================================== */

function dirtyMindsGame(){

    const params = new URLSearchParams(window.location.search);

    let roomId = params.get("room") || "";
    let playerId = params.get("player_id") || "";
    let playerName = params.get("player_name") || "";

    let room = null;
    let pollId = null;
    let joined = false;
    let isHost = false;

    function createPlayerId(){
        return "web_" + Date.now() + "_" + Math.random().toString(36).slice(2,9);
    }

    if(!playerId){
        playerId = createPlayerId();
    }

    function hostStorageKey(){
        return roomId ? "dirty_minds_host_" + roomId : "";
    }

    function saveHost(){
        if(!roomId) return;
        try{
            if(isHost){
                localStorage.setItem(hostStorageKey(), playerId);
            }
        }catch(e){
            console.warn("Unable to save host state", e);
        }
    }

    function loadHost(){
        if(!roomId) return false;
        try{
            return String(localStorage.getItem(hostStorageKey()) || "") === String(playerId);
        }catch(e){
            return false;
        }
    }

    html(`
        <div class="panel dm-lobby">

            <div class="game-title">
                🧠 Dirty Minds
            </div>

            <p class="help">
                Multiplayer party game for your group.
            </p>

            <div id="dmSetup">

                <input id="dmName"
                       placeholder="Enter your player name"
                       maxlength="40"
                       value="${escapeHtml(playerName)}"
                       autocomplete="nickname">

                <div style="margin-top:14px">
                    <input id="dmRoom"
                           placeholder="Room code"
                           maxlength="12"
                           value="${escapeHtml(roomId)}"
                           autocomplete="off">
                </div>

                <div class="controls">
                    <button id="dmCreate" class="primary">🎮 Create Game</button>
                    <button id="dmJoin">🔗 Join Room</button>
                </div>

                <div id="dmError" class="status" style="color:#ff7777"></div>

            </div>

            <div id="dmGame" style="display:none">

                <div id="dmRoomLabel" class="status"></div>
                <div id="dmHostBadge" style="text-align:center"></div>
                <div id="dmPhase"></div>
                <div id="dmPlayers" class="dm-players"></div>

                <div class="controls">
                    <button id="dmStart" class="primary" style="display:none">▶️ Start Game</button>
                    <button id="dmShare" class="dm-share" style="display:none">📋 Copy Invite Link</button>
                    <button id="dmReveal" class="gold" style="display:none">👀 Reveal Answer</button>
                    <button id="dmNext" class="primary" style="display:none">➡️ Next Round</button>
                </div>

            </div>

        </div>
    `);

    const API = "/real-games";

    const nameInput = $("#dmName");
    const roomInput = $("#dmRoom");

    function myName(){
        return (nameInput.value.trim() || "Player").slice(0,40);
    }

    async function api(url, options={}){
        const response = await fetch(url, {
            ...options,
            headers:{
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        let data;
        try{
            data = await response.json();
        }catch(e){
            throw new Error("Invalid server response.");
        }

        if(!response.ok){
            throw new Error(data.error || data.message || "Request failed.");
        }

        return data;
    }

    function showError(msg){
        const el = $("#dmError");
        if(el) el.textContent = msg || "";
    }

    function getReturnedRoom(data){
        return data && (data.room || data.data || null);
    }

    function establishHostFromRoom(){
        if(!room) return;

        const backendHost = room.host_id || room.host_player_id || room.host;

        if(backendHost){
            room.host_id = String(backendHost);
            isHost = String(backendHost) === String(playerId);
            if(isHost) saveHost();
            return;
        }

        if(loadHost()){
            isHost = true;
            room.host_id = room.host_id || playerId;
        }
    }

    async function createGame(){
        showError("");
        const name = myName();

        try{
            const data = await api(API + "/create-room", {
                method: "POST",
                body: JSON.stringify({
                    game_id: "dirty_minds",
                    player_id: playerId,
                    player_name: name
                })
            });

            roomId = data.room_id || (data.room && data.room.room_id) || "";
            room = getReturnedRoom(data);

            if(!roomId){
                throw new Error("No room code returned.");
            }

            isHost = true;
            if(!room) room = {};
            room.room_id = roomId;
            room.host_id = playerId;

            saveHost();
            roomInput.value = roomId;
            joined = true;

            history.replaceState({}, "", "?room=" + encodeURIComponent(roomId) + "&player_id=" + encodeURIComponent(playerId) + "&player_name=" + encodeURIComponent(name));

            showGame();
            startPolling();

        }catch(err){
            showError(err.message);
        }
    }

    async function joinGame(){
        showError("");

        try{
            roomId = roomInput.value.trim().toUpperCase();

            if(!roomId){
                showError("Enter a room code first.");
                return;
            }

            const data = await api(API + "/room/" + encodeURIComponent(roomId) + "/join", {
                method: "POST",
                body: JSON.stringify({
                    player_id: playerId,
                    player_name: myName()
                })
            });

            room = getReturnedRoom(data);
            joined = true;

            establishHostFromRoom();

            history.replaceState({}, "", "?room=" + encodeURIComponent(roomId) + "&player_id=" + encodeURIComponent(playerId) + "&player_name=" + encodeURIComponent(myName()));

            showGame();
            startPolling();

        }catch(err){
            showError(err.message);
        }
    }

    function showGame(){
        const setup = $("#dmSetup");
        const game = $("#dmGame");

        if(setup) setup.style.display = "none";
        if(game) game.style.display = "block";

        renderRoom();
    }

    async function refresh(){
        if(!roomId) return;

        try{
            const data = await api(API + "/room/" + encodeURIComponent(roomId));
            const newRoom = getReturnedRoom(data);

            if(!newRoom) return;

            const previousHostId = room && room.host_id ? room.host_id : null;
            room = newRoom;

            if(!room.host_id && previousHostId){
                room.host_id = previousHostId;
            }

            if(!room.host_id && loadHost()){
                room.host_id = playerId;
            }

            establishHostFromRoom();

            if(!joined){
                joined = true;
                showGame();
            }

            renderRoom();

        }catch(err){
            console.error("Dirty Minds refresh error:", err);
        }
    }

    function startPolling(){
        if(pollId) clearInterval(pollId);
        pollId = setInterval(refresh, 1000);
        activeIntervals.push(pollId);
        refresh();
    }

    function getStatus(){
        if(!room) return "waiting";
        if(room.finished || room.game_over) return "finished";
        if(room.status) return String(room.status).toLowerCase();
        if(room.phase){
            const p = String(room.phase).toLowerCase();
            if(p === "question" || p === "playing") return "playing";
            if(p === "reveal" || p === "revealed") return "revealed";
        }
        if(room.started) return "playing";
        return "waiting";
    }

    function getClue(){
        return room.clue || room.question || room.current_clue || (room.data && room.data.clue) || "";
    }

    function getRevealedAnswer(){
        return room.answer || room.current_answer || (room.data && room.data.answer) || "";
    }

    function renderRoom(){
        if(!room) return;

        const players = Array.isArray(room.players) ? room.players : [];
        const roomCode = room.room_id || roomId;

        establishHostFromRoom();

        $("#dmRoomLabel").innerHTML = `Room: <b>${escapeHtml(roomCode)}</b> · ${players.length} player${players.length === 1 ? "" : "s"}`;

        const hostBadge = $("#dmHostBadge");
        if(hostBadge){
            hostBadge.innerHTML = isHost ? `<span class="dm-host-badge">👑 YOU ARE THE HOST</span>` : "";
        }

        const playersEl = $("#dmPlayers");
        playersEl.innerHTML = "";

        players.forEach(p => {
            const row = document.createElement("div");
            row.className = "dm-player";

            if(String(p.player_id) === String(playerId)){
                row.classList.add("me");
            }

            const answered = room.answers && room.answers[p.player_id];
            const isHostPlayer = room.host_id && String(p.player_id) === String(room.host_id);

            row.innerHTML = `
                <span>
                    ${escapeHtml(p.name || p.player_name || "Player")}
                    ${isHostPlayer ? " 👑" : ""}
                </span>
                <span>
                    ${room.started ? (p.score ?? 0) + " pts" : ""}
                    ${answered ? '<span class="dm-submitted"> ✓</span>' : ""}
                </span>
            `;

            playersEl.appendChild(row);
        });

        const status = getStatus();

        const startButton = $("#dmStart");
        const shareButton = $("#dmShare");
        const revealButton = $("#dmReveal");
        const nextButton = $("#dmNext");

        /* ONLY HOST SEES START, REVEAL, NEXT */
        if(startButton){
            startButton.style.display = isHost && !room.started && !room.finished ? "inline-block" : "none";
        }

        if(shareButton){
            shareButton.style.display = !room.started && !room.finished ? "inline-block" : "none";
        }

        if(revealButton){
            revealButton.style.display = isHost && room.started && (status === "playing" || status === "question") ? "inline-block" : "none";
        }

        if(nextButton){
            nextButton.style.display = isHost && room.started && (status === "revealed" || status === "reveal") ? "inline-block" : "none";
        }

        if(!room.started && !room.finished){
            $("#dmPhase").innerHTML = `
                <div class="dm-question">👥 Waiting for Players</div>
                <div class="help">
                    Room Code:
                    <div class="dm-room-code">${escapeHtml(roomCode)}</div>
                    Give this code to everyone who wants to play.<br><br>
                    ${isHost ? `<b>👑 You are the host.</b><br>When everyone has joined, press <b>▶️ Start Game</b>.` : `Waiting for the host to start the game...`}
                </div>
            `;
            return;
        }

        if(room.finished || status === "finished"){
            const winner = room.winner;
            $("#dmPhase").innerHTML = `
                <div class="dm-question">🏆 GAME OVER</div>
                <div class="dm-answer">
                    ${winner ? escapeHtml(winner.name || winner.player_name || "Winner") + " — " + (winner.score ?? 0) + " points" : "Game Complete"}
                </div>
            `;
            return;
        }

        if(status === "playing" || status === "question"){
            renderQuestion();
            return;
        }

        if(status === "revealed" || status === "reveal"){
            renderReveal();
            return;
        }
    }

    function renderQuestion(){
        const clue = getClue();
        const answered = room.answers && room.answers[playerId];

        $("#dmPhase").innerHTML = `
            <div class="status">Round <b>${room.round || 1}</b> of <b>${room.total_rounds || 10}</b></div>

            <div class="dm-question">
                ${clue ? escapeHtml(clue) : "Loading clue..."}
            </div>

            <div>
                <input id="dmAnswer"
                       maxlength="200"
                       autocomplete="off"
                       placeholder="What's your answer?"
                       ${answered ? "disabled" : ""}>
            </div>

            <div class="controls">
                <button id="dmSubmit" class="primary" ${answered ? "disabled" : ""}>
                    ${answered ? "✓ Answer Submitted" : "Submit Answer"}
                </button>
            </div>

            ${answered ? `<div class="status" style="color:#6ee7a0">✓ Your answer has been submitted. Waiting for the reveal.</div>` : ""}
        `;

        const submit = $("#dmSubmit");
        if(submit) submit.onclick = submitAnswer;

        const answerInput = $("#dmAnswer");
        if(answerInput){
            answerInput.addEventListener("keydown", e => {
                if(e.key === "Enter" && !answered){
                    e.preventDefault();
                    submitAnswer();
                }
            });
        }
    }

    function renderReveal(){
        const clue = getClue();
        const answer = getRevealedAnswer();

        let answersHtml = "";
        const players = Array.isArray(room.players) ? room.players : [];

        players.forEach(p => {
            const submitted = room.answers && room.answers[p.player_id];
            answersHtml += `
                <div class="dm-player">
                    <span>${escapeHtml(p.name || p.player_name || "Player")}</span>
                    <span>${submitted ? escapeHtml(String(submitted)) : "No answer"}</span>
                </div>
            `;
        });

        $("#dmPhase").innerHTML = `
            <div class="status">Round <b>${room.round || 1}</b> of <b>${room.total_rounds || 10}</b></div>
            <div class="dm-question">${escapeHtml(clue)}</div>
            <div class="dm-answer">
                ✅ Innocent Answer:<br><br>
                ${escapeHtml(answer)}
            </div>
            <div class="status">Answers Submitted</div>
            ${answersHtml}
        `;
    }

    async function submitAnswer(){
        const input = $("#dmAnswer");
        if(!input) return;

        const answer = input.value.trim();
        if(!answer){
            alert("Enter an answer first.");
            return;
        }

        const submit = $("#dmSubmit");
        if(submit) submit.disabled = true;

        try{
            await api(API + "/room/" + encodeURIComponent(roomId) + "/dirty-minds/answer", {
                method: "POST",
                body: JSON.stringify({
                    player_id: playerId,
                    answer: answer
                })
            });

            await refresh();

        }catch(err){
            if(submit) submit.disabled = false;
            alert(err.message);
        }
    }

    async function startGame(){
        establishHostFromRoom();

        if(!isHost){
            alert("Only the host can start the game.");
            return;
        }

        if(!roomId){
            alert("No room code is available.");
            return;
        }

        const button = $("#dmStart");
        if(button){
            button.disabled = true;
            button.textContent = "⏳ Starting...";
        }

        try{
            const hostId = room && room.host_id ? room.host_id : playerId;

            await api(API + "/room/" + encodeURIComponent(roomId) + "/dirty-minds/start", {
                method: "POST",
                body: JSON.stringify({
                    player_id: playerId,
                    host_id: hostId
                })
            });

            await refresh();

        }catch(err){
            if(button){
                button.disabled = false;
                button.textContent = "▶️ Start Game";
            }
            alert(err.message);
        }
    }

    async function reveal(){
        if(!isHost){
            alert("Only the host can reveal the answer.");
            return;
        }

        try{
            await api(API + "/room/" + encodeURIComponent(roomId) + "/dirty-minds/reveal", {
                method: "POST",
                body: JSON.stringify({
                    player_id: playerId
                })
            });

            await refresh();

        }catch(err){
            alert(err.message);
        }
    }

    async function nextRound(){
        if(!isHost){
            alert("Only the host can start the next round.");
            return;
        }

        const button = $("#dmNext");
        if(button) button.disabled = true;

        try{
            await api(API + "/room/" + encodeURIComponent(roomId) + "/dirty-minds/next", {
                method: "POST",
                body: JSON.stringify({
                    player_id: playerId
                })
            });

            await refresh();

        }catch(err){
            if(button) button.disabled = false;
            alert(err.message);
        }
    }

    async function copyInvite(){
        if(!roomId) return;

        const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(roomId) + "&game=dirty_minds";

        try{
            await navigator.clipboard.writeText(url);
            const button = $("#dmShare");

            if(button){
                const old = button.textContent;
                button.textContent = "✅ Link Copied!";
                timer(() => { button.textContent = old; }, 2000);
            }
        }catch(err){
            prompt("Copy this invite link:", url);
        }
    }

    $("#dmCreate").onclick = createGame;
    $("#dmJoin").onclick = joinGame;
    $("#dmStart").onclick = startGame;
    $("#dmShare").onclick = copyInvite;
    $("#dmReveal").onclick = reveal;
    $("#dmNext").onclick = nextRound;

    if(roomId){
        timer(joinGame, 100);
    }

    activeCleanup = () => {
        if(pollId){
            clearInterval(pollId);
            pollId = null;
        }
    };
}

/* ==========================================================
   LAUNCH
   ========================================================== */

function launch(){

    clearGame();

    const id = String(GAME_ID)
        .toLowerCase()
        .trim()
        .replaceAll("-","_")
        .replaceAll(" ","_");

    const game = PLAYABLE_GAMES[id];

    if(!game){
        html(`
            <div class="panel">
                <div class="game-title">
                    ❌ Game Not Available
                </div>
                <div class="help">
                    The game engine for <b>${escapeHtml(GAME_ID)}</b> has not been installed.
                </div>
                <div class="controls">
                    <a class="back" href="/real-games/">Return to Real Games</a>
                </div>
            </div>
        `);
        return;
    }

    try{
        game();
    }catch(error){
        console.error("Real Game Error:", error);
        html(`
            <div class="panel">
                <div class="game-title">
                    ⚠️ Game Error
                </div>
                <div class="help">
                    Something went wrong while loading this game.
                </div>
                <div class="controls">
                    <button onclick="location.reload()" class="primary">Reload Game</button>
                </div>
            </div>
        `);
    }
}

document.addEventListener("DOMContentLoaded", function(){
    try{
        launch();
    }catch(error){
        console.error("Launch Error:", error);
    }
});
</script>
