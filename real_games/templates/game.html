<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>{{ game.name|default('Real Game') }} — Melanated AZ Real Games</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:
        max(12px,env(safe-area-inset-top))
        max(12px,env(safe-area-inset-right))
        max(12px,env(safe-area-inset-bottom))
        max(12px,env(safe-area-inset-left));
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
    border-radius:12px;
    padding:12px 16px;
    background:#252525;
    color:#fff;
    font-weight:700;
}

button:hover{
    background:#333;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    outline:none;
}

.page{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.header{
    text-align:center;
    margin-bottom:14px;
}

.header h1{
    margin:4px 0;
    font-size:clamp(24px,6vw,38px);
}

.header p{
    margin:4px 0;
    color:#aaa;
}

.back{
    display:inline-block;
    margin-bottom:8px;
    text-decoration:none;
    color:#fff;
    background:#1c1c1c;
    padding:9px 14px;
    border-radius:10px;
}

#gameArea{
    width:100%;
}

.panel{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
}

.status{
    text-align:center;
    min-height:24px;
    color:#ddd;
    margin:8px 0 12px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:12px;
}

.primary{
    background:#7c3aed;
}

.success{
    background:#16803c;
}

.danger{
    background:#9b2525;
}

.gold{
    background:#9a7415;
}

canvas{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    margin:0 auto;
    background:#050505;
    border:1px solid #333;
    border-radius:14px;
    touch-action:none;
}

.game-title{
    text-align:center;
    font-size:22px;
    font-weight:800;
    margin-bottom:8px;
}

.score{
    text-align:center;
    font-size:18px;
    margin:8px;
}

.help{
    color:#aaa;
    text-align:center;
    line-height:1.5;
}

.dpad{
    width:220px;
    margin:12px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.dpad button{
    min-height:52px;
    font-size:22px;
}

.dpad .up{
    grid-column:2;
}

.dpad .left{
    grid-column:1;
    grid-row:2;
}

.dpad .down{
    grid-column:2;
    grid-row:2;
}

.dpad .right{
    grid-column:3;
    grid-row:2;
}

/* ==========================================================
   2048
   ========================================================== */

.grid2048{
    width:min(94vw,430px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    padding:7px;
    background:#333;
    border-radius:12px;
}

.tile2048{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:#555;
    font-size:clamp(20px,7vw,38px);
    font-weight:900;
    min-width:0;
}

.tile2048:not(:empty){
    background:#8b5a2b;
}

/* ==========================================================
   MEMORY
   ========================================================== */

.memory-grid{
    width:min(94vw,480px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.memory-card{
    aspect-ratio:1;
    border-radius:12px;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(24px,8vw,42px);
    border:2px solid #333;
}

.memory-card.flipped,
.memory-card.matched{
    background:#53338b;
}

/* ==========================================================
   WHACK
   ========================================================== */

.mole-grid{
    width:min(94vw,450px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.hole{
    aspect-ratio:1;
    border-radius:50%;
    background:#151515;
    border:4px solid #292929;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(28px,10vw,60px);
}

/* ==========================================================
   CHESS / CHECKERS
   ========================================================== */

.board{
    width:min(94vw,560px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:4px solid #333;
    touch-action:manipulation;
}

.square{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:clamp(25px,8vw,58px);
    user-select:none;
}

.chess-light{
    background:#d8b98c;
}

.chess-dark{
    background:#765433;
}

.square.selected{
    outline:4px solid #5ee7ff;
    outline-offset:-4px;
}

.square.move{
    box-shadow:inset 0 0 0 5px rgba(80,220,120,.7);
}

.square.capture{
    box-shadow:inset 0 0 0 5px rgba(240,70,70,.8);
}

.checker-dark{
    background:#151515;
}

.checker-light{
    background:#ddd;
}

.checker-piece{
    width:72%;
    height:72%;
    border-radius:50%;
    border:4px solid #222;
    box-shadow:0 4px 8px #0008;
}

.checker-red{
    background:#d52d2d;
}

.checker-black{
    background:#202020;
}

.checker-king::after{
    content:"♛";
    color:#ffd95a;
    font-size:50%;
}

/* ==========================================================
   MONOPOLY
   ========================================================== */

.mono-board{
    width:min(96vw,620px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(11,1fr);
    grid-template-rows:repeat(11,1fr);
    gap:2px;
    background:#222;
    padding:3px;
}

.mono-space{
    background:#ddd;
    color:#111;
    min-width:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(7px,1.7vw,11px);
    padding:2px;
}

.mono-center{
    grid-column:2/11;
    grid-row:2/11;
    background:#151515;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:10px;
}

.mono-token{
    font-size:15px;
    line-height:1;
}

/* ==========================================================
   DIRTY MINDS
   ========================================================== */

.dm-lobby{
    max-width:600px;
    margin:auto;
}

.dm-question{
    font-size:clamp(23px,5vw,34px);
    line-height:1.35;
    text-align:center;
    font-weight:800;
    padding:25px 12px;
}

.dm-answer{
    text-align:center;
    font-size:clamp(24px,6vw,36px);
    font-weight:900;
    padding:20px;
    background:#221733;
    border-radius:14px;
    margin:10px 0;
}

.dm-players{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:12px;
}

.dm-player{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    background:#1a1a1a;
    border-radius:10px;
}

.dm-player.me{
    border:1px solid #7c3aed;
}

.dm-submitted{
    color:#6ee7a0;
    font-weight:700;
}

.dm-host-badge{
    display:inline-block;
    margin:8px auto;
    padding:8px 14px;
    border-radius:999px;
    background:#7c3aed;
    color:#fff;
    font-weight:800;
}

.dm-room-code{
    font-size:32px;
    font-weight:900;
    letter-spacing:4px;
    margin:15px 0;
    color:#a78bfa;
    text-align:center;
}

.dm-share{
    background:#16803c;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .panel{
        padding:11px;
        border-radius:14px;
    }

    button{
        padding:11px 13px;
    }

    .controls button{
        flex:1 1 auto;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="header">

        <a class="back" href="/real-games/">
            ← Real Games
        </a>

        <h1>
            {{ game.icon|default('🎮') }}
            {{ game.name|default('Real Game') }}
        </h1>

        <p>
            {{ game.description|default('Have fun!') }}
        </p>

    </div>

    <div id="gameArea"></div>

</div>

<script>
"use strict";

/* ==========================================================
   GLOBAL GAME SYSTEM
   ========================================================== */

const GAME_ID = {{ game.game_id|default('unknown')|tojson }};

const gameArea = document.getElementById("gameArea");

let activeCleanup = null;
let activeTimers = [];
let activeIntervals = [];
let activeFrames = [];

function $(selector){
    return document.querySelector(selector);
}

function clearGame(){

    if(typeof activeCleanup === "function"){
        try{
            activeCleanup();
        }catch(e){
            console.error(e);
        }
    }

    activeCleanup = null;

    activeTimers.forEach(clearTimeout);
    activeIntervals.forEach(clearInterval);
    activeFrames.forEach(cancelAnimationFrame);

    activeTimers = [];
    activeIntervals = [];
    activeFrames = [];

    if(gameArea) gameArea.innerHTML = "";
}

function timer(fn,ms){
    const id = setTimeout(fn,ms);
    activeTimers.push(id);
    return id;
}

function interval(fn,ms){
    const id = setInterval(fn,ms);
    activeIntervals.push(id);
    return id;
}

function frame(fn){
    const id = requestAnimationFrame(fn);
    activeFrames.push(id);
    return id;
}

function html(content){
    if(gameArea) gameArea.innerHTML = content;
}

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ==========================================================
   SNAKE
   ========================================================== */

function snakeGame(){

    html(`
        <div class="panel">
            <div class="game-title">🐍 Snake</div>
            <div class="score">Score: <b id="snakeScore">0</b></div>
            <canvas id="snakeCanvas" width="400" height="400"></canvas>

            <div class="dpad">
                <button class="up" id="sUp">⬆️</button>
                <button class="left" id="sLeft">⬅️</button>
                <button class="down" id="sDown">⬇️</button>
                <button class="right" id="sRight">➡️</button>
            </div>

            <div class="controls">
                <button id="snakeRestart" class="primary">Restart</button>
            </div>
        </div>
    `);

    const canvas=$("#snakeCanvas");
    const ctx=canvas.getContext("2d");

    const size=20;
    const cells=20;

    let snake,food,dx,dy,score,running;

    function reset(){
        snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        food=spawnFood();
        dx=1;
        dy=0;
        score=0;
        running=true;
        $("#snakeScore").textContent=score;
        draw();
    }

    function spawnFood(){
        let p;
        do{
            p={
                x:Math.floor(Math.random()*cells),
                y:Math.floor(Math.random()*cells)
            };
        }while(snake && snake.some(s=>s.x===p.x && s.y===p.y));
        return p;
    }

    function change(nx,ny){
        if(nx===-dx && ny===-dy)return;
        dx=nx;
        dy=ny;
    }

    function tick(){
        if(!running)return;

        const head={
            x:snake[0].x+dx,
            y:snake[0].y+dy
        };

        if(
            head.x<0 ||
            head.y<0 ||
            head.x>=cells ||
            head.y>=cells ||
            snake.some(s=>s.x===head.x && s.y===head.y)
        ){
            running=false;
            timer(()=>alert("Game Over! Score: "+score),20);
            return;
        }

        snake.unshift(head);

        if(head.x===food.x && head.y===food.y){
            score++;
            $("#snakeScore").textContent=score;
            food=spawnFood();
        }else{
            snake.pop();
        }

        draw();
    }

    function draw(){
        ctx.fillStyle="#050505";
        ctx.fillRect(0,0,400,400);

        ctx.fillStyle="#e33";
        ctx.fillRect(food.x*size,food.y*size,size-1,size-1);

        ctx.fillStyle="#39d98a";

        snake.forEach(s=>{
            ctx.fillRect(s.x*size,s.y*size,size-1,size-1);
        });
    }

    function key(e){
        const k=e.key.toLowerCase();

        if([
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            "w",
            "a",
            "s",
            "d"
        ].includes(k)){
            e.preventDefault();
        }

        if(k==="arrowup" || k==="w")change(0,-1);
        if(k==="arrowdown" || k==="s")change(0,1);
        if(k==="arrowleft" || k==="a")change(-1,0);
        if(k==="arrowright" || k==="d")change(1,0);
    }

    document.addEventListener("keydown",key);

    $("#sUp").onclick=()=>change(0,-1);
    $("#sDown").onclick=()=>change(0,1);
    $("#sLeft").onclick=()=>change(-1,0);
    $("#sRight").onclick=()=>change(1,0);
    $("#snakeRestart").onclick=reset;

    const loop=setInterval(tick,110);
    activeIntervals.push(loop);

    reset();

    activeCleanup=()=>{
        document.removeEventListener("keydown",key);
    };
}


/* ==========================================================
   PONG
   ========================================================== */

function pongGame(){

    html(`
        <div class="panel">
            <div class="game-title">🏓 Pong</div>
            <div class="score">You <b id="pongPlayer">0</b> — <b id="pongCPU">0</b> CPU</div>
            <canvas id="pongCanvas" width="700" height="400"></canvas>
            <div class="help">Move your paddle with mouse, finger, or ↑ ↓ keys.</div>
            <div class="controls">
                <button id="pongRestart" class="primary">Restart</button>
            </div>
        </div>
    `);

    const canvas=$("#pongCanvas");
    const ctx=canvas.getContext("2d");

    const W=700;
    const H=400;

    let playerY=160;
    let cpuY=160;
    let ball={
        x:350,
        y:200,
        vx:5,
        vy:3
    };

    let ps=0;
    let cs=0;
    let raf;

    function reset(){
        ps=0;
        cs=0;
        playerY=160;
        cpuY=160;

        $("#pongPlayer").textContent=0;
        $("#pongCPU").textContent=0;

        resetBall(Math.random()<.5?-1:1);
    }

    function resetBall(dir){
        ball={
            x:W/2,
            y:H/2,
            vx:dir*5,
            vy:(Math.random()-.5)*6
        };
    }

    function movePlayer(y){
        const rect=canvas.getBoundingClientRect();
        const scale=H/rect.height;

        playerY=(y-rect.top)*scale-40;
        playerY=Math.max(0,Math.min(H-80,playerY));
    }

    canvas.addEventListener("pointermove",e=>movePlayer(e.clientY));
    canvas.addEventListener("pointerdown",e=>movePlayer(e.clientY));

    function key(e){
        if(e.key==="ArrowUp")playerY-=30;
        if(e.key==="ArrowDown")playerY+=30;

        playerY=Math.max(0,Math.min(H-80,playerY));
    }

    document.addEventListener("keydown",key);

    function loop(){
        ctx.fillStyle="#050505";
        ctx.fillRect(0,0,W,H);

        ctx.strokeStyle="#444";
        ctx.setLineDash([8,8]);

        ctx.beginPath();
        ctx.moveTo(W/2,0);
        ctx.lineTo(W/2,H);
        ctx.stroke();

        ctx.setLineDash([]);

        cpuY+=(ball.y-40-cpuY)*.045;
        cpuY=Math.max(0,Math.min(H-80,cpuY));

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        if(ball.y<10 || ball.y>H-10){
            ball.vy*=-1;
        }

        if(
            ball.x<40 &&
            ball.x>25 &&
            ball.y>playerY &&
            ball.y<playerY+80
        ){
            ball.vx=Math.abs(ball.vx);
            ball.vy+=(ball.y-(playerY+40))*.08;
        }

        if(
            ball.x>W-40 &&
            ball.x<W-25 &&
            ball.y>cpuY &&
            ball.y<cpuY+80
        ){
            ball.vx=-Math.abs(ball.vx);
            ball.vy+=(ball.y-(cpuY+40))*.08;
        }

        if(ball.x<0){
            cs++;
            $("#pongCPU").textContent=cs;
            resetBall(1);
        }

        if(ball.x>W){
            ps++;
            $("#pongPlayer").textContent=ps;
            resetBall(-1);
        }

        ctx.fillStyle="#fff";

        ctx.fillRect(20,playerY,12,80);
        ctx.fillRect(W-32,cpuY,12,80);

        ctx.beginPath();
        ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
        ctx.fill();

        raf=requestAnimationFrame(loop);
        activeFrames.push(raf);
    }

    $("#pongRestart").onclick=reset;

    reset();
    loop();

    activeCleanup=()=>{
        document.removeEventListener("keydown",key);
        cancelAnimationFrame(raf);
    };
}


/* ==========================================================
   BREAKOUT
   ========================================================== */

function breakoutGame(){

    html(`
        <div class="panel">
            <div class="game-title">🧱 Breakout</div>
            <div class="score">Score: <b id="breakScore">0</b></div>
            <canvas id="breakCanvas" width="600" height="450"></canvas>
            <div class="help">Move paddle with finger, mouse, or arrow keys.</div>
            <div class="controls">
                <button id="breakRestart" class="primary">Restart</button>
            </div>
        </div>
    `);

    const canvas=$("#breakCanvas");
    const ctx=canvas.getContext("2d");

    const W=600;
    const H=450;

    let paddleX=250;
    let ball;
    let bricks;
    let score=0;
    let raf;

    function reset(){
        paddleX=250;
        score=0;

        $("#breakScore").textContent=0;

        ball={
            x:300,
            y:350,
            vx:4,
            vy:-4,
            r:8
        };

        bricks=[];

        for(let r=0;r<5;r++){
            for(let c=0;c<10;c++){
                bricks.push({
                    x:8+c*59,
                    y:40+r*25,
                    w:54,
                    h:18,
                    alive:true
                });
            }
        }
    }

    function move(x){
        const rect=canvas.getBoundingClientRect();

        paddleX=
            (x-rect.left)/
            rect.width*
            W-60;

        paddleX=Math.max(0,Math.min(W-120,paddleX));
    }

    canvas.addEventListener("pointermove",e=>move(e.clientX));
    canvas.addEventListener("pointerdown",e=>move(e.clientX));

    function key(e){
        if(e.key==="ArrowLeft")paddleX-=30;
        if(e.key==="ArrowRight")paddleX+=30;

        paddleX=Math.max(0,Math.min(W-120,paddleX));
    }

    document.addEventListener("keydown",key);

    function loop(){

        ctx.fillStyle="#050505";
        ctx.fillRect(0,0,W,H);

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        if(ball.x<ball.r || ball.x>W-ball.r){
            ball.vx*=-1;
        }

        if(ball.y<ball.r){
            ball.vy*=-1;
        }

        if(
            ball.y+ball.r>=380 &&
            ball.x>=paddleX &&
            ball.x<=paddleX+120 &&
            ball.vy>0
        ){
            ball.vy=-Math.abs(ball.vy);
            ball.vx+=(ball.x-(paddleX+60))*.03;
        }

        bricks.forEach(b=>{
            if(
                b.alive &&
                ball.x>b.x &&
                ball.x<b.x+b.w &&
                ball.y>b.y &&
                ball.y<b.y+b.h &&
                ball.vy<0
            ){
                b.alive=false;
                ball.vy*=-1;
                score++;
                $("#breakScore").textContent=score;
            }
        });

        if(ball.y>H){
            reset();
        }

        bricks.forEach(b=>{
            if(!b.alive)return;

            ctx.fillStyle="#9b59b6";
            ctx.fillRect(b.x,b.y,b.w,b.h);
        });

        ctx.fillStyle="#fff";
        ctx.fillRect(paddleX,380,120,12);

        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
        ctx.fill();

        raf=requestAnimationFrame(loop);
        activeFrames.push(raf);
    }

    $("#breakRestart").onclick=reset;

    reset();
    loop();

    activeCleanup=()=>{
        document.removeEventListener("keydown",key);
        cancelAnimationFrame(raf);
    };
}


/* ==========================================================
   DODGE
   ========================================================== */

function dodgeGame(){

    html(`
        <div class="panel">
            <div class="game-title">💥 Dodge</div>
            <div class="score">Score: <b id="dodgeScore">0</b></div>
            <canvas id="dodgeCanvas" width="400" height="550"></canvas>

            <div class="dpad">
                <button class="left" id="dLeft">⬅️</button>
                <button class="right" id="dRight">➡️</button>
            </div>

            <div class="controls">
                <button id="dodgeRestart" class="primary">Restart</button>
            </div>
        </div>
    `);

    const canvas=$("#dodgeCanvas");
    const ctx=canvas.getContext("2d");

    let player;
    let enemies;
    let score;
    let running;
    let raf;
    let last=0;

    function reset(){
        player={
            x:180,
            y:480,
            w:40,
            h:40
        };

        enemies=[];
        score=0;
        running=true;
        last=0;

        $("#dodgeScore").textContent=0;
    }

    function left(){
        player.x=Math.max(0,player.x-35);
    }

    function right(){
        player.x=Math.min(360,player.x+35);
    }

    $("#dLeft").onclick=left;
    $("#dRight").onclick=right;

    function key(e){
        if(e.key==="ArrowLeft" || e.key==="a")left();
        if(e.key==="ArrowRight" || e.key==="d")right();
    }

    document.addEventListener("keydown",key);

    canvas.addEventListener("pointermove",e=>{
        const rect=canvas.getBoundingClientRect();

        player.x=
            (e.clientX-rect.left)/
            rect.width*
            400-20;

        player.x=Math.max(0,Math.min(360,player.x));
    });

    function loop(t){

        if(!running)return;

        if(!last)last=t;

        const dt=Math.min(.035,(t-last)/1000);
        last=t;

        if(Math.random()<.04){
            enemies.push({
                x:Math.random()*370,
                y:-30,
                w:30+Math.random()*30,
                h:30,
                speed:150+Math.random()*130
            });
        }

        enemies.forEach(e=>{
            e.y+=e.speed*dt;
        });

        enemies=enemies.filter(e=>e.y<580);

        score+=dt;

        $("#dodgeScore").textContent=Math.floor(score);

        for(const e of enemies){
            if(
                player.x<e.x+e.w &&
                player.x+player.w>e.x &&
                player.y<e.y+e.h &&
                player.y+player.h>e.y
            ){
                running=false;

                timer(()=>{
                    alert(
                        "You survived "+
                        Math.floor(score)+
                        " seconds!"
                    );
                },20);

                return;
            }
        }

        ctx.fillStyle="#050505";
        ctx.fillRect(0,0,400,550);

        ctx.fillStyle="#4ade80";
        ctx.fillRect(
            player.x,
            player.y,
            player.w,
            player.h
        );

        ctx.fillStyle="#ef4444";

        enemies.forEach(e=>{
            ctx.fillRect(
                e.x,
                e.y,
                e.w,
                e.h
            );
        });

        raf=requestAnimationFrame(loop);
        activeFrames.push(raf);
    }

    $("#dodgeRestart").onclick=reset;

    reset();
    loop(0);

    activeCleanup=()=>{
        document.removeEventListener("keydown",key);
        cancelAnimationFrame(raf);
    };
}


/* ==========================================================
   2048
   ========================================================== */

function game2048(){

    html(`
        <div class="panel">
            <div class="game-title">🔢 2048</div>
            <div class="score">Score: <b id="score2048">0</b></div>
            <div id="grid2048" class="grid2048"></div>
            <div class="help">Swipe or use arrow keys.</div>

            <div class="controls">
                <button id="restart2048" class="primary">New Game</button>
            </div>
        </div>
    `);

    const grid=$("#grid2048");

    let board;
    let score;

    function reset(){
        board=Array.from(
            {length:4},
            ()=>Array(4).fill(0)
        );

        score=0;

        add();
        add();

        render();
    }

    function add(){
        const empty=[];

        for(let r=0;r<4;r++){
            for(let c=0;c<4;c++){
                if(!board[r][c]){
                    empty.push([r,c]);
                }
            }
        }

        if(!empty.length)return;

        const [r,c]=
            empty[
                Math.floor(Math.random()*empty.length)
            ];

        board[r][c]=
            Math.random()<.9 ? 2 : 4;
    }

    function slide(line){

        let a=line.filter(Boolean);

        for(let i=0;i<a.length-1;i++){

            if(a[i]===a[i+1]){

                a[i]*=2;
                score+=a[i];

                a.splice(i+1,1);
            }
        }

        while(a.length<4){
            a.push(0);
        }

        return a;
    }

    function move(dir){

        const old=JSON.stringify(board);

        if(dir==="left"){
            for(let r=0;r<4;r++){
                board[r]=slide(board[r]);
            }
        }

        if(dir==="right"){
            for(let r=0;r<4;r++){
                board[r]=
                    slide(board[r].slice().reverse())
                    .reverse();
            }
        }

        if(dir==="up"){
            for(let c=0;c<4;c++){

                const col=[
                    board[0][c],
                    board[1][c],
                    board[2][c],
                    board[3][c]
                ];

                const s=slide(col);

                for(let r=0;r<4;r++){
                    board[r][c]=s[r];
                }
            }
        }

        if(dir==="down"){
            for(let c=0;c<4;c++){

                const col=[
                    board[3][c],
                    board[2][c],
                    board[1][c],
                    board[0][c]
                ];

                const s=slide(col);

                for(let i=0;i<4;i++){
                    board[3-i][c]=s[i];
                }
            }
        }

        if(JSON.stringify(board)!==old){
            add();
            render();
        }
    }

    function canMove(){

        for(let r=0;r<4;r++){
            for(let c=0;c<4;c++){

                if(!board[r][c]){
                    return true;
                }

                if(
                    c<3 &&
                    board[r][c]===board[r][c+1]
                ){
                    return true;
                }

                if(
                    r<3 &&
                    board[r][c]===board[r+1][c]
                ){
                    return true;
                }
            }
        }

        return false;
    }

    function render(){

        grid.innerHTML="";

        board.flat().forEach(value=>{

            const tile=document.createElement("div");

            tile.className="tile2048";
            tile.textContent=value || "";

            grid.appendChild(tile);
        });

        $("#score2048").textContent=score;

        if(!canMove()){
            timer(()=>{
                alert(
                    "Game over! Score: "+
                    score
                );
            },50);
        }
    }

    function key(e){

        const map={
            ArrowLeft:"left",
            ArrowRight:"right",
            ArrowUp:"up",
            ArrowDown:"down"
        };

        if(map[e.key]){
            e.preventDefault();
            move(map[e.key]);
        }
    }

    let startX=0;
    let startY=0;

    grid.addEventListener("pointerdown",e=>{
        startX=e.clientX;
        startY=e.clientY;
    });

    grid.addEventListener("pointerup",e=>{

        const dx=e.clientX-startX;
        const dy=e.clientY-startY;

        if(
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            )<25
        ){
            return;
        }

        if(Math.abs(dx)>Math.abs(dy)){
            move(dx>0?"right":"left");
        }else{
            move(dy>0?"down":"up");
        }
    });

    document.addEventListener("keydown",key);

    $("#restart2048").onclick=reset;

    reset();

    activeCleanup=()=>{
        document.removeEventListener("keydown",key);
    };
}


/* ==========================================================
   MEMORY MATCH
   ========================================================== */

function memoryGame(){

    html(`
        <div class="panel">
            <div class="game-title">🧠 Memory Match</div>
            <div class="score">
                Matches: <b id="memoryScore">0</b>
            </div>

            <div id="memoryGrid" class="memory-grid"></div>

            <div class="controls">
                <button id="memoryRestart" class="primary">
                    New Game
                </button>
            </div>
        </div>
    `);

    const symbols=[
        "🍕","🏀","🎮","🐍",
        "🚀","🎯","🔥","⭐"
    ];

    const grid=$("#memoryGrid");

    let cards=[];
    let first=null;
    let second=null;
    let lock=false;
    let matches=0;

    function reset(){

        cards=[
            ...symbols,
            ...symbols
        ].sort(()=>Math.random()-.5);

        first=null;
        second=null;
        lock=false;
        matches=0;

        render();
    }

    function render(){

        grid.innerHTML="";

        cards.forEach((symbol,index)=>{

            const card=document.createElement("button");

            card.className="memory-card";
            card.dataset.index=index;

            if(
                symbol.visible ||
                symbol.matched
            ){
                card.textContent=symbol;

                card.classList.add(
                    symbol.matched
                    ? "matched"
                    : "flipped"
                );
            }

            card.onclick=()=>flip(index);

            grid.appendChild(card);
        });

        $("#memoryScore").textContent=matches;
    }

    function flip(index){

        if(lock || cards[index].matched){
            return;
        }

        if(first!==null && first===index){
            return;
        }

        const buttons=
            grid.querySelectorAll(".memory-card");

        buttons[index].textContent=cards[index];

        buttons[index].classList.add("flipped");

        if(first===null){
            first=index;
            return;
        }

        second=index;
        lock=true;

        if(cards[first]===cards[second]){

            cards[first].matched=true;
            cards[second].matched=true;

            matches++;

            first=null;
            second=null;
            lock=false;

            render();

            if(matches===symbols.length){
                timer(()=>{
                    alert(
                        "You found every pair!"
                    );
                },100);
            }

        }else{

            timer(()=>{

                render();

                first=null;
                second=null;
                lock=false;

            },700);
        }
    }

    $("#memoryRestart").onclick=reset;

    reset();
}

function reactionGame(){

    html(`

                ⚡ Reaction Test
            </div>

            <div id="reactionBox"
                 style="
                 min-height:280px;
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 border-radius:18px;
                 background:#202020;
                 font-size:28px;
                 font-weight:900;
                 text-align:center;
                 padding:20px;">

                TAP TO START

            </div>

            <div class="score">
                Result:
                <b id="reactionScore">—</b>
            </div>

            <div class="controls">
                <button id="reactionRestart"
                        class="primary">
                    Try Again
                </button>
            </div>

        </div>
    `);

    const box=$("#reactionBox");
    const score=$("#reactionScore");

    let state="idle";
    let start=0;
    let waitTimer=null;

    function startGame(){

        if(state==="waiting"){

            clearTimeout(waitTimer);

            state="idle";

            box.textContent=
                "Too early! Tap to try again.";

            return;
        }

        if(state==="go")return;

        state="waiting";

        box.textContent="WAIT...";

        waitTimer=setTimeout(()=>{

            state="go";

            start=performance.now();

            box.textContent="TAP NOW!";

        },1000+Math.random()*3000);
    }

    function tap(){

        if(state==="idle"){
            startGame();
            return;
        }

        if(state==="waiting"){

            clearTimeout(waitTimer);

            state="idle";

            box.textContent="Too early!";

            return;
        }

        if(state==="go"){

            const ms=
                Math.round(
                    performance.now()-start
                );

            score.textContent=ms+" ms";

            box.textContent=
                "Great! "+
                ms+
                " ms";

            state="idle";
        }
    }

    box.onclick=tap;

    $("#reactionRestart").onclick=()=>{

        state="idle";

        score.textContent="—";

        box.textContent="TAP TO START";
    };

    activeCleanup=()=>{
        clearTimeout(waitTimer);
    };
}

/* ==========================================================
   BASKETBALL
   ========================================================== */

function basketballGame(){

    html(`
        <div class="panel">

            <div class="game-title">
                🏀 Basketball
            </div>

            <div class="score">
                Score:
                <b id="basketScore">0</b>
                |
                Time:
                <b id="basketTime">30</b>
            </div>

            <canvas id="basketCanvas"
                    width="360"
                    height="520">
            </canvas>

            <div class="help">
                Drag from the ball toward the hoop,
                then release.
            </div>

            <div class="controls">

                <button id="basketRestart"
                        class="primary">
                    Start / Restart
                </button>

            </div>

        </div>
    `);

    const canvas=$("#basketCanvas");
    const ctx=canvas.getContext("2d");

    let score=0;
    let time=30;
    let running=false;
    let ball;
    let startPoint=null;
    let raf;

    const hoop={
        x:180,
        y:135,
        w:80
    };

    function reset(){

        score=0;
        time=30;
        running=true;

        $("#basketScore").textContent=0;
        $("#basketTime").textContent=30;

        ball={
            x:180,
            y:455,
            vx:0,
            vy:0,
            active:false,
            scored:false
        };
    }

    function shoot(x,y){

        if(!running)return;

        const rect=
            canvas.getBoundingClientRect();

        const tx=
            (x-rect.left)/
            rect.width*
            360;

        const ty=
            (y-rect.top)/
            rect.height*
            520;

        const dx=tx-ball.x;
        const dy=ty-ball.y;

        const power=.075;

        ball.vx=dx*power;
        ball.vy=dy*power;

        if(ball.vy>-4){
            ball.vy=-9;
        }

        ball.active=true;
        ball.scored=false;
    }

    canvas.addEventListener("pointerdown",e=>{

        if(!running)return;

        startPoint={
            x:e.clientX,
            y:e.clientY
        };
    });

    canvas.addEventListener("pointerup",e=>{

        if(!startPoint)return;

        shoot(
            e.clientX,
            e.clientY
        );

        startPoint=null;
    });

    function loop(){

        ctx.fillStyle="#16202b";
        ctx.fillRect(0,0,360,520);

        ctx.fillStyle="#b87842";
        ctx.fillRect(0,350,360,170);

        ctx.strokeStyle="#fff";
        ctx.lineWidth=6;

        ctx.strokeRect(
            hoop.x-25,
            hoop.y-55,
            50,
            55
        );

        ctx.strokeStyle="#f97316";

        ctx.beginPath();

        ctx.ellipse(
            hoop.x,
            hoop.y,
            hoop.w/2,
            12,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;

        for(let i=-2;i<=2;i++){

            ctx.beginPath();

            ctx.moveTo(
                hoop.x+i*14,
                hoop.y
            );

            ctx.lineTo(
                hoop.x+i*10,
                hoop.y+35
            );

            ctx.stroke();
        }

        if(ball.active){

            const previousY=ball.y;

            ball.vy+=.28;

            ball.x+=ball.vx;
            ball.y+=ball.vy;

            if(ball.x<12 || ball.x>348){
                ball.vx*=-.75;
            }

            if(
                !ball.scored &&
                previousY<hoop.y &&
                ball.y>=hoop.y &&
                ball.x>hoop.x-hoop.w/2 &&
                ball.x<hoop.x+hoop.w/2
            ){

                score++;

                ball.scored=true;

                $("#basketScore").textContent=score;
            }

            if(ball.y>530){

                ball={
                    x:180,
                    y:455,
                    vx:0,
                    vy:0,
                    active:false,
                    scored:false
                };
            }
        }

        ctx.fillStyle="#f97316";

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            15,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(running){

            raf=requestAnimationFrame(loop);

            activeFrames.push(raf);
        }
    }

    $("#basketRestart").onclick=()=>{

        reset();

        cancelAnimationFrame(raf);

        loop();
    };

    reset();
    loop();

    interval(()=>{

        if(!running)return;

        time--;

        $("#basketTime").textContent=time;

        if(time<=0){

            running=false;

            alert(
                "Game Over! You scored "+
                score+
                " basket"+
                (score===1?"":"s")+
                "."
            );
        }

    },1000);

    activeCleanup=()=>{
        cancelAnimationFrame(raf);
    };
}

function chessGame(){

            </div>

                Turn:

                </button>

            </div>

        </div>
    `);

    const boardEl=$("#chessBoard");

    const pieces={
        r:"♜",
        n:"♞",
        b:"♝",
        q:"♛",
        k:"♚",
        p:"♟",
        R:"♖",
        N:"♘",
        B:"♗",
        Q:"♕",
        K:"♔",
        P:"♙"
    };

    let board;
    let turn;
    let selected=null;
    let gameOver=false;

    function initial(){

        board=[
            ["r","n","b","q","k","b","n","r"],
            ["p","p","p","p","p","p","p","p"],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            ["P","P","P","P","P","P","P","P"],
            ["R","N","B","Q","K","B","N","R"]
        ];

        turn="w";
        selected=null;
        gameOver=false;

        render();
    }

    function color(piece){

        if(!piece)return null;

        return piece===
            piece.toUpperCase()
            ? "w"
            : "b";
    }

    function inside(r,c){
        return r>=0 &&
               r<8 &&
               c>=0 &&
               c<8;
    }

    function clone(b){
        return b.map(row=>row.slice());
    }

    function pseudo(
        b,
        r,
        c,
        attacksOnly=false
    ){

        const p=b[r][c];

        if(!p)return [];

        const col=color(p);
        const type=p.toLowerCase();

        const moves=[];

        function add(nr,nc){

            if(!inside(nr,nc))return;

            const target=b[nr][nc];

            if(target && color(target)===col)return;

            if(
                target &&
                target.toLowerCase()==="k"
            ){
                return;
            }

            moves.push([nr,nc]);
        }

        if(type==="p"){

            const dir=
                col==="w"
                ? -1
                : 1;

            if(attacksOnly){

                add(r+dir,c-1);
                add(r+dir,c+1);

                return moves;
            }

            if(
                inside(r+dir,c) &&
                !b[r+dir][c]
            ){

                moves.push([
                    r+dir,
                    c
                ]);

                const start=
                    col==="w"
                    ? 6
                    : 1;

                if(
                    r===start &&
                    !b[r+2*dir][c]
                ){

                    moves.push([
                        r+2*dir,
                        c
                    ]);
                }
            }

            for(
                const dc of [-1,1]
            ){

                const nr=r+dir;
                const nc=c+dc;

                if(
                    inside(nr,nc) &&
                    b[nr][nc] &&
                    color(b[nr][nc])!==col &&
                    b[nr][nc].toLowerCase()!=="k"
                ){

                    moves.push([
                        nr,
                        nc
                    ]);
                }
            }
        }

        if(type==="n"){

            [
                [-2,-1],
                [-2,1],
                [-1,-2],
                [-1,2],
                [1,-2],
                [1,2],
                [2,-1],
                [2,1]
            ].forEach(
                ([dr,dc])=>
                    add(r+dr,c+dc)
            );
        }

        if(
            type==="b" ||
            type==="r" ||
            type==="q"
        ){

            const dirs=[];

            if(
                type==="b" ||
                type==="q"
            ){

                dirs.push(
                    [-1,-1],
                    [-1,1],
                    [1,-1],
                    [1,1]
                );
            }

            if(
                type==="r" ||
                type==="q"
            ){

                dirs.push(
                    [-1,0],
                    [1,0],
                    [0,-1],
                    [0,1]
                );
            }

            dirs.forEach(
                ([dr,dc])=>{

                    let nr=r+dr;
                    let nc=c+dc;

                    while(
                        inside(nr,nc)
                    ){

                        const target=
                            b[nr][nc];

                        if(!target){

                            moves.push([
                                nr,
                                nc
                            ]);

                        }else{

                            if(
                                color(target)!==col &&
                                target.toLowerCase()!=="k"
                            ){

                                moves.push([
                                    nr,
                                    nc
                                ]);
                            }

                            break;
                        }

                        nr+=dr;
                        nc+=dc;
                    }
                }
            );
        }

        if(type==="k"){

            for(let dr=-1;dr<=1;dr++){

                for(let dc=-1;dc<=1;dc++){

                    if(
                        dr===0 &&
                        dc===0
                    ){
                        continue;
                    }

                    add(
                        r+dr,
                        c+dc
                    );
                }
            }
        }

        return moves;
    }

    function attacked(
        b,
        tr,
        tc,
        byColor
    ){

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                const p=b[r][c];

                if(
                    !p ||
                    color(p)!==byColor
                ){
                    continue;
                }

                const type=
                    p.toLowerCase();

                if(type==="p"){

                    const dir=
                        byColor==="w"
                        ? -1
                        : 1;

                    if(
                        r+dir===tr &&
                        Math.abs(c-tc)===1
                    ){
                        return true;
                    }

                }else{

                    const moves=
                        pseudo(
                            b,
                            r,
                            c,
                            true
                        );

                    if(
                        moves.some(
                            m=>
                                m[0]===tr &&
                                m[1]===tc
                        )
                    ){
                        return true;cat << 'EOF' > solution.html
                    }
                }
            }
        }0

        return false;
    }

    function inCheck(b,col){

        let kr=- serve1;
        let kc=-1;

        for(let r=0;r<8 header;r++){

            for(let c=0;c<8;c++){

                if(
                    b[r][c]===
                    (col==="w"?"K":"k me") expanded
                ){

                    kr=r;
                    kc=c; keep
                }
            }
        }

        if(kr<0)return true;

        return attacked(
            b,
            kr,
            kc,
            col==="w"?"b":"w"
        );
    }

    function legalMoves(r,c){

        const p=board[r][c];

        if(
            !p ||
            color(p)!==turn
        ){
            return [];
        }

        return pseudo(
            board,
            r,
            c
        ).filter(
            ([nr,nc])=>{

                const copy=clone(board);

                copy[nr][nc]=copy[r][c];
                copy[r][c]=null;

                const moved=
                    copy[nr][nc];

                if(
                    moved.toLowerCase()==="p" &&
                    (nr===0 || nr===7)
                ){

                    copy[nr][nc]=
                        color(moved)==="w"
                        ? "Q"
                        : "q";
                }

                return !inCheck(
                    copy,
                    turn
                );
            }
        );
    }

    function anyLegal(col){

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                if(
                    board[r][c] &&
                    color(board[r][c])===col &&
                    legalMoves(r,c).length
                ){
                    return true;
                }
            }
        }

        return false;
    }

    function move(
        fr,
        fc,
        tr,
        tc
    ){

        const p=board[fr][fc];

        board[tr][tc]=p;
        board[fr][fc]=null;

        if(
            p.toLowerCase()==="p" &&
            (tr===0 || tr===7)
        ){

            board[tr][tc]=
                color(p)==="w"
                ? "Q"
                : "q";
        }

        turn=
            turn==="w"
            ? "b"
            : "w";

        selected=null;

        const check=
            inCheck(
                board,
                turn
            );

        if(!anyLegal(turn)){

            gameOver=true;

            $("#chessStatus").textContent=
                check
                ? (
                    turn==="w"
                    ? "White"
                    : "Black"
                )+
                " is checkmated."
                : "Stalemate.";

        }else{

            $("#chessStatus").textContent=
                check
                ? "Check!"
                : "Select a piece.";
        }

        $("#chessTurn").textContent=
            turn==="w"
            ? "White"
            : "Black";

        render();
    }

    function clickSquare(r,c){

        if(gameOver)return;

        if(selected){

            const moves=
                legalMoves(
                    selected.r,
                    selected.c
                );

            if(
                moves.some(
                    m=>
                        m[0]===r &&
                        m[1]===c
                )
            ){

                move(
                    selected.r,
                    selected.c,
                    r,
                    c
                );

                return;
            }
        }

        if(
            board[r][c] &&
            color(board[r][c])===turn
        ){

            selected={
                r,
                c
            };

        }else{

            selected=null;
        }

        render();
    }

    function render(){

        boardEl.innerHTML="";

        const moves=
            selected
            ? legalMoves(
                selected.r,
                selected.c
            )
            : [];

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                const sq=
                    document.createElement("button");

                sq.className=
                    "square "+
                    (
                        (r+c)%2===0
                        ? "chess-light"
                        : "chess-dark"
                    );

                if(
                    selected &&
                    selected.r===r &&
                    selected.c===c
                ){
                    sq.classList.add("selected");
                }

                if(
                    moves.some(
                        m=>
                            m[0]===r &&
                            m[1]===c
                    )
                ){

                    sq.classList.add(
                        board[r][c]
                        ? "capture"
                        : "move"
                    );
                }

                if(board[r][c]){
                    sq.textContent=
                        pieces[board[r][c]];
                }

                sq.onclick=
                    ()=>clickSquare(r,c);

                boardEl.appendChild(sq);
            }
        }
    }

    $("#chessRestart").onclick=initial;

    initial();
}

function checkersGame(){

    html(`
        <div class="panel">

            <div class="game-title">
                🔴 Checkers
            </div>

            <div class="score">
                Turn:
                <b id="checkerTurn">Red</b>
            </div>

            <div id="checkerBoard"
                 class="board">
            </div>

            <div id="checkerStatus"
                 class="status">
                Select a piece.
            </div>

            <div class="controls">

                <button id="checkerRestart"
                        class="primary">
                    New Game
                </button>

            </div>

        </div>
    `);

    const el=$("#checkerBoard");

    let board;
    let turn;
    let selected=null;
    let mustContinue=false;
    let gameOver=false;

    function reset(){

        board=
            Array.from(
                {length:8},
                ()=>Array(8).fill(null)
            );

        for(let r=0;r<3;r++){

            for(let c=0;c<8;c++){

                if((r+c)%2===1){
                    board[r][c]="b";
                }
            }
        }

        for(let r=5;r<8;r++){

            for(let c=0;c<8;c++){

                if((r+c)%2===1){
                    board[r][c]="r";
                }
            }
        }

        turn="r";
        selected=null;
        mustContinue=false;
        gameOver=false;

        render();
    }

    function inside(r,c){

        return r>=0 &&
               r<8 &&
               c>=0 &&
               c<8;
    }

    function captures(r,c){

        const p=board[r][c];

        if(!p)return [];

        const king=
            p===p.toUpperCase();

        const dirs=[];

        if(king || p.toLowerCase()==="r"){

            dirs.push(
                [-1,-1],
                [-1,1],
                [1,-1],
                [1,1]
            );

        }else{

            const dir=
                p.toLowerCase()==="r"
                ? -1
                : 1;

            dirs.push(
                [dir,-1],
                [dir,1]
            );
        }

        const result=[];

        dirs.forEach(
            ([dr,dc])=>{

                const mr=r+dr;
                const mc=c+dc;

                const lr=r+dr*2;
                const lc=c+dc*2;

                if(
                    inside(lr,lc) &&
                    board[mr] &&
                    board[mr][mc] &&
                    board[mr][mc].toLowerCase()!==p.toLowerCase() &&
                    !board[lr][lc]
                ){

                    result.push([
                        lr,
                        lc,
                        mr,
                        mc
                    ]);
                }
            }
        );

        return result;
    }

    function moves(r,c){

        const p=board[r][c];

        if(!p)return [];

        if(captures(r,c).length){
            return captures(r,c);
        }

        const king=
            p===p.toUpperCase();

        const dirs=
            king
            ? [
                [-1,-1],
                [-1,1],
                [1,-1],
                [1,1]
            ]
            : [
                [
                    p.toLowerCase()==="r"
                    ? -1
                    : 1,
                    -1
                ],
                [
                    p.toLowerCase()==="r"
                    ? -1
                    : 1,
                    1
                ]
            ];

        const result=[];

        dirs.forEach(
            ([dr,dc])=>{

                const nr=r+dr;
                const nc=c+dc;

                if(
                    inside(nr,nc) &&
                    !board[nr][nc]
                ){

                    result.push([
                        nr,
                        nc
                    ]);
                }
            }
        );

        return result;
    }

    function playerHasCapture(p){

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                if(
                    board[r][c] &&
                    board[r][c].toLowerCase()===p &&
                    captures(r,c).length
                ){

                    return true;
                }
            }
        }

        return false;
    }

    function move(
        fr,
        fc,
        tr,
        tc
    ){

        const p=board[fr][fc];

        const isCapture=
            Math.abs(tr-fr)===2;

        board[tr][tc]=p;
        board[fr][fc]=null;

        if(isCapture){

            board[
                (fr+tr)/2
            ][
                (fc+tc)/2
            ]=null;

            if(captures(tr,tc).length){

                selected={
                    r:tr,
                    c:tc
                };

                mustContinue=true;

                render();

                return;
            }
        }

        if(
            p.toLowerCase()==="r" &&
            tr===0
        ){
            board[tr][tc]="R";
        }

        if(
            p.toLowerCase()==="b" &&
            tr===7
        ){
            board[tr][tc]="B";
        }

        turn=
            turn==="r"
            ? "b"
            : "r";

        selected=null;
        mustContinue=false;

        checkEnd();
        render();
    }

    function checkEnd(){

        let pieces=0;
        let movesAvailable=false;

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                if(
                    board[r][c] &&
                    board[r][c].toLowerCase()===turn
                ){

                    pieces++;

                    if(
                        moves(r,c).length
                    ){
                        movesAvailable=true;
                    }
                }
            }
        }

        if(
            pieces===0 ||
            !movesAvailable
        ){

            gameOver=true;

            $("#checkerStatus").textContent=
                (
                    turn==="r"
                    ? "Black"
                    : "Red"
                )+
                " wins!";
        }
    }

    function click(r,c){

        if(gameOver)return;

        if(selected){

            const found=
                moves(
                    selected.r,
                    selected.c
                ).find(
                    m=>
                        m[0]===r &&
                        m[1]===c
                );

            if(found){

                move(
                    selected.r,
                    selected.c,
                    r,
                    c
                );

                return;
            }
        }

        if(
            board[r][c] &&
            board[r][c].toLowerCase()===turn
        ){

            if(
                playerHasCapture(turn) &&
                !captures(r,c).length
            ){
                return;
            }

            selected={
                r,
                c
            };

            render();
        }
    }

    function render(){

        el.innerHTML="";

        const globalCapture=
            playerHasCapture(turn);

        for(let r=0;r<8;r++){

            for(let c=0;c<8;c++){

                const sq=
                    document.createElement("button");

                sq.className=
                    "square "+
                    (
                        (r+c)%2===0
                        ? "checker-light"
                        : "checker-dark"
                    );

                const p=board[r][c];

                if(
                    p &&
                    p.toLowerCase()===turn
                ){

                    const piece=
                        document.createElement("div");

                    piece.className=
                        "checker-piece "+
                        (
                            p.toLowerCase()==="r"
                            ? "checker-red"
                            : "checker-black"
                        );

                    if(
                        p===p.toUpperCase()
                    ){
                        piece.classList.add(
                            "checker-king"
                        );
                    }

                    sq.appendChild(piece);
                }

                if(
                    selected &&
                    selected.r===r &&
                    selected.c===c
                ){
                    sq.classList.add("selected");
                }

                if(
                    selected &&
                    moves(
                        selected.r,
                        selected.c
                    ).some(
                        m=>
                            m[0]===r &&
                            m[1]===c
                    )
                ){

                    sq.classList.add(
                        board[r][c]
                        ? "capture"
                        : "move"
                    );
                }

                sq.onclick=
                    ()=>click(r,c);

                el.appendChild(sq);
            }
        }

        $("#checkerTurn").textContent=
            turn==="r"
            ? "Red"
            : "Black";

        if(!gameOver){

            $("#checkerStatus").textContent=
                globalCapture
                ? "A capture is mandatory."
                : "Select a piece.";
        }
    }

    $("#checkerRestart").onclick=reset;

    reset();
}
